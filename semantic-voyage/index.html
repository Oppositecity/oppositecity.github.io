<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Semantic Voyage</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#000}
  body{
    font-family:"Courier Prime","Courier New",Courier,monospace;
    color:#fff;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  canvas{display:block;touch-action:none}

  #ui{
    position:fixed;inset:0;z-index:10;pointer-events:none;
    padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));
    display:grid;
    grid-template-rows:auto 1fr auto;
    font-size:13px;line-height:1.5;
  }
  .dim{color:rgba(255,255,255,.58)}
  .narrow{display:none}
  @media (max-width:640px){.wide{display:none}.narrow{display:inline}}
  .lab{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.52)}

  #top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
  #voyage{font-size:15px}
  #voyage b{font-weight:400}
  #voyage .to{color:rgba(255,255,255,.55);padding:0 .5em}
  #hint{text-align:right;white-space:nowrap}

  #bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
  #here{font-size:26px;line-height:1.15;margin-bottom:2px}
  #trail{
    color:rgba(255,255,255,.62);font-size:12px;max-width:62vw;
    max-height:4.6em;overflow:hidden;
    display:flex;flex-wrap:wrap;gap:0 .45em;
  }
  #trail span:not(:last-child)::after{content:" \2192";color:rgba(255,255,255,.42)}
  #right{text-align:right;flex:none}
  #moves{font-size:34px;line-height:1}

  #reach{pointer-events:auto;margin-top:12px;display:flex;align-items:center;gap:9px}
  #reach input{
    -webkit-appearance:none;appearance:none;width:104px;height:14px;
    background:transparent;cursor:pointer;
  }
  #reach input::-webkit-slider-runnable-track{height:1px;background:rgba(255,255,255,.28)}
  #reach input::-moz-range-track{height:1px;background:rgba(255,255,255,.28)}
  #reach input::-webkit-slider-thumb{
    -webkit-appearance:none;width:9px;height:9px;border-radius:50%;
    background:#fff;margin-top:-4px;
  }
  #reach input::-moz-range-thumb{width:9px;height:9px;border:0;border-radius:50%;background:#fff}
  #reach input:focus-visible{outline:1px solid #fff;outline-offset:4px}

  button{
    pointer-events:auto;background:none;border:0;padding:4px 0;
    font:inherit;font-size:10px;letter-spacing:.22em;text-transform:uppercase;
    color:rgba(255,255,255,.68);cursor:pointer;
  }
  button:hover,button:focus-visible{color:#fff}
  button:focus-visible{outline:1px solid #fff;outline-offset:3px}

  #arrived{
    position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.9);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;text-align:center;padding:24px;
    opacity:0;pointer-events:none;transition:opacity .6s ease;
  }
  #arrived.on{opacity:1;pointer-events:auto}
  #arrived h1{font-size:13px;font-weight:400;letter-spacing:.5em;text-indent:.5em;color:rgba(255,255,255,.62)}
  #arrived .word{font-size:min(13vw,58px)}
  #arrived .stat{font-size:13px;color:rgba(255,255,255,.68);max-width:34ch}

  #boot{
    position:fixed;inset:0;z-index:30;background:#000;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.62);
    transition:opacity .7s ease;
  }
  #boot.off{opacity:0;pointer-events:none}

  @media (max-width:640px){
    #ui{font-size:12px;padding:calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom))}
    #hint{font-size:10px;line-height:1.6}
    #voyage{font-size:13px}
    #here{font-size:21px}
    #moves{font-size:26px}
    #trail{max-width:100%;max-height:3em}
    #bottom{flex-direction:column;align-items:flex-start;gap:10px}
    #right{text-align:left}
    #right .row{display:flex;align-items:baseline;gap:8px}
  }
  @media (prefers-reduced-motion:reduce){
    #arrived,#boot{transition:none}
  }
</style>
</head>
<body>

<div id="boot">charting 20,480 words</div>

<div id="ui">
  <div id="top">
    <div>
      <div class="lab">voyage</div>
      <div id="voyage"><b id="w-from">—</b><span class="to">→</span><b id="w-to">—</b></div>
    </div>
    <div id="hint" class="dim">
      <span class="wide">drag to look<br>scroll to move<br>click a lit word<br>1–8 to jump</span><span class="narrow">tap a lit word</span>
    </div>
  </div>

  <div></div>

  <div id="bottom">
    <div>
      <div class="lab">here</div>
      <div id="here">—</div>
      <div id="trail"></div>
    </div>
    <div id="right">
      <div class="row"><div id="moves">0</div><div class="lab">moves</div></div>
      <div id="reach">
        <span class="lab">reach</span>
        <input id="reach-n" type="range" min="2" max="8" step="1" value="6" aria-label="number of reachable words">
        <span id="reach-v" class="dim">6</span>
      </div>
      <button id="new">new voyage</button>
    </div>
  </div>
</div>

<div id="arrived">
  <h1>arrived</h1>
  <div class="word" id="a-word">—</div>
  <div class="stat" id="a-stat"></div>
  <button id="again">voyage again</button>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const N = 20480, K = 8, SCALE = 520.0;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- decode ---------- */
const raw = id => document.getElementById(id).textContent.trim();
function b64(s){
  const bin = atob(s), out = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}

const WORDS = raw('d-words').split('\n');

const posI = new Int16Array(b64(raw('d-pos')).buffer);
const POS  = new Float32Array(N*3);
for (let i=0;i<N*3;i++) POS[i] = posI[i]/32000*SCALE;

const knnBytes = b64(raw('d-knn'));
const KNN = new Int32Array(N*K);
{
  let p=0;
  for (let i=0;i<N;i++) for (let k=0;k<K;k++){
    let z=0, s=0, b;
    do { b = knnBytes[p++]; z |= (b & 0x7f) << s; s += 7; } while (b & 0x80);
    KNN[i*K+k] = i + ((z>>>1) ^ -(z & 1));
  }
}

const RANK = new Uint16Array(b64(raw('d-rank')).buffer);

const simBytes = b64(raw('d-sim'));
const SIM = new Float32Array(N*K);
for (let i=0;i<N;i++){
  let acc = simBytes[i*K];
  SIM[i*K] = acc/255*0.85 + 0.15;
  for (let k=1;k<K;k++){
    acc = (acc - simBytes[i*K+k]) & 255;
    SIM[i*K+k] = acc/255*0.85 + 0.15;
  }
}

/* words inside the giant reachable component — every voyage is completable */
const CORE = (() => {
  const seen = new Uint8Array(N), q = new Int32Array(N);
  let head=0, tail=0, seed=0;
  seen[seed]=1; q[tail++]=seed;
  while (head<tail){
    const u=q[head++];
    for (let k=0;k<K;k++){ const v=KNN[u*K+k]; if(!seen[v]){seen[v]=1;q[tail++]=v;} }
  }
  const list=[]; for(let i=0;i<N;i++) if(seen[i]) list.push(i);
  return list;
})();

const _dist = new Int32Array(N), _queue = new Int32Array(N);

/* breadth-first over the reach the player is actually flying with.
   returns how many nodes were reached; _dist holds hop counts (-1 = unreached) */
function explore(from, width){
  _dist.fill(-1);
  let head = 0, tail = 0;
  _dist[from] = 0; _queue[tail++] = from;
  while (head < tail){
    const u = _queue[head++];
    for (let k=0;k<width;k++){
      const v = KNN[u*K+k];
      if (_dist[v] < 0){ _dist[v] = _dist[u] + 1; _queue[tail++] = v; }
    }
  }
  return tail;
}

function shortestPath(a, b, width){
  explore(a, width || K);
  return _dist[b];
}

/* a target is only ever chosen from what the current reach can actually get to */
function pickTarget(from, width, minHops){
  const n = explore(from, width);
  const cand = [];
  for (let i=0;i<n;i++){ const v = _queue[i]; if (_dist[v] >= minHops) cand.push(v); }
  return cand.length ? cand[(Math.random()*cand.length)|0] : -1;
}

/* ---------- glyph atlas ---------- */
const CELL = 96, COLS = 8, ROWS = 4, ADV = 0.475;
const GLYPHS = 'abcdefghijklmnopqrstuvwxyz';

async function buildAtlas(){
  try {
    await Promise.race([
      Promise.all([document.fonts.load('400 76px "Courier Prime"'),
                   document.fonts.load('700 76px "Courier Prime"')]),
      new Promise(r => setTimeout(r, 2500))
    ]);
  } catch(e){}
  const c = document.createElement('canvas');
  c.width = COLS*CELL; c.height = ROWS*CELL;
  const g = c.getContext('2d');
  g.clearRect(0,0,c.width,c.height);
  g.font = '700 76px "Courier Prime","Courier New",Courier,monospace';
  g.textAlign='center'; g.textBaseline='middle'; g.fillStyle='#fff';
  for (let i=0;i<GLYPHS.length;i++){
    const x = (i%COLS)*CELL + CELL/2, y = Math.floor(i/COLS)*CELL + CELL/2;
    g.fillText(GLYPHS[i], x, y);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.flipY = false;                       // v=0 is the top row of the canvas
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.generateMipmaps = true;
  tex.anisotropy = 4;
  return tex;
}

/* ---------- scene ---------- */
let scene, camera, renderer, controls, field, stateAttr;
const wordStart = new Int32Array(N);

/* state codes: 0 field, 1 reachable, 2 visited, 3 here, 4 target */
let here=0, target=0, trail=[], reachN=6, done=false;
const tap = {x:0, y:0, t:0};
let flight = null;

async function init(){
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.5, 4000);
  renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 1);
  document.body.appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.rotateSpeed = 0.42;
  controls.zoomSpeed = 0.8;
  controls.minDistance = 14;
  controls.maxDistance = 1100;
  controls.enablePan = false;

  const atlas = await buildAtlas();

  /* one quad instanced once per character of every word */
  let total = 0;
  for (let i=0;i<N;i++){ wordStart[i] = total; total += WORDS[i].length; }

  const aWordPos = new Float32Array(total*3);
  const aChar    = new Float32Array(total*2);
  const aState   = new Float32Array(total);
  const aRank    = new Float32Array(total);

  let p = 0;
  for (let i=0;i<N;i++){
    const w = WORDS[i], L = w.length;
    const x = POS[i*3], y = POS[i*3+1], z = POS[i*3+2];
    const rk = RANK[i];
    for (let c=0;c<L;c++,p++){
      aWordPos[p*3] = x; aWordPos[p*3+1] = y; aWordPos[p*3+2] = z;
      aChar[p*2]   = (c - (L-1)/2) * ADV;
      aChar[p*2+1] = w.charCodeAt(c) - 97;
      aRank[p]     = rk;
    }
  }

  const geo = new THREE.InstancedBufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
    -0.5,-0.5,0,  0.5,-0.5,0,  0.5,0.5,0,  -0.5,0.5,0
  ]),3));
  geo.setAttribute('uv', new THREE.BufferAttribute(new Float32Array([
    0,0, 1,0, 1,1, 0,1
  ]),2));
  geo.setIndex([0,1,2, 0,2,3]);
  geo.setAttribute('aWordPos', new THREE.InstancedBufferAttribute(aWordPos,3));
  geo.setAttribute('aChar',    new THREE.InstancedBufferAttribute(aChar,2));
  geo.setAttribute('aRank',    new THREE.InstancedBufferAttribute(aRank,1));
  stateAttr = new THREE.InstancedBufferAttribute(aState,1);
  stateAttr.setUsage(THREE.DynamicDrawUsage);
  geo.setAttribute('aState', stateAttr);
  geo.instanceCount = total;
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), SCALE*3);

  const mat = new THREE.ShaderMaterial({
    uniforms:{
      uAtlas:{value:atlas},
      uUnit:{value:1},
      uRef:{value:150},
      uTime:{value:0},
      uGrid:{value:new THREE.Vector2(COLS,ROWS)},
      uFar:{value:1200},
      uDensity:{value:8e8},
      uN:{value:N},
      uPulse:{value: REDUCED ? 0 : 1}
    },
    vertexShader:`
      attribute vec3 aWordPos;
      attribute vec2 aChar;
      attribute float aState;
      attribute float aRank;
      uniform float uUnit, uRef, uTime, uFar, uPulse, uDensity, uN;
      uniform vec2 uGrid;
      varying vec2 vUv;
      varying float vA;
      void main(){
        vec4 mv = modelViewMatrix * vec4(aWordPos, 1.0);
        float dist = max(-mv.z, 1.0);

        // stellar magnitude: common words carry further, like brighter stars.
        // words on the voyage itself are never culled.
        bool lit = aState > 0.5;
        if (!lit && aRank > uDensity * pow(dist, -2.2)){
          gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
          return;
        }
        float mag = 1.0 - aRank / uN;

        float bright = 0.16 + 0.30 * pow(mag, 1.4);
        float size   = 0.88 + 0.30 * mag;
        if (aState > 3.5){                       // target — a slow beacon
          bright = 0.75 + 0.25 * sin(uTime * 2.0) * uPulse;
          size = 1.75;
        } else if (aState > 2.5){                // here
          bright = 1.0; size = 1.9;
        } else if (aState > 1.5){                // already visited
          bright = 0.45; size = 1.2;
        } else if (aState > 0.5){                // within reach
          bright = 0.92 + 0.08 * sin(uTime * 1.6 + aRank * 0.13) * uPulse;
          size = 1.45;
        }

        // near-constant screen size: gentle depth cue, never vanishes
        float s = uUnit * pow(dist, 0.88) * pow(uRef, 0.12) * size;

        vec2 corner = uv - 0.5;
        mv.xy += vec2(aChar.x + corner.x, corner.y) * s;
        gl_Position = projectionMatrix * mv;

        float gi = aChar.y;
        vUv = (vec2(mod(gi, uGrid.x), floor(gi / uGrid.x)) + vec2(uv.x, 1.0 - uv.y)) / uGrid;

        float fade = clamp(1.0 - dist / uFar, 0.0, 1.0);
        vA = bright * (0.14 + 0.86 * fade * fade);
      }
    `,
    fragmentShader:`
      uniform sampler2D uAtlas;
      varying vec2 vUv;
      varying float vA;
      void main(){
        float a = texture2D(uAtlas, vUv).a;
        if (a * vA < 0.012) discard;
        gl_FragColor = vec4(1.0, 1.0, 1.0, a * vA);
      }
    `,
    transparent:true,
    blending:THREE.AdditiveBlending,
    depthTest:false,
    depthWrite:false
  });

  field = new THREE.Mesh(geo, mat);
  field.frustumCulled = false;
  scene.add(field);
  sizeUnit();

  addEventListener('resize', onResize);
  renderer.domElement.addEventListener('pointerdown', e => {
    tap.x = e.clientX; tap.y = e.clientY; tap.t = performance.now();
  });
  renderer.domElement.addEventListener('pointerup', e => {
    if (performance.now() - tap.t > 600) return;
    if (Math.hypot(e.clientX - tap.x, e.clientY - tap.y) > 9) return;
    onPointer(e);
  });
  addEventListener('keydown', onKey);
  document.getElementById('new').onclick = newVoyage;
  document.getElementById('again').onclick = newVoyage;
  const rn = document.getElementById('reach-n');
  rn.oninput = () => {
    reachN = +rn.value;
    document.getElementById('reach-v').textContent = reachN;
    paint();
  };

  newVoyage();
  document.getElementById('boot').classList.add('off');
  renderer.setAnimationLoop(tick);
}

/* world units per screen pixel, so a word holds a stable size */
function sizeUnit(){
  const small = innerWidth < 640;
  const px = small ? 15 : 19;                    // cell height on screen
  const h  = 2 * Math.tan(camera.fov * Math.PI / 360);
  field.material.uniforms.uUnit.value = px * h / innerHeight;
  field.material.uniforms.uDensity.value = small ? 3.5e8 : 8e8;
}

function onResize(){
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  sizeUnit();
}

/* ---------- state ---------- */
function reachable(i){
  const out = [];
  for (let k=0;k<reachN;k++){
    const v = KNN[i*K+k];
    if (v !== i && out.indexOf(v) < 0) out.push(v);
  }
  return out;
}

function setWordState(i, v){
  const s = wordStart[i], e = s + WORDS[i].length;
  for (let p=s;p<e;p++) stateAttr.array[p] = v;
}

let lastPainted = [];
function paint(){
  for (const i of lastPainted) setWordState(i, 0);
  lastPainted = [];
  const touch = i => { lastPainted.push(i); };
  for (const i of trail){ setWordState(i, 2); touch(i); }
  if (!done) for (const i of reachable(here)){ setWordState(i, 1); touch(i); }
  setWordState(target, 4); touch(target);
  setWordState(here, 3);  touch(here);
  stateAttr.needsUpdate = true;
}

function vec(i){ return new THREE.Vector3(POS[i*3], POS[i*3+1], POS[i*3+2]); }

function flyTo(i, instant){
  const to = vec(i);
  if (instant){
    controls.target.copy(to);
    camera.position.copy(to.clone().add(new THREE.Vector3(26,16,34)));
    controls.update();
    return;
  }
  const offset = camera.position.clone().sub(controls.target);
  if (offset.length() > 190) offset.setLength(190);
  if (offset.length() < 22)  offset.setLength(22);
  flight = {
    t: 0,
    dur: REDUCED ? 0.001 : 1.15,
    fromT: controls.target.clone(),
    toT: to,
    fromC: camera.position.clone(),
    toC: to.clone().add(offset)
  };
}

function jump(i){
  if (done || i === here) return;
  if (reachable(here).indexOf(i) < 0) return;
  here = i;
  trail.push(i);
  flyTo(i);
  paint();
  ui();
  if (i === target) arrive();
}

function newVoyage(){
  done = false;
  document.getElementById('arrived').classList.remove('on');
  const pick = () => CORE[(Math.random()*CORE.length)|0];
  target = -1;
  for (let tries=0; tries<40 && target<0; tries++){
    here = pick();
    target = pickTarget(here, reachN, 5);
  }
  if (target < 0){ here = pick(); target = pickTarget(here, K, 2); }
  trail = [here];
  flyTo(here, true);
  paint();
  ui();
}

function arrive(){
  done = true;
  const took = trail.length - 1;
  const best = shortestPath(trail[0], target, reachN);
  const a = document.getElementById('arrived');
  document.getElementById('a-word').textContent = WORDS[target];
  document.getElementById('a-stat').textContent =
    took + (took === 1 ? ' move' : ' moves') + ' from ' + WORDS[trail[0]] +
    (best > 0 ? ' \u00b7 the shortest way was ' + best : '');
  a.classList.add('on');
  paint();
}

function ui(){
  document.getElementById('w-from').textContent = WORDS[trail[0]];
  document.getElementById('w-to').textContent   = WORDS[target];
  document.getElementById('here').textContent   = WORDS[here];
  document.getElementById('moves').textContent  = trail.length - 1;
  document.getElementById('trail').innerHTML =
    trail.map(i => '<span>' + WORDS[i] + '</span>').join('');
}

/* ---------- picking: project only the lit words ---------- */
function onPointer(e){
  if (done) return;
  const cands = reachable(here);
  let best = -1, bestD = 46 * 46;
  const v = new THREE.Vector3();
  for (const i of cands){
    v.set(POS[i*3], POS[i*3+1], POS[i*3+2]).project(camera);
    if (v.z > 1) continue;
    const sx = (v.x * 0.5 + 0.5) * innerWidth;
    const sy = (-v.y * 0.5 + 0.5) * innerHeight;
    const d = (sx - e.clientX) ** 2 + (sy - e.clientY) ** 2;
    if (d < bestD){ bestD = d; best = i; }
  }
  if (best >= 0) jump(best);
}

function onKey(e){
  if (e.key >= '1' && e.key <= '8'){
    const c = reachable(here)[+e.key - 1];
    if (c !== undefined) jump(c);
  } else if (e.key === 'n'){ newVoyage(); }
}

/* ---------- loop ---------- */
const clock = new THREE.Clock();
function tick(){
  const dt = clock.getDelta();
  field.material.uniforms.uTime.value += dt;

  if (flight){
    flight.t += dt / flight.dur;
    const t = Math.min(flight.t, 1);
    const e = t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
    controls.target.lerpVectors(flight.fromT, flight.toT, e);
    camera.position.lerpVectors(flight.fromC, flight.toC, e);
    if (t >= 1) flight = null;
  }

  controls.update();
  renderer.render(scene, camera);
}

init().catch(err => {
  document.getElementById('boot').textContent = 'this piece needs webgl';
  console.error(err);
});
</script>
</body>
</html>
