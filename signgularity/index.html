<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SIGNGULARITY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#ffffff; --bg:#000000; --track:rgba(255,255,255,.45); --field:rgba(0,0,0,.55); --dock: max(14px, env(safe-area-inset-bottom)); }
  body.on-white{ --ink:#000000; --bg:#ffffff; --track:rgba(0,0,0,.45); --field:rgba(255,255,255,.6); }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background:var(--bg); color:var(--ink);
    font-family:"Courier Prime","Courier New",Courier,monospace;
    overflow:hidden; overscroll-behavior:none;
  }
  #stage{ position:fixed; inset:0; touch-action:none; }
  canvas{ display:block; }

  #wordwrap{
    position:fixed; top:max(16px,env(safe-area-inset-top)); left:0; right:0;
    display:flex; flex-direction:column; align-items:center; gap:7px;
    pointer-events:none; z-index:10;
  }
  #hint{
    font-size:11px; letter-spacing:.28em; text-transform:uppercase; color:var(--ink);
    opacity:.95;
  }
  #field{ position:relative; pointer-events:auto; }
  #mirror{
    position:absolute; visibility:hidden; white-space:pre; left:0; top:0;
    font-family:inherit; font-weight:700; font-size:clamp(15px,4.4vw,22px);
    letter-spacing:.42em; text-transform:uppercase;
  }
  #caret{
    position:absolute; top:50%; transform:translateY(-50%);
    width:.5em; height:1.05em; background:var(--ink); pointer-events:none;
    font-size:clamp(15px,4.4vw,22px);
    animation:blink 1.06s steps(1,end) infinite;
  }
  #caret[hidden]{ display:none; }
  @keyframes blink{ 0%,50%{ opacity:1; } 50.01%,100%{ opacity:0; } }
  @media (prefers-reduced-motion:reduce){ #caret{ animation:none; } }
  #word{
    display:block; width:min(88vw,540px);
    background:var(--field); border:1px solid var(--ink); outline:0;
    color:var(--ink); caret-color:var(--ink);
    font-family:inherit; font-weight:700; font-size:clamp(15px,4.4vw,22px);
    letter-spacing:.42em; text-indent:.42em; text-align:center; text-transform:uppercase;
    padding:11px 12px;
  }
  #word:focus{ outline:2px solid var(--ink); outline-offset:2px; }
  #word::placeholder{ color:var(--ink); opacity:.8; }

  #note{
    position:fixed; left:0; right:0; top:50%; transform:translateY(-50%);
    text-align:center; font-size:12px; letter-spacing:.24em; text-transform:uppercase;
    color:var(--ink); pointer-events:none; z-index:5;
  }

  #dock{
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    padding:38px 18px var(--dock);
    background:linear-gradient(to top, var(--bg) 55%, transparent);
  }
  #readout{
    display:flex; align-items:baseline; justify-content:space-between;
    font-size:12px; letter-spacing:.24em; text-transform:uppercase; margin-bottom:2px;
  }
  #rvalue{ font-weight:700; font-size:15px; letter-spacing:.1em; }

  input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:44px; background:transparent; margin:0; display:block; }
  input[type=range]::-webkit-slider-runnable-track{ height:2px; background:var(--track); }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; appearance:none; width:26px; height:26px; margin-top:-12px; border:0; border-radius:50%; background:var(--ink); }
  input[type=range]::-moz-range-track{ height:2px; background:var(--track); }
  input[type=range]::-moz-range-thumb{ width:26px; height:26px; border:0; border-radius:50%; background:var(--ink); }

  .row{ display:flex; gap:24px; overflow-x:auto; scrollbar-width:none; }
  .row::-webkit-scrollbar{ display:none; }
  .row button{
    -webkit-appearance:none; appearance:none; background:none; border:0; margin:0;
    padding:9px 0; color:var(--ink); font-family:inherit; font-size:12px; font-weight:400;
    letter-spacing:.24em; text-transform:uppercase; white-space:nowrap; cursor:pointer;
  }
  .row button[aria-pressed="true"]{ font-weight:700; }
  #strip button[aria-pressed="true"]::before,
  #inks button[aria-pressed="true"]::before{ content:"\2022 "; }
  .row button:focus-visible{ outline:2px solid var(--ink); outline-offset:3px; }
  #acts{ padding-bottom:8px; }
  #seedrow{ font-size:11px; letter-spacing:.28em; text-transform:uppercase; color:var(--ink); opacity:.9; margin-bottom:6px; }
</style>
</head>
<body>

<div id="stage"></div>

<div id="wordwrap">
  <label id="hint" for="word">Type a word</label>
  <div id="field">
    <input id="word" value="SIGNGULARITY" maxlength="60" autocomplete="off" autocorrect="off"
           autocapitalize="characters" spellcheck="false" aria-label="Word to collapse">
    <span id="mirror" aria-hidden="true"></span>
    <span id="caret" aria-hidden="true"></span>
  </div>
</div>

<div id="note" hidden>Type a word</div>

<div id="dock">
  <div id="seedrow"><span id="seedlabel">Seed</span></div>
  <div id="readout"><span id="rname">Collapse</span><span id="rvalue">1.20</span></div>
  <input id="dial" type="range" min="0" max="1000" value="340" aria-label="Collapse">
  <div class="row" id="strip"></div>
  <div class="row" id="inks"></div>
  <div class="row" id="acts">
    <button id="src" type="button">Drawn</button>
    <button id="shade" type="button">Modeled</button>
    <button id="shuffle" type="button">Shuffle</button>
    <button id="freeze" type="button" aria-pressed="false">Freeze</button>
    <button id="stl" type="button">Save STL</button>
    <button id="link" type="button">Link</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* ============================================================
   SIGNGULARITY
   A word collapsed to a singularity: every letter held at one
   point, jutting outward in all directions.

   Two glyph sources.
   DRAWN  — the hand-authored A-Z topology from the original
            Language Singularity Simulator, carried over verbatim.
            Salvaged from a file whose switch statement had been
            spliced twice and no longer parsed; the duplicate tail
            was removed, nothing else changed.
   TRACED — any glyph the browser can render, contoured live:
            alpha field -> marching squares -> loop stitching ->
            Douglas-Peucker -> nesting test sorts outlines from
            counters. Greek, Cyrillic, Hebrew, kana, hanzi. No
            script menu; your keyboard is the switcher.

   Every sculpture is seeded. The seed rides in the URL, so a
   form you like can be recovered, printed, and sent to someone.
   ============================================================ */

var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

var P = {
  collapse: { label:'Collapse', v:0.34, map:function(x){ return x*3.5; },        fmt:function(x){ return (x*3.5).toFixed(2); } },
  depth:    { label:'Depth',    v:0.25, map:function(x){ return 0.06+x*1.15; },  fmt:function(x){ return (0.06+x*1.15).toFixed(2); } },
  spin:     { label:'Spin',     v:reduce?0:0.33, map:function(x){ return x*3; }, fmt:function(x){ return (x*3).toFixed(2); } },
  orbit:    { label:'Orbit',    v:reduce?0:0.25, map:function(x){ return x*2; }, fmt:function(x){ return (x*2).toFixed(2); } },
  shift:    { label:'Shift',    v:reduce?0:0.25, map:function(x){ return x*2; }, fmt:function(x){ return (x*2).toFixed(2); } }
};
var order = ['collapse','depth','spin','orbit','shift'];
var active = 'collapse';

var INKS = ['vowel','random','white','black'];
var INK_LABEL = { vowel:'Vowels', random:'Random', white:'White', black:'Black' };
var ink = 'vowel';
var shade = 'modeled';   // 'modeled' | 'flat'
var paused = false, time = 0;
var source = 'drawn';
var seed = '';
var letterData = [];
var geoCache = {};

/* ============================================================
   SEED
   ============================================================ */

var rng = null;

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function seedToInt(s){
  var h = 2166136261;
  for(var i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function pad6(s){ while(s.length < 6) s = '0' + s; return s; }
function newSeed(){ return pad6(Math.floor(Math.random()*2176782336).toString(36)).slice(0,6); }
function seedFromWord(w){ return pad6((seedToInt(w || 'word') % 2176782336).toString(36)).slice(0,6); }
function resetRng(){ rng = mulberry32(seedToInt(seed)); }

/* ============================================================
   TRACED GLYPHS
   ============================================================ */

/* Trace resolution. 110 was fine for Latin but wrecked dense scripts —
   at that size the simplifier collapsed a kanji like U+9B31 from 1080
   contour points to 133 across 11 loops, losing three of its counters
   outright. At 200 with a finer epsilon it recovers 14 loops and 13
   counters, and still costs ~2.4k vertices against a 60k budget. */
var GRID = 200, PAD = 15, ISO = 0.5;
var TRACE_EPS = 0.5;
var off = document.createElement('canvas');
off.width = off.height = GRID;
var octx = off.getContext('2d', { willReadFrequently:true });

function alphaField(ch){
  octx.clearRect(0,0,GRID,GRID);
  octx.fillStyle = '#fff';
  octx.textAlign = 'center';
  octx.textBaseline = 'middle';
  var size = GRID - PAD*2;
  octx.font = '700 ' + size + 'px "Courier Prime","Courier New",Courier,monospace';
  octx.fillText(ch, GRID/2, GRID/2 + size*0.04);
  var d = octx.getImageData(0,0,GRID,GRID).data;
  var f = new Float32Array(GRID*GRID);
  for(var i=0;i<GRID*GRID;i++) f[i] = d[i*4+3]/255;
  return f;
}

// edges: 0 top, 1 right, 2 bottom, 3 left
var CASES = [
  [], [[3,0]], [[0,1]], [[3,1]],
  [[1,2]], [[3,0],[1,2]], [[0,2]], [[3,2]],
  [[2,3]], [[2,0]], [[0,1],[2,3]], [[2,1]],
  [[1,3]], [[1,0]], [[0,3]], []
];

function clamp01(t){ return t<0?0:(t>1?1:t); }
function keyOf(p){ return Math.round(p[0]*64)+':'+Math.round(p[1]*64); }

function inkBounds(f, N){
  var x0=N, y0=N, x1=-1, y1=-1;
  for(var y=0;y<N;y++){
    for(var x=0;x<N;x++){
      if(f[y*N+x] > ISO){
        if(x<x0)x0=x; if(x>x1)x1=x;
        if(y<y0)y0=y; if(y>y1)y1=y;
      }
    }
  }
  if(x1<0) return null;
  return { x0:x0-2, y0:y0-2, x1:x1+1, y1:y1+1 };
}

function marchLoops(f, N){
  N = N || GRID;
  var B = inkBounds(f, N);
  if(!B) return [];

  /* Hot path — this is most of the cost of tracing a sign, so it
     avoids per-cell function calls and string keys. Corner tests are
     read from two precomputed row masks that shift down each row, and
     shared edge points are matched on a packed integer key. */
  function edgePoint(x,y,e){
    function V(cx,cy){
      if(cx<0||cy<0||cx>=N||cy>=N) return 0;
      return f[cy*N+cx];
    }
    var a,b,t;
    if(e===0){ a=V(x,y);   b=V(x+1,y);   t=(ISO-a)/((b-a)||1e-6); return [x+clamp01(t), y]; }
    if(e===1){ a=V(x+1,y); b=V(x+1,y+1); t=(ISO-a)/((b-a)||1e-6); return [x+1, y+clamp01(t)]; }
    if(e===2){ a=V(x,y+1); b=V(x+1,y+1); t=(ISO-a)/((b-a)||1e-6); return [x+clamp01(t), y+1]; }
    a=V(x,y); b=V(x,y+1); t=(ISO-a)/((b-a)||1e-6); return [x, y+clamp01(t)];
  }
  function packed(p){ return (Math.round(p[0]*64) << 14) + Math.round(p[1]*64); }

  var w = B.x1 - B.x0 + 2;
  var rowA = new Uint8Array(w+1), rowB = new Uint8Array(w+1);
  function fillRow(row, y){
    for(var i=0;i<=w;i++){
      var x = B.x0 + i;
      row[i] = (x>=0 && x<N && y>=0 && y<N && f[y*N+x] > ISO) ? 1 : 0;
    }
  }

  var segA = [], segB = [], map = new Map();
  fillRow(rowA, B.y0);
  for(var y=B.y0; y<=B.y1; y++){
    fillRow(rowB, y+1);
    for(var i=0;i<w;i++){
      var idx = rowA[i] | (rowA[i+1] << 1) | (rowB[i+1] << 2) | (rowB[i] << 3);
      if(idx === 0 || idx === 15) continue;
      var cs = CASES[idx], x = B.x0 + i;
      for(var s=0;s<cs.length;s++){
        var a = edgePoint(x,y,cs[s][0]);
        var b = edgePoint(x,y,cs[s][1]);
        var n = segA.length;
        segA.push(a); segB.push(b);
        var k = packed(a);
        var bucket = map.get(k);
        if(bucket) bucket.push(n); else map.set(k, [n]);
      }
    }
    var swap = rowA; rowA = rowB; rowB = swap;
  }

  var used = new Uint8Array(segA.length);
  var loops = [];
  for(var i0=0;i0<segA.length;i0++){
    if(used[i0]) continue;
    var loop = [], cur = i0, guard = 0;
    used[i0] = 1; loop.push(segA[i0]);
    while(guard++ < 60000){
      loop.push(segB[cur]);
      var cands = map.get(packed(segB[cur])), nxt = -1;
      if(cands){
        for(var c=0;c<cands.length;c++){
          if(!used[cands[c]]){ nxt = cands[c]; break; }
        }
      }
      if(nxt < 0) break;
      used[nxt] = 1; cur = nxt;
    }
    if(loop.length > 6) loops.push(loop);
  }
  return loops;
}

/* Douglas-Peucker. These loops are CLOSED, so first and last point
   coincide and the baseline has zero length — every perpendicular
   distance reads as 0 and the contour flattens to two points. Split
   the ring at its farthest point first, then simplify both halves. */
function simplify(pts, eps){
  if(pts.length < 6) return pts;
  var last = pts.length - 1;
  var keep = new Uint8Array(pts.length);
  keep[0] = keep[last] = 1;

  function rec(s,e){
    if(e - s < 2) return;
    var maxD = 0, idx = -1;
    var ax=pts[s][0], ay=pts[s][1], bx=pts[e][0], by=pts[e][1];
    var dx=bx-ax, dy=by-ay, len=Math.hypot(dx,dy);
    for(var i=s+1;i<e;i++){
      var d = (len < 1e-9)
        ? Math.hypot(pts[i][0]-ax, pts[i][1]-ay)
        : Math.abs(dy*(pts[i][0]-ax) - dx*(pts[i][1]-ay))/len;
      if(d>maxD){ maxD=d; idx=i; }
    }
    if(maxD>eps && idx>0){ keep[idx]=1; rec(s,idx); rec(idx,e); }
  }

  if(Math.hypot(pts[last][0]-pts[0][0], pts[last][1]-pts[0][1]) < 1e-6){
    var far = 0, fd = -1;
    for(var i=1;i<last;i++){
      var d2 = Math.hypot(pts[i][0]-pts[0][0], pts[i][1]-pts[0][1]);
      if(d2>fd){ fd=d2; far=i; }
    }
    keep[far] = 1;
    rec(0, far); rec(far, last);
  } else {
    rec(0, last);
  }

  var out = [];
  for(var k=0;k<pts.length;k++) if(keep[k]) out.push(pts[k]);
  return out;
}

function ringArea(loop){
  var a = 0;
  for(var i=0,j=loop.length-1;i<loop.length;j=i++){
    a += (loop[j][0]*loop[i][1] - loop[i][0]*loop[j][1]);
  }
  return a/2;
}
function inside(pt, loop){
  var x=pt[0], y=pt[1], hit=false;
  for(var i=0,j=loop.length-1;i<loop.length;j=i++){
    var xi=loop[i][0], yi=loop[i][1], xj=loop[j][0], yj=loop[j][1];
    if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/((yj-yi)||1e-9) + xi)) hit = !hit;
  }
  return hit;
}

function tracedShapes(ch){
  var loops = marchLoops(alphaField(ch))
    .map(function(L){ return simplify(L, TRACE_EPS); })
    .filter(function(L){ return L.length > 3 && Math.abs(ringArea(L)) > 3; });
  if(!loops.length) return [];

  var S = GRID*0.30;
  function toEm(L){
    return L.map(function(p){
      return new THREE.Vector2((p[0]-GRID/2)/S, -(p[1]-GRID/2)/S);
    });
  }

  var outers = [], holes = [];
  for(var i=0;i<loops.length;i++){
    var depth = 0;
    for(var j=0;j<loops.length;j++){
      if(i!==j && inside(loops[i][0], loops[j])) depth++;
    }
    (depth % 2 === 0 ? outers : holes).push({ raw:loops[i], pts:toEm(loops[i]) });
  }

  return outers.map(function(o){
    var sh = new THREE.Shape(o.pts);
    holes.forEach(function(h){
      if(inside(h.raw[0], o.raw)) sh.holes.push(new THREE.Path(h.pts));
    });
    return sh;
  });
}

/* ============================================================
   CONTOUR REPAIR
   The hand-drawn paths carry two defects that both end in the same
   artifact. S crosses itself at the waist and Q where the tail meets
   the ring; M and Q also have contours that touch outright. And half
   the alphabet has gaps between contours narrower than the bevel,
   so the bevel folds through itself at those pinch points. Either
   way you get overlapping coplanar faces that z-fight and shimmer
   as the letter turns.

   Repaired without touching the drawings: fill the path with the
   nonzero rule — which unions any overlap — punch the counters back
   out, and re-extract simple contours with the same marcher the
   traced source uses. Runs at a finer raster than the tracer so the
   letterform keeps its edge, and only on the letters that need it.
   ============================================================ */

var REPAIR_N = 200;

/* A path that CROSSES itself (S, Q) doesn't just double-cover an area --
   at the crossing point the nonzero winding number flips sign (+1 to -1),
   passing through 0 in between. That 0 is a real zero-width pinch in the
   path's own geometry, not a fill-rule artifact, so a plain retrace
   reproduces it faithfully as a crimped waist. A small morphological
   CLOSE (dilate then erode, ~2px at this raster) bridges pinches in that
   size range without touching genuine counters, which run an order of
   magnitude larger. */
function morphAlpha(src, N, radius, dilate){
  var out = new Uint8Array(N*N);
  for(var y=0;y<N;y++){
    for(var x=0;x<N;x++){
      var v = dilate ? 0 : 255;
      for(var dy=-radius; dy<=radius; dy++){
        var yy = y+dy; if(yy<0||yy>=N) continue;
        for(var dx=-radius; dx<=radius; dx++){
          var xx = x+dx; if(xx<0||xx>=N) continue;
          var s = src[yy*N+xx];
          if(dilate){ if(s>v) v=s; } else { if(s<v) v=s; }
        }
      }
      out[y*N+x] = v;
    }
  }
  return out;
}
function morphClose(alphaData, N, radius){
  var a = new Uint8Array(N*N);
  for(var i=0;i<N*N;i++) a[i] = alphaData[i*4+3];
  a = morphAlpha(a, N, radius, true);
  a = morphAlpha(a, N, radius, false);
  for(var j=0;j<N*N;j++) alphaData[j*4+3] = a[j];
}

/* The bevel is gone, and that is the real fix. Its whole job was a
   glint on the edges, but an in-plane bevel folds through itself
   anywhere two contours pass closer than twice its size — which is
   half the drawn alphabet, and nearly every stroke junction in a
   dense traced glyph like a hanzi. Hard 90-degree edges read more
   sculptural under four coloured lights anyway, and they cost fewer
   triangles. TOUCH_LIMIT now only catches contours that genuinely
   touch, so fewer letters go through the rasteriser and more keep
   their bezier edge. */
var TOUCH_LIMIT = 0.006;

function crosses(a1,a2,b1,b2){
  function side(p,q,r){ return (r.y-p.y)*(q.x-p.x) - (q.y-p.y)*(r.x-p.x); }
  var d1=side(b1,b2,a1), d2=side(b1,b2,a2), d3=side(a1,a2,b1), d4=side(a1,a2,b2);
  return ((d1>0&&d2<0)||(d1<0&&d2>0)) && ((d3>0&&d4<0)||(d3<0&&d4>0));
}

function segGap(p,q,r,s){
  function ptSeg(a,b,c){
    var vx=c.x-b.x, vy=c.y-b.y, L=vx*vx+vy*vy;
    if(L<1e-12) return Math.hypot(a.x-b.x, a.y-b.y);
    var t = Math.max(0, Math.min(1, ((a.x-b.x)*vx + (a.y-b.y)*vy)/L));
    return Math.hypot(a.x-(b.x+t*vx), a.y-(b.y+t*vy));
  }
  return Math.min(ptSeg(p,r,s), ptSeg(q,r,s), ptSeg(r,p,q), ptSeg(s,p,q));
}

/* Flag a letter if it crosses itself, or if any two contours pass
   closer than the bevel can survive (twice the bevel size). */
function needsRepair(shape){
  var rings = [shape.getPoints(20)];
  shape.holes.forEach(function(h){ rings.push(h.getPoints(20)); });
  var limit = TOUCH_LIMIT;
  for(var ri=0;ri<rings.length;ri++){
    for(var rj=ri;rj<rings.length;rj++){
      var A = rings[ri], B = rings[rj];
      for(var i=0;i<A.length-1;i++){
        for(var j=(ri===rj ? i+2 : 0); j<B.length-1; j++){
          if(ri===rj && i===0 && j===B.length-2) continue;
          if(ri===rj && crosses(A[i],A[i+1],B[j],B[j+1])) return true;
          if(segGap(A[i],A[i+1],B[j],B[j+1]) < limit) return true;
        }
      }
    }
  }
  return false;
}

function cleanShapes(shape){
  var N = REPAIR_N, pad = 10;
  var outer = shape.getPoints(24);
  var holes = shape.holes.map(function(h){ return h.getPoints(24); });
  var all = outer.slice();
  holes.forEach(function(h){ all = all.concat(h); });

  var minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
  all.forEach(function(p){
    if(p.x<minX) minX=p.x; if(p.x>maxX) maxX=p.x;
    if(p.y<minY) minY=p.y; if(p.y>maxY) maxY=p.y;
  });
  var span = Math.max(maxX-minX, maxY-minY) || 1;
  var k = (N - pad*2)/span;

  var cv = document.createElement('canvas');
  cv.width = cv.height = N;
  var cx = cv.getContext('2d', { willReadFrequently:true });

  function toC(p){ return [ pad + (p.x-minX)*k, N - pad - (p.y-minY)*k ]; }
  function trace(ring){
    cx.beginPath();
    ring.forEach(function(p,i){
      var c = toC(p);
      if(i===0) cx.moveTo(c[0], c[1]); else cx.lineTo(c[0], c[1]);
    });
    cx.closePath();
  }

  cx.clearRect(0,0,N,N);
  cx.fillStyle = '#fff';
  trace(outer); cx.fill('nonzero');
  cx.globalCompositeOperation = 'destination-out';
  holes.forEach(function(h){ trace(h); cx.fill('nonzero'); });
  cx.globalCompositeOperation = 'source-over';

  var img = cx.getImageData(0,0,N,N);
  var d = img.data;
  morphClose(d, N, 2);
  var f = new Float32Array(N*N);
  for(var i=0;i<N*N;i++) f[i] = d[i*4+3]/255;

  var loops = marchLoops(f, N)
    .map(function(L){ return simplify(L, 0.5); })
    .filter(function(L){ return L.length > 3 && Math.abs(ringArea(L)) > 4; });
  if(!loops.length) return [shape];

  function toLetter(L){
    return L.map(function(p){
      return new THREE.Vector2(minX + (p[0]-pad)/k, minY + (N-pad-p[1])/k);
    });
  }

  var outers = [], punches = [];
  for(var a=0;a<loops.length;a++){
    var depth = 0;
    for(var b=0;b<loops.length;b++){
      if(a!==b && inside(loops[a][0], loops[b])) depth++;
    }
    (depth % 2 === 0 ? outers : punches).push({ raw:loops[a], pts:toLetter(loops[a]) });
  }

  return outers.map(function(o){
    var sh = new THREE.Shape(o.pts);
    punches.forEach(function(h){
      if(inside(h.raw[0], o.raw)) sh.holes.push(new THREE.Path(h.pts));
    });
    return sh;
  });
}

/* ---------- geometry ---------- */
var BASE_DEPTH = 0.3;
var LATIN = /^[A-Z]$/;

/* Every drawn glyph is now provably clean, but the traced source is
   unbounded — any codepoint, any device font, contours nobody has
   ever inspected. So validate what comes out rather than trusting
   what goes in: reject NaN vertices, count degenerate triangles, and
   cap how much geometry one sign is allowed to cost. A hanzi is an
   order of magnitude denser than an A. */
var VERT_BUDGET = 60000;    // per sign
var SCENE_BUDGET = 900000;  // per sculpture
var lastAudit = [];

function validate(geo){
  var pos = geo.attributes.position;
  var r = { verts: pos.count, nan: 0, degenerate: 0, ok: true };
  var a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
  var u = new THREE.Vector3(), v = new THREE.Vector3();
  for(var i=0;i+2<pos.count;i+=3){
    a.fromBufferAttribute(pos,i); b.fromBufferAttribute(pos,i+1); c.fromBufferAttribute(pos,i+2);
    if(!isFinite(a.x)||!isFinite(a.y)||!isFinite(a.z)||
       !isFinite(b.x)||!isFinite(b.y)||!isFinite(b.z)||
       !isFinite(c.x)||!isFinite(c.y)||!isFinite(c.z)){ r.nan++; continue; }
    u.subVectors(b,a); v.subVectors(c,a);
    if(u.cross(v).length() * 0.5 < 1e-9) r.degenerate++;
  }
  geo.computeBoundingBox();
  var bb = geo.boundingBox;
  var finite = bb && isFinite(bb.min.x) && isFinite(bb.max.x) &&
                     isFinite(bb.min.y) && isFinite(bb.max.y);
  var sized = finite && (bb.max.x-bb.min.x) > 1e-4 && (bb.max.y-bb.min.y) > 1e-4;
  r.ok = (r.nan === 0) && finite && sized && r.verts > 0 && r.verts <= VERT_BUDGET;
  if(!finite) r.note = 'non-finite bounds';
  else if(!sized) r.note = 'zero extent';
  else if(r.verts > VERT_BUDGET) r.note = 'over vertex budget';
  else if(r.nan) r.note = 'NaN vertices';
  return r;
}

function extrude(shapes){
  return new THREE.ExtrudeGeometry(shapes, { depth: BASE_DEPTH, bevelEnabled: false, steps: 1 });
}

function letterGeometry(char){
  var useDrawn = (source === 'drawn') && LATIN.test(char);
  var key = (useDrawn ? 'D' : 'T') + char;
  if(geoCache.hasOwnProperty(key)) return geoCache[key];

  var drawn = null;
  if(LATIN.test(char)){
    drawn = new THREE.Shape();
    createLetterShape(char, drawn);
  }

  var shapes;
  if(useDrawn){
    shapes = needsRepair(drawn) ? cleanShapes(drawn) : [drawn];
  } else {
    shapes = tracedShapes(char);
    if(!shapes.length){
      if(drawn){ shapes = needsRepair(drawn) ? cleanShapes(drawn) : [drawn]; }
      else { geoCache[key] = null; return null; }
    }
  }

  var geo = extrude(shapes);
  var check = validate(geo);

  /* One retry through the rasteriser, which produces contours that are
     simple by construction. If that still fails the sign is dropped
     rather than shipped broken. */
  if(!check.ok && shapes.length && shapes[0].curves){
    geo.dispose();
    var repaired = cleanShapes(shapes[0]);
    geo = extrude(repaired);
    check = validate(geo);
    check.repaired = true;
  }

  lastAudit.push({ char:char, key:key, shapes:shapes.length, check:check });

  if(!check.ok){
    geo.dispose();
    geoCache[key] = null;
    return null;
  }

  var c = new THREE.Vector3();
  geo.boundingBox.getCenter(c);
  geo.translate(-c.x, -c.y, -c.z);
  geoCache[key] = geo;
  return geo;
}

var VOWELS = 'AEIOU';

function isWarm(char){
  if(LATIN.test(char)) return VOWELS.indexOf(char) >= 0;
  return (char.codePointAt(0) % 2) === 0;
}

function letterColor(char){
  if(ink === 'white') return new THREE.Color(0xffffff);
  if(ink === 'black') return new THREE.Color(0x0d0d0d);
  if(ink === 'random') return new THREE.Color().setHSL(rng(), 0.8, 0.7);
  if(isWarm(char)) return new THREE.Color().setHSL(0.0 + rng()*0.2, 0.8 + rng()*0.2, 0.6 + rng()*0.2);
  return new THREE.Color().setHSL(0.5 + rng()*0.4, 0.7 + rng()*0.3, 0.5 + rng()*0.3);
}

function letterMaterial(color){
  if(shade === 'flat'){
    return new THREE.MeshBasicMaterial({ color:color });
  }
  if(ink === 'white'){
    return new THREE.MeshPhongMaterial({ color:color, emissive:0x0a0a0a, specular:0x555555, shininess:18 });
  }
  if(ink === 'black'){
    return new THREE.MeshPhongMaterial({ color:color, emissive:0x000000, specular:0x9a9a9a, shininess:70 });
  }
  return new THREE.MeshPhongMaterial({ color:color, emissive:color.clone().multiplyScalar(0.15), shininess:30 });
}

function clearKnot(){
  letterData.forEach(function(d){
    knot.remove(d.mesh);
    d.mesh.material.dispose();
  });
  letterData = [];
}

function build(text){
  clearKnot();
  resetRng();

  var raw = (text || '');
  var chars = [];
  Array.from(raw).forEach(function(ch){
    if(/\s/.test(ch)) return;
    var c = (source === 'drawn') ? ch.toUpperCase() : ch;
    if(source === 'drawn' && !LATIN.test(c)) return;
    chars.push(c);
  });

  document.getElementById('note').hidden = chars.length > 0;
  var n = chars.length || 1;

  var budget = 0;
  for(var i=0;i<chars.length;i++){
    var geo = letterGeometry(chars[i]);
    if(!geo) continue;
    budget += geo.attributes.position.count;
    if(budget > SCENE_BUDGET) break;

    var phi = Math.acos(-1 + (2*i)/n);
    var theta = Math.sqrt(n * Math.PI) * phi;
    var j = 0.3;
    var dir = new THREE.Vector3(
      Math.sin(phi)*Math.cos(theta) + (rng()-0.5)*j,
      Math.cos(phi)                 + (rng()-0.5)*j,
      Math.sin(phi)*Math.sin(theta) + (rng()-0.5)*j
    ).normalize();

    var color = letterColor(chars[i]);
    var mesh = new THREE.Mesh(geo, letterMaterial(color));
    mesh.scale.z = P.depth.map(P.depth.v) / BASE_DEPTH;
    knot.add(mesh);

    letterData.push({
      mesh: mesh,
      char: chars[i],
      warm: isWarm(chars[i]),
      baseDirection: dir,
      phase: (i/n) * Math.PI * 2,
      originalColor: color,
      rate: new THREE.Vector3(rng()*0.02-0.01, rng()*0.02-0.01, rng()*0.02-0.01),
      spun: new THREE.Vector3()
    });
  }
}

/* ---------- per-frame placement ---------- */
var mY = new THREE.Matrix4(), mX = new THREE.Matrix4(), mZ = new THREE.Matrix4();

function place(){
  var spin = P.spin.map(P.spin.v);
  var orbit = P.orbit.map(P.orbit.v);
  var density = P.collapse.map(P.collapse.v);
  var shift = P.shift.map(P.shift.v);
  var orbitOffset = time * orbit;

  for(var i=0;i<letterData.length;i++){
    var d = letterData[i];
    var t = time * spin + d.phase;

    var dir = d.baseDirection.clone();
    mY.makeRotationY(orbitOffset + d.phase);           dir.applyMatrix4(mY);
    mX.makeRotationX(orbitOffset*0.7 + d.phase*0.5);   dir.applyMatrix4(mX);
    mZ.makeRotationZ(orbitOffset*0.3 + d.phase*0.8);   dir.applyMatrix4(mZ);

    dir.x += Math.sin(t*0.7)*0.1;
    dir.y += Math.cos(t*0.5)*0.1;
    dir.z += Math.sin(t*0.9)*0.1;
    dir.normalize();

    d.mesh.position.copy(dir.multiplyScalar(density));

    /* Tumble accumulates rather than deriving from time, so that
       moving the Spin dial doesn't snap the letters to a new angle.
       That means Freeze has to gate it explicitly — everything else
       in here is a function of `time`, which is already frozen. */
    if(!paused){
      d.spun.x += d.rate.x * spin;
      d.spun.y += d.rate.y * spin;
      d.spun.z += d.rate.z * spin;
    }
    d.mesh.rotation.set(d.spun.x, d.spun.y, d.spun.z);

    if(!isMono()){
      var c = d.originalColor.clone();
      var s = Math.sin(t * shift) * 0.1;
      if(ink === 'vowel'){
        if(d.warm) c.offsetHSL(s*0.5, 0, Math.sin(t*0.3)*0.1);
        else       c.offsetHSL(s*-0.3, 0, Math.cos(t*0.4)*0.08);
      } else {
        c.offsetHSL(s, 0, 0);
      }
      d.mesh.material.color.copy(c);
      if(d.mesh.material.emissive) d.mesh.material.emissive.copy(c.clone().multiplyScalar(0.15));
    }
  }
}

function frame(){
  requestAnimationFrame(frame);
  if(!paused) time += 0.016;
  place();
  camera.position.set(
    Math.cos(camYaw)*Math.cos(camPitch)*camDist,
    Math.sin(camPitch)*camDist,
    Math.sin(camYaw)*Math.cos(camPitch)*camDist
  );
  camera.lookAt(0,0,0);
  renderer.render(scene, camera);
}

                    holeO.bezierCurveTo(0.4, 0.7, 0.7, 0.4, 1, 0.4);
                    shape.holes.push(holeO);
                    break;

                    shape.moveTo(0, 0);
                    shape.lineTo(0, 3);
                    shape.lineTo(1.5, 3);
                    shape.bezierCurveTo(2, 3, 2.5, 2.5, 2.5, 2);
                    shape.bezierCurveTo(2.5, 1.5, 2, 1, 1.5, 1);
                    shape.lineTo(0.4, 1);

                    holeP.bezierCurveTo(1.8, 1.4, 2, 1.7, 2, 2);
                    holeP.bezierCurveTo(2, 2.3, 1.8, 2.6, 1.3, 2.6);
                    holeP.lineTo(0.4, 2.6);

                    shape.bezierCurveTo(0.5, 0, 0, 0.5, 0, 1.5);
                    shape.bezierCurveTo(0, 2.5, 0.5, 3, 1, 3);

                    holeQ.bezierCurveTo(1.6, 2.3, 1.3, 2.6, 1, 2.6);

                    shape.bezierCurveTo(2, 3, 2.5, 2.5, 2.5, 2);

order.forEach(function(k){

  b.setAttribute('aria-pressed', k===active ? 'true' : 'false');
  b.addEventListener('click', function(){ select(k); });
  strip.appendChild(b);
});

function select(k){
  active = k;
  Array.prototype.forEach.call(strip.children, function(b,i){
    b.setAttribute('aria-pressed', order[i]===k ? 'true' : 'false');
  });
  dial.value = Math.round(P[k].v*1000);

}

dial.addEventListener('input', function(){
  var v = (+dial.value)/1000;
  P[active].v = v;
  rvalue.textContent = P[active].fmt(v);
  if(active === 'depth'){
    var z = P.depth.map(v) / BASE_DEPTH;
    for(var i=0;i<letterData.length;i++) letterData[i].mesh.scale.z = z;
  }

/* ---------- URL state ---------- */
var hashLock = false;

function stateQuery(){
  return [
    'w=' + encodeURIComponent(wordEl.value),
    's=' + seed,
    'src=' + source,
    'i=' + ink,
    'sh=' + shade,
    'p=' + order.map(function(k){ return Math.round(P[k].v*1000); }).join('.')
  ].join('&');
}

/* Sandboxed previews run this file on a foreign origin, where
   replaceState throws SecurityError. Try once, then stop trying —
   the Link button still hands over a working URL either way. */
var canHash = true;

function writeHash(){
  if(!canHash) return;
  try {
    hashLock = true;
    history.replaceState(null, '', '#' + stateQuery());
    setTimeout(function(){ hashLock = false; }, 0);
  } catch(e){
    canHash = false;
    hashLock = false;
  }
}

function shareURL(){
  var base;
  try { base = location.href.split('#')[0]; } catch(e){ base = ''; }
  return base + '#' + stateQuery();
}

function copyLink(){
  var url = shareURL();
  var btn = document.getElementById('link');
  function ok(){
    btn.textContent = 'Copied';
    setTimeout(function(){ btn.textContent = 'Link'; }, 1400);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(ok, function(){ window.prompt('Copy this link', url); });
  } else {
    window.prompt('Copy this link', url);
  }
}

function readHash(){
  var h = location.hash.replace(/^#/, '');
  if(!h) return false;
  var q = {};
  h.split('&').forEach(function(pair){
    var i = pair.indexOf('=');
    if(i > 0) q[pair.slice(0,i)] = decodeURIComponent(pair.slice(i+1));
  });
  if(q.w !== undefined) wordEl.value = q.w;
  if(q.src === 'traced' || q.src === 'drawn'){
    source = q.src;
    document.getElementById('src').textContent = (source === 'drawn') ? 'Drawn' : 'Traced';
  }
  if(q.i !== undefined && INKS.indexOf(q.i) >= 0) ink = q.i;
  if(q.sh === 'flat' || q.sh === 'modeled'){
    shade = q.sh;
    document.getElementById('shade').textContent = (shade === 'modeled') ? 'Modeled' : 'Flat';
  }
  if(q.p){
    var parts = q.p.split('.');
    order.forEach(function(k,i){
      var n = parseInt(parts[i], 10);
      if(isFinite(n)) P[k].v = Math.max(0, Math.min(1, n/1000));
    });
  }
  seed = /^[a-z0-9]{1,8}$/.test(q.s || '') ? q.s : seedFromWord(wordEl.value);
  return true;
}

window.addEventListener('hashchange', function(){
  if(hashLock) return;
  if(readHash()){ select(active); showSeed(); build(wordEl.value); placeCaret(); }
});

/* ---------- orbit by hand ---------- */
var stage = document.getElementById('stage');
var drag = false, lx = 0, ly = 0, pinch = 0;

stage.addEventListener('pointerdown', function(e){ drag = true; lx = e.clientX; ly = e.clientY; });
window.addEventListener('pointerup',   function(){ drag = false; });
window.addEventListener('pointercancel', function(){ drag = false; });
window.addEventListener('pointermove', function(e){
  if(!drag) return;
  camYaw   -= (e.clientX - lx) * 0.006;
  camPitch += (e.clientY - ly) * 0.006;
  camPitch = Math.max(-1.45, Math.min(1.45, camPitch));
  lx = e.clientX; ly = e.clientY;
});
stage.addEventListener('wheel', function(e){
  e.preventDefault();
  camDist = Math.max(2.2, Math.min(30, camDist + e.deltaY*0.01));
}, {passive:false});
stage.addEventListener('touchmove', function(e){
  if(e.touches.length === 2){
    e.preventDefault();
    var d = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    if(pinch) camDist = Math.max(2.2, Math.min(30, camDist + (pinch - d)*0.03));
    pinch = d;
  }
}, {passive:false});
stage.addEventListener('touchend', function(){ pinch = 0; });

  camera.aspect = innerWidth/innerHeight;

});

/* ---------- binary STL ---------- */
function saveSTL(){
  if(!letterData.length) return;
  knot.updateMatrixWorld(true);

  var tris = [];
  letterData.forEach(function(d){
    var g = d.mesh.geometry.clone().applyMatrix4(d.mesh.matrixWorld);
    var g2 = g.index ? g.toNonIndexed() : g;
    var pos = g2.attributes.position;
    for(var i=0;i<pos.count;i+=3){
      tris.push([
        new THREE.Vector3().fromBufferAttribute(pos, i),
        new THREE.Vector3().fromBufferAttribute(pos, i+1),
        new THREE.Vector3().fromBufferAttribute(pos, i+2)
      ]);
    }
    g.dispose(); if(g2 !== g) g2.dispose();
  });

  var buf = new ArrayBuffer(84 + tris.length*50);
  var dv = new DataView(buf);
  dv.setUint32(80, tris.length, true);
  var off2 = 84;
  var n = new THREE.Vector3(), ab = new THREE.Vector3(), ac = new THREE.Vector3();
  tris.forEach(function(t){
    ab.subVectors(t[1], t[0]);
    ac.subVectors(t[2], t[0]);
    n.crossVectors(ab, ac).normalize();
    dv.setFloat32(off2,   n.x, true);
    dv.setFloat32(off2+4, n.y, true);
    dv.setFloat32(off2+8, n.z, true);
    off2 += 12;
    for(var k=0;k<3;k++){
      dv.setFloat32(off2,   t[k].x, true);
      dv.setFloat32(off2+4, t[k].y, true);
      dv.setFloat32(off2+8, t[k].z, true);
      off2 += 12;
    }
    dv.setUint16(off2, 0, true);
    off2 += 2;
  });

  var slug = wordEl.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,24) || 'WORD';
  var url = URL.createObjectURL(new Blob([buf], {type:'application/octet-stream'}));
  var link = document.createElement('a');
  link.href = url;
  link.download = 'signgularity-' + slug + '-' + seed + '.stl';
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}
document.getElementById('stl').addEventListener('click', saveSTL);
document.getElementById('link').addEventListener('click', copyLink);

/* ---------- audit mode: #audit ----------
   Sweeps the drawn alphabet plus a sample of every script the traced
   source is likely to meet, on THIS device with THIS device's fonts,
   and reports what the validator found. Offline checks can't do that.
   Open with #audit before any deploy. */
var AUDIT_SETS = [
  ['drawn A-Z',   'drawn',  'ABCDEFGHIJKLMNOPQRSTUVWXYZ'],
  ['digits',      'traced', '0123456789'],
  ['punctuation', 'traced', '.,;:!?-\u2014\u2019&#@*/()[]{}'],
  ['Greek',       'traced', '\u0391\u0392\u0393\u0394\u0398\u039b\u039e\u03a0\u03a3\u03a6\u03a8\u03a9'],
  ['Cyrillic',    'traced', '\u0410\u0411\u0412\u0413\u0414\u0416\u0417\u0418\u041b\u041f\u0424\u0426\u0427\u0428\u0429\u042a\u042b\u042d\u042e\u042f'],
  ['Hebrew',      'traced', '\u05d0\u05d1\u05d2\u05d3\u05d4\u05d5\u05d6\u05d7\u05d8\u05db\u05de\u05e0\u05e1\u05e2\u05e4\u05e6\u05e7\u05e8\u05e9\u05ea'],
  ['Arabic',      'traced', '\u0627\u0628\u062a\u062c\u062d\u062f\u0631\u0633\u0635\u0637\u0639\u0641\u0642\u0643\u0644\u0645\u0646\u0647\u0648\u064a'],
  ['Kana',        'traced', '\u3042\u3044\u3046\u3048\u304a\u30ab\u30ad\u30af\u30b1\u30b3\u3093'],
  ['Hangul',      'traced', '\uac00\ub098\ub2e4\ub77c\ub9c8\ubc14\uc0ac\uc544\uc790\ud558'],
  ['Hanzi',       'traced', '\u8a9e\u5bc6\u7121\u9580\u6771\u4eac\u6f22\u5b57\u9f8d\u9b31'],
  ['Devanagari',  'traced', '\u0905\u0915\u0917\u091c\u0924\u0926\u0928\u092a\u092e\u0930\u0932\u0938'],
  ['Symbols',     'traced', '\u2020\u00a7\u00b6\u221e\u2202\u2211\u25a0\u25b2\u2605\u2660\u266a\u2713']
];

function runAudit(){
  var sourceWas = source, rows = [], totals = { n:0, fail:0, repaired:0, degen:0, verts:0 };

  AUDIT_SETS.forEach(function(set){
    source = set[1];
    var name = set[0], chars = Array.from(set[2]);
    var fails = [], notes = {}, verts = 0, degen = 0, missing = [], repaired = 0;

    chars.forEach(function(ch){
      lastAudit.length = 0;
      var key = (source === 'drawn' && /^[A-Z]$/.test(ch) ? 'D' : 'T') + ch;
      delete geoCache[key];
      var g = letterGeometry(ch);
      var rec = lastAudit[lastAudit.length-1];
      totals.n++;
      if(!g){
        if(rec){ fails.push(ch); notes[rec.check.note || 'invalid'] = 1; totals.fail++; }
        else { missing.push(ch); }
        return;
      }
      verts += rec.check.verts;
      degen += rec.check.degenerate;
      if(rec.check.repaired){ repaired++; totals.repaired++; }
    });

    totals.degen += degen; totals.verts += verts;
    var line = pad(name, 13) + pad(String(chars.length), 4) +
               pad(verts ? Math.round(verts/Math.max(1,chars.length-fails.length-missing.length)) : 0, 8) +
               pad(String(degen), 7) + pad(String(repaired), 6);
    if(missing.length) line += ' noglyph:' + missing.join('');
    if(fails.length)   line += ' FAIL:' + fails.join('') + ' (' + Object.keys(notes).join(',') + ')';
    rows.push(line);
  });

  source = sourceWas;
  geoCache = {};

  function pad(s,n){ s = String(s); while(s.length<n) s += ' '; return s; }

  var head = pad('set',13) + pad('n',4) + pad('verts~',8) + pad('degen',7) + pad('fixed',6);
  var out = 'SIGNGULARITY GLYPH AUDIT\n' + navigator.userAgent + '\n\n' +
            head + '\n' + rows.join('\n') +
            '\n\nchecked ' + totals.n + '  rejected ' + totals.fail +
            '  auto-repaired ' + totals.repaired + '  degenerate tris ' + totals.degen +
            '\n\n"noglyph" means this device has no font for those — not a defect.' +
            '\nAny FAIL is a sign that would be silently dropped in normal use.';

  var pre = document.createElement('pre');
  pre.textContent = out;
  pre.style.cssText = 'position:fixed;inset:0;z-index:99;margin:0;padding:18px;overflow:auto;' +
    'background:#000;color:#fff;font:12px/1.5 "Courier Prime","Courier New",monospace;white-space:pre;';
  pre.addEventListener('click', function(){ pre.remove(); });
  document.body.appendChild(pre);
}

if(/(^|[#&])audit/.test(location.hash)) setTimeout(runAudit, 60);

})();
</script>
</body>
</html>
