  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;height:100dvh;overflow:hidden;background:#000;color:#fff;
    font-family:"Courier Prime Sub","Courier Prime","Courier New",Courier,monospace;
    -webkit-tap-highlight-color:transparent}
  body{display:flex;flex-direction:column}

  #field{flex:1 1 auto;align-self:stretch;width:100%;min-height:38vh;display:block;
    image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}

  #panel{flex:0 0 auto;padding:14px 18px calc(14px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:12px;max-width:660px;
    max-height:60vh;overflow-y:auto}
  #meta{font-size:11px;letter-spacing:.18em;line-height:1.8}
  #meta span{display:block;font-size:10px;letter-spacing:.1em;opacity:.55}
  #sliders{display:grid;grid-template-columns:auto minmax(90px,1fr) auto;
    gap:9px 14px;align-items:center;font-size:12px;letter-spacing:.06em}
  #sliders b{font-weight:normal;opacity:.5}
  #sliders i{font-style:normal;text-align:right;min-width:4.2em}
  #words{display:flex;flex-wrap:wrap;gap:11px 20px;align-items:baseline;
    font-size:12px;letter-spacing:.08em}

  .ctl{background:none;border:0;color:#fff;font:inherit;letter-spacing:inherit;
    padding:0;cursor:pointer;white-space:nowrap;user-select:none;-webkit-user-select:none}
  .ctl:focus-visible,input[type=range]:focus-visible{outline:2px solid #fff;outline-offset:4px}
  .ctl .k{opacity:.5;margin-right:.55em}
  @media (hover:hover){.ctl:hover{opacity:.65}}

  input[type=range]{-webkit-appearance:none;appearance:none;background:none;
    width:100%;height:18px;cursor:ew-resize}
  input[type=range]::-webkit-slider-runnable-track{height:2px;background:#575757}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;border:0;border-radius:0;
    width:9px;height:15px;background:#fff;margin-top:-7px}
  input[type=range]::-moz-range-track{height:2px;background:#575757}
  input[type=range]::-moz-range-thumb{border:0;border-radius:0;width:9px;height:15px;background:#fff}

  #restore{display:none}
  body.min #panel{display:none}
  body.min #restore{display:flex;gap:20px;flex:0 0 auto;font-size:11px;letter-spacing:.12em;
    padding:9px 18px calc(9px + env(safe-area-inset-bottom))}
</style>
</head>
<body>

<canvas id="field"></canvas>

<div id="panel">
  <div id="meta">belousov–zhabotinsky
    <span>drag the field to feed it</span></div>

  <div id="sliders">
    <b>speed</b><input type="range" id="sSpeed" min="0" max="1000" step="1" aria-label="speed"><i id="vSpeed"></i>
    <b>bands</b><input type="range" id="sBand"  min="0" max="9"    step="1" aria-label="colour bands"><i id="vBand"></i>
    <b>alpha</b><input type="range" id="sA" min="400" max="2000" step="5" aria-label="alpha"><i id="vA"></i>
    <b>beta</b><input type="range" id="sB" min="400" max="2000" step="5" aria-label="beta"><i id="vB"></i>
    <b>gamma</b><input type="range" id="sG" min="400" max="2000" step="5" aria-label="gamma"><i id="vG"></i>
  </div>

  <div id="words">
    <button class="ctl" id="run"></button>
    <button class="ctl" id="view"></button>
    <button class="ctl" id="pal"></button>
    <button class="ctl" id="drift"></button>
    <button class="ctl" id="seed">seed again</button>
    <button class="ctl" id="imm">full screen</button>
  </div>
</div>

<div id="restore">
  <button class="ctl" id="showCtl">controls</button>
  <button class="ctl" id="exitFs">leave full screen</button>
</div>

<script>
"use strict";
const cv = document.getElementById('field');
const ctx = cv.getContext('2d', {alpha:false});
const $ = id => document.getElementById(id);

/* ---- state ---------------------------------------------------------- */
const CALM = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=0,H=0,N=0, A,B,C, A2,B2,C2, img, px;
let alpha=1.20, beta=1.00, gamma=1.00, dt=0.10;
let running=!CALM, bandIdx=4, palIdx=0, driftIdx=CALM?0:1, viewIdx=0, shift=0;

const BANDS  = [3,4,5,6,8,10,12,16,24,0];      // 0 = smooth, at the top of the slider
const DRIFTS = [{n:'still',v:0},{n:'slow',v:0.00012},{n:'fast',v:0.0005},{n:'reverse',v:-0.0003}];
const VIEWS  = ['one species','all three'];
const PALETTES = [
  {n:'spectra',     loop:true,  s:['#ff0057','#ffd200','#00ff9d','#00b3ff','#7a4bff']},
  {n:'spectra ×3',  loop:true,  s:['#ff0057','#ffd200','#00ff9d','#00b3ff','#7a4bff',
                                   '#ff0057','#ffd200','#00ff9d','#00b3ff','#7a4bff',
                                   '#ff0057','#ffd200','#00ff9d','#00b3ff','#7a4bff']},
  {n:'iridescence', loop:true,  s:['#00ffd5','#7cff2f','#ffe600','#ff2f7c','#8b2bff','#1f6fff']},
  {n:'vhs',         loop:true,  s:['#05010e','#2d0a4e','#ff2bd6','#00e5ff','#eafcff','#00e5ff','#ff2bd6','#2d0a4e']},
  {n:'coolant',     loop:false, s:['#00060f','#003a63','#0fb7c9','#b8fff6','#ffffff']},
  {n:'chlorophyll', loop:false, s:['#03130a','#0b5b2a','#5ad12b','#d9ff6b','#f6ffe8']},
  {n:'ultraviolet', loop:true,  s:['#07020f','#3b0f6b','#8b2bff','#ff5ad6','#ffe6ff','#8b2bff','#3b0f6b']},
  {n:'oxide',       loop:true,  s:['#0a0410','#1f6fff','#00ffe1','#f2fff6','#ff36a8']},
  {n:'monolith',    loop:false, s:['#000000','#3a3a3a','#8a8a8a','#e8e8e8','#ffffff']}
];

/* ---- palette lookup -------------------------------------------------
   pixels are packed as little-endian RGBA, which every shipping browser
   platform is; big-endian would show channels swapped, not crash.       */
const LN = 512, lut = new Uint32Array(LN), qb = new Uint8Array(256);
function hex(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
let ring = [];
function buildRing(){
  const p = PALETTES[palIdx];
  let s = p.s.slice();
  if(!p.loop) s = s.concat(s.slice(1,-1).reverse());   // mirror into a seamless loop
  ring = s.map(hex);
}
function buildLUT(){
  const L = ring.length, bands = BANDS[bandIdx];
  for(let i=0;i<256;i++){
    let t = i/255;
    if(bands) t = Math.round(t*(bands-1))/(bands-1);
    qb[i] = (t*255)|0;
  }
  for(let i=0;i<LN;i++){
    let t = i/(LN-1);
    if(bands) t = Math.round(t*(bands-1))/(bands-1);
    let pos = (t + shift) % 1; if(pos<0) pos += 1;
    const f = pos*L, i0 = Math.floor(f)%L, i1 = (i0+1)%L, m = f-Math.floor(f);
    const c0 = ring[i0], c1 = ring[i1];
    const r = (c0[0]+(c1[0]-c0[0])*m)|0,
          g = (c0[1]+(c1[1]-c0[1])*m)|0,
          b = (c0[2]+(c1[2]-c0[2])*m)|0;
    lut[i] = (255<<24) | (b<<16) | (g<<8) | r;
  }
}

/* ---- grid ------------------------------------------------------------
   resizing resamples the existing field instead of reseeding, so a look
   you have dialled in survives going full screen. no-ops when the cell
   count would not change, so repeated layout events cost nothing.       */
let CELL = 3.5;      // css pixels per cell — keeps the grain consistent
let CAP  = 60000;    // per-frame ceiling, stepped down if the device struggles
function allocate(preserve){
  const r = cv.getBoundingClientRect();
  const dw = Math.max(1, r.width), dh = Math.max(1, r.height);
  let nW = Math.max(72, Math.round(dw/CELL)), nH = Math.max(72, Math.round(dh/CELL));
  if(nW*nH > CAP){ const s = Math.sqrt(nW*nH/CAP);
    nW = Math.max(72, Math.round(nW/s)); nH = Math.max(72, Math.round(nH/s)); }
  const nN = nW*nH;
  if(nW===W && nH===H) return;
  const nA = new Float32Array(nN), nB = new Float32Array(nN), nC = new Float32Array(nN);
  const had = N>0;
  if(preserve && had){
    for(let y=0;y<nH;y++){
      const sy = Math.min(H-1, (y*H/nH)|0)*W, ry = y*nW;
      for(let x=0;x<nW;x++){
        const s = sy + Math.min(W-1, (x*W/nW)|0);
        nA[ry+x]=A[s]; nB[ry+x]=B[s]; nC[ry+x]=C[s];
      }
    }
  }
  A=nA; B=nB; C=nC; W=nW; H=nH; N=nN;
  A2=new Float32Array(nN); B2=new Float32Array(nN); C2=new Float32Array(nN);
  cv.width=W; cv.height=H;
  img = ctx.createImageData(W,H);
  px = new Uint32Array(img.data.buffer);
  if(!(preserve && had)) seed();
}
function seed(){
  for(let i=0;i<N;i++){ A[i]=Math.random(); B[i]=Math.random(); C[i]=Math.random(); }
  for(let s=0;s<44;s++) step(1);   // burn in, so the slow view opens on structure
}
function feed(gx,gy,r){
  for(let dy=-r;dy<=r;dy++){
    const y = ((gy+dy)%H+H)%H;
    for(let dx=-r;dx<=r;dx++){
      if(dx*dx+dy*dy > r*r) continue;
      const i = y*W + (((gx+dx)%W+W)%W);
      A[i]=Math.random(); B[i]=Math.random(); C[i]=Math.random();
    }
  }
}

/* ---- the reaction ---------------------------------------------------
   three coupled species, each cell reacting against the 3x3 mean of its
   neighbours on a torus — the classic BZ automaton. dt scales diffusion
   and reaction together, so low values are true slow motion.            */
function step(d){
  for(let y=0;y<H;y++){
    const r0=((y-1+H)%H)*W, r1=y*W, r2=((y+1)%H)*W;
    for(let x=0;x<W;x++){
      const xm=(x-1+W)%W, xp=(x+1)%W;
      const i0=r0+xm, i1=r0+x, i2=r0+xp,
            i3=r1+xm, i4=r1+x, i5=r1+xp,
            i6=r2+xm, i7=r2+x, i8=r2+xp;
      const a=(A[i0]+A[i1]+A[i2]+A[i3]+A[i4]+A[i5]+A[i6]+A[i7]+A[i8])/9;
      const b=(B[i0]+B[i1]+B[i2]+B[i3]+B[i4]+B[i5]+B[i6]+B[i7]+B[i8])/9;
      const c=(C[i0]+C[i1]+C[i2]+C[i3]+C[i4]+C[i5]+C[i6]+C[i7]+C[i8])/9;
      const oa=A[i4], ob=B[i4], oc=C[i4];
      let na = oa + d*((a-oa) + a*(alpha*b - gamma*c));
      let nb = ob + d*((b-ob) + b*(beta*c  - alpha*a));
      let nc = oc + d*((c-oc) + c*(gamma*a - beta*b));
      A2[i4] = na<0?0:na>1?1:na;
      B2[i4] = nb<0?0:nb>1?1:nb;
      C2[i4] = nc<0?0:nc>1?1:nc;
    }
  }
  let t;
  t=A;A=A2;A2=t; t=B;B=B2;B2=t; t=C;C=C2;C2=t;
}

function paint(){
  if(viewIdx===1){
    /* all three species at once: a, b, c drive r, g, b. drift rotates
       which species owns which channel, blending through the changeover. */
    const pos = shift*3, k = Math.floor(pos)%3, f = pos - Math.floor(pos);
    let X,Y,Z;
    if(k===0){ X=A;Y=B;Z=C; } else if(k===1){ X=B;Y=C;Z=A; } else { X=C;Y=A;Z=B; }
    for(let i=0;i<N;i++){
      const xi=X[i], yi=Y[i], zi=Z[i];
      const r = xi+(yi-xi)*f, g = yi+(zi-yi)*f, b = zi+(xi-zi)*f;
      px[i] = (255<<24) | (qb[(b*255)|0]<<16) | (qb[(g*255)|0]<<8) | qb[(r*255)|0];
    }
  } else {
    for(let i=0;i<N;i++){
      const v = A[i];
      px[i] = lut[(v<=0?0:v>=1?LN-1:(v*(LN-1))|0)];
    }
  }
  ctx.putImageData(img,0,0);
}

function frame(){
  const t0 = performance.now();
  if(running){
    step(dt);
    const d = DRIFTS[driftIdx].v;
    if(d){ shift = (shift + d) % 1; if(viewIdx===0) buildLUT(); }
  }
  paint();
  watch(performance.now()-t0);
  requestAnimationFrame(frame);
}

/* ---- labels --------------------------------------------------------- */
function label(){
  $('run').innerHTML   = '<span class="k">state</span>' + (running ? 'flowing' : 'held');
  $('view').innerHTML  = '<span class="k">view</span>' + VIEWS[viewIdx];
  $('pal').innerHTML   = '<span class="k">colour</span>' + PALETTES[palIdx].n;
  $('pal').style.opacity = viewIdx===1 ? .35 : 1;
  $('drift').innerHTML = '<span class="k">drift</span>' + DRIFTS[driftIdx].n;
  $('imm').textContent = isFs() ? 'leave full screen' : 'full screen';
  $('vSpeed').textContent = dt.toFixed(2) + '×';
  $('vBand').textContent  = BANDS[bandIdx] || 'smooth';
  $('vA').textContent = alpha.toFixed(2);
  $('vB').textContent = beta.toFixed(2);
  $('vG').textContent = gamma.toFixed(2);
}

/* ---- sliders -------------------------------------------------------- */
/* speed runs on an exponential curve: fine control down at the slow end */
const DT_MIN = 0.01, DT_MAX = 1;
const dtToPos = v => Math.round(1000*Math.log(v/DT_MIN)/Math.log(DT_MAX/DT_MIN));
const posToDt = p => DT_MIN*Math.pow(DT_MAX/DT_MIN, p/1000);

$('sSpeed').value = dtToPos(dt);
$('sSpeed').oninput = e => { dt = posToDt(+e.target.value); label(); };
$('sBand').value = bandIdx;
$('sBand').oninput = e => { bandIdx = +e.target.value; buildLUT(); label(); };
function param(slider, set){
  $(slider).oninput = e => { set(+e.target.value/1000); label(); };
}
$('sA').value = alpha*1000; param('sA', v => alpha = v);
$('sB').value = beta*1000;  param('sB', v => beta  = v);
$('sG').value = gamma*1000; param('sG', v => gamma = v);

/* ---- word controls -------------------------------------------------- */
$('run').onclick   = () => { running = !running; label(); };
$('view').onclick  = () => { viewIdx=(viewIdx+1)%VIEWS.length; label(); };
$('pal').onclick   = () => { palIdx=(palIdx+1)%PALETTES.length; buildRing(); buildLUT(); label(); };
$('drift').onclick = () => { driftIdx=(driftIdx+1)%DRIFTS.length; label(); };
$('seed').onclick  = () => { seed(); };

/* ---- full screen ----------------------------------------------------
   where element full screen is unavailable (iOS), the same control just
   collapses the panel, which gets most of the way there.               */
const root = document.documentElement;
const canFs = !!(root.requestFullscreen || root.webkitRequestFullscreen);
function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function leaveFs(){
  const ex = document.exitFullscreen || document.webkitExitFullscreen;
  if(ex) Promise.resolve(ex.call(document)).catch(()=>{});
}
function setMin(on){
  document.body.classList.toggle('min', on);
  $('exitFs').style.display = isFs() ? '' : 'none';
  label();
  allocate(true);
}
$('imm').onclick = () => {
  if(isFs()){ leaveFs(); return; }
  if(canFs){
    const req = root.requestFullscreen || root.webkitRequestFullscreen;
    Promise.resolve(req.call(root)).catch(()=>{}).then(()=>setMin(true));
  } else setMin(true);
};
$('showCtl').onclick = () => setMin(false);
$('exitFs').onclick  = leaveFs;
addEventListener('fullscreenchange', () => setMin(isFs()));
addEventListener('webkitfullscreenchange', () => setMin(isFs()));

/* ---- feeding the field ---------------------------------------------- */
let down=false;
function toGrid(e){
  const r = cv.getBoundingClientRect();
  return [ Math.floor((e.clientX-r.left)/r.width*W), Math.floor((e.clientY-r.top)/r.height*H) ];
}
cv.addEventListener('pointerdown', e => { down=true; cv.setPointerCapture(e.pointerId);
  const [x,y]=toGrid(e); feed(x,y,Math.max(3,(W*0.045)|0)); });
cv.addEventListener('pointermove', e => { if(!down) return;
  const [x,y]=toGrid(e); feed(x,y,Math.max(2,(W*0.03)|0)); });
cv.addEventListener('pointerup',   () => down=false );
cv.addEventListener('pointercancel',()=> down=false );

/* ---- keyboard (desktop) --------------------------------------------- */
addEventListener('keydown', e => {
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.target.tagName==='INPUT') return;
  if(e.code==='Space'){ e.preventDefault(); running=!running; label(); }
  else if(e.key==='s'){ seed(); }
  else if(e.key==='f'){ $('imm').click(); }
  else if(e.key==='c'){ document.body.classList.contains('min') ? setMin(false) : setMin(true); }
});

/* ---- adaptive resolution --------------------------------------------
   if the reaction can't keep a frame budget on this device, drop the cell
   count once or twice rather than letting it crawl.                     */
let samples=0, total=0, drops=0;
function watch(ms){
  if(drops>=2 || !running) return;
  total+=ms; samples++;
  if(samples<120) return;
  const avg = total/samples; samples=0; total=0;
  if(avg > 14 && N > 14000){
    drops++; CELL *= 1.28; CAP = Math.round(N*0.6);
    allocate(true);                   // new CELL changes the target, so this lands
  }
}

/* ---- go ------------------------------------------------------------- */
let rt;
addEventListener('resize', () => { clearTimeout(rt); rt=setTimeout(()=>allocate(true), 220); });
addEventListener('orientationchange', () => { clearTimeout(rt); rt=setTimeout(()=>allocate(true), 320); });
buildRing(); buildLUT(); allocate(false); label(); frame();
</script>
</body>
</html>
