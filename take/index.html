<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>take</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;background:#000;color:#fff;
    overflow:hidden;overscroll-behavior:none}
  body{font-family:"Courier Prime","Courier New",Courier,monospace;font-size:15px}
  #cv{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;
    image-rendering:pixelated;touch-action:none;z-index:1}
  #gate{position:fixed;inset:0;z-index:4;background:#000;display:flex;
    align-items:center;justify-content:center}
  #go{font:inherit;font-size:16px;letter-spacing:.5em;color:#fff;background:#000;
    border:0;padding:18px 22px;cursor:pointer}
  #note{position:fixed;z-index:3;left:0;right:0;
    bottom:calc(18px + env(safe-area-inset-bottom));text-align:center;
    font-size:13px;letter-spacing:.24em;color:#fff;
    text-shadow:0 0 8px #000,0 0 3px #000;pointer-events:none;transition:opacity 2s}
</style>
</head>
<body>

<canvas id="cv"></canvas>
<div id="note"></div>
<div id="gate"><button id="go">TAKE</button></div>

<script>
"use strict";
/* =====================================================================
   A field, not a picture of anything.

   Two substances diffuse through a coarse grid and eat each other
   (Gray-Scott). Left alone, the feed and kill rates wander, so the
   field keeps changing its mind: spots, then worms, then a slow boil.

   Played a take, it starts from nothing. Every attack in the audio
   drops one dot, placed by how bright that sound was, and everything
   on screen grows out of those dots. The playing seeds the field; the
   chemistry does the rest.

   Everything is drawn in four inks. The continuous field is forced
   into them by an ordered Bayer threshold, so gradients arrive as
   dither texture instead of as blur.
 ===================================================================== */

const $ = s => document.querySelector(s);
const cv = $("#cv"), ctx = cv.getContext("2d", { alpha:false });

/* ---------- ink: four steps, dark to light ------------------------------- */

const INKS = [
  ["#04070c","#123a4f","#2f8fa6","#d8f4ff"],   // deep water
  ["#080306","#3c1040","#a52d7a","#ffd9f2"],   // bloom
  ["#02060a","#123f2a","#3fa05c","#eaffd6"],   // chlorophyll
  ["#05050a","#2a2550","#7b6ad6","#efeaff"],   // dusk
  ["#060403","#123b45","#57b0a4","#e8fff6"]    // shallows
];
let inkA = 0, inkB = 1, inkMix = 0;

const rgb = h => [parseInt(h.substr(1,2),16), parseInt(h.substr(3,2),16), parseInt(h.substr(5,2),16)];
const lerp = (a,b,t) => a + (b-a)*t;

/* the 8x8 ordered matrix. this is the whole look: no smoothing anywhere. */
const BAYER = (() => {
  const m = [
    [ 0,32, 8,40, 2,34,10,42],[48,16,56,24,50,18,58,26],
    [12,44, 4,36,14,46, 6,38],[60,28,52,20,62,30,54,22],
    [ 3,35,11,43, 1,33, 9,41],[51,19,59,27,49,17,57,25],
    [15,47, 7,39,13,45, 5,37],[63,31,55,23,61,29,53,21]];
  const f = new Float32Array(64);
  for(let y=0;y<8;y++) for(let x=0;x<8;x++) f[y*8+x] = (m[y][x] + 0.5)/64;
  return f;
})();

/* ---------- the field ---------------------------------------------------- */

const PX = 5;                       // cell size on screen
let W=0, H=0, u, v, u2, v2, img, gridCv, gridCtx;

/* feed and kill wander through the region where the system stays alive.
   those two numbers are the entire mood of the thing.                   */
let F = 0.030, K = 0.0605, dF = 0, dK = 0, wander = Math.random()*100, quiet = 0;
/* how hard an attack has to be is judged against this take's own recent
   attacks, not against a fixed number. quiet fingerpicking and hard
   strumming then both land about the same number of dots.              */
let riseAvg = 0.01, sinceDot = 0;
const DU = 0.20, DV = 0.10;

function build(){
  const vw = Math.max(1, window.innerWidth), vh = Math.max(1, window.innerHeight);
  cv.width  = Math.max(PX*8, Math.floor(vw/PX)*PX);
  cv.height = Math.max(PX*8, Math.floor(vh/PX)*PX);
  W = cv.width/PX; H = cv.height/PX;
  u = new Float32Array(W*H).fill(1);
  v = new Float32Array(W*H);
  u2 = new Float32Array(W*H);
  v2 = new Float32Array(W*H);
  gridCv = document.createElement("canvas");
  gridCv.width = W; gridCv.height = H;
  gridCtx = gridCv.getContext("2d", { alpha:false });
  img = gridCtx.createImageData(W,H);
  if(!takeFromHash()){
    // with no take to listen to, the field starts already inhabited
    for(let i=0;i<14;i++) seed(Math.random()*W, Math.random()*H, 3 + Math.random()*6);
  }
  ctx.imageSmoothingEnabled = false;
}

function seed(cx, cy, r){
  const x0 = Math.max(0, (cx-r)|0), x1 = Math.min(W, (cx+r)|0);
  const y0 = Math.max(0, (cy-r)|0), y1 = Math.min(H, (cy+r)|0);
  for(let y=y0; y<y1; y++)
    for(let x=x0; x<x1; x++)
      if(Math.hypot(x-cx, y-cy) < r){
        const i = y*W+x;
        v[i] = 0.5 + Math.random()*0.25;
        u[i] = 0.25;
      }
}

/* one Gray-Scott pass, wrapped at the edges so the field has no border */
function step(){
  const f = F, k = K;
  for(let y=0;y<H;y++){
    const yn = ((y-1+H)%H)*W, ys = ((y+1)%H)*W, yc = y*W;
    for(let x=0;x<W;x++){
      const xw = (x-1+W)%W, xe = (x+1)%W, i = yc+x;
      const uu = u[i], vv = v[i];
      const lu = (u[yc+xw] + u[yc+xe] + u[yn+x] + u[ys+x]
                + 0.5*(u[yn+xw] + u[yn+xe] + u[ys+xw] + u[ys+xe])) / 6 - uu;
      const lv = (v[yc+xw] + v[yc+xe] + v[yn+x] + v[ys+x]
                + 0.5*(v[yn+xw] + v[yn+xe] + v[ys+xw] + v[ys+xe])) / 6 - vv;
      const r = uu*vv*vv;
      const nu = uu + DU*lu - r + f*(1-uu);
      const nv = vv + DV*lv + r - (f+k)*vv;
      u2[i] = nu < 0 ? 0 : nu > 1 ? 1 : nu;
      v2[i] = nv < 0 ? 0 : nv > 1 ? 1 : nv;
    }
  }
  u.set(u2); v.set(v2);
}

/* ---------- drawing ------------------------------------------------------ */

const pal = new Uint8Array(12);
function mixInks(){
  const a = INKS[inkA], b = INKS[inkB];
  for(let i=0;i<4;i++){
    const ca = rgb(a[i]), cb = rgb(b[i]);
    pal[i*3]   = lerp(ca[0], cb[0], inkMix);
    pal[i*3+1] = lerp(ca[1], cb[1], inkMix);
    pal[i*3+2] = lerp(ca[2], cb[2], inkMix);
  }
}

function draw(){
  const d = img.data;
  for(let y=0;y<H;y++){
    const row = (y&7)*8;
    for(let x=0;x<W;x++){
      const i = y*W+x;
      let t = v[i]*2.6;                 // v runs roughly 0 .. 0.4
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      const s = t*3, lo = s|0;
      const c = (s - lo) > BAYER[row + (x&7)] ? (lo > 2 ? 3 : lo+1) : lo;
      const o = i*4, p = c*3;
      d[o] = pal[p]; d[o+1] = pal[p+1]; d[o+2] = pal[p+2]; d[o+3] = 255;
    }
  }
  gridCtx.putImageData(img,0,0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(gridCv, 0, 0, cv.width, cv.height);
}

/* ---------- sound, if there is any --------------------------------------- */

let ac, analyser, freq, src, playing = false;
const A = { bass:0, mid:0, high:0, level:0, rise:0, bright:0.3 };

function listen(){
  if(!analyser) return;
  analyser.getByteFrequencyData(freq);
  const n = freq.length;
  const band = (a,b) => { let s=0; for(let i=a;i<b;i++) s+=freq[i]; return s/(Math.max(1,b-a)*255); };
  A.bass = A.bass*0.85 + band(1, n*0.03|0)*0.15;
  A.mid  = A.mid *0.85 + band(n*0.03|0, n*0.20|0)*0.15;
  A.high = A.high*0.85 + band(n*0.20|0, n*0.55|0)*0.15;
  const lvl = (A.bass + A.mid + A.high)/3;
  A.rise = lvl - A.level;                      // an attack, not a level
  A.level = lvl;
  let ws = 0, wm = 0;
  for(let i=1;i<n;i++){ ws += freq[i]*i; wm += freq[i]; }
  A.bright = wm > 1 ? (ws/wm)/n : 0.3;         // where the energy sits
}

/* ---------- the wander ---------------------------------------------------
   with no sound the parameters drift on their own, slowly, so the field
   never settles. sound leans on the same two numbers.                    */

function evolve(){
  wander += 0.00045;
  const baseF = 0.0300 + 0.0075*Math.sin(wander) + 0.0035*Math.sin(wander*0.37 + 1.7);
  const baseK = 0.0600 + 0.0045*Math.sin(wander*0.61 + 0.4) + 0.0020*Math.sin(wander*1.9);
  dF += ((A.bass - A.high)*0.0022 - dF)*0.012;   // sound leans slowly, never jumps
  dK += ((A.high - A.mid)*0.0018 - dK)*0.012;
  F = baseF + dF;
  K = baseK + dK;

  inkMix += 0.00035 + A.level*0.0006;
  if(inkMix >= 1){
    inkMix = 0;
    inkA = inkB;
    inkB = (inkB + 1 + (Math.random()*2|0)) % INKS.length;
    if(inkB === inkA) inkB = (inkB + 1) % INKS.length;
  }
  mixInks();

  // every attack drops a single dot, placed by its brightness; everything
  // visible grows out of those dots and out of nothing else
  if(A.rise > 0) riseAvg = riseAvg*0.995 + A.rise*0.005;
  sinceDot++;
  const loud = Math.max(0.0025, riseAvg*1.5);     // relative, with a floor
  const hit = A.rise > loud && A.level > 0.015 && sinceDot > 7;   // ~8 dots a second, ceiling
  const starved = playing && sinceDot > 150;      // ~2.5 s with nothing: floor
  if(hit || starved){
    const b = hit ? A.bright : 0.3 + Math.random()*0.4;
    const y = H*(0.88 - Math.min(0.76, b*1.9));
    const x = W*(0.5 + 0.42*Math.sin(wander*7.3 + b*11));
    seed(x + (Math.random()-0.5)*W*0.12,
         y + (Math.random()-0.5)*H*0.09,
         2.5 + Math.min(4, A.level*10));
    sinceDot = 0;
  }
}

/* ---------- touch is a hand in the water --------------------------------- */

function pointer(e){
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left)/PX, y = (e.clientY - r.top)/PX;
  if(x>=0 && y>=0 && x<W && y<H) seed(x, y, 3.5);
}
cv.addEventListener("pointerdown", pointer);
cv.addEventListener("pointermove", e => { if(e.buttons || e.pressure > 0) pointer(e); });

/* ---------- loop ---------------------------------------------------------- */

function frame(){
  listen();
  evolve();
  const passes = 2 + Math.round(A.level*2);   // slow on purpose: the field should breathe
  for(let i=0;i<passes;i++) step();
  draw();
  requestAnimationFrame(frame);
}

/* ---------- a take from the repo ------------------------------------------
   #<did>/<cid> or #<did>/<cid>/<seconds>. the audio blob is fetched from
   whichever PDS holds that repo; the seconds, when present, are the take's
   real length.                                                           */

function takeFromHash(){
  const h = (location.hash||"").replace(/^#/,"").trim();
  const m = h.match(/^(did:[a-z0-9:%._-]+)\/([a-z0-9]+)(?:\/(\d+))?$/i);
  return m ? { did:m[1], cid:m[2], secs: m[3] ? parseInt(m[3],10) : 0 } : null;
}

async function pdsFor(did){
  const r = await fetch("https://plc.directory/" + did);
  if(!r.ok) throw new Error("could not resolve " + did);
  const doc = await r.json();
  const svc = (doc.service||[]).find(s => String(s.id).endsWith("atproto_pds"));
  if(!svc) throw new Error("no pds in that did document");
  return svc.serviceEndpoint.replace(/\/$/,"");
}

/* the recorder streams IMA ADPCM with a four-byte marker of its own: four
   bits a sample, so it can upload in real time over a slow link. anything
   without the marker is an older plain WAV take and is decoded normally. */

const ADPCM_STEP = new Int32Array([
  7,8,9,10,11,12,13,14,16,17,19,21,23,25,28,31,34,37,41,45,50,55,60,66,73,
  80,88,97,107,118,130,143,157,173,190,209,230,253,279,307,337,371,408,449,
  494,544,598,658,724,796,876,963,1060,1166,1282,1411,1552,1707,1878,2066,
  2272,2499,2749,3024,3327,3660,4026,4428,4871,5358,5894,6484,7132,7845,
  8630,9493,10442,11487,12635,13899,15289,16818,18500,20350,22385,24623,
  27086,29794,32767]);
const ADPCM_INDEX = new Int32Array([-1,-1,-1,-1,2,4,6,8]);

function decodeADPCM(bytes){
  const b = new Uint8Array(bytes);
  if(b[0]!==79 || b[1]!==67 || b[2]!==65 || b[3]!==49) return null;   // "OCA1"
  const rate = new DataView(bytes).getUint32(4, true);
  const n = (b.length - 12) * 2;
  const out = new Float32Array(n);
  let pred = 0, index = 0;
  for(let i=0;i<n;i++){
    const byte = b[12 + (i>>1)];
    const code = (i & 1) ? (byte >> 4) : (byte & 15);
    const step = ADPCM_STEP[index];
    let q = step >> 3;
    if(code & 4) q += step;
    if(code & 2) q += step >> 1;
    if(code & 1) q += step >> 2;
    pred += (code & 8) ? -q : q;
    if(pred > 32767) pred = 32767;
    if(pred < -32768) pred = -32768;
    index += ADPCM_INDEX[code & 7];
    if(index < 0) index = 0;
    if(index > 88) index = 88;
    out[i] = pred / 32768;
  }
  return { rate, pcm: out };
}

async function playTake(t){
  const pds = await pdsFor(t.did);
  const r = await fetch(pds + "/xrpc/com.atproto.sync.getBlob?did=" +
    encodeURIComponent(t.did) + "&cid=" + encodeURIComponent(t.cid));
  if(!r.ok) throw new Error("take not found (" + r.status + ")");
  const bytes = await r.arrayBuffer();
  const coded = decodeADPCM(bytes);
  let buf;
  if(coded){
    buf = ac.createBuffer(1, coded.pcm.length, coded.rate);
    buf.getChannelData(0).set(coded.pcm);
  } else {
    buf = await ac.decodeAudioData(bytes);
  }
  src = ac.createBufferSource();
  src.buffer = buf;
  src.connect(analyser);
  src.connect(ac.destination);
  const dur = t.secs > 0 ? Math.min(t.secs, buf.duration) : buf.duration;
  src.start(0, 0, dur);
  playing = true;
  src.onended = () => { playing = false; say(""); };
  say(fmt(dur));
  setTimeout(() => say(""), 4000);
}

const fmt = s => Math.floor(s/60) + ":" + String(Math.floor(s%60)).padStart(2,"0");
function say(s){
  const n = $("#note");
  n.textContent = s;
  n.style.opacity = s ? "1" : "0";
}

/* ---------- boot ----------------------------------------------------------- */

async function begin(){
  const g = $("#gate"); if(g) g.remove();
  ac = new (window.AudioContext||window.webkitAudioContext)();
  analyser = ac.createAnalyser();
  analyser.fftSize = 1024;
  analyser.smoothingTimeConstant = 0.6;
  freq = new Uint8Array(analyser.frequencyBinCount);
  build();
  mixInks();
  requestAnimationFrame(frame);
  const t = takeFromHash();
  if(!t) return;
  say("fetching");
  try{ await playTake(t); }
  catch(e){ say(String(e.message||e)); }
}

$("#go").textContent = takeFromHash() ? "PLAY" : "TAKE";
$("#go").onclick = begin;

let rebuild = null;
addEventListener("resize", () => {
  clearTimeout(rebuild);
  rebuild = setTimeout(build, 300);
});
</script>
</body>
</html>
