<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="theme-color" content="#000000">
<title>take</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;background:#000;color:#fff;
    overflow:hidden;overscroll-behavior:none}
  body{font-family:"Courier Prime","Courier New",Courier,monospace;font-size:15px}
  #cv{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;
    image-rendering:pixelated;touch-action:none;z-index:1}
  #gate{position:fixed;inset:0;z-index:4;background:#000;display:flex;
    align-items:center;justify-content:center}
  #go{font:inherit;font-size:16px;letter-spacing:.5em;color:#fff;background:#000;
    border:0;padding:18px 22px;cursor:pointer}
  #note{position:fixed;z-index:3;left:0;right:0;
    bottom:calc(18px + env(safe-area-inset-bottom));text-align:center;

    text-shadow:0 0 8px #000,0 0 3px #000;pointer-events:none;transition:opacity 2s}
</style>
</head>
<body>

<canvas id="cv"></canvas>
<div id="note"></div>
<div id="gate"><button id="go">TAKE</button></div>

<script>
"use strict";
/* =====================================================================
   A lamp, not a picture of anything.

   Bodies of wax sit in a dark liquid. The bottom of the lamp heats
   them, so they swell and rise; the top cools them, so they sink.
   Each body keeps its own temperature, so they fall out of step,
   pass each other, touch, merge, and stretch until they tear in two.

   Every body carries its own four-step dye. Where two meet, the pixels
   dither between their dyes by how much each one owns that spot, so
   colours marble by texture, never blend into mud. Every couple of
   minutes the lamp changes mood: four new dyes, mixed at random, never
   the same twice. Each body takes one as it passes through the heated
   base, and the liquid takes a new tint.

   The take is heat. Loudness (judged against its own peaks) warms
   the base; bright playing leans the liquid's tint; attacks build a
   slow pressure that now and then pinches off a new bud from the
   bottom or tears a big body in two. Nothing flashes.
 ===================================================================== */

const $ = s => document.querySelector(s);
const cv = $("#cv"), ctx = cv.getContext("2d", { alpha:false });

/* ---------- dye ----------------------------------------------------------
   dyes are mixed at random, not picked from a list. each is four steps,
   dark, body, glow, core, from one hue that drifts a little as it
   brightens, so a dye has its own undertone. they live in a pool of
   slots; a slot is reused once no body or mood is wearing it.          */
const POOL = 40, LIQ = 2;
const pal = new Uint8Array((POOL*4 + LIQ*3)*3);
const LQ = POOL*4;

function hsl(h, s, l){
  h = ((h % 1) + 1) % 1;
  const k = n => (n + h*12) % 12, a = s*Math.min(l, 1-l);
  const f = n => l - a*Math.max(-1, Math.min(k(n)-3, 9-k(n), 1));
  return [f(0)*255|0, f(8)*255|0, f(4)*255|0];
}
function inUse(slot){
  if(mood.includes(slot)) return true;
  for(const b of blobs) if(b.dye === slot || b.was === slot) return true;
  return false;
}
let lastHue = Math.random();
function mixDye(){
  let slot = -1;
  for(let t=0;t<POOL*2 && slot<0;t++){ const c = Math.random()*POOL|0; if(!inUse(c)) slot = c; }
  if(slot < 0) slot = Math.random()*POOL|0;
  // step away from the last hue so a mood never collapses into one colour
  const h = lastHue + 0.18 + Math.random()*0.64; lastHue = h;
  const sat = 0.85 + Math.random()*0.15;
  const drift = (Math.random() - 0.5)*0.12;          // the undertone
  const L = [0.12, 0.4, 0.56, 0.74];
  for(let k=0;k<4;k++){
    const c = hsl(h + drift*k, k === 3 ? sat*0.9 : sat, L[k]), o = (slot*4 + k)*3;
    pal[o] = c[0]; pal[o+1] = c[1]; pal[o+2] = c[2];
  }
  return slot;
}
function mixLiquid(i){
  const h = 0.5 + Math.random()*0.45, sat = 0.3 + Math.random()*0.3, L = [0.02, 0.055, 0.095];   // cool tints: blues, violets, deep greens
  for(let k=0;k<3;k++){
    const c = hsl(h, sat, L[k]), o = (LQ + i*3 + k)*3;
    pal[o] = c[0]; pal[o+1] = c[1]; pal[o+2] = c[2];
  }
}

const BAYER = (() => {
  const m = [
    [ 0,32, 8,40, 2,34,10,42],[48,16,56,24,50,18,58,26],
    [12,44, 4,36,14,46, 6,38],[60,28,52,20,62,30,54,22],
    [ 3,35,11,43, 1,33, 9,41],[51,19,59,27,49,17,57,25],
    [15,47, 7,39,13,45, 5,37],[63,31,55,23,61,29,53,21]];
  const f = new Float32Array(64);
  for(let y=0;y<8;y++) for(let x=0;x<8;x++) f[y*8+x] = (m[y][x] + 0.5)/64;
  return f;
})();

let blobs = [], mood = [];
mood = pickMood();
let liqA = 0, liqB = 0, liqMix = 1, lastMood = 0, tint = 0;
mixLiquid(0);
function pickMood(){
  const m = []; for(let i=0;i<4;i++){ const d = mixDye(); m.push(d); mood = mood.concat(d); }
  return m;
}
function mixInks(){}                              // dyes are written as they are mixed

/* ---------- the lamp -------------------------------------------------------- */

const PX = 4;
let W=0, H=0, img, gridCv, gridCtx, T = 0;

function makeBlob(x, y, r, slot){
  return { x, y, r, vx:0, vy:0,
           temp: Math.random(),             // out of step from the start
           dye: slot ?? mood[Math.random()*4|0], was: -1, dyeMix: 1,
           ph: Math.random()*1000,          // its own slow wobble
           lag: 0.6 + Math.random()*0.8 };  // how fast it takes on heat
}

function build(){
  const vw = Math.max(1, innerWidth), vh = Math.max(1, innerHeight);
  cv.width  = Math.max(PX*8, Math.floor(vw/PX)*PX);
  cv.height = Math.max(PX*8, Math.floor(vh/PX)*PX);
  W = cv.width/PX; H = cv.height/PX;
  gridCv = document.createElement("canvas");
  gridCv.width = W; gridCv.height = H;
  gridCtx = gridCv.getContext("2d", { alpha:false });
  img = gridCtx.createImageData(W,H);
  blobs = [];
  const n = 10 + (Math.random()*3|0);
  for(let i=0;i<n;i++)
    blobs.push(makeBlob(W*(0.12+0.76*Math.random()), H*(i+0.5)/n,
                        Math.min(W,H)*(0.1+0.09*Math.random()), mood[i % 4]));
  ctx.imageSmoothingEnabled = false;
}

const MIN_BLOBS = 8, MAX_BLOBS = 16;
let heat = 0, pressure = 0, lastTear = 0;

function physics(){
  const rMin = Math.min(W,H)*0.07, rMax = Math.min(W,H)*0.27;
  const warm = 1 + heat*0.8;                          // the take warms the base
  for(const b of blobs){
    b.ph += 0.004;
    // heat only at the base, cooling only near the top, insulated between:
    // so a body carries its temperature the whole way and the lamp cycles
    const h = b.y/H;
    if(h > 0.78){
      b.temp += (1 - b.temp)*0.0035*b.lag*warm;
      // the base re-dyes: a body not wearing the current mood takes one of it
      if(h > 0.85 && b.dyeMix >= 1 && !mood.includes(b.dye) && Math.random() < 0.01){
        b.was = b.dye; b.dye = mood[Math.random()*4|0]; b.dyeMix = 0;
      }
    }
    else if(h < 0.3) b.temp -= b.temp*0.0028*b.lag;
    else b.temp += (0.5 - b.temp)*0.00015;
    if(b.dyeMix < 1) b.dyeMix = Math.min(1, b.dyeMix + 0.0025);
    // hot rises, cold sinks. drag keeps it slow
    b.vy += (0.5 - b.temp)*0.0028 - b.vy*0.02;
    b.vx += Math.sin(b.ph*0.7 + b.y*0.03)*0.0012 - b.vx*0.02;
    b.x += b.vx; b.y += b.vy;
    // glass walls: soft
    const m = b.r*0.6;
    if(b.x < m){ b.x = m; b.vx = Math.abs(b.vx)*0.3; }
    if(b.x > W-m){ b.x = W-m; b.vx = -Math.abs(b.vx)*0.3; }
    if(b.y < m){ b.y = m; b.vy = Math.abs(b.vy)*0.2; b.temp *= 0.97; }
    if(b.y > H-m*0.4){ b.y = H-m*0.4; b.vy = -Math.abs(b.vy)*0.2; b.temp = Math.min(1, b.temp + 0.01); }
    // a hot body swells a little, a cold one draws in
    if(!b.base) b.base = b.r;
    b.r += (b.base*(0.85 + 0.3*b.temp) - b.r)*0.002;
  }
  // bodies that overlap deeply become one
  for(let i=0;i<blobs.length;i++) for(let j=i+1;j<blobs.length;j++){
    const a = blobs[i], b = blobs[j];
    const d = Math.hypot(a.x-b.x, a.y-b.y);
    if(d < 0.22*(a.r+b.r) && blobs.length > MIN_BLOBS && T - lastTear > 600 &&
       Math.hypot(a.base||a.r, b.base||b.r) < rMax){
      const big = a.r >= b.r ? a : b, small = big === a ? b : a;
      const A2 = big.r*big.r, B2 = small.r*small.r;
      big.x = (big.x*A2 + small.x*B2)/(A2+B2); big.y = (big.y*A2 + small.y*B2)/(A2+B2);
      big.vx = (big.vx*A2 + small.vx*B2)/(A2+B2); big.vy = (big.vy*A2 + small.vy*B2)/(A2+B2);
      big.r = big.base = Math.sqrt(A2+B2);
      blobs.splice(blobs.indexOf(small), 1); lastTear = T;
      return;                                   // one event per frame is plenty
    }
  }
  // a body too big, or stretched by moving fast, tears in two
  if(T - lastTear > 900) for(const b of blobs){
    const stretched = Math.abs(b.vy) > 0.075 && b.r > rMax*0.7;
    if(blobs.length < MAX_BLOBS && (b.r > rMax*1.05 || stretched)){
      tear(b); lastTear = T; return;
    }
  }
  if(blobs.length < MIN_BLOBS) bud();
}

function tear(b){
  const r = b.r/Math.SQRT2;
  const c = makeBlob(b.x, b.y + r*0.6, r, b.dye);   // a torn-off piece keeps its dye
  c.temp = b.temp*0.9; c.vy = b.vy*0.5 + 0.02; c.base = r;
  b.r = b.base = r; b.y -= r*0.6; b.vy -= 0.02;
  blobs.push(c);
}

function bud(){
  const r = Math.min(W,H)*(0.09 + 0.06*Math.random());
  const b = makeBlob(W*(0.2 + 0.6*Math.random()), H - r*0.5, r);
  b.temp = 0.85; b.base = r;
  blobs.push(b);
}

/* ---------- drawing ---------------------------------------------------------
   for each cell: how much every body owns it (metaball field), which body
   owns it most and which second. field strength picks the step of the ink;
   the ratio between first and second picks, by dither, whose ink it is.    */

function draw(){
  const d = img.data, n = blobs.length, p = T*0.0008;
  // a compact kernel: each body's pull ends at REACH times its radius, so
  // bodies stay apart until they really touch. scaled to 1 at the body's edge.
  const REACH = 1.8, EDGE = Math.pow(1 - 1/(REACH*REACH), 3);
  const bx = new Float32Array(n), by = new Float32Array(n), r2 = new Float32Array(n), sq = new Float32Array(n);
  for(let k=0;k<n;k++){
    const b = blobs[k];
    bx[k] = b.x; by[k] = b.y; r2[k] = 1/(b.r*b.r*REACH*REACH);
    sq[k] = 1/(1 + Math.min(0.6, Math.abs(b.vy)*6));   // moving bodies stretch tall
  }
  const nx = new Float32Array(W);
  for(let x=0;x<W;x++){ nx[x] = Math.sin(x*0.21 + p*6); }
  for(let y=0;y<H;y++){
    const ny = 0.3*Math.sin(y*0.17 - p*4), wob = 2.6*Math.sin(p*2.3 + y*0.071);
    const row = (y&7)*8, row2 = ((y+3)&7)*8, row3 = ((y+6)&7)*8;
    const wy = y + 2.2*Math.sin(p*3 + y*0.05), base = y/H;
    for(let x=0;x<W;x++){
      const wx = x + wob;                       // the glass wobbles the view
      let f = 0, m1 = 0, m2 = 0, k1 = 0, k2 = 0;
      for(let k=0;k<n;k++){
        const dx = wx - bx[k], dy = (wy - by[k])*sq[k];
        const e = 1 - (dx*dx + dy*dy)*r2[k];
        if(e <= 0) continue;
        const c = e*e*e/EDGE;
        f += c;
        if(c > m1){ m2 = m1; k2 = k1; m1 = c; k1 = k; }
        else if(c > m2){ m2 = c; k2 = k; }
      }
      const th = BAYER[row + (x&7)], th2 = BAYER[row2 + ((x+5)&7)], th3 = BAYER[row3 + ((x+2)&7)];
      // whose dye: sharpened share between the two nearest owners, by dither
      // the border wanders, so dyes marble into each other instead of meeting on a line
      const a2 = m1*m1, b2 = m2*m2;
      // only where two dyes are really contested; a lone body stays clean
      const share = a2/(a2 + b2 + 1e-12);
      const contest = share < 0.97 ? 1 - share : 0;
      const owner = blobs[m2 <= 0 || th < share + nx[x]*ny*Math.min(1, contest*4) ? k1 : k2];
      const dye = th3 < owner.dyeMix || owner.was < 0 ? owner.dye : owner.was;
      let q;
      if(f < 1){
        // the liquid, lit from the base, with the nearest wax's halo bleeding in
        if(f > 0.35 && (f - 0.35)/0.65 > th2) q = (dye*4)*3;
        else {
          const lq = (th3 < liqMix ? liqB : liqA)*3 + LQ;
          const t = (0.1 + base*base*0.9 + f*0.8 + tint)*2;
          const lo = t|0, st = (t - lo) > th ? lo + 1 : lo;
          q = (lq + (st > 2 ? 2 : st))*3;
        }
      } else {
        // the wax: body, glow, core. the core only where it is thickest
        let t = (f - 1)/2.2;
        t = t > 1 ? 1 : t;
        const s = 1 + t*2, lo = s|0;
        const st = (s - lo) > th2 ? (lo > 2 ? 3 : lo+1) : lo;
        q = (dye*4 + st)*3;
      }
      const o = (y*W + x)*4;
      d[o] = pal[q]; d[o+1] = pal[q+1]; d[o+2] = pal[q+2]; d[o+3] = 255;
    }
  }
  gridCtx.putImageData(img,0,0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(gridCv, 0, 0, cv.width, cv.height);
}

/* ---------- listening -------------------------------------------------------
   loudness against the take's own peaks, attacks against its own recent
   flux. both are felt as heat and pressure, not seen as beats.             */

let ac, analyser, tbuf, fbuf, prev, src, playing = false;
const A = { level:0, bright:0.3 };
let hold = 0.02, fluxHist = [], lastHit = 0, lastEvent = 0;

function listen(now){
  if(!analyser || !playing){ A.level *= 0.98; return; }
  analyser.getFloatTimeDomainData(tbuf);
  let e = 0;
  for(let i=0;i<tbuf.length;i++) e += tbuf[i]*tbuf[i];
  const rms = Math.sqrt(e/tbuf.length);
  hold = Math.max(rms, hold*0.9993, 0.003);
  A.level = A.level*0.97 + Math.min(1, rms/hold)*0.03;     // heavily smoothed: heat, not pulse

  analyser.getFloatFrequencyData(fbuf);
  let flux = 0, sum = 0, ws = 0;
  for(let i=2;i<fbuf.length;i++){
    const m = Math.pow(10, fbuf[i]/20);
    const dm = m - prev[i];
    if(dm > 0) flux += dm;
    prev[i] = m; sum += m; ws += m*i;
  }
  if(sum > 0) A.bright = A.bright*0.99 + (ws/sum/fbuf.length)*0.01;
  flux = flux/(sum + 1e-9);
  fluxHist.push(flux); if(fluxHist.length > 80) fluxHist.shift();
  let mean = 0; for(const f of fluxHist) mean += f; mean /= fluxHist.length;
  let sd = 0; for(const f of fluxHist) sd += (f-mean)*(f-mean); sd = Math.sqrt(sd/fluxHist.length);
  const audible = rms > 0.0015 && rms > hold*0.06;
  if(audible && fluxHist.length > 10 && flux > mean + 1.1*sd && flux > mean*1.2 && now - lastHit > 85){
    lastHit = now;
    pressure += Math.min(3, (flux-mean)/(sd+1e-9));
  }
}

/* ---------- the slow part ------------------------------------------------- */

function evolve(now){
  heat = heat*0.995 + A.level*0.005;
  tint = tint*0.995 + (A.bright - 0.3)*0.15*0.005;
  // a new mood every two minutes or so; heat brings it sooner
  if(now - lastMood > 120000 - heat*50000){
    lastMood = now; mood = pickMood();
    liqA = liqB; liqB = 1 - liqB; mixLiquid(liqB); liqMix = 0;
  }
  if(liqMix < 1) liqMix = Math.min(1, liqMix + 0.0004);
  // pressure from attacks is spent rarely: a bud, or a tear
  pressure *= 0.999;
  if(pressure > 20 && now - lastEvent > 12000){
    lastEvent = now; pressure = 0;
    if(blobs.length < MAX_BLOBS && Math.random() < 0.6) bud();
    else if(blobs.length < MAX_BLOBS){
      let big = blobs[0]; for(const b of blobs) if(b.r > big.r) big = b;
      tear(big);
    }
  }
}

/* ---------- touch warms the wax under the finger ---------------------------- */

function pointer(e){
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left)/PX, y = (e.clientY - r.top)/PX;
  for(const b of blobs){
    const d = Math.hypot(b.x-x, b.y-y);
    if(d < b.r*1.5){ b.temp = Math.max(0, b.temp - 0.15); b.vx += (b.x-x)/(d+1)*0.05; }
  }
}
cv.addEventListener("pointerdown", pointer);
cv.addEventListener("pointermove", e => { if(e.buttons || e.pressure > 0) pointer(e); });

/* ---------- loop ---------------------------------------------------------- */

function frame(now){
  T++;
  listen(now);
  evolve(now);
  physics();
  draw();
  requestAnimationFrame(frame);
}

/* ---------- a take from the repo ------------------------------------------
   #<did>/<cid> or #<did>/<cid>/<seconds>                                   */

function takeFromHash(){
  const h = (location.hash||"").replace(/^#/,"").trim();
  const m = h.match(/^(did:[a-z0-9:%._-]+)\/([a-z0-9]+)(?:\/(\d+))?$/i);
  return m ? { did:m[1], cid:m[2], secs: m[3] ? parseInt(m[3],10) : 0 } : null;
}

async function pdsFor(did){
  const r = await fetch("https://plc.directory/" + did);
  if(!r.ok) throw new Error("could not resolve " + did);
  const doc = await r.json();
  const svc = (doc.service||[]).find(s => String(s.id).endsWith("atproto_pds"));
  if(!svc) throw new Error("no pds in that did document");
  return svc.serviceEndpoint.replace(/\/$/,"");
}

/* the recorder streams IMA ADPCM behind a four-byte marker "OCA1".
   anything without it is an older plain WAV take.                        */

const ADPCM_STEP = new Int32Array([
  7,8,9,10,11,12,13,14,16,17,19,21,23,25,28,31,34,37,41,45,50,55,60,66,73,
  80,88,97,107,118,130,143,157,173,190,209,230,253,279,307,337,371,408,449,
  494,544,598,658,724,796,876,963,1060,1166,1282,1411,1552,1707,1878,2066,
  2272,2499,2749,3024,3327,3660,4026,4428,4871,5358,5894,6484,7132,7845,
  8630,9493,10442,11487,12635,13899,15289,16818,18500,20350,22385,24623,
  27086,29794,32767]);
const ADPCM_INDEX = new Int32Array([-1,-1,-1,-1,2,4,6,8]);

function decodeADPCM(bytes){
  const b = new Uint8Array(bytes);
  if(b[0]!==79 || b[1]!==67 || b[2]!==65 || b[3]!==49) return null;
  const rate = new DataView(bytes).getUint32(4, true);
  const n = (b.length - 12) * 2;
  const out = new Float32Array(n);
  let pred = 0, index = 0;
  for(let i=0;i<n;i++){
    const byte = b[12 + (i>>1)];
    const code = (i & 1) ? (byte >> 4) : (byte & 15);
    const step = ADPCM_STEP[index];
    let q = step >> 3;
    if(code & 4) q += step;
    if(code & 2) q += step >> 1;
    if(code & 1) q += step >> 2;
    pred += (code & 8) ? -q : q;
    if(pred > 32767) pred = 32767;
    if(pred < -32768) pred = -32768;
    index += ADPCM_INDEX[code & 7];
    if(index < 0) index = 0;
    if(index > 88) index = 88;
    out[i] = pred / 32768;
  }
  return { rate, pcm: out };
}

async function playTake(t){
  const pds = await pdsFor(t.did);
  const r = await fetch(pds + "/xrpc/com.atproto.sync.getBlob?did=" +
    encodeURIComponent(t.did) + "&cid=" + encodeURIComponent(t.cid));
  if(!r.ok) throw new Error("take not found (" + r.status + ")");
  const bytes = await r.arrayBuffer();
  const coded = decodeADPCM(bytes);
  let buf;
  if(coded){
    buf = ac.createBuffer(1, coded.pcm.length, coded.rate);
    buf.getChannelData(0).set(coded.pcm);
  } else {
    buf = await ac.decodeAudioData(bytes);
  }
  src = ac.createBufferSource();
  src.buffer = buf;
  src.connect(analyser);
  src.connect(ac.destination);
  const dur = t.secs > 0 ? Math.min(t.secs, buf.duration) : buf.duration;
  src.start(0, 0, dur);
  playing = true;
  src.onended = () => { playing = false; say(""); };
  say(fmt(dur));
  setTimeout(() => say(""), 4000);
}

const fmt = s => Math.floor(s/60) + ":" + String(Math.floor(s%60)).padStart(2,"0");
function say(s){
  const n = $("#note");
  n.textContent = s;
  n.style.opacity = s ? "1" : "0";
}

/* ---------- boot ----------------------------------------------------------- */

async function begin(){
  const g = $("#gate"); if(g) g.remove();
  ac = new (window.AudioContext||window.webkitAudioContext)();
  analyser = ac.createAnalyser();
  analyser.fftSize = 1024;
  analyser.smoothingTimeConstant = 0;          // raw frames: flux needs the edges
  analyser.minDecibels = -110; analyser.maxDecibels = -10;
  tbuf = new Float32Array(analyser.fftSize);
  fbuf = new Float32Array(analyser.frequencyBinCount);
  prev = new Float32Array(analyser.frequencyBinCount);
  build();
  mixInks();
  requestAnimationFrame(frame);
  const t = takeFromHash();
  if(!t) return;
  say("fetching");
  try{ await playTake(t); }
  catch(e){ say(String(e.message||e)); }
}

$("#go").textContent = takeFromHash() ? "PLAY" : "TAKE";
$("#go").onclick = begin;

let rebuild = null;
addEventListener("resize", () => {
  clearTimeout(rebuild);
  rebuild = setTimeout(build, 300);
});
</script>
</body>
