<!DOCTYPE html>
<html lang="en">
<head>

<title>take</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;background:#000;color:#fff;
    overflow:hidden;overscroll-behavior:none}
  body{font-family:"Courier Prime","Courier New",Courier,monospace;font-size:15px}
  #cv{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;
    image-rendering:pixelated;touch-action:none;z-index:1}
  #gate{position:fixed;inset:0;z-index:4;background:#000;display:flex;
    align-items:center;justify-content:center}
  #go{font:inherit;font-size:16px;letter-spacing:.5em;color:#fff;background:#000;
    border:0;padding:18px 22px;cursor:pointer}
  #ctl{position:fixed;z-index:3;left:50%;transform:translateX(-50%);
    bottom:calc(6px + env(safe-area-inset-bottom));font:inherit;font-size:14px;
    letter-spacing:.3em;color:#fff;background:none;border:0;padding:14px 22px;
    cursor:pointer;text-shadow:0 0 8px #000,0 0 3px #000;opacity:0;
    visibility:hidden;transition:opacity .6s}
  #note{position:fixed;z-index:3;left:0;right:0;
    bottom:calc(64px + env(safe-area-inset-bottom));text-align:center;

    text-shadow:0 0 8px #000,0 0 3px #000;pointer-events:none;transition:opacity 2s}

<body>

<canvas id="cv"></canvas>
<div id="note"></div>
<button id="ctl"></button>
<div id="gate"><button id="go">TAKE</button></div>

<script>
"use strict";
/* =====================================================================
   A reaction, in one bit.

   The screen is an excitable medium, the same family as the
   Belousov-Zhabotinsky reaction: at rest it is black; a point that is
   excited sends out a wavefront (white) and leaves a recovering tail
   behind it (stippled), and waves that meet annihilate. Struck the right
   way, a wave curls into a spiral that keeps turning by itself.

   Nothing moves unless the take moves it.
     an attack      one spiral. where it sits left to right is where the
                    attack sat in the take's own pitch range; how high
                    on the screen is how soft (low on the screen is hard);
                    its size is how hard it was struck; it turns clockwise
                    if the pitch rose from the attack before, anticlockwise
                    if it fell.
     loudness       how excitable the medium is, and how fast it reacts.
                    loud, the waves live and multiply; quiet, they thin
                    and die back; when the take ends the field goes out.
     the ground     every front that passes leaves a little ash, which
                    settles back over about half a minute. so the stippled
                    ground is where the music has been, and it is darkest
                    where the take never went.

   The take is heard before it is played: the whole file is analysed
   first, so a peak is a peak of THAT signal, judged against its own
   surroundings. guitar, noise, a drone: anything the browser can decode.

   A pixel is lit or it is not. Drop any audio file on the page to hear
   it by this field. Drag a finger to excite the medium yourself.

   It is a document more than a player. The only controls are words, not
   icons: pause, play, and again when the take has ended. They show when
   you touch the screen and fade when you stop (space does the same). Again
   starts from a clean field, so every hearing is a fresh reading of the
   same take. There is no scrubbing and no speed control on purpose: the
   take is the record, and it is heard once through, at its own speed.
 ==================================================================== */

const $ = s => document.querySelector(s);
const cv = $("#cv"), ctx = cv.getContext("2d", { alpha:false });

const BAYER = (() => {
  const m = [
    [ 0,32, 8,40, 2,34,10,42],[48,16,56,24,50,18,58,26],
    [12,44, 4,36,14,46, 6,38],[60,28,52,20,62,30,54,22],
    [ 3,35,11,43, 1,33, 9,41],[51,19,59,27,49,17,57,25],
    [15,47, 7,39,13,45, 5,37],[63,31,55,23,61,29,53,21]];
  const f = new Float32Array(64);
  for(let y=0;y<8;y++) for(let x=0;x<8;x++) f[y*8+x] = (m[y][x] + 0.5)/64;
  return f;
})();

/* ---------- the medium ------------------------------------------------------
   Barkley's two-variable model. u is the wavefront, v the recovery that
   trails it. b is how hard the medium is to excite: below about 0.11 waves
   live, above it they fail. the take moves b.                              */

const BZ = { a:0.75, b:0.108, eps:0.02, D:1, dx:1.0, dt:0.04 };
let PX = 4, W=0, H=0, img, gridCv, gridCtx, T = 0;
let U, V, U2, V2, M, acc = 0, impulse = 0;
const MEM = { gain:0.003, half:25 };   // how fast passing waves leave ash, and its half-life in seconds

function build(){
  const vw = Math.max(1, innerWidth), vh = Math.max(1, innerHeight);
  PX = Math.max(4, Math.ceil(Math.max(vw, vh)/240));      // keep the field a size a phone can run
  cv.width  = Math.max(PX*8, Math.floor(vw/PX)*PX);
  cv.height = Math.max(PX*8, Math.floor(vh/PX)*PX);
  W = cv.width/PX; H = cv.height/PX;
  gridCv = document.createElement("canvas");
  gridCv.width = W; gridCv.height = H;
  gridCtx = gridCv.getContext("2d", { alpha:false });
  img = gridCtx.createImageData(W,H);
  for(let i=3;i<img.data.length;i+=4) img.data[i] = 255;
  U = new Float32Array(W*H); V = new Float32Array(W*H);
  U2 = new Float32Array(W*H); V2 = new Float32Array(W*H); M = new Float32Array(W*H);
  ctx.imageSmoothingEnabled = false;
}

function fieldStep(n){
  const {a,b,eps,D,dx,dt} = BZ, k = D*dt/(dx*dx), ie = dt/eps;
  for(let s=0;s<n;s++){
    for(let y=0;y<H;y++){
      const ym = y > 0 ? y-1 : 0, yp = y < H-1 ? y+1 : H-1;
      for(let x=0;x<W;x++){
        const xm = x > 0 ? x-1 : 0, xp = x < W-1 ? x+1 : W-1, i = y*W + x;
        const u = U[i], v = V[i];
        const lap = U[y*W + xm] + U[y*W + xp] + U[ym*W + x] + U[yp*W + x] - 4*u;
        const nu = u + ie*u*(1-u)*(u - (v+b)/a) + k*lap;
        const un = nu < 0 ? 0 : nu > 1 ? 1 : nu;
        U2[i] = un;
        V2[i] = v + dt*(u - v);
        M[i] += (1 - M[i])*MEM.gain*un;                 // a front passing leaves ash
      }
    }
    let t = U; U = U2; U2 = t; t = V; V = V2; V2 = t;
  }
}

/* a cross-field start: the near half of a disc is excited and its lower half
   held refractory, which leaves one free end of wavefront at the centre. the
   wave can only curl one way: dir +1 clockwise, -1 anticlockwise.            */
function stamp(cx, cy, r, dir){
  const r2 = r*r;
  for(let y=Math.max(0,Math.floor(cy-r)); y<=Math.min(H-1,Math.ceil(cy+r)); y++)
  for(let x=Math.max(0,Math.floor(cx-r)); x<=Math.min(W-1,Math.ceil(cx+r)); x++){
    const dx = (x-cx)*dir, dy = y-cy;
    if(dx*dx + dy*dy > r2) continue;
    const i = y*W + x;
    if(dx <= 0) U[i] = 1;
    if(dy > 0) V[i] = 0.8;
  }
}

function medium(){
  impulse *= 0.96;
  // loud: easy to excite and quick. quiet: marginal. finished: waves fail.
  BZ.b = 0.108 - 0.03*Math.max(-0.5, A.level) - 0.03*impulse;
  acc += 1 + 1.4*Math.max(0, A.level);
  const n = acc|0; acc -= n;
  fieldStep(n);
  const keep = Math.pow(0.5, 1/(60*MEM.half));       // the ash settles back, slowly
  for(let i=0;i<M.length;i++) M[i] *= keep;
}

/* ---------- drawing ---------------------------------------------------------
   front, tail and ash are one brightness, front + 0.55 tail + 0.3 ash, and
   ordered dither turns it into lit or not lit. black is where nothing has
   passed.                                                                   */

function draw(){
  const d = img.data;
  for(let y=0;y<H;y++){
    const row = (y&7)*8;
    for(let x=0;x<W;x++){
      const i = y*W + x, o = i*4;
      const v = (U[i] + 0.55*V[i] + 0.3*M[i]) > BAYER[row + (x&7)] ? 255 : 0;
      d[o] = v; d[o+1] = v; d[o+2] = v;
    }
  }
  gridCtx.putImageData(img,0,0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(gridCv, 0, 0, cv.width, cv.height);
}

/* ---------- listening, before playing ---------------------------------------
   an onset is a rise in the log-spectrum, summed over log-spaced bands, so
   a quiet pluck and a loud one are the same size of event. a rise counts
   as a peak only if it is the largest within a few frames, stands well
   above the median of its own neighbourhood (measured in robust deviations,
   so steady noise sets its own bar), clears a floor taken from the whole
   take, and sits above a noise gate. peaks are kept at least SPACING apart.
   the numbers are all here so they can be tuned by ear.                     */

const AN = { N:1024, LO:60, HI:8000, BANDS:28,
             K:6.0,        // robust deviations above the local median
             REL:2.0,      // and at least this multiple of that median
             MIN:6.0,      // and an absolute rise, in nepers summed over bands:
                           // a real attack is 20-70, a flutter in a drone is under 1
             QUIET:0.01,   // log floor, as a fraction of the take's loudest band
             LOCAL:3,      // frames either side that a peak must beat
             WIN:1.2,      // seconds either side for the local median
             SPACING:0.08, // seconds between peaks, at the closest
             FLOOR:0.2,    // of the take's 95th-percentile onset
             GATE:0.03 };  // of the take's 95th-percentile loudness

function makeFFT(n){
  const levels = Math.round(Math.log2(n));
  const rev = new Uint16Array(n);
  for(let i=0;i<n;i++){ let r=0, x=i; for(let b=0;b<levels;b++){ r=(r<<1)|(x&1); x>>=1; } rev[i]=r; }
  const cs = new Float32Array(n/2), sn = new Float32Array(n/2);
  for(let i=0;i<n/2;i++){ cs[i]=Math.cos(2*Math.PI*i/n); sn[i]=-Math.sin(2*Math.PI*i/n); }
  return (re, im) => {
    for(let i=0;i<n;i++){ const j=rev[i]; if(j>i){
      let t=re[i]; re[i]=re[j]; re[j]=t; t=im[i]; im[i]=im[j]; im[j]=t; } }
    for(let size=2; size<=n; size<<=1){
      const half=size>>1, step=n/size;
      for(let i=0;i<n;i+=size) for(let j=i,k=0;j<i+half;j++,k+=step){
        const l=j+half;
        const tr=re[l]*cs[k]-im[l]*sn[k], ti=re[l]*sn[k]+im[l]*cs[k];
        re[l]=re[j]-tr; im[l]=im[j]-ti; re[j]+=tr; im[j]+=ti;
      }
    }
  };
}

function pct(a, q){
  const c = Float32Array.from(a).sort();
  return c.length ? c[Math.min(c.length-1, Math.floor(q*c.length))] : 0;
}

async function analyse(pcm, rate, yieldFn){
  const N = AN.N, hop = Math.max(256, Math.round(rate*0.016/64)*64);
  const nF = Math.max(0, Math.floor((pcm.length - N)/hop));
  const fft = makeFFT(N), re = new Float32Array(N), im = new Float32Array(N);
  const mag = new Float32Array(N/2 + 1);
  const win = new Float32Array(N);
  for(let i=0;i<N;i++) win[i] = 0.5 - 0.5*Math.cos(2*Math.PI*i/(N-1));
  const hz = rate/N, hi = Math.min(AN.HI, rate/2*0.95);
  const edges = [];
  for(let b=0;b<=AN.BANDS;b++){
    let e = Math.round(AN.LO*Math.pow(hi/AN.LO, b/AN.BANDS)/hz);
    if(b > 0 && e <= edges[b-1]) e = edges[b-1] + 1;
    edges.push(e);
  }
  const spec = start => {
    for(let i=0;i<N;i++){ const v = start+i < pcm.length ? pcm[start+i] : 0; re[i]=v*win[i]; im[i]=0; }
    fft(re, im);
    for(let i=0;i<=N/2;i++) mag[i] = Math.hypot(re[i], im[i])/N;
  };
  const B = AN.BANDS, bm = new Float32Array(nF*B), rms = new Float32Array(nF);
  for(let t=0;t<nF;t++){
    const s0 = t*hop;
    let e = 0; for(let i=0;i<N;i++){ const v = pcm[s0+i]; e += v*v; }
    rms[t] = Math.sqrt(e/N);
    spec(s0);
    for(let b=0;b<B;b++){
      let m = 0; for(let i=edges[b];i<edges[b+1];i++) m += mag[i]*mag[i];
      bm[t*B + b] = Math.sqrt(m);
    }
    if(yieldFn && (t % 400) === 399) await yieldFn();
  }
  // log-compress above a floor taken from this take, so the hiss under a
  // quiet passage can't swing the log wildly; then the rise in each band is
  // measured against the loudest of it and its neighbours a frame earlier,
  // so vibrato and a drifting partial are not mistaken for attacks
  const eps = Math.max(1e-7, AN.QUIET*pct(bm, 0.99));
  const o = new Float32Array(nF), prev = new Float32Array(B).fill(Math.log(eps));
  const cur = new Float32Array(B);
  for(let t=0;t<nF;t++){
    let flux = 0;
    for(let b=0;b<B;b++) cur[b] = Math.log(eps + bm[t*B + b]);
    for(let b=0;b<B;b++){
      let ref = prev[b];
      if(b > 0 && prev[b-1] > ref) ref = prev[b-1];
      if(b < B-1 && prev[b+1] > ref) ref = prev[b+1];
      const dl = cur[b] - ref; if(t > 0 && dl > 0) flux += dl;
    }
    o[t] = flux;
    prev.set(cur);
  }
  const p95r = pct(rms, 0.95), p95o = pct(o, 0.95);
  const gate = Math.max(0.0015, AN.GATE*p95r), floor = AN.FLOOR*p95o;
  const w = Math.max(8, Math.round(AN.WIN*rate/hop));
  const tmp = new Float32Array(2*w + 1), dev = new Float32Array(2*w + 1);
  const found = [];
  for(let t=AN.LOCAL; t<nF-AN.LOCAL; t++){
    const v = o[t];
    if(v <= floor || v < AN.MIN || rms[Math.min(nF-1, t+1)] < gate) continue;
    let top = true;
    for(let j=1;j<=AN.LOCAL && top;j++) if(o[t-j] >= v || o[t+j] > v) top = false;
    if(!top) continue;
    const a = Math.max(0, t-w), b = Math.min(nF, t+w+1), len = b - a;
    const ts = tmp.subarray(0, len); ts.set(o.subarray(a, b)); ts.sort();
    const med = ts[len>>1];
    const ds = dev.subarray(0, len);
    for(let i=0;i<len;i++) ds[i] = Math.abs(ts[i] - med);
    ds.sort();
    const sigma = 1.4826*ds[len>>1];
    const z = (v - med)/(sigma + 1e-4);
    if(z < AN.K || v < AN.REL*med) continue;
    found.push({ f:t, z, v });
  }
  // keep peaks apart; between two that are too close, the larger stays
  const gap = AN.SPACING*rate/hop, kept = [];
  for(const c of found){
    const last = kept[kept.length-1];
    if(last && c.f - last.f < gap){ if(c.z > last.z) kept[kept.length-1] = c; }
    else kept.push(c);
  }
  // where in the take's own pitch range each one sat: the spectral centroid
  // just after the attack, placed between the 5th and 95th percentile
  const ev = kept.map(c => {
    spec(Math.min(c.f + 1, nF - 1)*hop);
    let sw = 0, s = 0;
    for(let i=Math.floor(AN.LO/hz); i<=Math.floor(hi/hz); i++){ sw += mag[i]; s += mag[i]*i*hz; }
    return { t:(c.f*hop + N*0.5)/rate, v:c.v, s:Math.max(0.15, Math.min(1, c.z/10)),
             lc:Math.log2((sw > 0 ? s/sw : 1000) + 1) };
  });
  if(ev.length){
    const lcs = ev.map(e => e.lc);
    let lo = pct(lcs, 0.05), up = pct(lcs, 0.95);
    if(up - lo < 1.5){ const m = (up+lo)/2; lo = m - 0.75; up = m + 0.75; }
    for(const e of ev) e.pos = Math.max(0.04, Math.min(0.96, (e.lc - lo)/(up - lo)));
  }
  // loudness against the take's own loud, lightly smoothed
  const lv = new Float32Array(nF); let sm = 0;
  for(let t=0;t<nF;t++){ sm += (Math.min(1, rms[t]/(p95r + 1e-9)) - sm)*0.12; lv[t] = sm; }
  return { rate, hop, events:ev, lv, dur:pcm.length/rate };
}

/* ---------- playing, with the analysis in hand ----------------------------- */

let ac, src, playing = false, TL = null, ei = 0, t0 = 0, job = 0, ever = false, lastPos = 0.5;
let paused = false, ended = false, last = null, ctlTimer = 0;
const ctl = $("#ctl");
const A = { level:0 };

function attack(e){
  // one spiral. direction is the direction the pitch went since the last one.
  const dir = e.pos >= lastPos ? 1 : -1; lastPos = e.pos;
  stamp(e.pos*W, H*(0.15 + 0.7*(1 - e.s)), 4 + 8*e.s, dir);
  impulse = Math.min(1, impulse + 0.6*e.s);          // a strike makes the medium easy for a moment
}

function listen(){
  if(!playing || !TL){
    // no take yet: a quiet ambient field. a take that has ended: let it go out
    const target = ever ? -0.5 : 0.6;
    A.level += (target - A.level)*0.01;
    return;
  }
  const lat = ac.outputLatency || ac.baseLatency || 0;
  const el = ac.currentTime - t0 - lat;
  if(el < 0) return;
  const fi = Math.min(TL.lv.length - 1, Math.max(0, (el*TL.rate/TL.hop)|0));
  A.level = A.level*0.97 + (TL.lv[fi] || 0)*0.03;       // heavily smoothed: climate, not pulse
  while(ei < TL.events.length && TL.events[ei].t <= el + 0.02){
    const e = TL.events[ei++];
    if(e.t > el - 0.3) attack(e);                        // a backgrounded tab skips, not bursts
  }
}

/* ---------- touch excites the medium ---------------------------------------- */

function pointer(e){
  if(paused) return;
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left)/PX, y = (e.clientY - r.top)/PX;
  for(let j=-2;j<=2;j++) for(let i=-2;i<=2;i++){
    const px = (x+i)|0, py = (y+j)|0;
    if(px >= 0 && py >= 0 && px < W && py < H && i*i + j*j <= 5) U[py*W + px] = 1;
  }
}
cv.addEventListener("pointerdown", pointer);
cv.addEventListener("pointermove", e => { if(e.buttons || e.pressure > 0) pointer(e); });

/* ---------- loop ---------------------------------------------------------- */

function frame(){
  if(paused){ requestAnimationFrame(frame); return; }   // a paused take holds its picture
  T++;
  // with no take, the field keeps itself alive: when it thins out, a new spiral is struck
  if(!ever && T % 180 === 0){
    let c = 0; for(let i=0;i<V.length;i++) if(V[i] > 0.15) c++;
    if(c < 0.05*V.length)
      stamp(W*(0.2 + 0.6*Math.random()), H*(0.2 + 0.6*Math.random()), 9, Math.random() < 0.5 ? 1 : -1);
  }
  listen();
  medium();
  draw();
  requestAnimationFrame(frame);
}

/* ---------- a take from the repo ------------------------------------------
   #<did>/<cid> or #<did>/<cid>/<seconds>                                   */

function takeFromHash(){
  const h = (location.hash||"").replace(/^#/,"").trim();
  const m = h.match(/^(did:[a-z0-9:%._-]+)\/([a-z0-9]+)(?:\/(\d+))?$/i);
  return m ? { did:m[1], cid:m[2], secs: m[3] ? parseInt(m[3],10) : 0 } : null;
}

async function pdsFor(did){
  const r = await fetch("https://plc.directory/" + did);
  if(!r.ok) throw new Error("could not resolve " + did);
  const doc = await r.json();
  const svc = (doc.service||[]).find(s => String(s.id).endsWith("atproto_pds"));
  if(!svc) throw new Error("no pds in that did document");
  return svc.serviceEndpoint.replace(/\/$/,"");
}

/* the recorder streams IMA ADPCM behind a four-byte marker "OCA1".
   anything without it is decoded by the browser, whatever it is.        */

const ADPCM_STEP = new Int32Array([
  7,8,9,10,11,12,13,14,16,17,19,21,23,25,28,31,34,37,41,45,50,55,60,66,73,
  80,88,97,107,118,130,143,157,173,190,209,230,253,279,307,337,371,408,449,
  494,544,598,658,724,796,876,963,1060,1166,1282,1411,1552,1707,1878,2066,
  2272,2499,2749,3024,3327,3660,4026,4428,4871,5358,5894,6484,7132,7845,
  8630,9493,10442,11487,12635,13899,15289,16818,18500,20350,22385,24623,
  27086,29794,32767]);
const ADPCM_INDEX = new Int32Array([-1,-1,-1,-1,2,4,6,8]);

function decodeADPCM(bytes){
  const b = new Uint8Array(bytes);
  if(b[0]!==79 || b[1]!==67 || b[2]!==65 || b[3]!==49) return null;
  const rate = new DataView(bytes).getUint32(4, true);
  const n = (b.length - 12) * 2;
  const out = new Float32Array(n);
  let pred = 0, index = 0;
  for(let i=0;i<n;i++){
    const byte = b[12 + (i>>1)];
    const code = (i & 1) ? (byte >> 4) : (byte & 15);
    const step = ADPCM_STEP[index];
    let q = step >> 3;
    if(code & 4) q += step;
    if(code & 2) q += step >> 1;
    if(code & 1) q += step >> 2;
    pred += (code & 8) ? -q : q;
    if(pred > 32767) pred = 32767;
    if(pred < -32768) pred = -32768;
    index += ADPCM_INDEX[code & 7];
    if(index < 0) index = 0;
    if(index > 88) index = 88;
    out[i] = pred / 32768;
  }
  return { rate, pcm: out };
}

async function decodeBytes(bytes){
  const coded = decodeADPCM(bytes);
  if(coded){
    const buf = ac.createBuffer(1, coded.pcm.length, coded.rate);
    buf.getChannelData(0).set(coded.pcm);
    return buf;
  }
  return await ac.decodeAudioData(bytes);
}

function mono(buf){
  const a = buf.getChannelData(0);
  if(buf.numberOfChannels < 2) return a;
  const b = buf.getChannelData(1), m = new Float32Array(a.length);
  for(let i=0;i<m.length;i++) m[i] = (a[i] + b[i])*0.5;
  return m;
}

function stopCurrent(){
  if(src){ try{ src.onended = null; src.stop(); }catch(e){} src = null; }
  playing = false; TL = null; ei = 0;
}

async function playBuffer(buf, secs){
  stopCurrent();
  paused = false; ended = false;
  const mine = ++job;
  setCtl("");
  say("listening");
  const dur = secs > 0 ? Math.min(secs, buf.duration) : buf.duration;
  const cut = Math.min(buf.length, Math.round(dur*buf.sampleRate));
  const tl = await analyse(mono(buf).subarray(0, cut), buf.sampleRate,
                           () => new Promise(r => setTimeout(r, 0)));
  if(mine !== job) return;                       // another file arrived meanwhile
  last = { buf, dur, tl };
  await startPlayback(false);
}

async function startPlayback(fresh){
  stopCurrent();
  if(fresh){ U.fill(0); V.fill(0); M.fill(0); A.level = 0; impulse = 0; }
  TL = last.tl; ei = 0; ever = true; lastPos = 0.5; paused = false; ended = false;
  src = ac.createBufferSource();
  src.buffer = last.buf;
  src.connect(ac.destination);
  if(ac.state === "suspended") await ac.resume();
  t0 = ac.currentTime + 0.05;
  src.start(t0, 0, last.dur);
  playing = true;
  src.onended = () => { playing = false; ended = true; say(""); setCtl("again", true); };
  say(fmt(last.dur));
  setTimeout(() => say(""), 4000);
  setCtl("pause");
}

/* ---------- the only controls: pause, play, again --------------------------- */

function setCtl(t, stay){
  ctl.textContent = t;
  ctl.dataset.stay = stay ? "1" : "";
  ctl.style.visibility = t ? "visible" : "hidden";
  showCtl();
}
function showCtl(){
  if(!ctl.textContent) return;
  ctl.style.opacity = "1";
  clearTimeout(ctlTimer);
  if(!ctl.dataset.stay) ctlTimer = setTimeout(() => { ctl.style.opacity = "0"; }, 3000);
}
async function toggle(){
  if(!last) return;
  if(ended){ await startPlayback(true); return; }
  if(!playing) return;
  if(!paused){ paused = true; await ac.suspend(); setCtl("play", true); }
  else { paused = false; await ac.resume(); setCtl("pause"); }
}
ctl.onclick = toggle;
addEventListener("keydown", e => { if(e.code === "Space"){ e.preventDefault(); toggle(); } });
addEventListener("pointerdown", showCtl);
addEventListener("pointermove", showCtl);

async function playTake(t){
  const pds = await pdsFor(t.did);
  const r = await fetch(pds + "/xrpc/com.atproto.sync.getBlob?did=" +
    encodeURIComponent(t.did) + "&cid=" + encodeURIComponent(t.cid));
  if(!r.ok) throw new Error("take not found (" + r.status + ")");
  await playBuffer(await decodeBytes(await r.arrayBuffer()), t.secs);
}

const fmt = s => Math.floor(s/60) + ":" + String(Math.floor(s%60)).padStart(2,"0");
function say(s){
  const n = $("#note");
  n.textContent = s;
  n.style.opacity = s ? "1" : "0";
}

/* ---------- boot ----------------------------------------------------------- */

let started = false;
function start(){
  if(started) return;
  started = true;
  const g = $("#gate"); if(g) g.remove();
  ac = new (window.AudioContext||window.webkitAudioContext)();
  build();
  if(!takeFromHash()) for(let i=0;i<3;i++)
    stamp(W*(0.2 + 0.6*Math.random()), H*(0.2 + 0.6*Math.random()), 8, Math.random() < 0.5 ? 1 : -1);
  requestAnimationFrame(frame);
}

async function begin(){
  start();
  const t = takeFromHash();
  if(!t) return;
  say("fetching");
  try{ await playTake(t); }
  catch(e){ say(String(e.message||e)); }
}

$("#go").textContent = takeFromHash() ? "PLAY" : "TAKE";
$("#go").onclick = begin;

/* any audio file dropped on the page is heard by the same fire */
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", async e => {
  e.preventDefault();
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if(!f) return;
  start();
  say("reading");
  try{ await playBuffer(await decodeBytes(await f.arrayBuffer()), 0); }
  catch(err){ say("could not decode that"); }
});

let rebuild = null;
addEventListener("resize", () => {
  clearTimeout(rebuild);
  rebuild = setTimeout(() => { if(started) build(); }, 300);
});
</script>
