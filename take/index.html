<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>take</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;background:#000;color:#fff;
    overflow:hidden;overscroll-behavior:none}
  body{font-family:"Courier Prime","Courier New",Courier,monospace;font-size:15px}
  #cv{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;
    image-rendering:pixelated;touch-action:none;z-index:1}
  #gate{position:fixed;inset:0;z-index:4;background:#000;display:flex;
    align-items:center;justify-content:center}
  #go{font:inherit;font-size:16px;letter-spacing:.5em;color:#fff;background:#000;
    border:0;padding:18px 22px;cursor:pointer}
  #note{position:fixed;z-index:3;left:0;right:0;
    bottom:calc(18px + env(safe-area-inset-bottom));text-align:center;
    font-size:13px;letter-spacing:.24em;color:#fff;
    text-shadow:0 0 8px #000,0 0 3px #000;pointer-events:none;transition:opacity 2s}
</style>
</head>
<body>

<canvas id="cv"></canvas>
<div id="note"></div>
<div id="gate"><button id="go">TAKE</button></div>

<script>
"use strict";
/* =====================================================================
   A field, not a picture of anything.

   Two substances diffuse through a coarse grid and eat each other
   (Gray-Scott). The field is full from the first frame and is always
   carried along: every row slides sideways and every column slides
   up or down at its own speed, so the whole screen shears like water
   under wind. The slide is exact, whole cells, so nothing blurs.

   Feed and kill travel along a path that has been checked to stay
   alive, from waves through labyrinth to coral and back.

   The take drives it. Loudness (judged against the take's own peaks)
   speeds the flow and lifts the inks. Each attack, found by spectral
   flux against its own recent history, drops a ring that tears a hole
   and grows back as a wave.

   Four inks, forced by an 8x8 Bayer threshold. Under the chemistry a
   slow interference pattern keeps the empty water from going black.
 ===================================================================== */

const $ = s => document.querySelector(s);
const cv = $("#cv"), ctx = cv.getContext("2d", { alpha:false });

/* ---------- ink: four steps, dark to light ------------------------------- */

const INKS = [
  ["#04070c","#123a4f","#2f8fa6","#d8f4ff"],   // deep water
  ["#080306","#3c1040","#a52d7a","#ffd9f2"],   // bloom
  ["#02060a","#123f2a","#3fa05c","#eaffd6"],   // chlorophyll
  ["#05050a","#2a2550","#7b6ad6","#efeaff"],   // dusk
  ["#060403","#123b45","#57b0a4","#e8fff6"]    // shallows
];
let inkA = 0, inkB = 1, inkMix = 0;
const rgb = h => [parseInt(h.substr(1,2),16), parseInt(h.substr(3,2),16), parseInt(h.substr(5,2),16)];
const lerp = (a,b,t) => a + (b-a)*t;

const BAYER = (() => {
  const m = [
    [ 0,32, 8,40, 2,34,10,42],[48,16,56,24,50,18,58,26],
    [12,44, 4,36,14,46, 6,38],[60,28,52,20,62,30,54,22],
    [ 3,35,11,43, 1,33, 9,41],[51,19,59,27,49,17,57,25],
    [15,47, 7,39,13,45, 5,37],[63,31,55,23,61,29,53,21]];
  const f = new Float32Array(64);
  for(let y=0;y<8;y++) for(let x=0;x<8;x++) f[y*8+x] = (m[y][x] + 0.5)/64;
  return f;
})();

/* ---------- the field ---------------------------------------------------- */

const PX = 4;
let W=0, H=0, u, v, u2, v2, img, gridCv, gridCtx, rowAcc, colAcc, tmp;

/* feed/kill points that all stay alive with these coefficients (simulated:
   47-83% coverage everywhere along the path). the field travels between them. */
const PATH = [[0.022,0.051],[0.029,0.057],[0.039,0.058],[0.046,0.063],[0.0545,0.062],[0.062,0.0609]];
function fk(t){
  t = Math.max(0, Math.min(PATH.length-1.001, t));
  const i = t|0, f = t-i, a = PATH[i], b = PATH[i+1];
  return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f];
}
let F = 0.029, K = 0.057, wander = Math.random()*100, T = 0;
const MAXFLOW = 0.26;              // cells per frame; faster than ~0.3 tears the chemistry apart

function build(){
  const vw = Math.max(1, innerWidth), vh = Math.max(1, innerHeight);
  cv.width  = Math.max(PX*8, Math.floor(vw/PX)*PX);
  cv.height = Math.max(PX*8, Math.floor(vh/PX)*PX);
  W = cv.width/PX; H = cv.height/PX;
  u = new Float32Array(W*H).fill(1); v = new Float32Array(W*H);
  u2 = new Float32Array(W*H); v2 = new Float32Array(W*H);
  rowAcc = new Float32Array(H); colAcc = new Float32Array(W);
  tmp = new Float32Array(Math.max(W,H));
  gridCv = document.createElement("canvas");
  gridCv.width = W; gridCv.height = H;
  gridCtx = gridCv.getContext("2d", { alpha:false });
  img = gridCtx.createImageData(W,H);
  populate(W*H/260);               // full from the first frame, take or no take
  ctx.imageSmoothingEnabled = false;
}

function populate(n){
  for(let i=0;i<n;i++) blob(Math.random()*W, Math.random()*H, 2 + Math.random()*3);
}

function blob(cx, cy, r){
  for(let y=Math.floor(cy-r); y<=cy+r; y++)
    for(let x=Math.floor(cx-r); x<=cx+r; x++){
      if(Math.hypot(x-cx, y-cy) >= r) continue;
      const i = ((y%H+H)%H)*W + ((x%W+W)%W);
      v[i] = 0.5 + Math.random()*0.2; u[i] = 0.25;
    }
}

/* an attack: clear a disk, and seed its rim. the hole refills as a wave. */
function ring(cx, cy, r){
  const R = r + 1.6;
  for(let y=Math.floor(cy-R); y<=cy+R; y++)
    for(let x=Math.floor(cx-R); x<=cx+R; x++){
      const d = Math.hypot(x-cx, y-cy);
      if(d > R) continue;
      const i = ((y%H+H)%H)*W + ((x%W+W)%W);
      if(d < r - 1.4){ v[i] = 0; u[i] = 1; }
      else { v[i] = 0.55; u[i] = 0.25; }
    }
}

function step(){
  const f = F, k = K;
  for(let y=0;y<H;y++){
    const yn = ((y-1+H)%H)*W, ys = ((y+1)%H)*W, yc = y*W;
    for(let x=0;x<W;x++){
      const xw = x ? x-1 : W-1, xe = x < W-1 ? x+1 : 0, i = yc+x;
      const uu = u[i], vv = v[i];
      const lu = 0.2*(u[yc+xw]+u[yc+xe]+u[yn+x]+u[ys+x])
               + 0.05*(u[yn+xw]+u[yn+xe]+u[ys+xw]+u[ys+xe]) - uu;
      const lv = 0.2*(v[yc+xw]+v[yc+xe]+v[yn+x]+v[ys+x])
               + 0.05*(v[yn+xw]+v[yn+xe]+v[ys+xw]+v[ys+xe]) - vv;
      const r = uu*vv*vv;
      const nu = uu + lu - r + f*(1-uu);
      const nv = vv + 0.5*lv + r - (f+k)*vv;
      u2[i] = nu < 0 ? 0 : nu > 1 ? 1 : nu;
      v2[i] = nv < 0 ? 0 : nv > 1 ? 1 : nv;
    }
  }
  let s = u; u = u2; u2 = s; s = v; v = v2; v2 = s;
}

/* ---------- the flow: rows and columns slide by whole cells ------------- */

function rotRow(a, y, k){             // k = +1 or -1
  const o = y*W;
  if(k > 0){ const last = a[o+W-1]; a.copyWithin(o+1, o, o+W-1); a[o] = last; }
  else     { const first = a[o]; a.copyWithin(o, o+1, o+W); a[o+W-1] = first; }
}
function rotCol(a, x, k){
  for(let y=0;y<H;y++) tmp[y] = a[y*W+x];
  for(let y=0;y<H;y++) a[((y+k+H)%H)*W+x] = tmp[y];
}
function flow(speed){
  const p = T*0.004;
  for(let y=0;y<H;y++){
    rowAcc[y] += speed*(Math.sin(y*0.061 + p) + 0.45*Math.sin(y*0.173 - p*1.7));
    while(rowAcc[y] >= 1){ rotRow(u,y,1); rotRow(v,y,1); rowAcc[y] -= 1; }
    while(rowAcc[y] <= -1){ rotRow(u,y,-1); rotRow(v,y,-1); rowAcc[y] += 1; }
  }
  for(let x=0;x<W;x++){
    colAcc[x] += 0.7*speed*(Math.sin(x*0.083 - p*0.8) + 0.45*Math.sin(x*0.21 + p*1.3));
    while(colAcc[x] >= 1){ rotCol(u,x,1); rotCol(v,x,1); colAcc[x] -= 1; }
    while(colAcc[x] <= -1){ rotCol(u,x,-1); rotCol(v,x,-1); colAcc[x] += 1; }
  }
}

/* ---------- drawing ------------------------------------------------------ */

const pal = new Uint8Array(12);
function mixInks(){
  const a = INKS[inkA], b = INKS[inkB];
  for(let i=0;i<4;i++){
    const ca = rgb(a[i]), cb = rgb(b[i]);
    for(let c=0;c<3;c++) pal[i*3+c] = lerp(ca[c], cb[c], inkMix);
  }
}

function draw(){
  const d = img.data, p = T*0.01;
  const lift = 0.22*A.level + flash;          // the take brightens everything a little
  for(let y=0;y<H;y++){
    const row = (y&7)*8, sy = Math.sin(y*0.045 - p*0.7);
    for(let x=0;x<W;x++){
      const i = y*W+x;
      // the water under the chemistry: never flat, never black
      const under = 0.2 + 0.1*Math.sin(x*0.052 + p)*sy;
      let t = v[i]*2.3 + under + lift;
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      const s = t*3, lo = s|0;
      const c = (s - lo) > BAYER[row + (x&7)] ? (lo > 2 ? 3 : lo+1) : lo;
      const o = i*4, q = c*3;
      d[o] = pal[q]; d[o+1] = pal[q+1]; d[o+2] = pal[q+2]; d[o+3] = 255;
    }
  }
  gridCtx.putImageData(img,0,0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(gridCv, 0, 0, cv.width, cv.height);
}

/* ---------- listening -----------------------------------------------------
   loudness is judged against this take's own peaks, and attacks against
   this take's own recent flux, so a quiet fingerpicked take reads as fully
   as a hard strummed one.                                                 */

let ac, analyser, tbuf, fbuf, prev, src, playing = false;
const A = { level:0, bright:0.3 };
let hold = 0.02, fluxHist = [], lastHit = 0, flash = 0, kick = 0;

function listen(now){
  if(!analyser || !playing){ A.level *= 0.95; return; }
  analyser.getFloatTimeDomainData(tbuf);
  let e = 0;
  for(let i=0;i<tbuf.length;i++) e += tbuf[i]*tbuf[i];
  const rms = Math.sqrt(e/tbuf.length);
  hold = Math.max(rms, hold*0.9993, 0.003);
  A.level = A.level*0.75 + Math.min(1, rms/hold)*0.25;

  analyser.getFloatFrequencyData(fbuf);
  let flux = 0, sum = 0, ws = 0;
  for(let i=2;i<fbuf.length;i++){
    const m = Math.pow(10, fbuf[i]/20);
    const dm = m - prev[i];
    if(dm > 0) flux += dm;
    prev[i] = m; sum += m; ws += m*i;
  }
  if(sum > 0) A.bright = A.bright*0.8 + (ws/sum/fbuf.length)*0.2;
  flux = flux/(sum + 1e-9);                     // scale-free: loud and soft alike

  fluxHist.push(flux); if(fluxHist.length > 80) fluxHist.shift();
  let mean = 0; for(const f of fluxHist) mean += f; mean /= fluxHist.length;
  let sd = 0; for(const f of fluxHist) sd += (f-mean)*(f-mean); sd = Math.sqrt(sd/fluxHist.length);

  const audible = rms > 0.0015 && rms > hold*0.06;
  if(audible && fluxHist.length > 10 && flux > mean + 1.1*sd && flux > mean*1.2 && now - lastHit > 85){
    lastHit = now;
    hit(Math.min(3, (flux-mean)/(sd+1e-9)));
  }
}

function hit(strength){
  const b = A.bright;
  const y = H*(0.9 - Math.min(0.8, b*2.2)) + (Math.random()-0.5)*H*0.12;   // bright sounds sit high
  const x = W*(0.5 + 0.44*Math.sin(wander*9.1 + b*13)) + (Math.random()-0.5)*W*0.15;
  ring(x, y, 3 + strength*2.4 + A.level*5);
  flash = Math.min(0.28, flash + 0.05 + strength*0.04);
  kick = Math.min(0.12, kick + 0.03*strength);
}

/* ---------- the wander ---------------------------------------------------- */

let lastAlive = 0;
function evolve(now){
  wander += 0.0005;
  // travel the living path; bright playing leans toward coral, dark toward waves
  const t = 2.5 + 2.2*Math.sin(wander) + 0.6*Math.sin(wander*2.3 + 1.1) + (A.bright - 0.3)*1.5;
  [F, K] = fk(t);

  inkMix += 0.0004 + A.level*0.0012;
  if(inkMix >= 1){
    inkMix = 0; inkA = inkB;
    inkB = (inkB + 1 + (Math.random()*2|0)) % INKS.length;
    if(inkB === inkA) inkB = (inkB + 1) % INKS.length;
  }
  mixInks();
  flash *= 0.9; kick *= 0.96;

  // if the field ever thins out, put life back in
  if(now - lastAlive > 1000){
    lastAlive = now;
    let n = 0; for(let i=0;i<v.length;i+=7) if(v[i] > 0.15) n++;
    if(n/(v.length/7) < 0.15) populate(W*H/500);
  }
}

/* ---------- touch is a hand in the water --------------------------------- */

function pointer(e){
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left)/PX, y = (e.clientY - r.top)/PX;
  if(x>=0 && y>=0 && x<W && y<H) ring(x, y, 4);
}
cv.addEventListener("pointerdown", pointer);
cv.addEventListener("pointermove", e => { if(e.buttons || e.pressure > 0) pointer(e); });

/* ---------- loop ---------------------------------------------------------- */

function frame(now){
  T++;
  listen(now);
  evolve(now);
  flow(Math.min(MAXFLOW, 0.07 + 0.14*A.level + kick));
  for(let i=0;i<3;i++) step();
  draw();
  requestAnimationFrame(frame);
}

/* ---------- a take from the repo ------------------------------------------
   #<did>/<cid> or #<did>/<cid>/<seconds>                                   */

function takeFromHash(){
  const h = (location.hash||"").replace(/^#/,"").trim();
  const m = h.match(/^(did:[a-z0-9:%._-]+)\/([a-z0-9]+)(?:\/(\d+))?$/i);
  return m ? { did:m[1], cid:m[2], secs: m[3] ? parseInt(m[3],10) : 0 } : null;
}

async function pdsFor(did){
  const r = await fetch("https://plc.directory/" + did);
  if(!r.ok) throw new Error("could not resolve " + did);
  const doc = await r.json();
  const svc = (doc.service||[]).find(s => String(s.id).endsWith("atproto_pds"));
  if(!svc) throw new Error("no pds in that did document");
  return svc.serviceEndpoint.replace(/\/$/,"");
}

/* the recorder streams IMA ADPCM behind a four-byte marker "OCA1".
   anything without it is an older plain WAV take.                        */

const ADPCM_STEP = new Int32Array([
  7,8,9,10,11,12,13,14,16,17,19,21,23,25,28,31,34,37,41,45,50,55,60,66,73,
  80,88,97,107,118,130,143,157,173,190,209,230,253,279,307,337,371,408,449,
  494,544,598,658,724,796,876,963,1060,1166,1282,1411,1552,1707,1878,2066,
  2272,2499,2749,3024,3327,3660,4026,4428,4871,5358,5894,6484,7132,7845,
  8630,9493,10442,11487,12635,13899,15289,16818,18500,20350,22385,24623,
  27086,29794,32767]);
const ADPCM_INDEX = new Int32Array([-1,-1,-1,-1,2,4,6,8]);

function decodeADPCM(bytes){
  const b = new Uint8Array(bytes);
  if(b[0]!==79 || b[1]!==67 || b[2]!==65 || b[3]!==49) return null;
  const rate = new DataView(bytes).getUint32(4, true);
  const n = (b.length - 12) * 2;
  const out = new Float32Array(n);
  let pred = 0, index = 0;
  for(let i=0;i<n;i++){
    const byte = b[12 + (i>>1)];
    const code = (i & 1) ? (byte >> 4) : (byte & 15);
    const step = ADPCM_STEP[index];
    let q = step >> 3;
    if(code & 4) q += step;
    if(code & 2) q += step >> 1;
    if(code & 1) q += step >> 2;
    pred += (code & 8) ? -q : q;
    if(pred > 32767) pred = 32767;
    if(pred < -32768) pred = -32768;
    index += ADPCM_INDEX[code & 7];
    if(index < 0) index = 0;
    if(index > 88) index = 88;
    out[i] = pred / 32768;
  }
  return { rate, pcm: out };
}

async function playTake(t){
  const pds = await pdsFor(t.did);
  const r = await fetch(pds + "/xrpc/com.atproto.sync.getBlob?did=" +
    encodeURIComponent(t.did) + "&cid=" + encodeURIComponent(t.cid));
  if(!r.ok) throw new Error("take not found (" + r.status + ")");
  const bytes = await r.arrayBuffer();
  const coded = decodeADPCM(bytes);
  let buf;
  if(coded){
    buf = ac.createBuffer(1, coded.pcm.length, coded.rate);
    buf.getChannelData(0).set(coded.pcm);
  } else {
    buf = await ac.decodeAudioData(bytes);
  }
  src = ac.createBufferSource();
  src.buffer = buf;
  src.connect(analyser);
  src.connect(ac.destination);
  const dur = t.secs > 0 ? Math.min(t.secs, buf.duration) : buf.duration;
  src.start(0, 0, dur);
  playing = true;
  src.onended = () => { playing = false; say(""); };
  say(fmt(dur));
  setTimeout(() => say(""), 4000);
}

const fmt = s => Math.floor(s/60) + ":" + String(Math.floor(s%60)).padStart(2,"0");
function say(s){
  const n = $("#note");
  n.textContent = s;
  n.style.opacity = s ? "1" : "0";
}

/* ---------- boot ----------------------------------------------------------- */

async function begin(){
  const g = $("#gate"); if(g) g.remove();
  ac = new (window.AudioContext||window.webkitAudioContext)();
  analyser = ac.createAnalyser();
  analyser.fftSize = 1024;
  analyser.smoothingTimeConstant = 0;          // raw frames: flux needs the edges
  analyser.minDecibels = -110; analyser.maxDecibels = -10;
  tbuf = new Float32Array(analyser.fftSize);
  fbuf = new Float32Array(analyser.frequencyBinCount);
  prev = new Float32Array(analyser.frequencyBinCount);
  build();
  mixInks();
  requestAnimationFrame(frame);
  const t = takeFromHash();
  if(!t) return;
  say("fetching");
  try{ await playTake(t); }
  catch(e){ say(String(e.message||e)); }
}

$("#go").textContent = takeFromHash() ? "PLAY" : "TAKE";
$("#go").onclick = begin;

let rebuild = null;
addEventListener("resize", () => {
  clearTimeout(rebuild);
  rebuild = setTimeout(build, 300);
});
</script>
</body>
</html>
