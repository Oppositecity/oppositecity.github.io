<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>take</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:"Courier Prime","Courier New",Courier,monospace;font-size:15px}
  body{display:flex;align-items:center;justify-content:center}
  a{color:#fff;letter-spacing:.4em;padding:18px 22px}
</style>
</head>
<body>
<a id="r" href="/remix/">REMIX</a>
<script>
/* the take player became the remix page. every link to a take still lands
   there, on the same take: #<did>/<cid> and the older #<did>/<cid>/<seconds>
   both arrive as #<did>/<cid>. */
(function(){
  var h = (location.hash || "").replace(/^#/, "");
  var m = h.match(/^(did:[a-z0-9:%._-]+)\/([a-z0-9]+)(?:\/\d+)?(\?.*)?$/i);
  var to = "/remix/" + (m ? "#" + m[1] + "/" + m[2] + (m[3] || "") : location.hash);
  document.getElementById("r").href = to;
  location.replace(to);
})();
</script>
</body>
</html>
