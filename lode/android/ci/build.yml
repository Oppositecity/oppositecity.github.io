name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Signing key (made once, then reused) and font
        run: |
          if [ -f keystore.b64 ]; then
            base64 -d keystore.b64 > lode.keystore
          else
            keytool -genkeypair -keystore lode.keystore -storetype PKCS12 -alias lode -keyalg RSA -keysize 2048 -validity 20000 -storepass oppositecity -keypass oppositecity -dname "CN=Opposite City, O=Opposite City, C=US"
            base64 -w 76 lode.keystore > keystore.b64
            git config user.name "lode build"
            git config user.email "actions@users.noreply.github.com"
            git add keystore.b64
            git commit -m "signing key"
            git push
          fi
          curl -fsSL -o app/src/main/assets/CourierPrime-Regular.ttf https://github.com/google/fonts/raw/main/ofl/courierprime/CourierPrime-Regular.ttf

      - name: Build
        run: gradle assembleRelease --no-daemon

      - name: Name the apk
        run: cp app/build/outputs/apk/release/app-release.apk lode.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: lode 0.1.${{ github.run_number }}
          files: lode.apk
          make_latest: true
          body: |
            Download lode.apk on an Android phone and open it.
            Allow Chrome to install unknown apps when asked, and tap "Install anyway" if Play Protect warns.
