const SIMPLE = [
  {

      { pos: "Avant-poste · 1", posEN: "Outpost", species: [
        { n: 1, fr: "Le Cocu en herbe ou anticipé", en: "The Budding or Anticipatory Cuckold", desc: "Whose wife had lovers before the wedding and does not bring her virginity to the husband." },
      ]},
      { pos: "Avant-garde · 2", posEN: "Vanguard", species: [
        { n: 2, fr: "Le Cocu présomptif", en: "The Presumptive Cuckold", desc: "Long before marriage, dreads the common fate and tortures himself trying to escape it — his precautions only hasten the event he fears." },
        { n: 3, fr: "Le Cocu imaginaire", en: "The Imaginary Cuckold", desc: "Not yet a cuckold but despairs believing he is. Suffers imaginary pain before the real thing. Molière painted him." },
      ]},
      { pos: "Flanqueurs de droite · 3", posEN: "Right Flankers", species: [
        { n: 4, fr: "Le Cocu martial ou fanfaron", en: "The Martial or Braggart Cuckold", desc: "Believes his terrifying threats against suitors have shielded him — yet wears the horns all the same, usually planted by the very man who applauds his vigilance." },
        { n: 5, fr: "Le Cocu argus ou cauteleux", en: "The Argus or Wily Cuckold", desc: "A shrewd operator who knows every trick of love and makes clever arrangements to foil rivals. Wins many battles but, like the finest general, eventually suffers defeat." },
        { n: 6, fr: "Le Cocu goguenard", en: "The Mocking Cuckold", desc: "Jokes about his fellow cuckolds, calling them imbeciles who deserve their fate. Those who hear him exchange knowing smiles." },

      { pos: "Ailerette droite · 4", posEN: "Right Winglet", species: [
        { n: 7, fr: "Le Cocu pur et simple", en: "The Pure and Simple Cuckold", desc: "An honorable jealous man who does not know his disgrace and gives no cause for laughter through boasting or clumsy measures. The most praiseworthy of all species." },
        { n: 8, fr: "Le Cocu fataliste ou résigné", en: "The Fatalist or Resigned Cuckold", desc: "Lacking personal means to hold his wife, resigns himself to whatever God ordains and falls back on justice and duty — at which point she does not fail to betray him." },
        { n: 9, fr: "Le Cocu condamné ou désigné", en: "The Condemned or Designated Cuckold", desc: "Afflicted with deformities or infirmities, he dares to take a beautiful wife. The public unanimously condemns him to wear the horns, and the sentence is duly carried out." },
        { n: 10, fr: "Le Cocu irréprochable ou victimé", en: "The Irreproachable or Victimized Cuckold", desc: "Joins attentiveness to physical and moral advantages and deserves an honest wife in every respect, yet is betrayed by a coquette. The public declares him worthy of a better fate." },
      ]},
      { pos: "Aileron droit · 5", posEN: "Right Wing Section", species: [
        { n: 11, fr: "Le Cocu de prescription", en: "The Cuckold by Prescription", desc: "Makes long absences and voyages, during which nature speaks to the senses of a wife who, after sufficient resistance, is forced by prolonged privation to accept the help of a charitable neighbor." },
        { n: 12, fr: "Le Cocu absorbé ou préoccupé", en: "The Absorbed or Preoccupied Cuckold", desc: "The torrent of business keeps him constantly away from his wife, to whom he can give no attention; he must close his eyes to the care provided by a discreet friend of the household." },
        { n: 13, fr: "Le Cocu de santé", en: "The Health Cuckold", desc: "By doctor's orders abstains from the work of the flesh. His wife can do no less than resort to substitutes, without the husband having the right to take offense." },
        { n: 14, fr: "Le Cocu régénérateur ou conservateur", en: "The Regenerator or Conservator Cuckold", desc: "Takes charge of the community's interests, watches over his fellows' households and warns them of dangers to their honor — meanwhile failing to see what transpires in his own home." },
        { n: 15, fr: "Le Cocu propagandiste", en: "The Propagandist Cuckold", desc: "Goes about singing the joys of married life, urging everyone to take a wife — and to whom does he deliver these apologies for marriage? Usually to the very man who is cuckolding him." },
      ]},
    ]
  },
  {
    className: "Cornettes",
    classNameEN: "The Short-Horned",
    color: "#e65100",
    desc: "The middle class — cuckolds of greater refinement, from the sympathetic to the mystical.",
    positions: [
      { pos: "Aile droite · 6", posEN: "Right Wing", species: [
        { n: 16, fr: "Le Cocu sympathique", en: "The Sympathetic Cuckold", desc: "Grows fond of his wife's lovers and makes them his intimate friends. When she quarrels with her lover, he goes to find him: 'We never see you anymore, we're all sad. Come visit, it will cheer her up.'" },
        { n: 17, fr: "Le Cocu tolérant ou débonnaire", en: "The Tolerant or Good-Natured Cuckold", desc: "Seeing a lover installed in his house, behaves like a gentleman who wishes to do the honors — confines himself to secret remonstrances with his wife and treats the lover like anyone else." },
        { n: 18, fr: "Le Cocu réciproque", en: "The Reciprocal Cuckold", desc: "Returns the favor and closes his eyes because he takes his compensation with the wife or relative of the man who cuckolds him. A loan repaid: one keeps quiet in such cases." },
        { n: 19, fr: "Le Cocu auxiliaire ou coadjuteur", en: "The Auxiliary or Coadjutor Cuckold", desc: "Rarely appears at home except to spread joy, reproaches the timid admirers for not laughing or drinking enough, and urges them to live as good republicans among whom all is shared." },
        { n: 20, fr: "Le Cocu accélérant ou précipitant", en: "The Accelerating or Precipitating Cuckold", desc: "Works to advance the timetable — hastens to show off his young wife, subscribes her to the theater, encourages her to cherish friends. Like parcels sent by express coach, he arrives sooner at the destination." },
        { n: 21, fr: "Le Cocu traitable ou bénin", en: "The Manageable or Benign Cuckold", desc: "Can be reasoned with. Suitors persuade him that a husband must make sacrifices for domestic peace and allow his wife harmless diversions — since a woman of principles could never be seduced." },
      ]},
      { pos: "Centre de secte · 7", posEN: "Center of the Sect", species: [
        { n: 22, fr: "Le Cocu optimiste ou bon vivant", en: "The Optimist or Bon Vivant Cuckold", desc: "Sees everything in the best light, amuses himself with his wife's intrigues, drinks to the health of his fellow cuckolds, and finds merriment where others tear their hair. Is he not the wisest?" },
        { n: 23, fr: "Le Cocu converti ou ravisé", en: "The Converted or Reformed Cuckold", desc: "At first made a great fuss and adjusted to the horns only with difficulty, but has since come to his senses, now joking about the matter and consoling himself with the others." },
        { n: 24, fr: "Le Cocu fédéral ou coalisé", en: "The Federal or Coalition Cuckold", desc: "Seeing the affair is inevitable, agrees to admit a lover — but one of his choosing. Then they form a coalition, like Pitt and Coburg, to surround the wife and jointly repel other suitors." },
        { n: 25, fr: "Le Cocu transcendant ou de haute volée", en: "The Transcendent or High-Flying Cuckold", desc: "The cleverest of the entire fraternity, placed at the center. Marries a beautiful woman, shows her off with some fanfare, and once she has aroused universal envy, trades her for a high position or major partnership. 'It isn't cuckoldry at that price.'" },
        { n: 26, fr: "Le Cocu grandiose ou impassible", en: "The Grandiose or Impassive Cuckold", desc: "Neither distressed nor amused by the cuckoldry he perceives, maintains perfect calm without descending to any action that invites ridicule. Common among the wealthy married for money." },
        { n: 27, fr: "Le Cocu déserteur ou scissionnaire", en: "The Deserter or Secessionist Cuckold", desc: "Bored with the household's love affairs, publicly renounces his wife and says to each new lover: 'When he's had as much of her as I have, he'll be quite tired of her.'" },
        { n: 28, fr: "Le Cocu de l'étrier ou prête-nom", en: "The Stirrup or Front-Man Cuckold", desc: "A straw man given a promotion on condition he marry the mistress of a powerful man and adopt the child. Often marries the cow and the calf together; his horns put his foot in the stirrup." },
      ]},
      { pos: "Aile gauche · 6", posEN: "Left Wing", species: [
        { n: 29, fr: "Le Cocu pouponné ou compensé", en: "The Pampered or Compensated Cuckold", desc: "Suspects something, but is so well caressed, coddled, and fussed over by his wife that his suspicions expire the moment she strokes his chin." },
        { n: 30, fr: "Le Cocu ensorcelé ou à cataracte", en: "The Bewitched or Blinkered Cuckold", desc: "His wife so fascinates and lulls him that he alone is ignorant of escapades that are the talk of the town. He would not believe his own eyes if he caught her in the act." },
        { n: 31, fr: "Le Cocu glaneur ou banal", en: "The Gleaner or Common Cuckold", desc: "Comes humbly to claim his share of the cake, ardently courting his better half for what she grants to so many others — after whom he modestly comes to glean." },
        { n: 32, fr: "Le Cocu en tutelle", en: "The Cuckold Under Guardianship", desc: "Whose wife wears the trousers and who cannot function in society without her support. One such was heard to say: 'If my wife were here, she'd know how to answer you.'" },
        { n: 33, fr: "Le Cocu révérencieux ou à procédés", en: "The Ceremonious or Procedural Cuckold", desc: "A simpleton who retaliates only with polite reasoning. One such, finding a gentleman in bed with his wife, said: 'That is most improper, sir. I never would have expected this of a man like you.'" },
        { n: 34, fr: "Le Cocu mystique ou encaffardé", en: "The Mystical or Bigoted Cuckold", desc: "Surrounds his wife with priests and holy people to avoid danger, among whom some Tartuffe slips in and plants horns on his head for the greater glory of God." },
      ]},
    ]
  },
  {
    className: "Cornards",
    classNameEN: "The Great-Horned",
    color: "#b71c1c",
    desc: "The most extreme class — from the orthodox believer to the posthumous cuckold of two worlds.",
    positions: [
      { pos: "Aileron gauche · 5", posEN: "Left Wing Section", species: [
        { n: 35, fr: "Le Cocu orthodoxe ou endoctriné", en: "The Orthodox or Indoctrinated Cuckold", desc: "The catechumen of the trade — believes in principles and good morals, thinks libertines exaggerate, and places all his hope in his wife's good nature and the influence of morality." },
        { n: 36, fr: "Le Cocu apostat ou transfuge", en: "The Apostate or Turncoat Cuckold", desc: "After being a model of reason and warning others against the conjugal trap, plunges headfirst into it himself. Such was Molière, who after enlightening the fraternity, enrolled most foolishly." },
        { n: 37, fr: "Le Cocu matté ou perplexe", en: "The Subdued or Perplexed Cuckold", desc: "Reduced to gnawing his bit in silence. Family or business considerations oblige him to play along with his wife and the friends who know his embarrassing position." },
        { n: 38, fr: "Le Cocu sordide", en: "The Sordid Cuckold", desc: "A miser who refuses to pay for his wife's wardrobe, forcing her to listen to generous offers — then profits from the gallant who maintains her, deluding himself through the double advantage." },
        { n: 39, fr: "Le Cocu goujat ou crapuleux", en: "The Boorish or Debauched Cuckold", desc: "A lout against whom the public takes sides, revolted by the contrast between his vile conduct and his wife's good manners. Everyone supports the lady: 'It would be a shame if she were faithful to such a pig.'" },
      ]},
      { pos: "Ailerette gauche · 4", posEN: "Left Winglet", species: [
        { n: 40, fr: "Le Cocu déniaisé, ébahi", en: "The Disabused or Dumbfounded Cuckold", desc: "Having long believed obstinately in his wife's virtue, is finally undeceived by some dramatic event — a gift she makes him — and sadly passes into the ranks of the enlightened." },
        { n: 41, fr: "Le Cocu récalcitrant", en: "The Recalcitrant Cuckold", desc: "Cannot get used to seeing the gallant around. Makes scenes, causes commotion. Family, friends, and neighbors must intervene to persuade him it's all harmless — but only achieve an uneasy truce." },
        { n: 42, fr: "Le Cocu fulminant", en: "The Fulminating Cuckold", desc: "Invokes the authorities, the courts, stirs up the public, causes a frightful scandal, threatens violence — and achieves nothing but exposing himself to the ridicule he could have avoided." },
        { n: 43, fr: "Le Cocu trompette", en: "The Trumpet Cuckold", desc: "Goes about in a tearful voice taking the public into his confidence: 'But sir, I caught them in the act!' He would gladly hire a trumpeter to gather a bigger crowd." },
      ]},
      { pos: "Flanqueurs de gauche · 3", posEN: "Left Flankers", species: [
        { n: 44, fr: "Le Cocu disgracié", en: "The Disgraced Cuckold", desc: "Over whom the wife has taken such an empire that she won't even admit him — he is rarely received at her home, still less allowed to appear in public with her." },
        { n: 45, fr: "Le Cocu pot-au-feu", en: "The Pot-au-Feu Cuckold", desc: "A subordinate species whom the wife supports and who respectfully lends himself to everything necessary for the smooth operation of her amorous commerce. Not the rarest species." },
        { n: 46, fr: "Le Cocu cornard ou désespéré", en: "The Desperate Cuckold (George Dandin)", desc: "Molière's George Dandin — endures every conceivable tribulation, duped, ruined, mistreated, outraged by his wife, finding in marriage a sure means of going straight to heaven by doing purgatory on earth." },
      ]},
      { pos: "Arrière-garde · 2", posEN: "Rearguard", species: [
        { n: 47, fr: "Le Cocu porte-bannière", en: "The Banner-Bearer Cuckold", desc: "A fool married to a pretty wife whose credulity, stupidity, ugliness, and avarice provoke a rain of horns. At his appearance, the word 'horns' resounds everywhere and the public elevates him to standard-bearer." },
        { n: 48, fr: "Le Cocu porte-quenouille", en: "The Distaff-Bearer Cuckold", desc: "Tends the household while the lady goes out to amuse herself. At promenades, she walks ahead with the gallant while he follows behind carrying her handbag and lapdog — less burdened in his arms than on his forehead." },
      ]},
      { pos: "Arrière-poste · 1", posEN: "Rear Outpost", species: [
        { n: 49, fr: "Le Cocu posthume ou des deux mondes", en: "The Posthumous or Two-Worlds Cuckold", desc: "Whose wife bears children 10-12 months after his death. The law awards them to him though he could not have fathered them — cuckold of both worlds, since after bearing horns in this life, more are planted on his coffin." },
      ]},
    ]
  }
];

const COMPOUND = [
  { n: 50, fr: "Le Cocu de vocation ou de grâce, cocu quiétiste", en: "The Vocation or Grace Cuckold (Quietist)", desc: "Has by nature what the orthodox has only by training — has never known suspicion, brings to marriage an honest and pure soul, and finds in cuckoldry all the blessings the Constitution promised France: peace, union, concord. The finest paste of cuckold in the fraternity." },
  { n: 51, fr: "Le Cocu loup-garou", en: "The Werewolf Cuckold", desc: "Makes his house an impregnable fortress, guards more severely than a eunuch around the odalisques, brutalizes not only suitors but all outsiders. But as Philip of Macedon said, no fortress is impregnable if a mule laden with gold can climb to it." },
  { n: 52, fr: "Le Cocu pédagogue ou précepteur", en: "The Pedagogue or Tutor Cuckold", desc: "Molière's School for Wives — the old man who forms a young innocent destined to share his bed, but another comes along to give better-received lessons. Many philosophers court the mother to marry the daughter." },
  { n: 53, fr: "Le Cocu vétilleux", en: "The Nitpicking Cuckold", desc: "On some suspicions, perceives in the future an event that is no longer future. He argues with his wife about appearances the public might discuss. She gives reassuring answers. He persists with his good advice, which she graciously accepts — the better to keep his mind at rest and his forehead well-furnished." },
  { n: 54, fr: "Le Cocu philanthrope ou fraternel", en: "The Philanthropist or Fraternal Cuckold", desc: "Considers men a family of brothers among whom all goods should be common. Good-naturedly raises a troop of children who bear his name but belong to his neighbors — their different fathers' names written on the children's faces." },
  { n: 55, fr: "Le Cocu à prétention ou avantageux, suffisant", en: "The Pretentious or Self-Important Cuckold", desc: "Believes his wife so honored to have him as husband that she cannot even think of listening to suitors, in whom he sees only unworthy victims. His security makes him a convenient and negligent husband." },
  { n: 56, fr: "Le Cocu prédicant ou compatissant", en: "The Preaching or Compassionate Cuckold", desc: "Brings his wife the consolations of friendship, paints the sweet charms of virtue. He obtains from her in words and promises as much as the gallants obtain in favors. He triumphs at last — when age drives away all her lovers." },
  { n: 57, fr: "Le Cocu cosmopolite ou hospitalier", en: "The Cosmopolitan or Hospitable Cuckold", desc: "Whose house resembles an inn, given the number of gallants his wife assembles from every country. They are so numerous that his suspicions cannot settle on any one." },
  { n: 58, fr: "Le Cocu misanthrope", en: "The Misanthrope Cuckold", desc: "Upon discovering the affair, takes the world in aversion, claims the age is rotten and morals are destroyed. A half-madman, pitiful in his moral jeremiads, who should not have married if he so loathed sharing the fate of so many worthy men." },
  { n: 59, fr: "Le Cocu enragé, possédé ou maudit", en: "The Enraged, Possessed, or Accursed Cuckold", desc: "The sick jealous man who combines physical and moral disgrace — gout or paralysis prevents him from satisfying and watching over a young wife. Suffering continually in body and spirit, he is truly among the possessed." },
  { n: 60, fr: "Le Cocu virtuose", en: "The Virtuoso Cuckold", desc: "Passionate about some branch of science or art, befriends all its practitioners. If a music-lover, anyone who plays him a tune on the bagpipes becomes his favorite and gains access to his wife — whom he recommends to their artistic attention." },
  { n: 61, fr: "Le Cocu délaissé", en: "The Abandoned Cuckold", desc: "A disagreeable man in a mismatched marriage who, after harassing his pretty wife, finds one morning the cage empty and the bird flown, with a divorce summons waiting." },
  { n: 62, fr: "Le Cocu à toutes sauces", en: "The All-Sauces Cuckold", desc: "Accumulates every dignity of the order. Began as a budding cuckold, then passed through sympathetic, orthodox, bewitched, and all subsequent species — maintaining unalterable serenity throughout. If he dies in time, a court will award him a posthumous child to complete the set." },
  { n: 63, fr: "Le Cocu d'urgence ou de sauvegarde", en: "The Emergency or Safeguard Cuckold", desc: "Whom a financial crisis or grave danger obliges to close his eyes while his wife's liaisons rescue a failing business, free mortgaged properties, and render other services important enough to make him protect her activities. During the Terror, many such cuckolds saved their heads at the expense of their foreheads." },
  { n: 64, fr: "Le Cocu escamoté", en: "The Conjured-Away Cuckold", desc: "Whose wife, made pregnant during his absence, delivers furtively with the help of a journey and an honest doctor who fabricates convenient illnesses. He escapes the principal danger — avoids the child and keeps only the horns, which are less costly to maintain." },
  { n: 65, fr: "Le Cocu prudot ou caméléon", en: "The Prude or Chameleon Cuckold", desc: "Will rail against this very taxonomy, cry offense to morals — a Tartuffe swollen with formulas, bristling with edifying anecdotes, denying well-known liaisons. Typically a hypocrite who courts his servants while preaching principles he believes no more than anyone else." },
  { n: 66, fr: "Le Cocu judicieux ou de garantie, protococu", en: "The Judicious or Guaranteed Cuckold (Proto-Cuckold)", desc: "The flower of the fraternity. Marries a rich woman by mutual arrangement of liberties. Both know the terms of their bargain and honorably fulfill all conditions: liberty, respect, protection, and reciprocal friendship. Fourier wrote: 'This is the species to which I would aspire if I ever married.'" },
];

{id:"nombres",z:"move",t:"move",role:"frame",st:"fourier",name:"Three sacred numbers",en:"Three, seven and twelve",eq:"octave = 7 essential + 5 accessory + 1 unison",gloss:"The passional gamut is analogous to the musical octave: twelve sounds, seven decided, five accidental; the thirteenth repeats the first.",src:V2("197, 235, 312")},

{id:"monogyne",z:"chars",t:"chars",role:"source",st:"fourier",name:"Monogynes",en:"Simple souls · one dominant",eq:"576 of 810",

{id:"polygyne",z:"chars",t:"chars",role:"interaction",st:"fourier",name:"Polygynes",en:"Characters of compound gamut",gloss:"The generic name for every degree from digyne to omnigyne.",src:V2("314")},

{id:"damon",z:"chars",t:"chars",role:"frame",st:"fourier",name:"Damon and Aristo",en:"Who is right about love?",
 gloss:"Damon, faithful to one woman, is right up to about 2,300 in 30,000 — about 1,150 monogyne couples in love. Aristo, who loves seven women at once, is right if his kind, the omnigyne, furnishes two in 30,000. Both are wrong above or below the proportion.",src:V2("311–312")},
{id:"superdom",z:"chars",t:"chars",role:"switch",st:"fourier",name:"Superdominant",en:"The casting vote",gloss:"Julius Caesar had the papillon as superdominant and dictated four letters at once while writing a fifth.",src:V2("27–28")},
{id:"biomni",z:"chars",t:"chars",role:"switch",st:"fourier",name:"Bi-potential gamut",en:"The second octave",

{id:"muscles",z:"chars",t:"chars",role:"frame",st:"fourier",name:"810 muscles",en:"The body as sign",gloss:"The 810 characters are represented by the 810 muscles of the human couple, male and female. The spiritual integral is 810; the corporeal, two.",src:V2("308")},
{id:"integral",z:"chars",t:"chars",role:"storage",st:"fourier",name:"L’âme intégrale",en:"810 contrasted characters",

      const col=TYPEC[byId[a].t];
      el('path',{class:'edge',d:roundPath(pts),stroke:col,'stroke-width':3.6,'stroke-opacity':.85,'marker-end':`url(#m_${col.slice(1)})`,'stroke-dasharray':k==='analogy'?'14 9':''},LEDGE)}
    if(n%12===0)await new Promise(r=>setTimeout(r,0));
  }
}

/* ---------- view ---------- */
let vb={x:0,y:0,w:W,h:H};const cw=()=>svg.clientWidth,ch=()=>svg.clientHeight;
function apply(){vb.h=vb.w*ch()/cw();svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`)}
function fit(x,y,w,h){const s=Math.min(cw()/w,ch()/h);vb.w=cw()/s;vb.x=x+w/2-vb.w/2;vb.y=y+h/2-(vb.w*ch()/cw())/2;apply()}
function zoomAt(px,py,f){const wx=vb.x+px/cw()*vb.w,wy=vb.y+py/ch()*vb.h,nw=Math.min(W*1.6,Math.max(300,vb.w*f));vb.x=wx-px/cw()*nw;vb.y=wy-py/ch()*(nw*ch()/cw());vb.w=nw;apply()}
let fly=null;
function flyTo(cx,cy,w,ms=900){cancelAnimationFrame(fly);const a={...vb},t0=performance.now(),b={x:cx-w/2,y:cy-w*ch()/cw()/2,w};
  if(reduce){Object.assign(vb,b);apply();return}
  const st=now=>{let k=Math.min(1,(now-t0)/ms);k=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;vb.x=a.x+(b.x-a.x)*k;vb.y=a.y+(b.y-a.y)*k;vb.w=a.w+(b.w-a.w)*k;apply();if(k<1)fly=requestAnimationFrame(st)};fly=requestAnimationFrame(st)}
const pts=new Map();let moved=0,down=null,pinch=null;
svg.addEventListener('pointerdown',e=>{cancelAnimationFrame(fly);svg.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;down=pts.size===1?e.target:null;
  if(pts.size===2){const[p,q]=[...pts.values()];pinch=Math.hypot(p.x-q.x,p.y-q.y)}});
svg.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const pr=pts.get(e.pointerId),c={x:e.clientX,y:e.clientY};
  if(pts.size===1){const dx=c.x-pr.x,dy=c.y-pr.y;moved+=Math.abs(dx)+Math.abs(dy);vb.x-=dx*vb.w/cw();vb.y-=dy*vb.h/ch();apply()}
  pts.set(e.pointerId,c);if(pts.size===2){const[p,q]=[...pts.values()],d=Math.hypot(p.x-q.x,p.y-q.y),r=svg.getBoundingClientRect();if(pinch)zoomAt((p.x+q.x)/2-r.left,(p.y+q.y)/2-r.top,pinch/d);pinch=d;moved=99}});
svg.addEventListener('pointerup',e=>{
  if(pts.size===1&&moved<8&&down){const hr=down.closest&&down.closest('[data-href]');if(hr)window.open(hr.dataset.href,'_blank','noopener')}
  pts.delete(e.pointerId);if(pts.size<2)pinch=null});
svg.addEventListener('pointercancel',e=>{pts.delete(e.pointerId);pinch=null});
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(e.deltaY*(e.ctrlKey?.012:.0016)))},{passive:false});
addEventListener('resize',apply);
document.getElementById('zin').onclick=()=>zoomAt(cw()/2,ch()/2,.6);
document.getElementById('zout').onclick=()=>zoomAt(cw()/2,ch()/2,1.6);
document.getElementById('whole').onclick=()=>{const s=Math.min(cw()/W,ch()/H);flyTo(W/2,H/2,cw()/s)};
document.getElementById('save').onclick=()=>{const c=svg.cloneNode(true);c.setAttribute('viewBox',`0 0 ${W} ${H}`);c.setAttribute('width',W);c.setAttribute('height',H);
  const st=document.createElementNS(NS,'style');st.textContent="text{paint-order:stroke;stroke:#fff;stroke-width:5px}text.nohalo{stroke:none}";c.prepend(st);
  const bl=new Blob([new XMLSerializer().serializeToString(c)],{type:'image/svg+xml'});const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='clef-fourier-systeme.svg';document.body.appendChild(a);a.click();a.remove()};
