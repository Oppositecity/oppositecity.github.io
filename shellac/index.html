<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SHELLAC</title>
<meta name="description" content="Browse public domain 78rpm and cylinder recordings from the Internet Archive, year by year">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'Courier Prime', 'Courier New', monospace;
    background: #000; color: #fff; overflow-x: hidden;
  }
  button, input { font-family: inherit; }
  #app { min-height: 100%; display: flex; flex-direction: column; }

  header { padding: 1.3rem 1.1rem 0.8rem; flex-shrink: 0; }
  h1 { font-size: 1.5rem; font-weight: 400; letter-spacing: 0.32em; color: #fff; }
  .tagline { margin-top: 0.4rem; font-size: 0.72rem; letter-spacing: 0.04em; color: #e0e0e0; line-height: 1.5; }
  .tagline a { color: #fff; }

  .controls { padding: 0 1.1rem; flex-shrink: 0; }

  .search-box {
    display: flex; border: 1px solid #fff; padding: 0.6rem 0.75rem;
    gap: 0.5rem; align-items: center;
  }
  .search-box input {
    flex: 1; background: transparent; border: none; outline: none;
    color: #fff; font-size: 0.9rem; letter-spacing: 0.02em; min-width: 0;
  }
  .search-box input::placeholder { color: #a8a8a8; }
  .search-box button {
    background: transparent; border: none; color: #fff;
    font-size: 0.8rem; letter-spacing: 0.1em; cursor: pointer; flex-shrink: 0;
  }

  /* ---------- source row ---------- */
  .row-label {
    font-size: 0.6rem; letter-spacing: 0.22em; color: #b8b8b8;
    text-transform: uppercase; margin-top: 1.1rem;
  }
  .source-row {
    display: flex; gap: 0.9rem; margin-top: 0.45rem;
    overflow-x: auto; scrollbar-width: none; padding-bottom: 0.15rem;
  }
  .source-row::-webkit-scrollbar { display: none; }
  .source-chip {
    background: transparent; border: none; cursor: pointer; flex-shrink: 0;
    color: #a8a8a8; font-size: 0.72rem; letter-spacing: 0.04em;
    padding: 0.2rem 0; white-space: nowrap;
  }
  .source-chip.active { color: #fff; font-weight: 700; }

  /* ---------- year strip: a histogram you can walk ---------- */
  .year-strip {
    display: flex; align-items: flex-end; gap: 0;
    margin-top: 1.1rem; height: 5.2rem;
    overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x proximity;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .year-strip::-webkit-scrollbar { display: none; }
  .year-btn {
    background: transparent; border: none; cursor: pointer;
    scroll-snap-align: center; flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    width: 1.75rem; height: 100%; padding: 0;
  }
  .year-btn .bar {
    width: 0.62rem; background: #6e6e6e; min-height: 1px;
    transition: height 0.25s ease, background 0.12s;
  }
  .year-btn .ylabel {
    color: #b4b4b4; font-size: 0.6rem; letter-spacing: 0.01em;
    margin-top: 0.35rem; line-height: 1;
    writing-mode: vertical-rl; height: 2.1rem;
  }
  .year-btn.empty .bar { background: #3a3a3a; }
  .year-btn.empty .ylabel { color: #767676; }
  .year-btn.active { width: 3.1rem; }
  .year-btn.active .bar { background: #fff; width: 1.1rem; }
  .year-btn.active .ylabel {
    writing-mode: horizontal-tb; color: #fff; font-size: 0.9rem;
    font-weight: 700; height: 2.1rem; letter-spacing: 0.02em;
  }

  .strip-meta {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 0.8rem; margin-top: 0.55rem;
    font-size: 0.68rem; letter-spacing: 0.05em; color: #d8d8d8;
  }
  #count-line { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .strip-meta button {
    background: transparent; border: none; color: #d8d8d8;
    font-size: 0.66rem; letter-spacing: 0.1em; cursor: pointer;
    text-transform: uppercase; padding: 0.2rem 0; flex-shrink: 0;
  }
  .strip-meta button.on { color: #fff; font-weight: 700; }

  .genre-row { display: none; flex-wrap: wrap; margin-top: 0.6rem; }
  .genre-row.open { display: flex; }
  .genre-chip {
    background: transparent; border: none; cursor: pointer;
    color: #a8a8a8; font-size: 0.7rem; letter-spacing: 0.05em;
    padding: 0.25rem 0; margin-right: 0.85rem;
  }
  .genre-chip.active { color: #fff; font-weight: 700; }

  /* ---------- results ---------- */
  main { flex: 1; padding: 1.1rem 1.1rem 7rem; }
  .status { font-size: 0.78rem; color: #d8d8d8; padding: 1.2rem 0; letter-spacing: 0.04em; }
  .status.err { color: #fff; }
  .retry {
    display: inline-block; margin-top: 0.7rem; background: transparent;
    border: 1px solid #fff; color: #fff; padding: 0.5rem 1rem;
    font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer;
  }

  .track { padding: 0.62rem 0; cursor: pointer; display: flex; gap: 0.7rem; align-items: baseline; }
  .track-mark { width: 0.9rem; flex-shrink: 0; color: #fff; font-size: 0.7rem; }
  .track-info { min-width: 0; flex: 1; }
  .track-title { font-size: 0.9rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-meta { font-size: 0.72rem; color: #c8c8c8; margin-top: 0.15rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track.playing .track-title { font-weight: 700; }

  .list-end { font-size: 0.7rem; color: #d8d8d8; letter-spacing: 0.08em; padding: 1.6rem 0 0.5rem; }
  #sentinel { height: 1px; }

  /* ---------- now playing overlay ---------- */
  #now-playing { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; align-items: center; padding: 1.4rem 1.4rem 1.6rem; z-index: 20; }
  #now-playing.open { display: flex; }
  .np-top { width: 100%; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
  .np-close { background: transparent; border: none; color: #fff; font-size: 0.78rem; letter-spacing: 0.12em; cursor: pointer; padding: 0.4rem; text-transform: uppercase; }
  .np-label { font-size: 0.68rem; letter-spacing: 0.16em; color: #d8d8d8; text-transform: uppercase; }
  .np-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; max-width: 340px; }
  #disc { width: min(50vw, 200px); height: min(50vw, 200px); border-radius: 50%; position: relative; margin-bottom: 1.7rem; flex-shrink: 0; }
  #disc canvas { width: 100%; height: 100%; display: block; }
  #disc.spin { animation: spin 2.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .np-title { font-size: 1.1rem; font-weight: 400; color: #fff; text-align: center; line-height: 1.35; }
  .np-creator { font-size: 0.85rem; color: #e4e4e4; margin-top: 0.45rem; text-align: center; }
  .np-year { font-size: 0.7rem; color: #d8d8d8; letter-spacing: 0.1em; margin-top: 0.6rem; text-align: center; }
  .np-progress { width: 100%; margin-top: 1.7rem; }
  .np-bar { width: 100%; height: 3px; background: #5a5a5a; cursor: pointer; position: relative; }
  .np-bar-fill { height: 100%; background: #fff; width: 0%; }
  .np-times { display: flex; justify-content: space-between; font-size: 0.68rem; color: #d8d8d8; margin-top: 0.45rem; letter-spacing: 0.04em; }
  .np-controls { display: flex; align-items: center; justify-content: center; gap: 2.2rem; margin-top: 1.5rem; }
  .np-controls button { background: transparent; border: none; color: #fff; cursor: pointer; }
  .np-play { font-size: 1.1rem; border: 1px solid #fff !important; width: 3.4rem; height: 3.4rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .np-skip { font-size: 1.3rem; }
  .np-error { font-size: 0.74rem; color: #fff; margin-top: 0.9rem; text-align: center; min-height: 1rem; }

  /* ---------- mini player ---------- */
  #mini { position: fixed; left: 0; right: 0; bottom: 0; display: none; align-items: center; gap: 0.75rem; padding: 0.7rem 1.1rem 1rem; background: #000; z-index: 10; }
  #mini.show { display: flex; }
  #mini button { background: transparent; border: 1px solid #fff; color: #fff; width: 2.2rem; height: 2.2rem; border-radius: 50%; flex-shrink: 0; font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  #mini-info { flex: 1; min-width: 0; cursor: pointer; }
  #mini-title { font-size: 0.8rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #mini-creator { font-size: 0.7rem; color: #c8c8c8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #mini-time { font-size: 0.68rem; color: #d8d8d8; flex-shrink: 0; }

  ::selection { background: #fff; color: #000; }
  a { color: #fff; }
</style>
</head>
<body>

<div id="app">
  <header>
    <h1>SHELLAC</h1>
    <div class="tagline">public domain 78s and cylinders, streamed live from the <a href="https://archive.org" target="_blank" rel="noopener">Internet Archive</a> — browsed year by year</div>
  </header>

  <div class="controls">
    <div class="search-box">
      <input id="search-input" type="text" placeholder="search title, artist, song..." autocomplete="off">
      <button id="search-btn">GO</button>
    </div>

    <div class="row-label">source</div>
    <div class="source-row" id="source-row"></div>

    <div class="year-strip" id="year-strip"></div>

    <div class="strip-meta">
      <span id="count-line"></span>
      <button id="genre-toggle">genres</button>
    </div>

    <div class="genre-row" id="genre-row"></div>
  </div>

  <main id="results">
    <div class="status" id="status">loading...</div>
    <div id="sentinel"></div>
  </main>
</div>

<div id="mini">
  <button id="mini-play">&#9654;</button>
  <div id="mini-info">
    <div id="mini-title">—</div>
    <div id="mini-creator">—</div>
  </div>
  <div id="mini-time">0:00</div>
</div>

<div id="now-playing">
  <div class="np-top">
    <span class="np-label">now playing</span>
    <button class="np-close" id="np-close">close</button>
  </div>
  <div class="np-body">
    <div id="disc"><canvas width="230" height="230"></canvas></div>
    <div class="np-title" id="np-title">—</div>
    <div class="np-creator" id="np-creator">—</div>
    <div class="np-year" id="np-year"></div>

    <div class="np-progress">
      <div class="np-bar" id="np-bar"><div class="np-bar-fill" id="np-bar-fill"></div></div>
      <div class="np-times"><span id="np-elapsed">0:00</span><span id="np-duration">0:00</span></div>
    </div>

    <div class="np-controls">
      <button class="np-skip" id="np-prev">&#10218;&#10218;</button>
      <button class="np-play" id="np-play">&#9654;</button>
      <button class="np-skip" id="np-next">&#10219;&#10219;</button>
    </div>
    <div class="np-error" id="np-error"></div>
  </div>
</div>

<audio id="audio" preload="none"></audio>

<script>
(function () {
  "use strict";

  /* ===============================================================
     JSONP. archive.org sends no CORS headers, so everything is a
     script tag. Fails fast when a script loads without calling back.
  =============================================================== */
  var jsonpCounter = 0;
  function jsonp(url, timeoutMs) {
    return new Promise(function (resolve, reject) {
      var cb = "shellac_cb_" + (jsonpCounter++) + "_" + Date.now();
      var script = document.createElement("script");
      var done = false;
      var timer = setTimeout(function () { fail("timeout"); }, timeoutMs || 12000);

      function cleanup() {
        clearTimeout(timer);
        try { delete window[cb]; } catch (e) { window[cb] = undefined; }
        if (script.parentNode) script.parentNode.removeChild(script);
      }
      function fail(m) { if (done) return; done = true; cleanup(); reject(new Error(m)); }

      window[cb] = function (data) { if (done) return; done = true; cleanup(); resolve(data); };
      script.onerror = function () { fail("network"); };
      script.onload = function () { setTimeout(function () { fail("no-callback"); }, 250); };
      script.src = url + (url.indexOf("?") === -1 ? "?" : "&") + "callback=" + cb;
      document.head.appendChild(script);
    });
  }

  var SEARCH = "https://archive.org/advancedsearch.php";

  /* ===============================================================
     Constants
  =============================================================== */
  var YEAR_MIN = 1890;
  var YEAR_MAX = 1959;
  var BOOT_YEAR = 1929;
  var PAGE_SIZE = 100;
  var MAX_PAGE = 40;
  var BAR_MAX_PX = 46;
  var COUNT_CONCURRENCY = 5;
  var CACHE_VERSION = "v3";
  var CACHE_TTL = 45 * 24 * 3600 * 1000;

  /* The umbrella collection. Its children are fetched at boot so the
     source list is whatever the archive actually holds, not a guess. */
  var UMBRELLA = "78rpm";
  var FALLBACK_SOURCES = [
    { id: "78rpm", label: "everything" },
    { id: "georgeblood", label: "great 78 project" }
  ];
  var MAX_SOURCES = 9;

  var GENRES = [
    { label: "all", subject: null },
    { label: "jazz", subject: "jazz" },
    { label: "blues", subject: "blues" },
    { label: "classical", subject: "classical" },
    { label: "vaudeville", subject: "vaudeville" },
    { label: "dance", subject: "dance music" },
    { label: "folk", subject: "folk music" },
    { label: "hawaiian", subject: "hawaiian" },
    { label: "band", subject: "band music" }
  ];

  var state = {
    source: FALLBACK_SOURCES[0],
    sources: FALLBACK_SOURCES.slice(),
    year: BOOT_YEAR,
    genre: GENRES[0],
    query: "",
    mode: "year",
    tracks: [],
    page: 0,
    numFound: 0,
    exhausted: false,
    loading: false,
    token: 0,
    index: -1
  };

  var counts = {};        // year -> number | null, for the active source
  var countsRun = 0;      // invalidates an in-progress census

  var el = {};
  ["search-input","search-btn","source-row","year-strip","count-line","genre-toggle",
   "genre-row","results","status","sentinel","mini","mini-play","mini-title",
   "mini-creator","mini-time","mini-info","now-playing","np-close","np-title",
   "np-creator","np-year","np-play","np-prev","np-next","np-bar","np-bar-fill",
   "np-elapsed","np-duration","np-error","disc","audio"].forEach(function (id) {
    el[id] = document.getElementById(id);
  });

  function commas(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
  function firstOf(v) { return Array.isArray(v) ? v[0] : v; }
  function cleanTitle(t) { return firstOf(t) || "untitled"; }
  function formatTime(s) {
    if (!isFinite(s) || s < 0) s = 0;
    var m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return m + ":" + (sec < 10 ? "0" : "") + sec;
  }
  function store(key, val) {
    try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), v: val })); } catch (e) {}
  }
  function recall(key) {
    try {
      var raw = localStorage.getItem(key);
      if (!raw) return null;
      var o = JSON.parse(raw);
      if (!o || Date.now() - o.t > CACHE_TTL) return null;
      return o.v;
    } catch (e) { return null; }
  }

  /* ===============================================================
     Disc canvas — ordered-dither groove rings
  =============================================================== */
  (function drawDisc() {
    var c = el["disc"].querySelector("canvas");
    var ctx = c.getContext("2d");
    var size = c.width, r = size / 2;
    ctx.fillStyle = "#000";
    ctx.beginPath(); ctx.arc(r, r, r, 0, Math.PI * 2); ctx.fill();
    var bayer = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
    for (var y = 0; y < size; y++) {
      for (var x = 0; x < size; x++) {
        var dx = x - r, dy = y - r;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > r || dist < r * 0.16) continue;
        var frac = ((dist / r) * 40) % 1;
        if (frac < 0.5 && frac > (bayer[y % 4][x % 4] / 16) * 0.5) {
          ctx.fillStyle = "rgba(255,255,255,0.6)";
          ctx.fillRect(x, y, 1, 1);
        }
      }
    }
    ctx.fillStyle = "#000";
    ctx.beginPath(); ctx.arc(r, r, r * 0.16, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(r, r, r * 0.16, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(r, r, 2, 0, Math.PI * 2); ctx.fillStyle = "#fff"; ctx.fill();
  })();

  /* ===============================================================
     Sources — fetched from the archive itself
  =============================================================== */
  function loadSources() {
    var cached = recall("shellac." + CACHE_VERSION + ".sources");
    if (cached && cached.length) { adoptSources(cached); return; }

    var url = SEARCH +
      "?q=" + encodeURIComponent("mediatype:(collection) AND collection:(" + UMBRELLA + ")") +
      "&fl[]=identifier&fl[]=title" +
      "&rows=40&page=1&sort[]=item_count+desc&output=json";

    jsonp(url).then(function (data) {
      var docs = ((data && data.response && data.response.docs) || [])
        .filter(function (d) { return d && d.identifier; });
      if (!docs.length) return;

      var list = [{ id: UMBRELLA, label: "everything" }];
      var seen = { "78rpm": 1 };
      docs.forEach(function (d) {
        if (list.length >= MAX_SOURCES) return;
        if (seen[d.identifier]) return;
        seen[d.identifier] = 1;
        list.push({ id: d.identifier, label: shortLabel(firstOf(d.title) || d.identifier) });
      });
      store("shellac." + CACHE_VERSION + ".sources", list);
      adoptSources(list);
    }).catch(function () { /* keep the fallback list */ });
  }

  function shortLabel(t) {
    return String(t)
      .replace(/\s*\(.*?\)\s*/g, " ")
      .replace(/\b(Records?|Recordings?|Collection|Digitized by|Archive)\b/gi, " ")
      .replace(/[,.]/g, " ")
      .replace(/\s+/g, " ")
      .trim()
      .toLowerCase()
      .slice(0, 30) || "untitled";
  }

  function adoptSources(list) {
    state.sources = list;
    var keep = null;
    for (var i = 0; i < list.length; i++) if (list[i].id === state.source.id) keep = list[i];
    var prevId = state.source.id;
    state.source = keep || list[0];
    renderSources();
    if (state.source.id !== prevId) { startCensus(); resetAndLoad(); }
  }

  function renderSources() {
    el["source-row"].innerHTML = "";
    state.sources.forEach(function (s) {
      var b = document.createElement("button");
      b.className = "source-chip" + (s.id === state.source.id ? " active" : "");
      b.textContent = s.label;
      b.addEventListener("click", function () {
        if (s.id === state.source.id) return;
        state.source = s;
        renderSources();
        startCensus();
        resetAndLoad();
      });
      el["source-row"].appendChild(b);
    });
  }

  /* ===============================================================
     The census — one count query per year, throttled and cached.
     The year strip is the histogram it produces.
  =============================================================== */
  function startCensus() {
    var run = ++countsRun;
    var key = "shellac." + CACHE_VERSION + ".counts." + state.source.id;
    var cached = recall(key);
    if (cached) { counts = cached; paintYearStrip(false); return; }

    counts = {};
    paintYearStrip(false);

    var queue = [];
    for (var y = YEAR_MIN; y <= YEAR_MAX; y++) queue.push(y);
    var active = 0;
    var collection = state.source.id;

    function pump() {
      while (active < COUNT_CONCURRENCY && queue.length) {
        var y = queue.shift();
        active++;
        countYear(collection, y).then(function (res) {
          if (run !== countsRun) return;
          counts[res.year] = res.n;
          paintYearStrip(false);
        }).catch(function () {}).then(function () {
          active--;
          if (run !== countsRun) return;
          if (queue.length) pump();
          else if (active === 0) {
            store("shellac." + CACHE_VERSION + ".counts." + collection, counts);
            paintYearStrip(false);
            paintCountLine();
          }
        });
      }
    }
    pump();
  }

  function countYear(collection, y) {
    var url = SEARCH +
      "?q=" + encodeURIComponent("mediatype:(audio) AND collection:(" + collection + ") AND year:(" + y + ")") +
      "&fl[]=identifier&rows=1&page=1&output=json";
    return jsonp(url, 20000).then(function (data) {
      var n = (data && data.response && data.response.numFound) || 0;
      return { year: y, n: n };
    });
  }

  /* ===============================================================
     Year strip
  =============================================================== */
  var yearButtons = {};
  (function buildYearStrip() {
    var frag = document.createDocumentFragment();
    for (var y = YEAR_MIN; y <= YEAR_MAX; y++) {
      (function (yy) {
        var b = document.createElement("button");
        b.className = "year-btn";
        var bar = document.createElement("span");
        bar.className = "bar";
        bar.style.height = "1px";
        var lab = document.createElement("span");
        lab.className = "ylabel";
        lab.textContent = yy;
        b.appendChild(bar);
        b.appendChild(lab);
        b.addEventListener("click", function () { selectYear(yy); });
        yearButtons[yy] = b;
        frag.appendChild(b);
      })(y);
    }
    el["year-strip"].appendChild(frag);
  })();

  function maxCount() {
    var m = 0;
    for (var k in counts) if (typeof counts[k] === "number" && counts[k] > m) m = counts[k];
    return m;
  }

  function paintYearStrip(scroll) {
    var m = maxCount();
    for (var y = YEAR_MIN; y <= YEAR_MAX; y++) {
      var btn = yearButtons[y];
      var n = counts[y];
      var known = typeof n === "number";
      var active = (state.mode === "year" && state.year === y);
      btn.className = "year-btn" + (active ? " active" : "") + (known && n === 0 ? " empty" : "");
      // sqrt so the 1920s boom doesn't flatten the rest of the century
      var h = (known && m > 0 && n > 0) ? Math.max(2, Math.round(Math.sqrt(n / m) * BAR_MAX_PX)) : 1;
      btn.firstChild.style.height = h + "px";
      btn.title = known ? y + " \u00b7 " + commas(n) : String(y);
    }
    if (scroll && state.mode === "year" && yearButtons[state.year]) {
      var b = yearButtons[state.year];
      var strip = el["year-strip"];
      strip.scrollTo({
        left: b.offsetLeft - strip.clientWidth / 2 + b.offsetWidth / 2,
        behavior: "smooth"
      });
    }
  }

  function selectYear(y) {
    if (y < YEAR_MIN || y > YEAR_MAX) return;
    state.mode = "year";
    state.year = y;
    state.query = "";
    el["search-input"].value = "";
    paintYearStrip(true);
    resetAndLoad();
  }

  /* nearest year that actually has records, for stepping past gaps */
  function nextPopulated(from, dir) {
    for (var y = from; y >= YEAR_MIN && y <= YEAR_MAX; y += dir) {
      if (counts[y] === undefined || counts[y] > 0) return y;
    }
    return null;
  }

  /* ===============================================================
     Genres
  =============================================================== */
  (function buildGenres() {
    GENRES.forEach(function (g) {
      var b = document.createElement("button");
      b.className = "genre-chip";
      b.textContent = g.label;
      b.addEventListener("click", function () {
        state.genre = g;
        paintGenres();
        resetAndLoad();
      });
      g._btn = b;
      el["genre-row"].appendChild(b);
    });
  })();
  function paintGenres() {
    GENRES.forEach(function (g) {
      g._btn.className = "genre-chip" + (g === state.genre ? " active" : "");
    });
  }
  el["genre-toggle"].addEventListener("click", function () {
    var open = el["genre-row"].classList.toggle("open");
    el["genre-toggle"].classList.toggle("on", open);
  });

  /* ===============================================================
     Query + loading
  =============================================================== */
  function currentQuery() {
    var parts = ["mediatype:(audio)", "collection:(" + state.source.id + ")"];
    if (state.genre.subject) parts.push('subject:("' + state.genre.subject + '")');
    if (state.mode === "search") {
      var q = state.query.trim().replace(/["()]/g, "");
      parts.push("(title:(" + q + ") OR creator:(" + q + "))");
    } else {
      parts.push("year:(" + state.year + ")");
    }
    return parts.join(" AND ");
  }

  function paintCountLine() {
    if (state.mode === "search") {
      el["count-line"].textContent = state.numFound
        ? state.tracks.length + " of " + commas(state.numFound) + (state.exhausted ? "" : " \u00b7 loading")
        : "";
      return;
    }
    var total = counts[state.year];
    var bits = [];
    if (state.numFound) {
      bits.push(state.tracks.length + " of " + commas(state.numFound));
      if (!state.exhausted) bits.push("loading");
    } else if (typeof total === "number") {
      bits.push(commas(total) + " sides");
    }
    bits.push(state.source.label);
    el["count-line"].textContent = bits.join(" \u00b7 ");
  }

  function resetAndLoad() {
    state.token++;
    state.tracks = [];
    state.page = 0;
    state.numFound = 0;
    state.exhausted = false;
    state.loading = false;
    state.index = -1;

    el["results"].innerHTML = "";
    el["results"].appendChild(el["status"]);
    el["results"].appendChild(el["sentinel"]);
    el["status"].className = "status";
    el["status"].style.display = "block";
    el["status"].textContent = state.mode === "search"
      ? "searching..."
      : "loading " + state.year + "...";
    paintCountLine();
    window.scrollTo(0, 0);

    loadNextPage();
  }

  function loadNextPage() {
    if (state.loading || state.exhausted) return;
    var token = state.token;
    var nextPage = state.page + 1;
    if (nextPage > MAX_PAGE) { state.exhausted = true; paintTail(); return; }

    state.loading = true;
    if (state.tracks.length) paintTail();

    var url = SEARCH +
      "?q=" + encodeURIComponent(currentQuery()) +
      "&fl[]=identifier&fl[]=title&fl[]=creator&fl[]=year&fl[]=date" +
      "&rows=" + PAGE_SIZE + "&page=" + nextPage +
      "&sort[]=identifier+asc&output=json";

    jsonp(url).then(function (data) {
      if (token !== state.token) return;
      var resp = (data && data.response) || {};
      var docs = (resp.docs || []).filter(function (d) { return d && d.identifier; });

      state.page = nextPage;
      state.numFound = resp.numFound || state.tracks.length + docs.length;
      var startIdx = state.tracks.length;
      state.tracks = state.tracks.concat(docs);
      state.loading = false;
      if (!docs.length || state.tracks.length >= state.numFound) state.exhausted = true;

      appendTracks(startIdx);
      paintTail();
      requestAnimationFrame(maybeLoadMore);
    }).catch(function () {
      if (token !== state.token) return;
      state.loading = false;
      showError();
    });
  }

  function appendTracks(from) {
    el["status"].style.display = "none";
    var frag = document.createDocumentFragment();
    for (var i = from; i < state.tracks.length; i++) frag.appendChild(buildRow(state.tracks[i], i));
    el["results"].insertBefore(frag, el["sentinel"]);
  }

  function buildRow(t, i) {
    var row = document.createElement("div");
    row.className = "track" + (i === state.index ? " playing" : "");
    row.dataset.i = i;

    var mark = document.createElement("div");
    mark.className = "track-mark";
    mark.textContent = i === state.index ? "\u25B6" : "";

    var info = document.createElement("div");
    info.className = "track-info";
    var title = document.createElement("div");
    title.className = "track-title";
    title.textContent = cleanTitle(t.title);
    var meta = document.createElement("div");
    meta.className = "track-meta";
    var bits = [firstOf(t.creator) || "unknown artist"];
    if (state.mode === "search" && firstOf(t.year)) bits.push(firstOf(t.year));
    meta.textContent = bits.join("  \u00b7  ");
    info.appendChild(title);
    info.appendChild(meta);

    row.appendChild(mark);
    row.appendChild(info);
    row.addEventListener("click", function () { playTrack(i); });
    return row;
  }

  var tailEl = null;
  function paintTail() {
    if (tailEl && tailEl.parentNode) tailEl.parentNode.removeChild(tailEl);
    tailEl = null;
    paintCountLine();

    if (state.loading && state.tracks.length) {
      tailEl = document.createElement("div");
      tailEl.className = "status";
      tailEl.textContent = "...";
    } else if (state.exhausted && state.tracks.length) {
      tailEl = document.createElement("div");
      tailEl.className = "list-end";
      tailEl.textContent = state.page >= MAX_PAGE
        ? "\u2014 first " + commas(state.tracks.length) + " of " + commas(state.numFound) + " \u2014"
        : "\u2014 end of " + (state.mode === "search" ? "results" : state.year) + " \u2014";
    } else if (state.exhausted && !state.tracks.length) {
      el["status"].style.display = "block";
      el["status"].className = "status";
      el["status"].textContent = state.mode === "search"
        ? "nothing found \u2014 try another search"
        : "nothing in " + state.source.label + " for " + state.year + " \u2014 swipe or tap another year";
    }
    if (tailEl) el["results"].insertBefore(tailEl, el["sentinel"]);
  }

  function showError() {
    if (tailEl && tailEl.parentNode) tailEl.parentNode.removeChild(tailEl);
    tailEl = document.createElement("div");
    tailEl.className = "status err";
    tailEl.textContent = state.tracks.length
      ? "the archive stopped responding."
      : "couldn't reach the archive.";
    var btn = document.createElement("button");
    btn.className = "retry";
    btn.textContent = "retry";
    btn.addEventListener("click", function () {
      if (tailEl && tailEl.parentNode) tailEl.parentNode.removeChild(tailEl);
      tailEl = null;
      if (!state.tracks.length) {
        el["status"].style.display = "block";
        el["status"].textContent = "loading...";
      }
      loadNextPage();
    });
    tailEl.appendChild(document.createElement("br"));
    tailEl.appendChild(btn);
    el["status"].style.display = "none";
    el["results"].insertBefore(tailEl, el["sentinel"]);
  }

  function maybeLoadMore() {
    if (state.loading || state.exhausted) return;
    if (el["sentinel"].getBoundingClientRect().top < window.innerHeight + 700) loadNextPage();
  }

  function startInfiniteScroll() {
    if ("IntersectionObserver" in window) {
      new IntersectionObserver(function (e) {
        if (e[0].isIntersecting) loadNextPage();
      }, { rootMargin: "700px 0px" }).observe(el["sentinel"]);
    } else {
      window.addEventListener("scroll", maybeLoadMore, { passive: true });
    }
  }

  /* ===============================================================
     Swipe / keys step years, skipping empty ones
  =============================================================== */
  function stepYear(dir) {
    var target = nextPopulated(state.year + dir, dir);
    if (target !== null) selectYear(target);
  }

  (function swipe() {
    var x0 = null, y0 = null;
    el["results"].addEventListener("touchstart", function (e) {
      if (e.touches.length !== 1) { x0 = null; return; }
      x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
    }, { passive: true });
    el["results"].addEventListener("touchend", function (e) {
      if (x0 === null || state.mode !== "year") return;
      var t = e.changedTouches[0];
      var dx = t.clientX - x0, dy = t.clientY - y0;
      x0 = null;
      if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
      stepYear(dx < 0 ? 1 : -1);
    }, { passive: true });
  })();

  document.addEventListener("keydown", function (e) {
    if (document.activeElement === el["search-input"]) return;
    if (state.mode !== "year") return;
    if (e.key === "ArrowRight") stepYear(1);
    if (e.key === "ArrowLeft") stepYear(-1);
  });

  /* ===============================================================
     Playback
  =============================================================== */
  function markRow(i, on) {
    var row = el["results"].querySelector('.track[data-i="' + i + '"]');
    if (!row) return;
    row.classList.toggle("playing", on);
    var mark = row.querySelector(".track-mark");
    if (mark) mark.textContent = on ? "\u25B6" : "";
  }

  function playTrack(i) {
    var t = state.tracks[i];
    if (!t) return;
    if (state.index >= 0) markRow(state.index, false);
    state.index = i;
    markRow(i, true);

    el["np-error"].textContent = "";
    openNowPlaying(t);

    var token = state.token;
    resolveAudioUrl(t.identifier).then(function (url) {
      if (token !== state.token) return;
      if (!url) { el["np-error"].textContent = "no playable file for this item"; return; }
      el["audio"].src = url;
      el["audio"].play().catch(function () {});
    }).catch(function () {
      el["np-error"].textContent = "couldn't load this recording \u2014 try another";
    });
  }

  function resolveAudioUrl(identifier) {
    return jsonp("https://archive.org/metadata/" + encodeURIComponent(identifier)).then(function (data) {
      var files = (data && data.files) || [];
      var mp3 = null, i;
      for (i = 0; i < files.length; i++) {
        if (files[i].format === "VBR MP3" || files[i].format === "MP3") { mp3 = files[i]; break; }
      }
      if (!mp3) for (i = 0; i < files.length; i++) {
        if (/\.mp3$/i.test(files[i].name || "")) { mp3 = files[i]; break; }
      }
      if (!mp3) for (i = 0; i < files.length; i++) {
        if (/\.(ogg|m4a|flac)$/i.test(files[i].name || "")) { mp3 = files[i]; break; }
      }
      if (!mp3) return null;
      return "https://archive.org/download/" + identifier + "/" + encodeURIComponent(mp3.name);
    });
  }

  function openNowPlaying(t) {
    var creator = firstOf(t.creator) || "unknown artist";
    el["np-title"].textContent = cleanTitle(t.title);
    el["np-creator"].textContent = creator;
    var yr = firstOf(t.year) || (state.mode === "year" ? state.year : "");
    el["np-year"].textContent = [yr, state.source.label].filter(Boolean).join("  \u00b7  ");
    el["mini-title"].textContent = cleanTitle(t.title);
    el["mini-creator"].textContent = creator;
    el["now-playing"].classList.add("open");
    el["mini"].classList.add("show");
  }

  function setPlayingUI(playing) {
    el["np-play"].innerHTML = playing ? "&#10074;&#10074;" : "&#9654;";
    el["mini-play"].innerHTML = playing ? "&#10074;&#10074;" : "&#9654;";
    el["disc"].classList.toggle("spin", playing);
  }

  function togglePlay() {
    if (!el["audio"].src) return;
    if (el["audio"].paused) el["audio"].play().catch(function () {});
    else el["audio"].pause();
  }

  function nextTrack() {
    if (state.index < state.tracks.length - 1) { playTrack(state.index + 1); return; }
    if (!state.exhausted) {
      var want = state.index + 1;
      var token = state.token;
      loadNextPage();
      var tries = 0;
      var iv = setInterval(function () {
        if (token !== state.token || tries++ > 60) { clearInterval(iv); return; }
        if (state.tracks[want]) { clearInterval(iv); playTrack(want); }
        else if (state.exhausted && !state.loading) { clearInterval(iv); rollToNextYear(); }
      }, 200);
      return;
    }
    rollToNextYear();
  }

  function rollToNextYear() {
    if (state.mode !== "year") return;
    var target = nextPopulated(state.year + 1, 1);
    if (target === null) return;
    selectYear(target);
    var token = state.token, tries = 0;
    var iv = setInterval(function () {
      if (token !== state.token || tries++ > 60) { clearInterval(iv); return; }
      if (state.tracks.length) { clearInterval(iv); playTrack(0); }
      else if (state.exhausted && !state.loading) { clearInterval(iv); rollToNextYear(); }
    }, 200);
  }

  function prevTrack() { if (state.index > 0) playTrack(state.index - 1); }

  el["audio"].addEventListener("play", function () { setPlayingUI(true); });
  el["audio"].addEventListener("pause", function () { setPlayingUI(false); });
  el["audio"].addEventListener("ended", nextTrack);
  el["audio"].addEventListener("error", function () {
    if (el["audio"].src) el["np-error"].textContent = "playback error \u2014 try another recording";
  });
  el["audio"].addEventListener("timeupdate", function () {
    var d = el["audio"].duration || 0, c = el["audio"].currentTime || 0;
    el["np-bar-fill"].style.width = (d ? (c / d) * 100 : 0) + "%";
    el["np-elapsed"].textContent = formatTime(c);
    el["np-duration"].textContent = formatTime(d);
    el["mini-time"].textContent = formatTime(c);
  });

  el["np-play"].addEventListener("click", togglePlay);
  el["mini-play"].addEventListener("click", togglePlay);
  el["np-next"].addEventListener("click", nextTrack);
  el["np-prev"].addEventListener("click", prevTrack);
  el["np-close"].addEventListener("click", function () { el["now-playing"].classList.remove("open"); });
  el["mini-info"].addEventListener("click", function () { el["now-playing"].classList.add("open"); });
  el["np-bar"].addEventListener("click", function (e) {
    var rect = el["np-bar"].getBoundingClientRect();
    var pct = (e.clientX - rect.left) / rect.width;
    if (el["audio"].duration) el["audio"].currentTime = pct * el["audio"].duration;
  });

  /* ===============================================================
     Search
  =============================================================== */
  function doSearch() {
    var q = el["search-input"].value.trim();
    if (!q) { selectYear(state.year); return; }
    state.query = q;
    state.mode = "search";
    paintYearStrip(false);
    resetAndLoad();
  }
  el["search-btn"].addEventListener("click", doSearch);
  el["search-input"].addEventListener("keydown", function (e) {
    if (e.key === "Enter") { el["search-input"].blur(); doSearch(); }
  });

  /* ===============================================================
     Deep link: /shellac/#1931 or #georgeblood/1931
  =============================================================== */
  (function readHash() {
    var h = (location.hash || "").replace(/^#/, "");
    if (!h) return;
    var parts = h.split("/");
    var yr = parseInt(parts[parts.length - 1], 10);
    if (parts.length > 1 && parts[0]) state.source = { id: parts[0], label: parts[0] };
    if (yr >= YEAR_MIN && yr <= YEAR_MAX) state.year = yr;
  })();
  function writeHash() {
    var h = "#" + state.source.id + "/" + state.year;
    if (location.hash !== h) history.replaceState(null, "", h);
  }

  /* ===============================================================
     Boot
  =============================================================== */
  paintGenres();
  renderSources();
  paintYearStrip(false);
  loadSources();
  startCensus();
  resetAndLoad();
  startInfiniteScroll();
  window.addEventListener("load", function () { paintYearStrip(true); });
  setInterval(function () { if (state.mode === "year") writeHash(); }, 1500);
})();
</script>
</body>
</html>
