<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SHELLAC</title>
<meta name="description" content="Browse public domain 78rpm recordings from the Internet Archive, year by year">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'Courier Prime', 'Courier New', monospace;
    background: #000; color: #fff; overflow-x: hidden;
  }
  button, input { font-family: inherit; }
  #app { min-height: 100%; display: flex; flex-direction: column; }

  header { padding: 1.4rem 1.1rem 0.9rem; flex-shrink: 0; }
  h1 { font-size: 1.5rem; font-weight: 400; letter-spacing: 0.32em; color: #fff; }
  .tagline { margin-top: 0.4rem; font-size: 0.72rem; letter-spacing: 0.04em; color: #e0e0e0; line-height: 1.5; }
  .tagline a { color: #fff; }

  .controls { padding: 0 1.1rem; flex-shrink: 0; }

  .search-box {
    display: flex; border: 1px solid #fff; padding: 0.6rem 0.75rem;
    gap: 0.5rem; align-items: center;
  }
  .search-box input {
    flex: 1; background: transparent; border: none; outline: none;
    color: #fff; font-size: 0.9rem; letter-spacing: 0.02em; min-width: 0;
  }
  .search-box input::placeholder { color: #a8a8a8; }
  .search-box button {
    background: transparent; border: none; color: #fff;
    font-size: 0.8rem; letter-spacing: 0.1em; cursor: pointer; flex-shrink: 0;
  }

  /* ---------- the single year strip: horizontal, snapping, always visible ---------- */
  .year-strip {
    display: flex; gap: 0.1rem; margin-top: 1.1rem;
    overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding-bottom: 0.2rem;
  }
  .year-strip::-webkit-scrollbar { display: none; }
  .year-btn {
    background: transparent; border: none; cursor: pointer;
    scroll-snap-align: center; flex-shrink: 0;
    color: #a0a0a0; font-size: 0.85rem; letter-spacing: 0.04em;
    padding: 0.3rem 0.5rem; line-height: 1.2;
    transition: color 0.12s, font-size 0.12s;
  }
  .year-btn.active { color: #fff; font-size: 1.5rem; font-weight: 700; padding: 0 0.6rem; }

  .strip-meta {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-top: 0.5rem; font-size: 0.68rem; letter-spacing: 0.05em; color: #d0d0d0;
  }
  .strip-meta button {
    background: transparent; border: none; color: #d0d0d0;
    font-size: 0.68rem; letter-spacing: 0.08em; cursor: pointer;
    text-transform: uppercase; padding: 0.2rem 0;
  }
  .strip-meta button.on { color: #fff; }

  .genre-row { display: none; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.7rem; }
  .genre-row.open { display: flex; }
  .genre-chip {
    background: transparent; border: none; cursor: pointer;
    color: #a0a0a0; font-size: 0.68rem; letter-spacing: 0.06em;
    text-transform: lowercase; padding: 0.25rem 0;
    margin-right: 0.55rem;
  }
  .genre-chip.active { color: #fff; font-weight: 700; }

  /* ---------- results ---------- */
  main { flex: 1; padding: 1.1rem 1.1rem 7rem; }
  .status { font-size: 0.78rem; color: #d0d0d0; padding: 1.2rem 0; letter-spacing: 0.04em; }
  .status.err { color: #fff; }
  .retry {
    display: inline-block; margin-top: 0.7rem; background: transparent;
    border: 1px solid #fff; color: #fff; padding: 0.5rem 1rem;
    font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer;
  }

  .track { padding: 0.62rem 0; cursor: pointer; display: flex; gap: 0.7rem; align-items: baseline; }
  .track-mark { width: 0.9rem; flex-shrink: 0; color: #fff; font-size: 0.7rem; }
  .track-info { min-width: 0; flex: 1; }
  .track-title { font-size: 0.9rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-meta { font-size: 0.72rem; color: #c4c4c4; margin-top: 0.15rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track.playing .track-title { font-weight: 700; }

  .list-end { font-size: 0.7rem; color: #d0d0d0; letter-spacing: 0.08em; padding: 1.6rem 0 0.5rem; }
  #sentinel { height: 1px; }

  /* ---------- now playing overlay ---------- */
  #now-playing { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; align-items: center; padding: 1.4rem 1.4rem 1.6rem; z-index: 20; }
  #now-playing.open { display: flex; }
  .np-top { width: 100%; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
  .np-close { background: transparent; border: none; color: #fff; font-size: 0.78rem; letter-spacing: 0.12em; cursor: pointer; padding: 0.4rem; text-transform: uppercase; }
  .np-label { font-size: 0.68rem; letter-spacing: 0.16em; color: #d0d0d0; text-transform: uppercase; }
  .np-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; max-width: 340px; }
  #disc { width: min(52vw, 210px); height: min(52vw, 210px); border-radius: 50%; position: relative; margin-bottom: 1.8rem; flex-shrink: 0; }
  #disc canvas { width: 100%; height: 100%; display: block; }
  #disc.spin { animation: spin 2.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .np-title { font-size: 1.1rem; font-weight: 400; color: #fff; text-align: center; line-height: 1.35; }
  .np-creator { font-size: 0.85rem; color: #e0e0e0; margin-top: 0.45rem; text-align: center; }
  .np-year { font-size: 0.7rem; color: #d0d0d0; letter-spacing: 0.1em; margin-top: 0.6rem; }
  .np-progress { width: 100%; margin-top: 1.8rem; }
  .np-bar { width: 100%; height: 3px; background: #555; cursor: pointer; position: relative; }
  .np-bar-fill { height: 100%; background: #fff; width: 0%; }
  .np-times { display: flex; justify-content: space-between; font-size: 0.68rem; color: #d0d0d0; margin-top: 0.45rem; letter-spacing: 0.04em; }
  .np-controls { display: flex; align-items: center; justify-content: center; gap: 2.2rem; margin-top: 1.6rem; }
  .np-controls button { background: transparent; border: none; color: #fff; cursor: pointer; }
  .np-play { font-size: 1.1rem; border: 1px solid #fff !important; width: 3.4rem; height: 3.4rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .np-skip { font-size: 1.3rem; }
  .np-error { font-size: 0.74rem; color: #fff; margin-top: 1rem; text-align: center; min-height: 1rem; }

  /* ---------- mini player ---------- */
  #mini { position: fixed; left: 0; right: 0; bottom: 0; display: none; align-items: center; gap: 0.75rem; padding: 0.7rem 1.1rem 1rem; background: #000; z-index: 10; }
  #mini.show { display: flex; }
  #mini button { background: transparent; border: 1px solid #fff; color: #fff; width: 2.2rem; height: 2.2rem; border-radius: 50%; flex-shrink: 0; font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  #mini-info { flex: 1; min-width: 0; cursor: pointer; }
  #mini-title { font-size: 0.8rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #mini-creator { font-size: 0.7rem; color: #c4c4c4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #mini-time { font-size: 0.68rem; color: #d0d0d0; flex-shrink: 0; }

  ::selection { background: #fff; color: #000; }
  a { color: #fff; }
</style>
</head>
<body>

<div id="app">
  <header>
    <h1>SHELLAC</h1>
    <div class="tagline">public domain 78s, streamed live from the <a href="https://archive.org" target="_blank" rel="noopener">Internet Archive</a> — browsed year by year</div>
  </header>

  <div class="controls">
    <div class="search-box">
      <input id="search-input" type="text" placeholder="search title, artist, song..." autocomplete="off">
      <button id="search-btn">GO</button>
    </div>

    <div class="year-strip" id="year-strip"></div>

    <div class="strip-meta">
      <span id="count-line"></span>
      <button id="genre-toggle">genres</button>
    </div>

    <div class="genre-row" id="genre-row"></div>
  </div>

  <main id="results">
    <div class="status" id="status">loading...</div>
    <div id="sentinel"></div>
  </main>
</div>

<div id="mini">
  <button id="mini-play">&#9654;</button>
  <div id="mini-info">
    <div id="mini-title">—</div>
    <div id="mini-creator">—</div>
  </div>
  <div id="mini-time">0:00</div>
</div>

<div id="now-playing">
  <div class="np-top">
    <span class="np-label">now playing</span>
    <button class="np-close" id="np-close">close</button>
  </div>
  <div class="np-body">
    <div id="disc"><canvas width="230" height="230"></canvas></div>
    <div class="np-title" id="np-title">—</div>
    <div class="np-creator" id="np-creator">—</div>
    <div class="np-year" id="np-year"></div>

    <div class="np-progress">
      <div class="np-bar" id="np-bar"><div class="np-bar-fill" id="np-bar-fill"></div></div>
      <div class="np-times"><span id="np-elapsed">0:00</span><span id="np-duration">0:00</span></div>
    </div>

    <div class="np-controls">
      <button class="np-skip" id="np-prev">&#10218;&#10218;</button>
      <button class="np-play" id="np-play">&#9654;</button>
      <button class="np-skip" id="np-next">&#10219;&#10219;</button>
    </div>
    <div class="np-error" id="np-error"></div>
  </div>
</div>

<audio id="audio" preload="none"></audio>

<script>
(function () {
  "use strict";

  /* ---------------------------------------------------------------
     JSONP — archive.org sends no CORS headers, so every call is a
     script tag. Fails fast: if the script loads but never invokes the
     callback (a malformed / error response), bail immediately rather
     than sitting on a long timeout.
  --------------------------------------------------------------- */
  var jsonpCounter = 0;
  function jsonp(url, timeoutMs) {
    return new Promise(function (resolve, reject) {
      var cb = "shellac_cb_" + (jsonpCounter++) + "_" + Date.now();
      var script = document.createElement("script");
      var done = false;
      var timer = setTimeout(function () { fail("timeout"); }, timeoutMs || 12000);

      function cleanup() {
        clearTimeout(timer);
        try { delete window[cb]; } catch (e) { window[cb] = undefined; }
        if (script.parentNode) script.parentNode.removeChild(script);
      }
      function fail(msg) { if (done) return; done = true; cleanup(); reject(new Error(msg)); }

      window[cb] = function (data) { if (done) return; done = true; cleanup(); resolve(data); };
      script.onerror = function () { fail("network"); };
      script.onload = function () {
        // if the callback already fired, done === true and this no-ops
        setTimeout(function () { fail("no-callback"); }, 250);
      };
      script.src = url + (url.indexOf("?") === -1 ? "?" : "&") + "callback=" + cb;
      document.head.appendChild(script);
    });
  }

  /* ---------------------------------------------------------------
     Constants
  --------------------------------------------------------------- */
  var YEAR_MIN = 1900;
  var YEAR_MAX = 1959;
  var BOOT_YEAR = 1929;
  var PAGE_SIZE = 100;
  var MAX_PAGE = 40;       // advancedsearch rejects deep paging; 4000 items is plenty

  var GENRES = [
    { label: "all", subject: null },
    { label: "jazz", subject: "jazz" },
    { label: "blues", subject: "blues" },
    { label: "classical", subject: "classical" },
    { label: "vaudeville", subject: "vaudeville" },
    { label: "dance", subject: "dance music" },
    { label: "folk", subject: "folk music" },
    { label: "hawaiian", subject: "hawaiian" },
    { label: "band", subject: "band music" }
  ];

  var state = {
    year: BOOT_YEAR,
    genre: GENRES[0],
    query: "",
    mode: "year",      // 'year' | 'search'
    tracks: [],
    page: 0,           // last page successfully fetched
    numFound: 0,
    exhausted: false,
    loading: false,
    token: 0,          // invalidates in-flight requests when the query changes
    index: -1
  };

  var el = {};
  ["search-input","search-btn","year-strip","count-line","genre-toggle","genre-row",
   "results","status","sentinel","mini","mini-play","mini-title","mini-creator",
   "mini-time","mini-info","now-playing","np-close","np-title","np-creator","np-year",
   "np-play","np-prev","np-next","np-bar","np-bar-fill","np-elapsed","np-duration",
   "np-error","disc","audio"].forEach(function (id) {
    el[id] = document.getElementById(id);
  });

  /* ---------------------------------------------------------------
     Disc canvas — ordered-dither groove rings
  --------------------------------------------------------------- */
  (function drawDisc() {
    var c = el["disc"].querySelector("canvas");
    var ctx = c.getContext("2d");
    var size = c.width, r = size / 2;
    ctx.fillStyle = "#000";
    ctx.beginPath(); ctx.arc(r, r, r, 0, Math.PI * 2); ctx.fill();
    var bayer = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
    for (var y = 0; y < size; y++) {
      for (var x = 0; x < size; x++) {
        var dx = x - r, dy = y - r;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > r || dist < r * 0.16) continue;
        var ring = (dist / r) * 40;
        var frac = ring - Math.floor(ring);
        var threshold = bayer[y % 4][x % 4] / 16;
        if (frac < 0.5 && frac > threshold * 0.5) {
          ctx.fillStyle = "rgba(255,255,255,0.6)";
          ctx.fillRect(x, y, 1, 1);
        }
      }
    }
    ctx.fillStyle = "#000";
    ctx.beginPath(); ctx.arc(r, r, r * 0.16, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(r, r, r * 0.16, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(r, r, 2, 0, Math.PI * 2); ctx.fillStyle = "#fff"; ctx.fill();
  })();

  /* ---------------------------------------------------------------
     Year strip — one control, snaps, centres the active year
  --------------------------------------------------------------- */
  var yearButtons = {};
  (function buildYearStrip() {
    var frag = document.createDocumentFragment();
    for (var y = YEAR_MIN; y <= YEAR_MAX; y++) {
      (function (yy) {
        var b = document.createElement("button");
        b.className = "year-btn";
        b.textContent = yy;
        b.addEventListener("click", function () { selectYear(yy); });
        yearButtons[yy] = b;
        frag.appendChild(b);
      })(y);
    }
    el["year-strip"].appendChild(frag);
  })();

  function paintYearStrip(scroll) {
    for (var y = YEAR_MIN; y <= YEAR_MAX; y++) {
      var active = (state.mode === "year" && state.year === y);
      yearButtons[y].className = "year-btn" + (active ? " active" : "");
    }
    if (scroll && state.mode === "year" && yearButtons[state.year]) {
      var btn = yearButtons[state.year];
      var strip = el["year-strip"];
      strip.scrollTo({
        left: btn.offsetLeft - strip.clientWidth / 2 + btn.offsetWidth / 2,
        behavior: "smooth"
      });
    }
  }

  function selectYear(y) {
    if (y < YEAR_MIN || y > YEAR_MAX) return;
    state.mode = "year";
    state.year = y;
    state.query = "";
    el["search-input"].value = "";
    paintYearStrip(true);
    resetAndLoad();
  }

  /* ---------------------------------------------------------------
     Genres — hidden behind one word, not a permanent strip
  --------------------------------------------------------------- */
  (function buildGenres() {
    GENRES.forEach(function (g) {
      var b = document.createElement("button");
      b.className = "genre-chip";
      b.textContent = g.label;
      b.addEventListener("click", function () {
        state.genre = g;
        paintGenres();
        resetAndLoad();
      });
      g._btn = b;
      el["genre-row"].appendChild(b);
    });
  })();
  function paintGenres() {
    GENRES.forEach(function (g) {
      g._btn.className = "genre-chip" + (g === state.genre ? " active" : "");
    });
  }
  el["genre-toggle"].addEventListener("click", function () {
    var open = el["genre-row"].classList.toggle("open");
    el["genre-toggle"].classList.toggle("on", open);
  });

  /* ---------------------------------------------------------------
     Query building
  --------------------------------------------------------------- */
  function currentQuery() {
    var parts = ["mediatype:(audio)", "collection:(georgeblood)"];
    if (state.genre.subject) parts.push('subject:("' + state.genre.subject + '")');
    if (state.mode === "search") {
      var q = state.query.trim().replace(/["()]/g, "");
      parts.push("(title:(" + q + ") OR creator:(" + q + "))");
    } else {
      parts.push("year:(" + state.year + ")");
    }
    return parts.join(" AND ");
  }

  /* ---------------------------------------------------------------
     Loading — page-based (advancedsearch.php pages on &page=, NOT
     &start=), one page at a time, appended not rebuilt.
  --------------------------------------------------------------- */
  function resetAndLoad() {
    state.token++;
    state.tracks = [];
    state.page = 0;
    state.numFound = 0;
    state.exhausted = false;
    state.loading = false;
    state.index = -1;

    el["results"].innerHTML = "";
    el["results"].appendChild(el["status"]);
    el["results"].appendChild(el["sentinel"]);
    el["status"].className = "status";
    el["status"].style.display = "block";
    el["status"].textContent = state.mode === "search"
      ? "searching..."
      : "loading " + state.year + "...";
    el["count-line"].textContent = "";
    window.scrollTo(0, 0);

    loadNextPage();
  }

  function loadNextPage() {
    if (state.loading || state.exhausted) return;
    var token = state.token;
    var nextPage = state.page + 1;
    if (nextPage > MAX_PAGE) { state.exhausted = true; paintTail(); return; }

    state.loading = true;
    if (state.tracks.length) paintTail();

    var url = "https://archive.org/advancedsearch.php" +
      "?q=" + encodeURIComponent(currentQuery()) +
      "&fl[]=identifier&fl[]=title&fl[]=creator&fl[]=year" +
      "&rows=" + PAGE_SIZE +
      "&page=" + nextPage +
      "&sort[]=identifier+asc" +
      "&output=json";

    jsonp(url).then(function (data) {
      if (token !== state.token) return;   // year changed mid-flight — drop it
      var resp = (data && data.response) || {};
      var docs = (resp.docs || []).filter(function (d) { return d && d.identifier; });

      state.page = nextPage;
      state.numFound = resp.numFound || state.tracks.length + docs.length;
      var startIdx = state.tracks.length;
      state.tracks = state.tracks.concat(docs);
      state.loading = false;
      if (!docs.length || state.tracks.length >= state.numFound) state.exhausted = true;

      appendTracks(startIdx);
      paintTail();
      // if the first page didn't fill the viewport, keep pulling
      requestAnimationFrame(maybeLoadMore);
    }).catch(function () {
      if (token !== state.token) return;
      state.loading = false;
      showError();
    });
  }

  function appendTracks(from) {
    el["status"].style.display = "none";
    var frag = document.createDocumentFragment();
    for (var i = from; i < state.tracks.length; i++) {
      frag.appendChild(buildRow(state.tracks[i], i));
    }
    el["results"].insertBefore(frag, el["sentinel"]);
  }

  function buildRow(t, i) {
    var row = document.createElement("div");
    row.className = "track" + (i === state.index ? " playing" : "");
    row.dataset.i = i;

    var mark = document.createElement("div");
    mark.className = "track-mark";
    mark.textContent = i === state.index ? "\u25B6" : "";

    var info = document.createElement("div");
    info.className = "track-info";
    var title = document.createElement("div");
    title.className = "track-title";
    title.textContent = cleanTitle(t.title);
    var meta = document.createElement("div");
    meta.className = "track-meta";
    meta.textContent = firstOf(t.creator) || "unknown artist";
    info.appendChild(title);
    info.appendChild(meta);

    row.appendChild(mark);
    row.appendChild(info);
    row.addEventListener("click", function () { playTrack(i); });
    return row;
  }

  /* the tail is the only thing repainted — never the whole list */
  var tailEl = null;
  function paintTail() {
    if (tailEl && tailEl.parentNode) tailEl.parentNode.removeChild(tailEl);
    tailEl = null;

    if (state.numFound) {
      el["count-line"].textContent = state.exhausted
        ? state.tracks.length + " of " + state.numFound
        : state.tracks.length + " of " + state.numFound + " \u00b7 loading";
    }

    if (state.loading && state.tracks.length) {
      tailEl = document.createElement("div");
      tailEl.className = "status";
      tailEl.textContent = "...";
    } else if (state.exhausted && state.tracks.length) {
      tailEl = document.createElement("div");
      tailEl.className = "list-end";
      tailEl.textContent = state.page >= MAX_PAGE
        ? "\u2014 first " + state.tracks.length + " of " + state.numFound + " \u2014"
        : "\u2014 end of " + (state.mode === "search" ? "results" : state.year) + " \u2014";
    } else if (state.exhausted && !state.tracks.length) {
      el["status"].style.display = "block";
      el["status"].className = "status";
      el["status"].textContent = state.mode === "search"
        ? "nothing found \u2014 try another search"
        : "nothing catalogued for " + state.year + " \u2014 swipe or tap another year";
    }
    if (tailEl) el["results"].insertBefore(tailEl, el["sentinel"]);
  }

  function showError() {
    if (tailEl && tailEl.parentNode) tailEl.parentNode.removeChild(tailEl);
    tailEl = document.createElement("div");
    tailEl.className = "status err";
    tailEl.textContent = state.tracks.length
      ? "the archive stopped responding."
      : "couldn't reach the archive.";
    var btn = document.createElement("button");
    btn.className = "retry";
    btn.textContent = "retry";
    btn.addEventListener("click", function () {
      if (tailEl && tailEl.parentNode) tailEl.parentNode.removeChild(tailEl);
      tailEl = null;
      if (!state.tracks.length) {
        el["status"].style.display = "block";
        el["status"].textContent = "loading...";
      }
      loadNextPage();
    });
    tailEl.appendChild(document.createElement("br"));
    tailEl.appendChild(btn);
    el["status"].style.display = "none";
    el["results"].insertBefore(tailEl, el["sentinel"]);
  }

  /* ---------------------------------------------------------------
     Infinite scroll
  --------------------------------------------------------------- */
  function maybeLoadMore() {
    if (state.loading || state.exhausted) return;
    var rect = el["sentinel"].getBoundingClientRect();
    if (rect.top < window.innerHeight + 700) loadNextPage();
  }

  function startInfiniteScroll() {
    if ("IntersectionObserver" in window) {
      new IntersectionObserver(function (entries) {
        if (entries[0].isIntersecting) loadNextPage();
      }, { rootMargin: "700px 0px" }).observe(el["sentinel"]);
    } else {
      window.addEventListener("scroll", maybeLoadMore, { passive: true });
    }
  }

  /* ---------------------------------------------------------------
     Swipe the results area to step years
  --------------------------------------------------------------- */
  (function swipe() {
    var x0 = null, y0 = null;
    el["results"].addEventListener("touchstart", function (e) {
      if (e.touches.length !== 1) { x0 = null; return; }
      x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
    }, { passive: true });
    el["results"].addEventListener("touchend", function (e) {
      if (x0 === null || state.mode !== "year") return;
      var t = e.changedTouches[0];
      var dx = t.clientX - x0, dy = t.clientY - y0;
      x0 = null;
      if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
      selectYear(state.year + (dx < 0 ? 1 : -1));
    }, { passive: true });
  })();

  document.addEventListener("keydown", function (e) {
    if (document.activeElement === el["search-input"]) return;
    if (state.mode !== "year") return;
    if (e.key === "ArrowRight") selectYear(state.year + 1);
    if (e.key === "ArrowLeft") selectYear(state.year - 1);
  });

  /* ---------------------------------------------------------------
     Helpers
  --------------------------------------------------------------- */
  function firstOf(v) { return Array.isArray(v) ? v[0] : v; }
  function cleanTitle(t) { return firstOf(t) || "untitled"; }
  function formatTime(s) {
    if (!isFinite(s) || s < 0) s = 0;
    var m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return m + ":" + (sec < 10 ? "0" : "") + sec;
  }

  /* ---------------------------------------------------------------
     Playback
  --------------------------------------------------------------- */
  function markRow(i, on) {
    var row = el["results"].querySelector('.track[data-i="' + i + '"]');
    if (!row) return;
    row.classList.toggle("playing", on);
    var mark = row.querySelector(".track-mark");
    if (mark) mark.textContent = on ? "\u25B6" : "";
  }

  function playTrack(i) {
    var t = state.tracks[i];
    if (!t) return;
    if (state.index >= 0) markRow(state.index, false);
    state.index = i;
    markRow(i, true);

    el["np-error"].textContent = "";
    openNowPlaying(t);

    var token = state.token;
    resolveAudioUrl(t.identifier).then(function (url) {
      if (token !== state.token) return;
      if (!url) { el["np-error"].textContent = "no playable file for this item"; return; }
      el["audio"].src = url;
      el["audio"].play().catch(function () {});
    }).catch(function () {
      el["np-error"].textContent = "couldn't load this recording \u2014 try another";
    });
  }

  function resolveAudioUrl(identifier) {
    return jsonp("https://archive.org/metadata/" + encodeURIComponent(identifier)).then(function (data) {
      var files = (data && data.files) || [];
      var mp3 = null;
      for (var i = 0; i < files.length; i++) {
        if (files[i].format === "VBR MP3" || files[i].format === "MP3") { mp3 = files[i]; break; }
      }
      if (!mp3) {
        for (var j = 0; j < files.length; j++) {
          if (/\.mp3$/i.test(files[j].name || "")) { mp3 = files[j]; break; }
        }
      }
      if (!mp3) return null;
      return "https://archive.org/download/" + identifier + "/" + encodeURIComponent(mp3.name);
    });
  }

  function openNowPlaying(t) {
    var creator = firstOf(t.creator) || "unknown artist";
    el["np-title"].textContent = cleanTitle(t.title);
    el["np-creator"].textContent = creator;
    el["np-year"].textContent = firstOf(t.year) || (state.mode === "year" ? state.year : "");
    el["mini-title"].textContent = cleanTitle(t.title);
    el["mini-creator"].textContent = creator;
    el["now-playing"].classList.add("open");
    el["mini"].classList.add("show");
  }

  function setPlayingUI(playing) {
    el["np-play"].innerHTML = playing ? "&#10074;&#10074;" : "&#9654;";
    el["mini-play"].innerHTML = playing ? "&#10074;&#10074;" : "&#9654;";
    el["disc"].classList.toggle("spin", playing);
  }

  function togglePlay() {
    if (!el["audio"].src) return;
    if (el["audio"].paused) el["audio"].play().catch(function () {});
    else el["audio"].pause();
  }

  function nextTrack() {
    if (state.index < state.tracks.length - 1) { playTrack(state.index + 1); return; }
    if (!state.exhausted) {
      // pull the next page, then continue playing into it
      var want = state.index + 1;
      var token = state.token;
      loadNextPage();
      var tries = 0;
      var iv = setInterval(function () {
        if (token !== state.token || tries++ > 60) { clearInterval(iv); return; }
        if (state.tracks[want]) { clearInterval(iv); playTrack(want); }
        else if (state.exhausted && !state.loading) { clearInterval(iv); rollToNextYear(); }
      }, 200);
      return;
    }
    rollToNextYear();
  }

  function rollToNextYear() {
    if (state.mode !== "year" || state.year >= YEAR_MAX) return;
    var token;
    selectYear(state.year + 1);
    token = state.token;
    var tries = 0;
    var iv = setInterval(function () {
      if (token !== state.token || tries++ > 60) { clearInterval(iv); return; }
      if (state.tracks.length) { clearInterval(iv); playTrack(0); }
      else if (state.exhausted && !state.loading) { clearInterval(iv); rollToNextYear(); }
    }, 200);
  }

  function prevTrack() { if (state.index > 0) playTrack(state.index - 1); }

  el["audio"].addEventListener("play", function () { setPlayingUI(true); });
  el["audio"].addEventListener("pause", function () { setPlayingUI(false); });
  el["audio"].addEventListener("ended", nextTrack);
  el["audio"].addEventListener("error", function () {
    if (el["audio"].src) el["np-error"].textContent = "playback error \u2014 try another recording";
  });
  el["audio"].addEventListener("timeupdate", function () {
    var d = el["audio"].duration || 0, c = el["audio"].currentTime || 0;
    el["np-bar-fill"].style.width = (d ? (c / d) * 100 : 0) + "%";
    el["np-elapsed"].textContent = formatTime(c);
    el["np-duration"].textContent = formatTime(d);
    el["mini-time"].textContent = formatTime(c);
  });

  el["np-play"].addEventListener("click", togglePlay);
  el["mini-play"].addEventListener("click", togglePlay);
  el["np-next"].addEventListener("click", nextTrack);
  el["np-prev"].addEventListener("click", prevTrack);
  el["np-close"].addEventListener("click", function () { el["now-playing"].classList.remove("open"); });
  el["mini-info"].addEventListener("click", function () { el["now-playing"].classList.add("open"); });
  el["np-bar"].addEventListener("click", function (e) {
    var rect = el["np-bar"].getBoundingClientRect();
    var pct = (e.clientX - rect.left) / rect.width;
    if (el["audio"].duration) el["audio"].currentTime = pct * el["audio"].duration;
  });

  /* ---------------------------------------------------------------
     Search
  --------------------------------------------------------------- */
  function doSearch() {
    var q = el["search-input"].value.trim();
    if (!q) { selectYear(state.year); return; }
    state.query = q;
    state.mode = "search";
    paintYearStrip(false);
    resetAndLoad();
  }
  el["search-btn"].addEventListener("click", doSearch);
  el["search-input"].addEventListener("keydown", function (e) {
    if (e.key === "Enter") { el["search-input"].blur(); doSearch(); }
  });

  /* ---------------------------------------------------------------
     Boot
  --------------------------------------------------------------- */
  paintGenres();
  paintYearStrip(false);
  window.addEventListener("load", function () { paintYearStrip(true); });
  resetAndLoad();
  startInfiniteScroll();
})();
</script>
</body>
</html>
