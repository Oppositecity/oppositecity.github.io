<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SHELLAC</title>
<meta name="description" content="Browse public domain 78rpm recordings from the Internet Archive, year by year">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { font-family: 'Courier Prime', 'Courier New', monospace; background: #000; color: #fff; overflow-x: hidden; }
  button, input { font-family: inherit; }
  #app { min-height: 100%; display: flex; flex-direction: column; }

  header { padding: 1.4rem 1.1rem 1rem; flex-shrink: 0; }
  h1 { font-size: 1.5rem; font-weight: 400; letter-spacing: 0.32em; color: #fff; }
  .tagline { margin-top: 0.35rem; font-size: 0.72rem; letter-spacing: 0.05em; color: #cfcfcf; }
  .tagline a { color: #cfcfcf; }

  .controls { padding: 0 1.1rem 0.9rem; flex-shrink: 0; }
  .search-box { display: flex; border: 1px solid #fff; padding: 0.55rem 0.7rem; gap: 0.5rem; align-items: center; }
  .search-box input { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 0.9rem; letter-spacing: 0.02em; }
  .search-box input::placeholder { color: #8a8a8a; }
  .search-box button { background: transparent; border: none; color: #cfcfcf; font-size: 0.85rem; cursor: pointer; }

  /* ---------- decade accordion: primary chronological navigation ---------- */
  .decade-rail { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.9rem; }
  .decade-chip {
    background: transparent; border: 1px solid #555; color: #cfcfcf;
    font-size: 0.72rem; letter-spacing: 0.05em; padding: 0.42rem 0.7rem;
    cursor: pointer; white-space: nowrap;
  }
  .decade-chip.open { border-color: #fff; color: #fff; }
  .decade-chip.has-selection { border-color: #fff; color: #000; background: #fff; }

  .year-row {
    display: flex; flex-wrap: wrap; gap: 0.3rem;
    margin-top: 0.55rem; padding: 0.6rem; border: 1px dotted #333;
  }
  .year-chip {
    background: transparent; border: 1px solid #444; color: #9a9a9a;
    font-size: 0.68rem; padding: 0.32rem 0.55rem; cursor: pointer;
  }
  .year-chip.active { border-color: #fff; color: #000; background: #fff; }

  .genre-row { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.65rem; }
  .genre-chip {
    background: transparent; border: 1px solid #3a3a3a; color: #9a9a9a;
    font-size: 0.63rem; letter-spacing: 0.05em; text-transform: uppercase;
    padding: 0.28rem 0.55rem; cursor: pointer;
  }
  .genre-chip.active { border-color: #fff; color: #fff; }

  /* ---------- current-year header with step arrows ---------- */
  .year-header {
    display: flex; align-items: center; justify-content: center; gap: 0.9rem;
    margin-top: 0.85rem; padding-top: 0.7rem; border-top: 1px dotted #2a2a2a;
  }
  .year-step {
    background: transparent; border: 1px solid #fff; color: #fff;
    width: 1.8rem; height: 1.8rem; font-size: 0.85rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .year-step:disabled { border-color: #444; color: #444; cursor: default; }
  .year-big { font-size: 1rem; letter-spacing: 0.1em; color: #fff; min-width: 3.6rem; text-align: center; }
  .count-line { font-size: 0.66rem; color: #9a9a9a; letter-spacing: 0.03em; text-align: center; margin-top: 0.35rem; }

  /* ---------- results ---------- */
  main { flex: 1; padding: 0.6rem 1.1rem 6rem; overflow-y: auto; }
  .status { font-size: 0.75rem; color: #9a9a9a; padding: 1rem 0; letter-spacing: 0.03em; text-align: center; }
  .track { padding: 0.7rem 0; cursor: pointer; display: flex; justify-content: space-between; gap: 0.8rem; }
  .track + .track { border-top: 1px dotted #2a2a2a; }
  .track-info { min-width: 0; }
  .track-title { font-size: 0.88rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-meta { font-size: 0.72rem; color: #9a9a9a; margin-top: 0.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track.playing .track-title { color: #fff; font-weight: 700; }
  .track.playing .track-meta { color: #cfcfcf; }

  .load-more {
    display: block; width: 100%; margin-top: 1.2rem; padding: 0.75rem;
    background: transparent; border: 1px solid #fff; color: #fff;
    font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer;
  }
  .load-more:disabled { border-color: #444; color: #444; cursor: default; }
  .list-end { font-size: 0.68rem; color: #666; letter-spacing: 0.06em; padding: 1.2rem 0 0.4rem; text-align: center; }

  /* ---------- now playing overlay ---------- */
  #now-playing { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; align-items: center; padding: 1.4rem 1.4rem 1.6rem; z-index: 20; }
  #now-playing.open { display: flex; }
  .np-top { width: 100%; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
  .np-close { background: transparent; border: none; color: #cfcfcf; font-size: 0.85rem; letter-spacing: 0.1em; cursor: pointer; padding: 0.4rem; }
  .np-label { font-size: 0.68rem; letter-spacing: 0.15em; color: #9a9a9a; text-transform: uppercase; }
  .np-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; max-width: 340px; }
  #disc { width: min(58vw, 230px); height: min(58vw, 230px); border-radius: 50%; position: relative; margin-bottom: 2rem; flex-shrink: 0; }
  #disc canvas { width: 100%; height: 100%; display: block; }
  #disc.spin { animation: spin 2.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .np-title { font-size: 1.15rem; font-weight: 400; color: #fff; text-align: center; line-height: 1.35; max-width: 320px; }
  .np-creator { font-size: 0.85rem; color: #cfcfcf; margin-top: 0.4rem; text-align: center; }
  .np-year { font-size: 0.68rem; color: #9a9a9a; letter-spacing: 0.08em; margin-top: 0.55rem; }
  .np-progress { width: 100%; margin-top: 1.8rem; }
  .np-bar { width: 100%; height: 3px; background: #333; cursor: pointer; position: relative; }
  .np-bar-fill { height: 100%; background: #fff; width: 0%; }
  .np-times { display: flex; justify-content: space-between; font-size: 0.68rem; color: #9a9a9a; margin-top: 0.4rem; letter-spacing: 0.03em; }
  .np-controls { display: flex; align-items: center; justify-content: center; gap: 2.2rem; margin-top: 1.6rem; }
  .np-controls button { background: transparent; border: none; color: #fff; cursor: pointer; }
  .np-play { font-size: 1.1rem; border: 1px solid #fff !important; width: 3.4rem; height: 3.4rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .np-skip { font-size: 1.3rem; }
  .np-error { font-size: 0.72rem; color: #cfcfcf; margin-top: 1rem; text-align: center; }

  /* ---------- mini player ---------- */
  #mini { position: fixed; left: 0; right: 0; bottom: 0; display: none; align-items: center; gap: 0.7rem; padding: 0.6rem 1rem; background: #000; border-top: 1px solid #2a2a2a; z-index: 10; }
  #mini.show { display: flex; }
  #mini button { background: transparent; border: 1px solid #fff; color: #fff; width: 2.1rem; height: 2.1rem; border-radius: 50%; flex-shrink: 0; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  #mini-info { flex: 1; min-width: 0; cursor: pointer; }
  #mini-title { font-size: 0.78rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #mini-creator { font-size: 0.68rem; color: #9a9a9a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #mini-time { font-size: 0.65rem; color: #9a9a9a; flex-shrink: 0; }

  ::selection { background: #fff; color: #000; }
  a { color: #fff; }
</style>
</head>
<body>

<div id="app">
  <header>
    <h1>SHELLAC</h1>
    <div class="tagline">public domain 78s, streamed live from the <a href="https://archive.org" target="_blank" rel="noopener">Internet Archive</a> — browsed year by year</div>
  </header>

  <div class="controls">
    <div class="search-box">
      <input id="search-input" type="text" placeholder="search title, artist, song..." autocomplete="off">
      <button id="search-btn">go</button>
    </div>

    <div class="decade-rail" id="decade-rail"></div>
    <div class="year-row" id="year-row" style="display:none"></div>
    <div class="genre-row" id="genre-row"></div>

    <div class="year-header" id="year-header" style="display:none">
      <button class="year-step" id="year-prev">‹</button>
      <div class="year-big" id="year-big">—</div>
      <button class="year-step" id="year-next">›</button>
    </div>
    <div class="count-line" id="count-line"></div>
  </div>

  <main id="results">
    <div class="status" id="status">pick a decade to open its years</div>
  </main>
</div>

<div id="mini">
  <button id="mini-play">▶</button>
  <div id="mini-info">
    <div id="mini-title">—</div>
    <div id="mini-creator">—</div>
  </div>
  <div id="mini-time">0:00</div>
</div>

<div id="now-playing">
  <div class="np-top">
    <span class="np-label">now playing</span>
    <button class="np-close" id="np-close">close</button>
  </div>
  <div class="np-body">
    <div id="disc"><canvas width="230" height="230"></canvas></div>
    <div class="np-title" id="np-title">—</div>
    <div class="np-creator" id="np-creator">—</div>
    <div class="np-year" id="np-year"></div>

    <div class="np-progress">
      <div class="np-bar" id="np-bar"><div class="np-bar-fill" id="np-bar-fill"></div></div>
      <div class="np-times"><span id="np-elapsed">0:00</span><span id="np-duration">0:00</span></div>
    </div>

    <div class="np-controls">
      <button class="np-skip" id="np-prev">⟨⟨</button>
      <button class="np-play" id="np-play">▶</button>
      <button class="np-skip" id="np-next">⟩⟩</button>
    </div>
    <div class="np-error" id="np-error"></div>
  </div>
</div>

<audio id="audio" preload="none"></audio>

<script>
(function () {
  "use strict";

  /* ---------------- JSONP ---------------- */
  var jsonpCounter = 0;
  function jsonp(url) {
    return new Promise(function (resolve, reject) {
      var cbName = "shellac_cb_" + (jsonpCounter++) + "_" + Date.now();
      var script = document.createElement("script");
      var timeout = setTimeout(function () { cleanup(); reject(new Error("timeout")); }, 15000);
      function cleanup() { clearTimeout(timeout); delete window[cbName]; if (script.parentNode) script.parentNode.removeChild(script); }
      window[cbName] = function (data) { cleanup(); resolve(data); };
      var sep = url.indexOf("?") === -1 ? "?" : "&";
      script.src = url + sep + "callback=" + cbName;
      script.onerror = function () { cleanup(); reject(new Error("network")); };
      document.body.appendChild(script);
    });
  }

  /* ---------------- decades, each expanding to its own years ---------------- */
  var DECADES = [
    { label: "1890s", start: 1890, end: 1899 },
    { label: "1900s", start: 1900, end: 1909 },
    { label: "1910s", start: 1910, end: 1919 },
    { label: "1920s", start: 1920, end: 1929 },
    { label: "1930s", start: 1930, end: 1939 },
    { label: "1940s", start: 1940, end: 1949 },
    { label: "1950s", start: 1950, end: 1959 }
  ];
  DECADES.forEach(function (d) {
    d.years = [];
    for (var y = d.start; y <= d.end; y++) d.years.push(y);
  });
  function decadeIndexForYear(y) {
    for (var i = 0; i < DECADES.length; i++) if (y >= DECADES[i].start && y <= DECADES[i].end) return i;
    return 0;
  }

  var GENRES = [
    { label: "all genres", subject: null },
    { label: "jazz", subject: "jazz" },
    { label: "blues", subject: "blues" },
    { label: "classical", subject: "classical" },
    { label: "vaudeville", subject: "vaudeville" },
    { label: "dance", subject: "dance music" },
    { label: "folk", subject: "folk music" },
    { label: "hawaiian", subject: "hawaiian" },
    { label: "band", subject: "band music" }
  ];

  var PAGE_SIZE = 200;
  var AUTO_FETCH_CAP_PAGES = 15; // safety net: auto-fetch up to ~3000 items, then hand off to a manual button

  var state = {
    expandedDecade: null,
    year: null,
    genre: GENRES[0],
    query: "",
    mode: null,          // 'year' | 'search'
    tracks: [],
    start: 0,
    numFound: 0,
    hasMore: false,
    autoFetching: false,
    pagesFetchedThisLoad: 0,
    index: -1,
    playing: false
  };

  var el = {
    searchInput: document.getElementById("search-input"),
    searchBtn: document.getElementById("search-btn"),
    decadeRail: document.getElementById("decade-rail"),
    yearRow: document.getElementById("year-row"),
    genreRow: document.getElementById("genre-row"),
    yearHeader: document.getElementById("year-header"),
    yearPrev: document.getElementById("year-prev"),
    yearNext: document.getElementById("year-next"),
    yearBig: document.getElementById("year-big"),
    countLine: document.getElementById("count-line"),
    results: document.getElementById("results"),
    status: document.getElementById("status"),
    mini: document.getElementById("mini"),
    miniPlay: document.getElementById("mini-play"),
    miniTitle: document.getElementById("mini-title"),
    miniCreator: document.getElementById("mini-creator"),
    miniTime: document.getElementById("mini-time"),
    miniInfo: document.getElementById("mini-info"),
    np: document.getElementById("now-playing"),
    npClose: document.getElementById("np-close"),
    npTitle: document.getElementById("np-title"),
    npCreator: document.getElementById("np-creator"),
    npYear: document.getElementById("np-year"),
    npPlay: document.getElementById("np-play"),
    npPrev: document.getElementById("np-prev"),
    npNext: document.getElementById("np-next"),
    npBar: document.getElementById("np-bar"),
    npBarFill: document.getElementById("np-bar-fill"),
    npElapsed: document.getElementById("np-elapsed"),
    npDuration: document.getElementById("np-duration"),
    npError: document.getElementById("np-error"),
    disc: document.getElementById("disc"),
    audio: document.getElementById("audio")
  };

  /* ---------------- disc canvas (dithered groove rings) ---------------- */
  (function drawDisc() {
    var c = el.disc.querySelector("canvas");
    var ctx = c.getContext("2d");
    var size = c.width, r = size / 2;
    ctx.fillStyle = "#000";
    ctx.beginPath(); ctx.arc(r, r, r, 0, Math.PI * 2); ctx.fill();
    var bayer = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
    for (var y = 0; y < size; y++) {
      for (var x = 0; x < size; x++) {
        var dx = x - r, dy = y - r;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > r || dist < r * 0.16) continue;
        var ring = (dist / r) * 40;
        var frac = ring - Math.floor(ring);
        var threshold = bayer[y % 4][x % 4] / 16;
        if (frac < 0.5 && frac > threshold * 0.5) {
          ctx.fillStyle = "rgba(255,255,255,0.55)";
          ctx.fillRect(x, y, 1, 1);
        }
      }
    }
    ctx.fillStyle = "#000";
    ctx.beginPath(); ctx.arc(r, r, r * 0.16, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(r, r, r * 0.16, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(r, r, 2, 0, Math.PI * 2); ctx.fillStyle = "#fff"; ctx.fill();
  })();

  /* ---------------- decade accordion ---------------- */
  function renderDecadeRail() {
    el.decadeRail.innerHTML = "";
    DECADES.forEach(function (d, i) {
      var b = document.createElement("button");
      var hasSelection = state.mode === "year" && state.year >= d.start && state.year <= d.end;
      b.className = "decade-chip" + (i === state.expandedDecade ? " open" : "") + (hasSelection ? " has-selection" : "");
      b.textContent = d.label;
      b.addEventListener("click", function () { toggleDecade(i); });
      el.decadeRail.appendChild(b);
    });
  }

  function toggleDecade(i) {
    state.expandedDecade = (state.expandedDecade === i) ? null : i;
    renderDecadeRail();
    renderYearRow();
  }

  function renderYearRow() {
    if (state.expandedDecade === null) {
      el.yearRow.style.display = "none";
      el.yearRow.innerHTML = "";
      return;
    }
    var d = DECADES[state.expandedDecade];
    el.yearRow.innerHTML = "";
    el.yearRow.style.display = "flex";
    d.years.forEach(function (y) {
      var b = document.createElement("button");
      b.className = "year-chip" + (state.mode === "year" && state.year === y ? " active" : "");
      b.textContent = y;
      b.addEventListener("click", function () { selectYear(y); });
      el.yearRow.appendChild(b);
    });
  }

  function selectYear(y) {
    state.query = ""; el.searchInput.value = "";
    state.mode = "year";
    state.year = y;
    state.expandedDecade = decadeIndexForYear(y);
    renderDecadeRail();
    renderYearRow();
    renderYearHeader();
    resetAndLoad();
  }

  function renderYearHeader() {
    if (state.mode !== "year") {
      el.yearHeader.style.display = "none";
      return;
    }
    el.yearHeader.style.display = "flex";
    el.yearBig.textContent = state.year;
    el.yearPrev.disabled = state.year <= DECADES[0].start;
    el.yearNext.disabled = state.year >= DECADES[DECADES.length - 1].end;
  }
  el.yearPrev.addEventListener("click", function () { if (state.mode === "year" && state.year > DECADES[0].start) selectYear(state.year - 1); });
  el.yearNext.addEventListener("click", function () { if (state.mode === "year" && state.year < DECADES[DECADES.length - 1].end) selectYear(state.year + 1); });

  /* ---------------- genre row (secondary refinement) ---------------- */
  function renderGenreRow() {
    el.genreRow.innerHTML = "";
    GENRES.forEach(function (g) {
      var b = document.createElement("button");
      b.className = "genre-chip" + (g === state.genre ? " active" : "");
      b.textContent = g.label;
      b.addEventListener("click", function () {
        state.genre = g;
        renderGenreRow();
        if (state.mode) resetAndLoad();
      });
      el.genreRow.appendChild(b);
    });
  }

  /* ---------------- query building ---------------- */
  function buildYearQuery() {
    var parts = ["mediatype:(audio)", "collection:(georgeblood)", "year:(" + state.year + ")"];
    if (state.genre.subject) parts.push('subject:("' + state.genre.subject + '")');
    return parts.join(" AND ");
  }
  function buildSearchQuery() {
    var parts = ["mediatype:(audio)", "collection:(georgeblood)"];
    if (state.genre.subject) parts.push('subject:("' + state.genre.subject + '")');
    var q = state.query.trim().replace(/"/g, "");
    parts.push('(title:(' + q + ') OR creator:(' + q + '))');
    return parts.join(" AND ");
  }
  function currentQuery() { return state.mode === "search" ? buildSearchQuery() : buildYearQuery(); }

  /* ---------------- loading: auto-fetch everything for a single year ---------------- */
  function resetAndLoad() {
    state.tracks = [];
    state.start = 0;
    state.numFound = 0;
    state.hasMore = false;
    state.autoFetching = false;
    state.pagesFetchedThisLoad = 0;
    state.index = -1;

    el.status.style.display = "block";
    el.status.textContent = state.mode === "search" ? "searching..." : "loading " + state.year + "...";
    el.results.innerHTML = "";
    el.results.appendChild(el.status);
    el.countLine.textContent = "";

    autoFetchLoop();
  }

  function fetchOnePage() {
    var fl = "identifier,title,creator,year";
    var url = "https://archive.org/advancedsearch.php?q=" + encodeURIComponent(currentQuery()) +
      "&fl[]=" + fl.split(",").join("&fl[]=") +
      "&rows=" + PAGE_SIZE + "&start=" + state.start +
      "&sort[]=year+asc&sort[]=identifier+asc&output=json";
    return jsonp(url).then(function (data) {
      var resp = data.response || {};
      var docs = (resp.docs || []).filter(function (d) { return d.identifier; });
      state.tracks = state.tracks.concat(docs);
      state.numFound = resp.numFound || state.tracks.length;
      state.start += docs.length;
      state.pagesFetchedThisLoad++;
      state.hasMore = docs.length > 0 && state.start < state.numFound;
      return docs.length;
    });
  }

  function autoFetchLoop() {
    state.autoFetching = true;
    fetchOnePage().then(function () {
      renderResults();
      if (state.hasMore && state.pagesFetchedThisLoad < AUTO_FETCH_CAP_PAGES) {
        autoFetchLoop();
      } else {
        state.autoFetching = false;
        renderResults();
      }
    }).catch(function () {
      state.autoFetching = false;
      if (!state.tracks.length) {
        el.status.textContent = "couldn't reach the archive — try again";
      } else {
        renderResults();
      }
    });
  }

  function loadMoreManually() {
    state.autoFetching = true;
    renderResults();
    fetchOnePage().then(function () {
      state.pagesFetchedThisLoad = 0; // reset the cap window so it can auto-continue again for a while
      autoFetchLoop();
    }).catch(function () { state.autoFetching = false; renderResults(); });
  }

  /* ---------------- results ---------------- */
  function renderResults() {
    el.results.innerHTML = "";

    if (!state.tracks.length && !state.autoFetching) {
      el.status.textContent = state.mode === "search"
        ? "nothing found — try another search"
        : "nothing catalogued for " + state.year + " — try another year";
      el.results.appendChild(el.status);
      el.countLine.textContent = "";
      return;
    }

    if (state.numFound) {
      el.countLine.textContent = state.autoFetching
        ? "loading... " + state.tracks.length + " of " + state.numFound
        : state.tracks.length + " of " + state.numFound + " loaded";
    }

    state.tracks.forEach(function (t, i) {
      var row = document.createElement("div");
      row.className = "track" + (i === state.index ? " playing" : "");
      var creator = t.creator ? (Array.isArray(t.creator) ? t.creator[0] : t.creator) : "unknown artist";
      row.innerHTML =
        '<div class="track-info"><div class="track-title">' + escapeHtml(cleanTitle(t.title)) + '</div>' +
        '<div class="track-meta">' + escapeHtml(creator) + '</div></div>';
      row.addEventListener("click", function () { playTrack(i); });
      el.results.appendChild(row);
    });

    if (state.autoFetching) {
      var loading = document.createElement("div");
      loading.className = "status";
      loading.textContent = "loading more automatically...";
      el.results.appendChild(loading);
    } else if (state.hasMore) {
      var more = document.createElement("button");
      more.className = "load-more";
      more.textContent = "load remaining " + (state.numFound - state.start);
      more.addEventListener("click", loadMoreManually);
      el.results.appendChild(more);
    } else if (state.tracks.length) {
      var end = document.createElement("div");
      end.className = "list-end";
      end.textContent = "— all " + state.numFound + " loaded —";
      el.results.appendChild(end);
    }
  }

  function cleanTitle(t) { if (!t) return "untitled"; return Array.isArray(t) ? t[0] : t; }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* ---------------- playback ---------------- */
  function playTrack(i) {
    state.index = i;
    var t = state.tracks[i];
    if (!t) return;
    el.npError.textContent = "";
    openNowPlaying(t);
    resolveAudioUrl(t.identifier).then(function (url) {
      if (!url) { el.npError.textContent = "no playable audio file found for this item"; return; }
      el.audio.src = url;
      el.audio.play().catch(function () {});
    }).catch(function () { el.npError.textContent = "couldn't load this recording — try another"; });
    renderResults();
  }

  function resolveAudioUrl(identifier) {
    var url = "https://archive.org/metadata/" + encodeURIComponent(identifier);
    return jsonp(url).then(function (data) {
      var files = data.files || [];
      var mp3 = files.find(function (f) { return f.format === "VBR MP3" || f.format === "MP3"; });
      if (!mp3) mp3 = files.find(function (f) { return /\.mp3$/i.test(f.name); });
      if (!mp3) return null;
      return "https://archive.org/download/" + identifier + "/" + encodeURIComponent(mp3.name);
    });
  }

  function openNowPlaying(t) {
    var creator = t.creator ? (Array.isArray(t.creator) ? t.creator[0] : t.creator) : "unknown artist";
    el.npTitle.textContent = cleanTitle(t.title);
    el.npCreator.textContent = creator;
    el.npYear.textContent = t.year || "";
    el.miniTitle.textContent = cleanTitle(t.title);
    el.miniCreator.textContent = creator;
    el.np.classList.add("open");
    el.mini.classList.add("show");
  }

  function formatTime(s) {
    if (!isFinite(s) || s < 0) s = 0;
    var m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return m + ":" + (sec < 10 ? "0" : "") + sec;
  }

  function setPlayingUI(playing) {
    state.playing = playing;
    el.npPlay.textContent = playing ? "❚❚" : "▶";
    el.miniPlay.textContent = playing ? "❚❚" : "▶";
    el.disc.classList.toggle("spin", playing);
  }

  el.audio.addEventListener("play", function () { setPlayingUI(true); });
  el.audio.addEventListener("pause", function () { setPlayingUI(false); });
  el.audio.addEventListener("ended", function () { nextTrack(); });
  el.audio.addEventListener("error", function () { if (el.audio.src) el.npError.textContent = "playback error — try another recording"; });
  el.audio.addEventListener("timeupdate", function () {
    var d = el.audio.duration || 0, c = el.audio.currentTime || 0;
    var pct = d ? (c / d) * 100 : 0;
    el.npBarFill.style.width = pct + "%";
    el.npElapsed.textContent = formatTime(c);
    el.npDuration.textContent = formatTime(d);
    el.miniTime.textContent = formatTime(c);
  });

  function togglePlay() {
    if (!el.audio.src) return;
    if (el.audio.paused) el.audio.play().catch(function () {});
    else el.audio.pause();
  }

  function nextTrack() {
    if (state.index < state.tracks.length - 1) { playTrack(state.index + 1); return; }
    // fully exhausted this year (everything's loaded, since we auto-fetch to completion) — roll to the next year
    if (state.mode === "year" && !state.hasMore && !state.autoFetching && state.year < DECADES[DECADES.length - 1].end) {
      var nextY = state.year + 1;
      selectYear(nextY);
      // queue autoplay of the first track once it loads
      var check = setInterval(function () {
        if (!state.autoFetching && state.tracks.length) {
          clearInterval(check);
          playTrack(0);
        } else if (!state.autoFetching && !state.hasMore && !state.tracks.length) {
          clearInterval(check);
        }
      }, 200);
    }
  }
  function prevTrack() { if (state.index > 0) playTrack(state.index - 1); }

  el.npPlay.addEventListener("click", togglePlay);
  el.miniPlay.addEventListener("click", togglePlay);
  el.npNext.addEventListener("click", nextTrack);
  el.npPrev.addEventListener("click", prevTrack);
  el.npClose.addEventListener("click", function () { el.np.classList.remove("open"); });
  el.miniInfo.addEventListener("click", function () { el.np.classList.add("open"); });
  el.npBar.addEventListener("click", function (e) {
    var rect = el.npBar.getBoundingClientRect();
    var pct = (e.clientX - rect.left) / rect.width;
    if (el.audio.duration) el.audio.currentTime = pct * el.audio.duration;
  });

  function doSearch() {
    state.query = el.searchInput.value;
    if (state.query.trim()) {
      state.mode = "search";
      renderDecadeRail();
      renderYearHeader();
      resetAndLoad();
    }
  }
  el.searchBtn.addEventListener("click", doSearch);
  el.searchInput.addEventListener("keydown", function (e) { if (e.key === "Enter") doSearch(); });

  /* ---------------- boot ---------------- */
  renderGenreRow();
  renderDecadeRail();
  toggleDecade(0);           // open the earliest decade
  selectYear(DECADES[0].start); // and load its first year straight away
})();
</script>
</body>
</html>
