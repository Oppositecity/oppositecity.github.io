<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Language Instrument</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }

  :root{
    --ink:#ffffff;
    --void:#000000;
    --speech:#ffffff;
    --tone:#8fa9ff;
    --couple:#ff8ca8;
    --pulse:#c4a9ff;
    --space:#7fe3d0;
  }

  html,body{ height:100%; }
  body{
    background:var(--void);
    color:var(--ink);
    font-family:'Courier Prime','Courier New',Courier,monospace;
    font-size:16px;
    line-height:1.5;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    padding:18px 16px 14px;
    gap:14px;
  }

  .eyebrow{
    font-size:11px;
    letter-spacing:.34em;
    text-transform:uppercase;
    flex:0 0 auto;
  }

  /* ---------- the typed field: the hero ---------- */
  #stage{
    flex:1 1 auto;
    min-height:0;
    overflow:hidden;
    display:flex;
    align-items:flex-end;
    padding-bottom:4px;
  }
  #line{
    width:100%;
    max-height:100%;
    overflow:hidden;
    font-size:clamp(26px,7.5vw,54px);
    line-height:1.28;
    letter-spacing:.02em;
    word-break:break-word;
    white-space:pre-wrap;
  }
  #line span{
    display:inline-block;
    will-change:transform;
    color:var(--ink);
  }
  #caret{
    display:inline-block;
    width:.55em;
    background:var(--ink);
    color:var(--void);
    animation:blink 1.06s steps(1) infinite;
  }
  @keyframes blink{ 50%{ background:transparent; } }

  /* ---------- input ---------- */
  #box{
    flex:0 0 auto;
    border:2px solid var(--ink);
    padding:10px 12px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  #box .tag{ font-size:11px; letter-spacing:.24em; text-transform:uppercase; }
  #feed{
    flex:1 1 auto;
    background:transparent;
    border:0;
    outline:0;
    color:var(--ink);
    font-family:inherit;
    font-size:16px;
    caret-color:var(--ink);
  }
  #feed::placeholder{ color:var(--ink); opacity:.85; }

  /* ---------- layers ---------- */
  #layers, #presets, #tape{
    flex:0 0 auto;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  #presets .layer{ --c:var(--ink); letter-spacing:.14em; }
  .layer{
    font-family:inherit;
    font-size:12px;
    letter-spacing:.18em;
    text-transform:uppercase;
    background:var(--void);
    color:var(--ink);
    border:2px solid var(--ink);
    padding:7px 10px;
    cursor:pointer;
    user-select:none;
  }
  .layer[data-on="1"]{ background:var(--c); color:var(--void); border-color:var(--c); font-weight:700; }
  .layer:focus-visible{ outline:3px solid var(--ink); outline-offset:2px; }

  /* ---------- parameters ---------- */
  #params{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    gap:11px;
    padding-right:2px;
  }
  #params:empty{ display:none; }
  .group-name{ font-size:11px; letter-spacing:.26em; text-transform:uppercase; color:var(--c); }
  .row{ display:flex; align-items:center; gap:12px; }
  .row .name{ font-size:13px; flex:0 0 40%; }
  .row .val{ font-size:13px; flex:0 0 4.5em; text-align:right; }
  input[type=range]{
    flex:1 1 auto;
    -webkit-appearance:none; appearance:none;
    background:transparent; height:22px; margin:0;
  }
  input[type=range]::-webkit-slider-runnable-track{ height:2px; background:var(--ink); }
  input[type=range]::-moz-range-track{ height:2px; background:var(--ink); }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:16px; height:16px; margin-top:-7px;
    background:var(--c,#fff); border:2px solid var(--ink);
  }
  input[type=range]::-moz-range-thumb{
    width:16px; height:16px; border:2px solid var(--ink);
    background:var(--c,#fff); border-radius:0;
  }
  select{
    flex:1 1 auto;
    font-family:inherit; font-size:13px;
    background:var(--void); color:var(--ink);
    border:2px solid var(--ink);
    padding:5px 6px;
  }

  header{ flex:0 0 auto; display:flex; flex-direction:column; gap:10px; }
  #modes{ display:flex; gap:6px; }
  #modes .layer{ flex:1 1 0; text-align:center; padding:9px 4px; }
  #rack{ flex:0 0 auto; display:flex; flex-direction:column; gap:12px;
         max-height:46vh; overflow-y:auto; }
  #rack[hidden]{ display:none; }
  #view-play, #view-key, #view-learn{
    flex:1 1 auto; min-height:0; display:flex; flex-direction:column; gap:14px;
  }
  [hidden]{ display:none !important; }
  .scroller{ flex:1 1 auto; min-height:0; overflow-y:auto; display:flex;
             flex-direction:column; gap:16px; padding-bottom:8px; }
  .note{ font-size:14px; line-height:1.6; }

  /* the key */
  .fam{ display:flex; flex-direction:column; gap:6px; }
  .fam h2{ font-size:11px; letter-spacing:.26em; text-transform:uppercase; font-weight:400; }
  .glyphs{ display:grid; grid-template-columns:repeat(auto-fill,minmax(66px,1fr)); gap:6px; }
  .glyph{
    font-family:inherit; background:var(--void); color:var(--ink);
    border:2px solid var(--ink); padding:10px 2px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  .glyph b{ font-size:22px; font-weight:700; line-height:1; }
  .glyph i{ font-style:normal; font-size:10px; letter-spacing:.06em; }
  .glyph i:first-of-type{ font-weight:700; }
  .glyph:active{ background:var(--ink); color:var(--void); }

  /* learn */
  #levels{ display:flex; flex-wrap:wrap; gap:6px; }
  #learn-controls{ display:flex; flex-wrap:wrap; gap:6px; }
  .field{ border:2px solid var(--ink); padding:10px 12px; display:flex;
          flex-direction:column; gap:6px; }
  .field .tag{ font-size:11px; letter-spacing:.24em; text-transform:uppercase; }
  .field textarea{
    background:transparent; border:0; outline:0; color:var(--ink);
    font-family:inherit; font-size:16px; line-height:1.55; resize:vertical; width:100%;
  }
  .field textarea::placeholder{ color:var(--ink); opacity:.8; }
  #enc-controls{ display:flex; flex-wrap:wrap; gap:6px; }
  #answer-box{ border:2px solid var(--ink); padding:10px 12px; display:flex;
               align-items:center; gap:10px; }
  #answer-box .tag{ font-size:11px; letter-spacing:.24em; text-transform:uppercase; }
  #answer{ flex:1 1 auto; background:transparent; border:0; outline:0; color:var(--ink);
           font-family:inherit; font-size:18px; letter-spacing:.06em; }
  #answer::placeholder{ color:var(--ink); opacity:.85; }
  #verdict{ display:flex; flex-direction:column; gap:8px; }
  .vline{ font-size:22px; letter-spacing:.14em; }
  .vline .hit{ color:var(--space); }
  .vline .miss{ color:var(--couple); text-decoration:line-through; }
  .why{ font-size:13px; line-height:1.6; }

  @media (min-width:900px){
    body{ padding:26px 32px 20px; max-width:1180px; margin:0 auto; width:100%; }
    header{ flex-direction:row; align-items:center; justify-content:space-between; }
    #modes{ flex:0 0 auto; }
    #modes .layer{ flex:0 0 auto; padding:9px 16px; }
    #keychart{ display:grid; grid-template-columns:1fr 1fr; gap:22px 34px; align-items:start; }
    #rack{ max-height:38vh; }
    #params{ max-height:26vh; display:grid; grid-template-columns:1fr 1fr; gap:11px 34px; align-content:start; }
    .group-name{ grid-column:1 / -1; }
  }

  @media (prefers-reduced-motion:reduce){
    #caret{ animation:none; }
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Language Instrument</div>
  <div id="modes"></div>
</header>

<div id="view-play">
<div id="stage"><div id="line"><span id="caret"> </span></div></div>

<div id="box">
  <span class="tag">Type</span>
  <input id="feed" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="here — every letter sounds">
</div>

<div id="tape"></div>
<div id="rack" hidden>
  <div id="presets"></div>
  <div id="layers"></div>
  <div id="params"></div>
</div>
</div><!-- /view-play -->

<div id="view-key" hidden>
  <div class="scroller">
    <p class="note">Every letter is a family you hear first and a step you hear second. Tap any letter to hear it.</p>
    <div id="keychart"></div>
  </div>
</div>

<div id="view-encode" hidden>
  <div class="scroller">
    <p class="note">Text, sound and notation are the same thing three ways. Write in either box; the other fills in.</p>
    <div class="field">
      <span class="tag">Text</span>
      <textarea id="enc-text" rows="3" spellcheck="false" placeholder="anything — contractions, stops, numbers"></textarea>
    </div>
    <div class="field">
      <span class="tag">Notation</span>
      <textarea id="enc-code" rows="3" spellcheck="false" placeholder="P5 V4 N2 ' P2"></textarea>
    </div>
    <div id="enc-controls"></div>
    <div id="enc-note" class="note"></div>
  </div>
</div>

<div id="view-learn" hidden>
  <div class="scroller">
    <div id="levels"></div>
    <div id="learn-status" class="note">Pick a level, then play a word and type what you hear.</div>
    <div id="learn-controls"></div>
    <div id="answer-box">
      <span class="tag">Heard</span>
      <input id="answer" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="type the word">
    </div>
    <div id="verdict"></div>
    <div id="score" class="note"></div>
  </div>
</div>

<script>
/* ============================================================
   LANGUAGE INSTRUMENT
   Three simultaneous readings of the same keystroke:
     SPEECH  — the letter as a vocal gesture (formants, articulation)
     TONE    — the letter as a pitch (mapping + scale)
     COUPLE  — the letter bent by its neighbours (mutual FM)
   plus PULSE (typing rhythm) and SPACE (keyboard geography).
============================================================ */

/* ---------------- linguistic tables ---------------- */

const VOWELS = 'aeiouy';

const VOWEL_FORMANTS = {
  a:{f1:730,f2:1090}, e:{f1:530,f2:1840}, i:{f1:270,f2:2290},
  o:{f1:570,f2:840},  u:{f1:300,f2:870},  y:{f1:440,f2:1900}
};

const ARTIC = {
  plosive:   'ptkbdg',
  fricative: 'fvszh',
  affricate: 'cjx',
  nasal:     'mn',
  liquid:    'lr',
  glide:     'wq'
};

function articOf(ch){
  for (const k in ARTIC) if (ARTIC[k].includes(ch)) return k;
  return 'fricative';
}
const isVowel = ch => VOWELS.includes(ch);

// English letter frequency order, most common first
const FREQ_ORDER = 'etaoinshrdlcumwfgypbvkjxqz';

const ROWS = ['qwertyuiop','asdfghjkl','zxcvbnm'];

function keyPos(ch){
  for (let r=0; r<ROWS.length; r++){
    const c = ROWS[r].indexOf(ch);
    if (c >= 0) return { x:(c + r*0.4) / 10, y:r/2 };
  }
  return { x:0.5, y:0.5 };
}

// distance between two keys on the physical board, 0..1
function keyDistance(a,b){
  const p = keyPos(a), q = keyPos(b);
  return Math.min(1, Math.hypot(p.x-q.x, (p.y-q.y)*0.6) * 1.25);
}

/* ---------------- pitch mappings ---------------- */

const MAPPINGS = {
  phonetic: ch => {
    if (isVowel(ch)) return 7 + VOWELS.indexOf(ch) * 2;
    const order = ['plosive','affricate','fricative','nasal','liquid','glide'];
    const g = articOf(ch);
    return order.indexOf(g) * 3 + (ARTIC[g].indexOf(ch) + 1);
  },
  frequency: ch => {
    const i = FREQ_ORDER.indexOf(ch);
    return i < 0 ? 0 : [0,7,4,12,9,2,16,5,11,19,3,14,21,8,23,10,1,17,6,13,24,15,22,18,20,26][i];
  },
  split: ch => isVowel(ch) ? 12 + VOWELS.indexOf(ch)*2 : (ch.charCodeAt(0)-97) % 12,
  chromatic: ch => (ch.charCodeAt(0) - 97),
  qwerty: ch => { const p = keyPos(ch); return Math.round((1-p.y)*12 + p.x*12); },
  ascii: ch => (ch.charCodeAt(0) - 97) % 24
};

const SCALES = {
  free:      null,
  pentatonic:[0,2,4,7,9],
  dorian:    [0,2,3,5,7,9,10],
  wholetone: [0,2,4,6,8,10],
  fifths:    [0,7,2,9,4]
};

function quantize(semi, scaleName){
  const s = SCALES[scaleName];
  if (!s) return semi;
  const oct = Math.floor(semi/12), deg = ((semi%12)+12)%12;
  let best = s[0], gap = 99;
  for (const n of s){ const d = Math.abs(n-deg); if (d < gap){ gap = d; best = n; } }
  return oct*12 + best;
}

/* ---------------- state ---------------- */

const LAYERS = {
  speech: { label:'Speech', on:true,  color:'var(--speech)' },
  tone:   { label:'Tone',   on:true,  color:'var(--tone)'   },
  couple: { label:'Couple', on:true,  color:'var(--couple)' },
  pulse:  { label:'Pulse',  on:false, color:'var(--pulse)'  },
  space:  { label:'Space',  on:true,  color:'var(--space)'  }
};

const P = {
  master:   { v:0.55, min:0,   max:1,   step:0.01, name:'Volume',        group:null   },
  speechLevel:{v:0.8, min:0,   max:1,   step:0.01, name:'Level',         group:'speech' },
  voicePitch:{v:150,  min:80,  max:300, step:1,    name:'Voice pitch',   group:'speech', unit:'Hz' },
  vowelLen: { v:0.30, min:0.08,max:0.9, step:0.01, name:'Vowel length',  group:'speech', unit:'s' },
  bite:     { v:0.55, min:0,   max:1,   step:0.01, name:'Consonant bite',group:'speech' },
  toneLevel:{ v:0.9,  min:0,   max:1,   step:0.01, name:'Level',         group:'tone' },
  spread:   { v:2.6,  min:0.5, max:5,   step:0.1,  name:'Register spread',group:'tone', unit:'oct' },
  grain:    { v:2,    min:1,   max:5,   step:1,    name:'Grains / letter',group:'tone' },
  spray:    { v:0.4,  min:0,   max:1,   step:0.01, name:'Grain spray',    group:'tone' },
  scatter:  { v:0.85, min:0,   max:1,   step:0.01, name:'Visual scatter', group:'tone' },
  root:     { v:294,  min:80,  max:660, step:1,    name:'Root',          group:'tone', unit:'Hz' },
  octave:   { v:0,    min:-2,  max:2,   step:1,    name:'Register',      group:'tone', unit:'oct' },
  air:      { v:0.22, min:0,   max:1,   step:0.01, name:'Air (top partial)', group:'tone' },
  sustain:  { v:1.1,  min:0.15,max:5,   step:0.05, name:'Sustain',       group:'tone', unit:'s' },
  depth:    { v:0.45, min:0,   max:1,   step:0.01, name:'Coupling depth',group:'couple' },
  reach:    { v:3,    min:1,   max:6,   step:1,    name:'Reach (letters)',group:'couple' },
  nearBias: { v:0.6,  min:-1,  max:1,   step:0.01, name:'Near/far bias', group:'couple' },
  mutual:   { v:0.7,  min:0,   max:1,   step:0.01, name:'Mutual return', group:'couple' },
  swing:    { v:0.6,  min:0,   max:1,   step:0.01, name:'Rhythm depth',  group:'pulse' },
  width:    { v:0.85, min:0,   max:1,   step:0.01, name:'Stereo width',  group:'space' }
};

const SEL = {
  mapping: { v:'phonetic', name:'Mapping', group:'tone', opts:{
    phonetic:'Phonetic clusters', frequency:'Letter frequency', split:'Vowel / consonant',
    chromatic:'Chromatic', qwerty:'Keyboard geography', ascii:'ASCII',
    cipher:'Beep cipher (decodable)' } },
  scale:   { v:'pentatonic', name:'Scale', group:'tone', opts:{
    free:'Free (no scale)', pentatonic:'Pentatonic', dorian:'Dorian',
    wholetone:'Whole tone', fifths:'Stacked fifths' } },
  timbre:  { v:'reed', name:'Timbre', group:'tone', opts:{
    reed:'Reed', glass:'Glass', pluck:'Pluck', choir:'Choir',
    wood:'Wood', hollow:'Hollow', code:'Code-aware' } }
};

/* ---------------- audio ---------------- */

let ctx = null, master = null, wet = null, busSpeech = null, busTone = null;

function audio(){
  if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return ctx; }
  ctx = new (window.AudioContext || window.webkitAudioContext)();

  master = ctx.createGain();
  master.gain.value = P.master.v;

  const limiter = ctx.createDynamicsCompressor();
  limiter.threshold.value = -10;
  limiter.knee.value = 6;
  limiter.ratio.value = 12;
  limiter.attack.value = 0.003;
  limiter.release.value = 0.2;

  // a short room, so sustained letters can hear each other
  const conv = ctx.createConvolver();
  const len = Math.floor(ctx.sampleRate * 1.5);
  const buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let c=0; c<2; c++){
    const d = buf.getChannelData(c);
    for (let i=0; i<len; i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/len, 2.6);
  }
  conv.buffer = buf;
  wet = ctx.createGain();
  wet.gain.value = 0.16;

  busSpeech = ctx.createGain(); busSpeech.gain.value = P.speechLevel.v;
  busTone   = ctx.createGain(); busTone.gain.value   = P.toneLevel.v;
  busSpeech.connect(master); busTone.connect(master);

  master.connect(limiter);
  master.connect(wet); wet.connect(conv); conv.connect(limiter);
  limiter.connect(ctx.destination);
  return ctx;
}

const TIMBRE = {
  // cut = lowpass in multiples of the fundamental. These are deliberately
  // dark and resonant; audibility on small speakers comes from register
  // (root + stratum) and from `part`, not from opening the filter.
  reed:   { types:['sawtooth','triangle'], cut:2.2, q:3.5, gain:0.22, part:2, ptype:'sine'     },
  glass:  { types:['sine','sine'],         cut:6.0, q:1.0, gain:0.24, part:3, ptype:'sine'     },
  pluck:  { types:['triangle','square'],   cut:3.0, q:2.0, gain:0.24, part:2, ptype:'triangle' },
  choir:  { types:['sawtooth','sawtooth'], cut:1.5, q:5.0, gain:0.20, part:2, ptype:'sine'     },
  code:   { types:['square','square'],     cut:4.0, q:1.5, gain:0.18, part:4, ptype:'square'   },
  wood:   { types:['triangle','triangle'], cut:2.0, q:2.5, gain:0.24, part:2, ptype:'sine'     },
  hollow: { types:['square','triangle'],   cut:1.8, q:4.0, gain:0.20, part:3, ptype:'sine'     },
  voice:  { types:['sawtooth','sawtooth'], cut:2.4, q:6.0, gain:0.20, part:2, ptype:'sine'     }
};

// live tone voices, newest last — the coupling pool
const ringing = [];

function panner(ch){
  const p = ctx.createStereoPanner
    ? ctx.createStereoPanner()
    : null;
  if (!p) return null;
  const jitter = (Math.random()*2 - 1) * 0.22;
  p.pan.value = LAYERS.space.on
    ? Math.max(-1, Math.min(1, ((keyPos(ch).x*2 - 1) + jitter) * P.width.v))
    : 0;
  return p;
}

/* --- SPEECH: the letter as an articulation --- */
function speak(ch, vel){
  const now = ctx.currentTime;
  const out = ctx.createGain();
  const pan = panner(ch);
  if (pan){ out.connect(pan); pan.connect(busSpeech); } else out.connect(busSpeech);

  if (isVowel(ch)){
    const f = VOWEL_FORMANTS[ch] || VOWEL_FORMANTS.a;
    const osc = ctx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.value = P.voicePitch.v;

    const mix = ctx.createGain();
    [[f.f1,0.5],[f.f2,0.34]].forEach(([hz,amt]) => {
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = hz; bp.Q.value = hz/90;
      const g = ctx.createGain(); g.gain.value = amt;
      osc.connect(bp); bp.connect(g); g.connect(mix);
    });

    const dur = P.vowelLen.v;
    const env = ctx.createGain();
    env.gain.setValueAtTime(0, now);
    env.gain.linearRampToValueAtTime(vel*0.34, now+0.03);
    env.gain.setTargetAtTime(0, now+dur*0.6, dur*0.25);
    mix.connect(env); env.connect(out);
    osc.start(now); osc.stop(now + dur + 0.4);
  } else {
    const kind = articOf(ch);
    const n = Math.floor(ctx.sampleRate * 0.09);
    const b = ctx.createBuffer(1, n, ctx.sampleRate);
    const d = b.getChannelData(0);
    for (let i=0; i<n; i++) d[i] = Math.random()*2 - 1;
    const src = ctx.createBufferSource(); src.buffer = b;

    const bp = ctx.createBiquadFilter();
    const shape = {
      plosive:  { type:'highpass', hz:1800, q:1,  len:0.045 },
      fricative:{ type:'bandpass', hz:5600, q:1.4,len:0.11  },
      affricate:{ type:'bandpass', hz:3400, q:2.4,len:0.08  },
      nasal:    { type:'lowpass',  hz:900,  q:4,  len:0.13  },
      liquid:   { type:'bandpass', hz:1400, q:5,  len:0.12  },
      glide:    { type:'lowpass',  hz:1600, q:2,  len:0.14  }
    }[kind];
    bp.type = shape.type;
    bp.frequency.value = shape.hz;
    bp.Q.value = shape.q * (0.5 + P.bite.v);

    const env = ctx.createGain();
    const amp = vel * 0.3 * (0.4 + P.bite.v*0.8);
    env.gain.setValueAtTime(amp, now);
    env.gain.exponentialRampToValueAtTime(0.0008, now + shape.len);

    src.connect(bp); bp.connect(env); env.connect(out);
    src.start(now);
  }
}

/* how long a point rings, by what kind of sound the letter is.
   plosives are dots, liquids and nasals are dashes — the texture needs
   different grain sizes or every point masks its neighbour. */
const GRAIN_LEN = {
  vowel:1.0, plosive:0.13, affricate:0.28, fricative:0.42,
  nasal:1.35, liquid:1.5, glide:1.1
};

/* register offset from letter rarity: common letters hold the middle,
   rare letters are flung to the edges, alternating up and down so the
   whole range fills in. Formal, and it is what stops the pile-up. */
function stratum(ch){
  const i = FREQ_ORDER.indexOf(ch);
  if (i < 0) return 0;
  const rarity = i / 25;
  const dir = (i % 2) ? 1 : -1;
  return dir * rarity * P.spread.v * 6;
}

/* ---------------- the beep cipher ----------------
   Nobody learns 26 arbitrary pitches. They learn feature bundles — which
   is how phonemes are learned in the first place. So a letter is:

       FAMILY  -> timbre + register band   (heard first, 7 of them)
       MEMBER  -> step within that family  (heard second, at most 6)

   Two cues, both small enough to hold in a head, and a third cue comes
   free from grain length. No scale quantizing here: quantizing collapses
   different letters onto the same pitch, which is fine for music and
   fatal for a code. Every letter must be recoverable by ear.          */

const CIPHER_FAMILY = {
  nasal:     { timbre:'choir',  base:-12 },
  glide:     { timbre:'hollow', base:-7  },
  liquid:    { timbre:'reed',   base:-5  },
  plosive:   { timbre:'pluck',  base:0   },
  vowel:     { timbre:'voice',  base:3   },
  affricate: { timbre:'code',   base:7   },
  fricative: { timbre:'glass',  base:12  }
};

// Steps inside a family, always spread across a full octave. A family of
// two gets its members an octave apart, not a whole tone — small families
// should be the EASY ones. Snapped to a pentatonic set so any two letters
// sounding together still agree.
const STEPS = [0, 2, 4, 7, 9, 12];

function stepFor(i, n){
  if (n <= 1) return 0;
  return STEPS[Math.round(i * (STEPS.length - 1) / (n - 1))];
}

function cipher(ch){
  const fam = isVowel(ch) ? 'vowel' : articOf(ch);
  const set = fam === 'vowel' ? VOWELS : ARTIC[fam];
  const idx = set.indexOf(ch);
  const f = CIPHER_FAMILY[fam];
  return { semi: f.base + stepFor(idx, set.length), timbre: f.timbre, family: fam };
}

/* Marks are not letters and should never be mistaken for one, so they get
   the one timbre no letter uses (wood) and their own registers. The
   apostrophe is the exception: it marks an ELISION — a letter that isn't
   there — so it is the shortest, highest thing in the language, a tick. */
const MARKS = {
  "'": { semi:31, timbre:'glass',  len:0.06 },   // elision tick
  '.': { semi:-17,timbre:'wood',   len:0.60 },   // full stop, the long low one
  ',': { semi:-10,timbre:'wood',   len:0.18 },
  '-': { semi:-12,timbre:'wood',   len:0.12 },
  '?': { semi:19, timbre:'wood',   len:0.38 },
  '!': { semi:21, timbre:'wood',   len:0.20 }
};
function digitMark(ch){
  return { semi:24 + (+ch)*2, timbre:'wood', len:0.16 };
}
function markOf(ch){
  if (MARKS[ch]) return MARKS[ch];
  if (/[0-9]/.test(ch)) return digitMark(ch);
  return null;
}

/* ---------------- written notation ----------------
   Sound and text are two of the three faces. This is the third: a written
   form you can pass on paper. Family letter + step number, so the notation
   says out loud what the ear is meant to do — find the family, then count
   the step. N1 is the first nasal. F5 is the fifth fricative.            */
const FAMILY_TAG = {
  nasal:'N', glide:'G', liquid:'L', plosive:'P',
  vowel:'V', affricate:'A', fricative:'F'
};
const MARK_TAG = { "'":"'", '.':'.', ',':',', '-':'-', '?':'?', '!':'!' };

function notate(ch){
  ch = ch.toLowerCase();
  if (ch === ' ') return '/';
  if (MARK_TAG[ch]) return MARK_TAG[ch];
  if (/[0-9]/.test(ch)) return '#' + ch;
  if (!/[a-z]/.test(ch)) return '';
  const fam = isVowel(ch) ? 'vowel' : articOf(ch);
  const set = fam === 'vowel' ? VOWELS : ARTIC[fam];
  return FAMILY_TAG[fam] + (set.indexOf(ch) + 1);
}

const FROM_TAG = (() => {
  const m = {};
  for (let i=0;i<26;i++){ const c = String.fromCharCode(97+i); m[notate(c)] = c; }
  Object.keys(MARK_TAG).forEach(c => m[MARK_TAG[c]] = c);
  for (let d=0; d<10; d++) m['#'+d] = String(d);
  m['/'] = ' ';
  return m;
})();

function encode(text){
  return [...text.toLowerCase()].map(notate).filter(Boolean).join(' ');
}

function decode(str){
  return str.trim().split(/\s+/).map(tok => FROM_TAG[tok] !== undefined ? FROM_TAG[tok] : '')
    .join('');
}

/* --- TONE: the letter as a pitch --- */
const CODE_OFFSET = {
  '(':-12,')':-12,'[':-10,']':-10,'{':-8,'}':-8,'<':-5,'>':-5,
  '=':7,'+':9,'-':5,'*':11,'/':4,'%':14,'!':16,'&':2,'|':3,
  ';':-2,':':0,',':-4,'.':-7,'"':19,"'":21,'_':-9,'#':12,'@':17,'$':13,'\\':6,'`':23,'?':18,'^':20,'~':15
};

function tone(ch, vel){
  let tName = SEL.timbre.v;
  const coded = SEL.mapping.v === 'cipher' && /[a-z]/.test(ch);
  /* marks are handled below and are live in cipher mode only */

  let semi, markLen = null;
  const mk = coded || SEL.mapping.v === 'cipher' ? markOf(ch) : null;

  if (coded) {
    const c = cipher(ch);
    semi = c.semi;
    tName = c.timbre;               // the family IS the timbre — that is the cue
  } else if (mk) {
    semi = mk.semi; tName = mk.timbre; markLen = mk.len;
  } else if (/[a-z]/.test(ch)) {
    semi = quantize(MAPPINGS[SEL.mapping.v](ch), SEL.scale.v)
         + quantize(Math.round(stratum(ch)), SEL.scale.v);
  } else if (/[0-9]/.test(ch)) {
    semi = quantize(+ch * 2, SEL.scale.v);
  } else if (SEL.timbre.v === 'code' && CODE_OFFSET[ch] !== undefined) {
    semi = CODE_OFFSET[ch];               // punctuation keeps its own intervals
  } else if (CODE_OFFSET[ch] !== undefined) {
    semi = quantize(((CODE_OFFSET[ch]%12)+12)%12, SEL.scale.v);
  } else {
    return null;
  }

  const t = TIMBRE[tName];
  const kind = /[a-z]/.test(ch) ? (isVowel(ch) ? 'vowel' : articOf(ch)) : 'plosive';
  let dur = markLen !== null ? markLen : P.sustain.v * (GRAIN_LEN[kind] || 1);
  if (tName === 'pluck') dur = Math.min(dur, 0.9);

  const freq = P.root.v * Math.pow(2, semi/12 + P.octave.v);

  // one letter is not one note. It is a small cloud of points, sprayed in
  // time and detuned against itself — the letter's own internal clutter.
  const count = Math.round(P.grain.v);
  let primary = null;

  for (let g = 0; g < count; g++){
    const late  = g === 0 ? 0 : (g * 0.012 + Math.random() * 0.05) * P.spray.v;
    const det   = g === 0 ? 0 : (Math.random() * 2 - 1) * 22 * P.spray.v;
    const amp   = g === 0 ? 1 : 0.55 / Math.sqrt(g + 1);
    const life  = g === 0 ? dur : dur * (0.4 + Math.random() * 0.5);
    const v = point(ch, freq, vel * amp, late, det, life, t, tName);
    if (g === 0) { v.semi = semi; primary = v; }
  }

  const now = ctx.currentTime;
  if (LAYERS.couple.on) coupleTo(primary, now, dur);

  ringing.push(primary);
  while (ringing.length > 28) ringing.shift();
  return primary;
}

/* a single point of sound */
function point(ch, freq, vel, late, detune, dur, t, tName){
  const now = ctx.currentTime + late;

  const osc  = ctx.createOscillator();
  const osc2 = ctx.createOscillator();
  osc.type = t.types[0]; osc2.type = t.types[1];
  osc.frequency.value = freq;
  osc2.frequency.value = freq;
  osc.detune.value = detune;
  osc2.detune.value = detune + (tName === 'choir' ? 9 : 4);

  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = Math.min(13000, freq * t.cut);
  lp.Q.value = t.q;

  const env = ctx.createGain();
  const peak = vel * t.gain / Math.sqrt(Math.max(1, P.grain.v));
  const atk = tName === 'pluck' ? 0.004 : Math.min(0.03, dur * 0.15);
  env.gain.setValueAtTime(0, now);
  env.gain.linearRampToValueAtTime(peak, now + atk);
  env.gain.exponentialRampToValueAtTime(0.0008, now + dur);

  const out = ctx.createGain();
  const pan = panner(ch);
  osc.connect(lp); osc2.connect(lp); lp.connect(env); env.connect(out);

  // the top partial bypasses the lowpass entirely — this is what makes the
  // tone layer audible on a laptop or phone speaker, which have no low end
  let osc3 = null;
  if (P.air.v > 0.01){
    osc3 = ctx.createOscillator();
    osc3.type = t.ptype;
    osc3.frequency.value = freq * t.part;
    osc3.detune.value = detune;
    const ag = ctx.createGain();
    ag.gain.value = P.air.v * 0.45;
    osc3.connect(ag); ag.connect(env);
    osc3.start(now); osc3.stop(now + dur + 0.1);
  }

  if (pan){ out.connect(pan); pan.connect(busTone); } else out.connect(busTone);

  osc.start(now); osc2.start(now);
  osc.stop(now + dur + 0.1); osc2.stop(now + dur + 0.1);

  return { ch, osc, osc2, freq, until: now + dur, links: [], el: null,
           phase: Math.random()*6.28 };
}

/* --- COUPLE: neighbours bend each other ---
   Each new letter frequency-modulates the letters still ringing behind it,
   and they modulate it back. How hard depends on
     (a) how many letters ago it was typed        — stream distance
     (b) how far apart the two keys are           — near/far bias
*/
function coupleTo(v, now, dur){
  const reach = Math.round(P.reach.v);
  const live = ringing.filter(o => o.until > now + 0.05);
  const partners = live.slice(-reach);

  partners.forEach((o, i) => {
    const back = partners.length - i;                 // 1 = immediately previous
    const streamFall = Math.pow(0.62, back - 1);

    const kd = keyDistance(o.ch, v.ch);               // 0 near .. 1 far
    const bias = P.nearBias.v;                        // +1 favours near keys
    const geo = bias >= 0
      ? (1 - kd) * bias + (1 - bias)
      : kd * (-bias) + (1 + bias);

    const amount = P.depth.v * streamFall * geo;
    if (amount < 0.005) return;

    // new letter -> old letter
    const g1 = ctx.createGain();
    g1.gain.value = 0;
    g1.gain.setTargetAtTime(amount * o.freq * 0.5, now, 0.05);
    g1.gain.setTargetAtTime(0, o.until - 0.15, 0.08);
    v.osc.connect(g1); g1.connect(o.osc.frequency); g1.connect(o.osc2.frequency);
    v.links.push(g1);

    // old letter -> new letter
    const back2 = P.mutual.v;
    if (back2 > 0.01){
      const g2 = ctx.createGain();
      g2.gain.value = 0;
      g2.gain.setTargetAtTime(amount * back2 * v.freq * 0.5, now, 0.05);
      g2.gain.setTargetAtTime(0, now + dur - 0.15, 0.08);
      o.osc.connect(g2); g2.connect(v.osc.frequency); g2.connect(v.osc2.frequency);
      v.links.push(g2);
      o.links.push(g2);
    }

    // record the pairing for the visual
    v.partners = v.partners || [];
    v.partners.push({ other:o, amount });
    o.partners = o.partners || [];
    o.partners.push({ other:v, amount });
  });
}

/* ---------------- keystroke ---------------- */

let lastTime = 0;

function sound(raw, vel){
  audio();
  const ch = raw.toLowerCase();
  if (ch === ' '){ if (LAYERS.speech.on) breath(vel || 1); return; }
  if (LAYERS.speech.on && /[a-z]/.test(ch)) speak(ch, vel || 1);
  if (LAYERS.tone.on) tone(ch, vel || 1);
}

function strike(raw){
  audio();
  if (taping) tape.push({ ch: raw, t: performance.now() - tapeStart });
  const ch = raw.toLowerCase();
  const now = performance.now();
  const gap = lastTime ? now - lastTime : 400;
  lastTime = now;

  let vel = 1;
  if (LAYERS.pulse.on){
    // fast typing -> brighter, shorter; slow typing -> fuller
    const fast = Math.max(0, Math.min(1, 1 - gap/520));
    vel = 1 - P.swing.v * (fast*0.55 - 0.2);
    vel = Math.max(0.25, Math.min(1.4, vel));
  }

  const el = paint(raw);

  if (ch === ' ' || ch === '\n'){
    if (LAYERS.speech.on) breath(vel);
    return;
  }

  if (LAYERS.speech.on && /[a-z]/.test(ch)) speak(ch, vel);
  if (LAYERS.tone.on){
    const v = tone(ch, vel);
    if (v) v.el = el;
  }
}

function breath(vel){
  const now = ctx.currentTime;
  const n = Math.floor(ctx.sampleRate * 0.16);
  const b = ctx.createBuffer(1, n, ctx.sampleRate);
  const d = b.getChannelData(0);
  for (let i=0; i<n; i++) d[i] = (Math.random()*2-1) * (1 - i/n);
  const s = ctx.createBufferSource(); s.buffer = b;
  const f = ctx.createBiquadFilter();
  f.type = 'bandpass'; f.frequency.value = 1100; f.Q.value = 0.8;
  const g = ctx.createGain();
  g.gain.setValueAtTime(vel*0.06, now);
  g.gain.exponentialRampToValueAtTime(0.0006, now + 0.17);
  s.connect(f); f.connect(g); g.connect(busSpeech);
  s.start(now);
}

/* ---------------- the visible line ---------------- */

const line = document.getElementById('line');
const caret = document.getElementById('caret');

function paint(raw){
  const el = document.createElement('span');
  el.textContent = raw === ' ' ? '\u00a0' : raw;
  line.insertBefore(el, caret);
  while (line.childNodes.length > 260) line.removeChild(line.firstChild);
  line.scrollTop = line.scrollHeight;
  return el;
}

function unpaint(){
  const prev = caret.previousSibling;
  if (prev) line.removeChild(prev);
}

/* letters that are still sounding lean toward whoever they're coupled to
   and shiver at the difference between their frequencies                */
function frame(){
  if (ctx){
    const now = ctx.currentTime;
    for (const v of ringing){
      if (!v.el) continue;
      const life = v.until - now;
      if (life <= 0){
        if (v.el.dataset.live){
          v.el.style.transform = `translate(0px, ${(-(v.semi||0) * 0.55 * P.scatter.v).toFixed(2)}px)`;
          v.el.style.color = '';
          delete v.el.dataset.live;
        }
        continue;
      }
      v.el.dataset.live = '1';
      const base = -(v.semi || 0) * 0.55 * P.scatter.v;
      const strength = Math.min(1, life / Math.max(0.2, P.sustain.v));

      let wob = 0, lean = 0;
      if (v.partners){
        for (const p of v.partners){
          if (p.other.until <= now) continue;
          const beat = Math.abs(v.freq - p.other.freq) * 0.02;
          wob += Math.sin(now * (2 + beat) * 3 + v.phase) * p.amount;
          lean += p.amount * Math.sign(p.other.freq - v.freq);
        }
      }
      const dx = wob * 5 * strength + lean * 2.4 * strength;
      const dy = base - strength * 3 - Math.abs(wob) * 2;
      v.el.style.transform = `translate(${dx.toFixed(2)}px, ${dy.toFixed(2)}px)`;
      v.el.style.color = wob !== 0 ? 'var(--couple)' : 'var(--tone)';
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------------- input, one path for phone and desktop ---------------- */

const feed = document.getElementById('feed');
let seen = '';

feed.addEventListener('input', () => {
  const val = feed.value;
  if (val.length > seen.length){
    const added = val.slice(seen.length);
    for (const c of added) strike(c);
  } else if (val.length < seen.length){
    for (let i=0; i<seen.length-val.length; i++) unpaint();
  }
  seen = val;
  if (val.length > 700){ feed.value = ''; seen = ''; }
});

feed.addEventListener('keydown', e => {
  if (e.key === 'Enter'){ e.preventDefault(); strike(' '); seen += ' '; feed.value = seen; }
});

document.addEventListener('pointerdown', e => {
  if (!e.target.closest('#layers, #params')) { audio(); feed.focus(); }
});
window.addEventListener('load', () => feed.focus());

/* ================= TAPE =================
   Keystrokes with their timing, so a performance can be replayed or looped.
   This is also the exchange format a keystroke-capture platform would want. */
let tape = [], taping = false, tapeStart = 0, loopOn = false, loopTimers = [];

function tapeStop(){ loopTimers.forEach(clearTimeout); loopTimers = []; }

function tapePlay(){
  tapeStop();
  if (!tape.length) return;
  const span = tape[tape.length-1].t + 900;
  tape.forEach(ev => loopTimers.push(setTimeout(() => strike(ev.ch), ev.t)));
  if (loopOn) loopTimers.push(setTimeout(tapePlay, span));
}

function showView(name){
  view = name;
  Object.entries(VIEWS).forEach(([n,id]) => {
    document.getElementById(id).hidden = (n !== name);
  });
  modesEl.querySelectorAll('.layer').forEach(b => {
    b.dataset.on = b.textContent === name ? '1' : '0';
  });
  if (name === 'Play') feed.focus();
  if (name === 'Learn') answerEl.focus();
}
Object.keys(VIEWS).forEach(n => {
  const b = button(n, () => { audio(); showView(n); }, modesEl);
  b.style.setProperty('--c', 'var(--ink)');
});

/* --- the key --- */
const FAMILY_NOTE = {
  nasal:'hummed and low — the longest, darkest sounds',
  glide:'hollow and soft',
  liquid:'warm and ringing',
  plosive:'plucked dots — the shortest sounds',
  vowel:'sung — the only letters that hold',
  affricate:'buzzy and square',
  fricative:'glassy and high — airy'
};

function playLetter(ch){
  audio();
  const keep = SEL.mapping.v;
  SEL.mapping.v = 'cipher';
  sound(ch, 1);
  SEL.mapping.v = keep;
}

function buildKey(){
  keychartEl.innerHTML = '';
  const order = ['nasal','glide','liquid','plosive','vowel','affricate','fricative'];
  order.forEach(fam => {
    const set = fam === 'vowel' ? VOWELS : ARTIC[fam];
    const wrap = document.createElement('div');
    wrap.className = 'fam';
    const h = document.createElement('h2');
    h.textContent = fam + ' — ' + CIPHER_FAMILY[fam].timbre + ' — ' + FAMILY_NOTE[fam];
    wrap.appendChild(h);
    const g = document.createElement('div');
    g.className = 'glyphs';
    [...set].forEach(ch => {
      const k = cipher(ch);
      const b = document.createElement('button');
      b.className = 'glyph';
      b.innerHTML = '<b>' + ch + '</b><i>' + notate(ch) + '</i><i>' +
        Math.round(P.root.v * Math.pow(2, k.semi/12)) + 'Hz</i>';
      b.addEventListener('click', () => playLetter(ch));
      g.appendChild(b);
    });
    wrap.appendChild(g);
    keychartEl.appendChild(wrap);
  });

  // marks
  const wrap = document.createElement('div');
  wrap.className = 'fam';
  const h = document.createElement('h2');
  h.textContent = "marks — wood — never a letter. ' is the elision tick";
  wrap.appendChild(h);
  const g = document.createElement('div');
  g.className = 'glyphs';
  Object.keys(MARKS).forEach(ch => {
    const b = document.createElement('button');
    b.className = 'glyph';
    b.innerHTML = '<b>' + ch + '</b><i>' +
      Math.round(P.root.v * Math.pow(2, MARKS[ch].semi/12)) + 'Hz</i>';
    b.addEventListener('click', () => playLetter(ch));
    g.appendChild(b);
  });
  wrap.appendChild(g); wrap.appendChild(document.createElement('div'));
  keychartEl.appendChild(wrap);
}

/* --- encode view: three faces of the same thing --- */
const encText = document.getElementById('enc-text');
const encCode = document.getElementById('enc-code');
const encCtrl = document.getElementById('enc-controls');
const encNote = document.getElementById('enc-note');

let syncing = false;
function describe(t){
  const n = [...t].filter(c => /[a-z0-9'.,\-?!]/.test(c)).length;
  encNote.textContent = n ? n + ' signs' : '';
}
encText.addEventListener('input', () => {
  if (syncing) return;
  syncing = true; encCode.value = encode(encText.value); describe(encText.value); syncing = false;
});
encCode.addEventListener('input', () => {
  if (syncing) return;
  syncing = true; encText.value = decode(encCode.value); describe(encText.value); syncing = false;
});

button('Play', () => playWord(encText.value, PACE[pace]), encCtrl);
button('Copy notation', () => {
  if (navigator.clipboard) navigator.clipboard.writeText(encCode.value)
    .then(() => encNote.textContent = 'Notation copied')
    .catch(() => encNote.textContent = 'Select and copy by hand');
  else encNote.textContent = 'Select and copy by hand';
}, encCtrl);
button('Clear', () => { encText.value=''; encCode.value=''; encNote.textContent=''; }, encCtrl);

/* --- play a word as beeps --- */
let playing = false, playTimers = [];
function stopWord(){
  playTimers.forEach(clearTimeout); playTimers = []; playing = false;
}
function playWord(word, gap){
  audio();
  stopWord();
  if (!word) return;
  playing = true;
  const keep = SEL.mapping.v;
  SEL.mapping.v = 'cipher';
  const chars = [...word.toLowerCase()];
  let t = 0;
  chars.forEach((ch, i) => {
    playTimers.push(setTimeout(() => sound(ch, 1), t));
    // a space is a real pause, not a beep with a gap after it
    t += (ch === ' ') ? gap * 1.5 : gap;
    if (i === chars.length - 1){
      playTimers.push(setTimeout(() => { SEL.mapping.v = keep; playing = false; }, t + 400));
    }
  });
}

function weight(w){
  let s = 0;
  for (const ch of w) s += (misses[ch] || 0);
  return s;
}

function newWord(){
  const L = LEVELS[level];
  // sample a few and take whichever contains most of your weak letters,
  // so practice drifts toward what you actually get wrong
  let best = null, bestScore = -1;
  for (let i=0; i<5; i++){
    const cand = L.words[Math.floor(Math.random() * L.words.length)];
    if (cand === target) continue;
    const sc = weight(cand) + Math.random() * 0.5;
    if (sc > bestScore){ bestScore = sc; best = cand; }
  }
  target = best || L.words[Math.floor(Math.random() * L.words.length)];
  revealed = false;
  answerEl.value = '';
  verdictEl.innerHTML = '';
  const signs = [...target].filter(c => c !== ' ').length;
  statusEl.textContent = 'Listen. ' + signs + ' sounds' +
    (target.includes(' ') ? ', ' + target.split(' ').length + ' words' : '') + '.';
  playWord(target, PACE[pace]);
  answerEl.focus();
}

function check(){
  if (!target) { statusEl.textContent = 'Play a word first.'; return; }
  const given = answerEl.value.trim().toLowerCase();
  if (!given) return;

  const line = document.createElement('div');
  line.className = 'vline';
  const notes = [];
  const n = Math.max(given.length, target.length);
  let hits = 0;

  for (let i = 0; i < n; i++){
    const want = target[i], got = given[i];
    const el = document.createElement('span');
    if (want && got === want){ el.className = 'hit'; el.textContent = want; hits++; }
    else {
      el.className = 'miss';
      el.textContent = got || '·';
      if (want){
        notes.push(explain(want, got));
        misses[want] = (misses[want] || 0) + 1;
      }
    }
    line.appendChild(el);
  }
  verdictEl.innerHTML = '';
  verdictEl.appendChild(line);

  const correct = given === target;
  asked++; if (correct) right++;
  statusEl.textContent = correct
    ? 'Yes — ' + target
    : 'It was ' + target;

  notes.slice(0, 3).forEach(t => {
    const p = document.createElement('div');
    p.className = 'why';
    p.textContent = t;
    verdictEl.appendChild(p);
  });
  const code = document.createElement('div');
  code.className = 'why';
  code.textContent = 'written: ' + encode(target);
  verdictEl.appendChild(code);

  const weak = Object.keys(misses).sort((a,b) => misses[b]-misses[a]).slice(0,3);
  scoreEl.textContent = right + ' of ' + asked +
    (weak.length ? '  ·  weakest: ' + weak.join(' ') : '');
  revealed = true;
}

/* say WHY it was missed, in the terms the cipher is taught in */
function explain(want, got){
  const mkW = markOf(want);
  if (mkW) return want === "'"
    ? "' is the tick — the shortest, highest sound. It marks a letter that isn't there."
    : "' " + want + "' is a mark, not a letter: wood timbre, which no letter uses.";
  const w = cipher(want);
  const hzW = Math.round(P.root.v * Math.pow(2, w.semi/12));
  if (!got) return want + ' — ' + w.family + ', ' + w.timbre + ', ' + hzW + 'Hz. You stopped early.';
  const g = markOf(got) ? null : (/[a-z]/.test(got) ? cipher(got) : null);
  if (!g) return want + ' — ' + w.family + ', ' + w.timbre + ', ' + hzW + 'Hz.';
  if (g.family === w.family){
    const step = w.semi - g.semi;
    return want + '/' + got + ' — same family (' + w.family + '), so the timbre was right. ' +
      want + ' is ' + Math.abs(step) + ' semitones ' + (step > 0 ? 'higher' : 'lower') + '.';
  }
  return want + ' is ' + w.family + ' (' + w.timbre + '), you heard ' + g.family +
    ' (' + g.timbre + '). Listen for the timbre before the pitch.';
}

function buildLevels(){
  levelsEl.innerHTML = '';
  LEVELS.forEach((L, i) => {
    const b = button(L.name, () => {
      level = i; asked = 0; right = 0; scoreEl.textContent = '';
      buildLevels();
      newWord();
    }, levelsEl);
    b.dataset.on = i === level ? '1' : '0';
    b.style.setProperty('--c', 'var(--ink)');
  });
}

const paceBtn = button('Pace: Steady', () => {
  const keys = Object.keys(PACE);
  pace = keys[(keys.indexOf(pace) + 1) % keys.length];
  paceBtn.textContent = 'Pace: ' + pace;
}, ctrlEl);

button('Show notation', () => {
  if (!target) return;
  const d = document.createElement('div');
  d.className = 'why';
  d.textContent = encode(target);
  verdictEl.innerHTML = '';
  verdictEl.appendChild(d);
  statusEl.textContent = 'Read it by eye, then type the word.';
}, ctrlEl);

button('New word', newWord, ctrlEl);
button('Hear again', () => target && playWord(target, PACE[pace]), ctrlEl);
button('Slower', () => target && playWord(target, PACE.Slow), ctrlEl);
button('Check', check, ctrlEl);
button('Give up', () => {
  if (!target) return;
  answerEl.value = target;
  check();
}, ctrlEl);

answerEl.addEventListener('keydown', e => {
  if (e.key === 'Enter'){ e.preventDefault(); revealed ? newWord() : check(); }
});

buildLevels();
buildKey();

const tapeEl = document.getElementById('tape');
const rackEl = document.getElementById('rack');

const rackBtn = button('Controls', () => {
  rackEl.hidden = !rackEl.hidden;
  rackBtn.dataset.on = rackEl.hidden ? '0' : '1';
}, tapeEl);

const recBtn = button('Record', () => {
  taping = !taping;
  if (taping){ tape = []; tapeStart = performance.now(); }
  recBtn.textContent = taping ? 'Recording — stop' : 'Record';
  recBtn.dataset.on = taping ? '1' : '0';
}, tapeEl);
button('Replay', tapePlay, tapeEl);
const loopBtn = button('Loop', () => {
  loopOn = !loopOn;
  loopBtn.dataset.on = loopOn ? '1' : '0';
  if (loopOn) tapePlay(); else tapeStop();
}, tapeEl);
button('Erase', () => { tape = []; tapeStop(); loopOn = false;
  loopBtn.dataset.on = '0'; }, tapeEl);
tapeEl.querySelectorAll('.layer').forEach(b => b.style.setProperty('--c','var(--ink)'));

function buildParams(){
  paramsEl.innerHTML = '';

  const groups = [null, ...Object.keys(LAYERS).filter(k => LAYERS[k].on)];

  groups.forEach(g => {
    const sliders = Object.entries(P).filter(([,p]) => p.group === g);
    const selects = Object.entries(SEL).filter(([,s]) => s.group === g);
    if (!sliders.length && !selects.length) return;

    if (g){
      const h = document.createElement('div');
      h.className = 'group-name';
      h.textContent = LAYERS[g].label;
      h.style.setProperty('--c', LAYERS[g].color);
      paramsEl.appendChild(h);
    }

    selects.forEach(([key, s]) => {
      const sel = document.createElement('select');
      Object.entries(s.opts).forEach(([v, label]) => {
        const o = document.createElement('option');
        o.value = v; o.textContent = label;
        if (v === s.v) o.selected = true;
        sel.appendChild(o);
      });
      sel.addEventListener('change', () => { s.v = sel.value; });
      paramsEl.appendChild(row(s.name, sel));
    });

    sliders.forEach(([key, p]) => {
      const inp = document.createElement('input');
      inp.type = 'range';
      inp.min = p.min; inp.max = p.max; inp.step = p.step; inp.value = p.v;
      if (g) inp.style.setProperty('--c', LAYERS[g].color);
      const val = document.createElement('div');
      val.className = 'val';
      const show = () => val.textContent = (p.step >= 1 ? p.v : p.v.toFixed(2)) + (p.unit ? ' '+p.unit : '');
      show();
      inp.addEventListener('input', () => {
        p.v = parseFloat(inp.value);
        show();
        if (key === 'master'      && master)    master.gain.value = p.v;
        if (key === 'speechLevel' && busSpeech) busSpeech.gain.value = p.v;
        if (key === 'toneLevel'   && busTone)   busTone.gain.value   = p.v;
      });
      paramsEl.appendChild(row(p.name, inp, val));
    });
  });
}
buildParams();
</script>
