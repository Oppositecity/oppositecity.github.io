<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Degrees of Freedom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#101a2e;
    --raised:#1a2745;
    --cell:#25355c;
    --base:#e6ecf7;
    --free:#7fe0ff;
    --pinned:#ff9ac2;
    --gap:#b7c0d6;
    --quiet:#8f9dba;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--ground);}
  body{
    font-family:"Courier Prime","Courier New",Courier,monospace;
    color:var(--base);
    font-size:16px;
    line-height:1.5;
    padding:28px 18px 140px;
    max-width:760px;
    margin:0 auto;
    -webkit-font-smoothing:antialiased;
  }

  h1{
    font-size:13px;
    font-weight:400;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--quiet);
    margin:0 0 4px;
  }
  .sub{
    font-size:13px;
    color:var(--quiet);
    margin:0 0 34px;
    max-width:44ch;
  }

  /* ---------- passage ---------- */
  #passage{
    font-size:24px;
    line-height:1.35;
    margin:0 0 40px;
    word-spacing:.1em;
  }
  @media (min-width:600px){ #passage{font-size:29px} }

  .lit{ white-space:pre-wrap; color:var(--quiet); font-size:.8em; vertical-align:top; line-height:1.25; }

  .w{
    display:inline-block;
    vertical-align:top;
    cursor:pointer;
    color:var(--quiet);
    transition:color .5s ease;
    margin-bottom:14px;
  }
  @media (prefers-reduced-motion:reduce){ .w{transition:none} }
  .w:focus{outline:2px solid var(--free);outline-offset:3px}
  .w.sel .wt{ font-weight:700 }
  .wt{display:block;line-height:1.25}

  .pix{
    display:flex;gap:2px;margin-top:5px;
    opacity:0;transition:opacity .5s ease;
  }
  .w.done .pix{opacity:1}
  .pix i{ width:5px;height:5px;background:#3d5183;display:block }

  .bits{
    display:none;
    font-size:10px;letter-spacing:.06em;line-height:1.6;
    color:var(--quiet);white-space:nowrap;margin-top:4px;
  }
  body.shownum .w.done .bits{display:block}

  .moves{
    display:none;
    font-size:11px;line-height:1.75;letter-spacing:.02em;
    color:#cdd6e8;white-space:nowrap;margin-top:6px;
  }
  body.showmoves .w.done .moves{display:block}
  .moves u{display:block;text-decoration:none}
  .moves s{display:block;text-decoration:none;color:var(--pinned);opacity:.75}
  .moves em{font-style:normal;color:var(--quiet)}

  /* ---------- controls ---------- */
  textarea{
    width:100%;
    background:var(--raised);
    color:var(--base);
    font-family:inherit;
    font-size:15px;
    line-height:1.6;
    border:0;
    padding:14px;
    resize:vertical;
    min-height:88px;
  }
  textarea:focus{outline:2px solid var(--free);outline-offset:2px}

  .row{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; align-items:center }

  button{
    font-family:inherit;
    font-size:12px;
    letter-spacing:.16em;
    text-transform:uppercase;
    border:0;
    padding:11px 16px;
    background:var(--free);
    color:#0a1020;
    cursor:pointer;
  }
  button:disabled{opacity:.45;cursor:default}
  button:focus-visible{outline:2px solid var(--base);outline-offset:2px}

  .tog{
    background:var(--raised);
    color:var(--quiet);
  }
  .tog[aria-pressed="true"]{ background:var(--base); color:#0a1020 }

  #status{
    font-size:12px;
    color:var(--quiet);
    margin-top:14px;
    min-height:1.4em;
    letter-spacing:.04em;
  }
  #summary{
    font-size:12px;
    color:var(--base);
    margin:0 0 30px;
    letter-spacing:.04em;
    min-height:1.4em;
  }
  #summary b{font-weight:700;color:var(--free)}

  /* ---------- detail ---------- */
  #detail{
    position:fixed;
    left:0;right:0;bottom:0;
    background:var(--raised);
    padding:18px 18px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(102%);
    transition:transform .28s ease;
    max-height:56vh;
    overflow-y:auto;
    z-index:9;
  }
  @media (prefers-reduced-motion:reduce){ #detail{transition:none} }
  #detail.open{transform:translateY(0)}
  #detail .inner{max-width:760px;margin:0 auto}
  #detail h2{
    font-size:22px;font-weight:700;margin:0 0 2px;
  }
  #detail .head{font-size:12px;color:var(--quiet);margin:0 0 16px;letter-spacing:.05em}
  .ch{margin-bottom:14px}
  .ch .n{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--quiet)}
  .ch .c{font-size:13px;color:var(--base)}
  .ch .s{font-size:13px;color:var(--free);word-spacing:.35em;line-height:1.7}
  .ch .z{font-size:13px;color:var(--pinned)}
  #close{position:absolute;top:12px;right:14px;background:none;color:var(--quiet);padding:6px 8px;font-size:16px;letter-spacing:0}
</style>
</head>
<body>

<h1>Degrees of freedom</h1>
<p class="sub">Every word is offered four moves — sideways, narrower, wider, adjacent — then tested against the words beside it. What survives is how far it can still go.</p>

<div id="summary"></div>
<div id="passage"></div>

<textarea id="input" spellcheck="false" aria-label="Passage to measure">A word is only as free as the sentence lets it be.</textarea>
<div class="row">
  <button id="go">Measure</button>
  <button class="tog" id="pos" aria-pressed="true">Match part of speech</button>
  <button class="tog" id="syl" aria-pressed="false">Lock syllable count</button>
  <button class="tog" id="mov" aria-pressed="true">Show moves</button>
  <button class="tog" id="num" aria-pressed="false">Show bits</button>
</div>
<div id="status">Tap a word after measuring to see where its freedom went.</div>

<div id="detail" aria-live="polite">
  <button id="close" aria-label="Close">×</button>
  <div class="inner" id="detailBody"></div>
</div>

<script>
"use strict";

const API = "https://api.datamuse.com/words?";
const cache = new Map();
let failures = 0, throttled = 0, pauseUntil = 0;

const sleep = ms => new Promise(r => setTimeout(r, ms));

/* A 429 is not an answer. Retry with backoff, and if it never lands, throw —
   never return an empty list, which would read as "this word is pinned". */
async function fetchWithRetry(qs, tries = 4){
  for (let a = 0; a < tries; a++){
    const wait = pauseUntil - Date.now();
    if (wait > 0) await sleep(wait);
    let res;
    try { res = await fetch(API + qs); }
    catch(e){
      if (a === tries - 1) throw new Error("network");
      await sleep(400 * Math.pow(2, a));
      continue;
    }
    if (res.ok) return res.json();
    if (res.status === 429 || res.status >= 500){
      throttled++;
      pauseUntil = Math.max(pauseUntil, Date.now() + 700 * Math.pow(2, a) + Math.random() * 300);
      if (a === tries - 1) throw new Error("throttled");
      continue;
    }
    throw new Error("HTTP " + res.status);
  }
  throw new Error("unreachable");
}

async function dm(qs){
  if (cache.has(qs)) return cache.get(qs);
  const p = fetchWithRetry(qs).catch(e => { failures++; cache.delete(qs); throw e; });
  cache.set(qs, p);
  return p;
}

/* run tasks with a ceiling on simultaneous requests */
async function pool(items, limit, fn){
  let i = 0;
  const workers = Array.from({length: Math.min(limit, items.length)}, async () => {
    while (i < items.length) { const k = i++; await fn(items[k], k); }
  });
  await Promise.all(workers);
}

/* ---------- tokenizing ---------- */
const WORD = /([A-Za-z]+(?:['\u2019\-][A-Za-z]+)*)/;
function tokenize(text){
  return text.split(WORD).filter(t => t !== "").map(t => ({
    text: t,
    isWord: WORD.test(t) && /[A-Za-z]/.test(t)
  }));
}

/* ---------- channels ---------- */
const CHANNELS = [
  { key:"syn",   label:"sideways",    qs: w => [`rel_syn=${w}&md=ps&max=100`] },
  { key:"narrow",label:"narrower",    qs: w => [`rel_spc=${w}&md=ps&max=100`] },
  { key:"wide",  label:"wider",       qs: w => [`rel_gen=${w}&md=ps&max=100`] },
  { key:"assoc", label:"adjacent",    qs: w => [`rel_trg=${w}&md=ps&max=100`] }
];

const enc = encodeURIComponent;

async function sourceInfo(word){
  const r = await dm(`sp=${enc(word)}&md=ps&max=1`);
  const hit = r && r[0] && r[0].word.toLowerCase() === word.toLowerCase() ? r[0] : null;
  return { tags: hit ? (hit.tags||[]).filter(t => !t.includes(":")) : [], syl: hit ? hit.numSyllables : null };
}

async function channelSet(word, ch){
  const lists = await Promise.all(ch.qs(enc(word)).map(q => dm(q)));
  const out = new Map();
  for (const list of lists) for (const it of list){
    const k = it.word.toLowerCase();
    if (k === word.toLowerCase() || !/^[a-z][a-z' -]*$/.test(k)) continue;
    if (!out.has(k)) out.set(k, it);
  }
  return [...out.values()];
}

/* words attested next to the neighbours, from corpus bigrams */
/* An empty bigram list means the corpus has nothing to say about this slot.
   That is missing evidence, not a constraint — the same mistake as reading a
   throttled lookup as a pinned word. Collapse empty sets to null. */
async function neighbourSets(prev, next){
  const F = prev ? dm(`rel_bga=${enc(prev)}&max=1000`) : Promise.resolve(null);
  const P = next ? dm(`rel_bgb=${enc(next)}&max=1000`) : Promise.resolve(null);
  const [f, p] = await Promise.all([F, P]);
  const set = list => {
    if (!list || !list.length) return null;
    return new Set(list.map(x => x.word.toLowerCase()));
  };
  return { follows: set(f), precedes: set(p) };
}

function admissible(cand, src, opts){
  if (opts.pos && src.tags.length){
    const t = (cand.tags||[]).filter(x => !x.includes(":"));
    if (t.length && !t.some(x => src.tags.includes(x))) return false;
  }
  if (opts.syl && src.syl != null && cand.numSyllables != null){
    if (cand.numSyllables !== src.syl) return false;
  }
  return true;
}

async function measure(word, prev, next, opts){
  const src = await sourceInfo(word);
  const sets = await Promise.all(CHANNELS.map(ch => channelSet(word, ch)));
  const nb = await neighbourSets(prev, next);
  const noContext = !nb.follows && !nb.precedes;

  const attested = w =>
    noContext ? true :
    (nb.follows && nb.follows.has(w)) || (nb.precedes && nb.precedes.has(w));

  const chans = [];
  const bare = new Set(), ctx = new Set();

  sets.forEach((list, i) => {
    const filtered = list.filter(c => admissible(c, src, opts));
    const kept = filtered.filter(c => attested(c.word.toLowerCase()));
    filtered.forEach(c => bare.add(c.word.toLowerCase()));
    kept.forEach(c => ctx.add(c.word.toLowerCase()));
    chans.push({
      label: CHANNELS[i].label,
      bare: filtered.length,
      ctx: kept.length,
      sample: kept.slice(0, 7).map(c => c.word),
      closed: filtered.filter(c => !attested(c.word.toLowerCase())).slice(0, 7).map(c => c.word)
    });
  });

  const B = bare.size, C = ctx.size;
  return {
    word, src, chans,
    B, C,
    dof: chans.filter(c => c.ctx > 0).length,
    bits: B === 0 ? null : (C === 0 ? Infinity : Math.log2(B / C)),
    gap: B === 0,
    noContext,
    sides: (nb.follows ? 1 : 0) + (nb.precedes ? 1 : 0),
    edge: !prev || !next
  };
}

/* ---------- colour ---------- */
const FREE = [127,224,255], PIN = [255,154,194], GAP = [183,192,214];
function colourFor(m){
  if (m.gap) return `rgb(${GAP.join(",")})`;
  const t = m.bits === Infinity ? 1 : Math.min(m.bits / 5, 1);
  const c = FREE.map((v,i) => Math.round(v + (PIN[i]-v)*t));
  return `rgb(${c.join(",")})`;
}

/* ---------- render ---------- */
const $ = id => document.getElementById(id);
const passageEl = $("passage"), statusEl = $("status"), summaryEl = $("summary");
const opts = { pos:true, syl:false };
let results = [], selected = null;

function build(tokens){
  passageEl.innerHTML = "";
  tokens.forEach((t, i) => {
    if (!t.isWord){
      const s = document.createElement("span");
      s.className = "lit";
      s.textContent = t.text;
      passageEl.appendChild(s);
      return;
    }
    const s = document.createElement("span");
    s.className = "w";
    s.tabIndex = 0;
    s.dataset.i = i;
    const wt = document.createElement("span");
    wt.className = "wt";
    wt.textContent = t.text;
    const pix = document.createElement("span");
    pix.className = "pix";
    for (let k=0;k<4;k++) pix.appendChild(document.createElement("i"));
    const bits = document.createElement("span");
    bits.className = "bits";
    const moves = document.createElement("span");
    moves.className = "moves";
    s.append(wt, pix, bits, moves);
    s.addEventListener("click", () => open(i));
    s.addEventListener("keydown", e => { if(e.key==="Enter"||e.key===" "){e.preventDefault();open(i);} });
    passageEl.appendChild(s);
  });
}

function paint(i, m){
  const el = passageEl.querySelector(`.w[data-i="${i}"]`);
  if (!el) return;
  const col = colourFor(m);
  el.style.color = col;
  el.classList.add("done");
  const cells = el.querySelectorAll(".pix i");
  m.chans.forEach((c, k) => { if (c.ctx > 0) cells[k].style.background = col; });
  el.querySelector(".bits").textContent =
    m.gap ? "no entry" : (m.bits === Infinity ? "pinned" : m.bits.toFixed(1) + " bits");

  /* round-robin across the open channels so every move is represented */
  const pick = (chans, field, n) => {
    const out = [], live = chans.filter(c => c[field].length);
    for (let d = 0; out.length < n && live.some(c => c[field][d]); d++)
      for (const c of live){ if (c[field][d] && out.length < n) out.push(c[field][d]); }
    return out;
  };
  const picked = pick(m.chans, "sample", 6);

  const mv = el.querySelector(".moves");
  if (picked.length){
    mv.innerHTML = picked.map(w => `<u>${w}</u>`).join("");
  } else if (!m.gap){
    /* nothing survived — show what context took away, marked as closed */
    const lost = pick(m.chans, "closed", 4);
    mv.innerHTML = lost.length
      ? lost.map(w => `<s>${w}</s>`).join("") + `<em>closed</em>`
      : `<em>no candidates</em>`;
  } else {
    mv.innerHTML = `<em>no entry</em>`;
  }
}

function summarise(){
  const done = results.filter(Boolean);
  if (!done.length) return;
  const gaps = done.filter(m => m.gap).length;
  const pinned = done.filter(m => !m.gap && m.C === 0).length;
  const measured = done.filter(m => !m.gap);
  const meanDof = measured.length ? (measured.reduce((a,m)=>a+m.dof,0)/measured.length).toFixed(2) : "—";
  const finite = measured.filter(m => m.bits !== Infinity);
  const total = finite.reduce((a,m)=>a+m.bits,0).toFixed(1);
  summaryEl.innerHTML =
    `mean freedom <b>${meanDof}</b> of 4 &nbsp; · &nbsp; passage constraint <b>${total} bits</b>` +
    ` &nbsp; · &nbsp; ${pinned} pinned &nbsp; · &nbsp; ${gaps} not in the lexicon`;
}

/* ---------- detail ---------- */
function open(i){
  const m = results[i];
  const el = passageEl.querySelector(`.w[data-i="${i}"]`);
  passageEl.querySelectorAll(".w.sel").forEach(x => x.classList.remove("sel"));
  if (el) el.classList.add("sel");
  selected = i;
  const body = $("detailBody");
  if (!m){
    body.innerHTML = `<h2>${el ? el.firstChild.textContent : ""}</h2><p class="head">Not measured yet.</p>`;
  } else {
    const head = m.gap
      ? "The lexicon has no entry for this word, so nothing here is a measurement."
      : (m.C === 0
        ? `${m.B} candidates exist. None of them are attested beside these neighbours.`
        : `${m.B} candidates, ${m.C} survive the neighbours — ${m.bits.toFixed(2)} bits of constraint, ${m.dof} of 4 channels open.`);
    const ctxNote = m.noContext
      ? (m.edge ? " No neighbour on one side and no corpus data on the other, so nothing was ruled out."
                : " The corpus has no bigram data for either neighbour, so nothing was ruled out — this reading is unconditioned.")
      : (m.sides === 1 ? " Conditioned on one side only; the other neighbour has no corpus data." : "");
    body.innerHTML =
      `<h2 style="color:${colourFor(m)}">${m.word}</h2>` +
      `<p class="head">${head}${ctxNote}</p>` +
      m.chans.map(c => `
        <div class="ch">
          <div class="n">${c.label} &nbsp; ${c.bare} → ${c.ctx}</div>
          ${c.ctx ? `<div class="s">${c.sample.join(" ")}</div>`
                  : `<div class="z">${c.bare ? "closed by context" : "no candidates"}</div>`}
        </div>`).join("");
  }
  $("detail").classList.add("open");
}
$("close").addEventListener("click", () => {
  $("detail").classList.remove("open");
  passageEl.querySelectorAll(".w.sel").forEach(x => x.classList.remove("sel"));
});

/* ---------- run ---------- */
let running = false;
async function run(){
  if (running) return;
  running = true;
  failures = 0; throttled = 0; pauseUntil = 0;
  $("go").disabled = true;
  summaryEl.textContent = "";
  $("detail").classList.remove("open");

  const tokens = tokenize($("input").value.trim() || $("input").placeholder || "");
  build(tokens);
  results = new Array(tokens.length).fill(null);

  const idx = tokens.map((t,i) => t.isWord ? i : -1).filter(i => i >= 0);
  if (!idx.length){ statusEl.textContent = "Nothing to measure."; $("go").disabled = false; running = false; return; }

  let done = 0, errored = 0;
  statusEl.textContent = `measuring 0 / ${idx.length}`;

  await pool(idx, 4, async (i) => {
    const before = idx.filter(j => j < i).pop();
    const after  = idx.find(j => j > i);
    try {
      const m = await measure(
        tokens[i].text,
        before != null ? tokens[before].text : null,
        after  != null ? tokens[after].text  : null,
        opts
      );
      results[i] = m;
      paint(i, m);
    } catch(e){ errored++; /* left grey and out of the statistics on purpose */ }
    done++;
    statusEl.textContent = `measuring ${done} / ${idx.length}`;
  });

  const got = results.filter(Boolean).length;
  if (got === 0){
    statusEl.textContent = throttled
      ? "The lexicon is rate limiting and never answered. Nothing was measured — a throttled lookup is not a pinned word, so no readings are shown."
      : "No connection to the lexicon. Nothing was measured — the readings below would be invented, so there are none.";
  } else {
    statusEl.textContent = errored
      ? `${got} of ${idx.length} words measured. ${errored} lookups did not answer${throttled ? " (rate limited)" : ""} — those words are grey, meaning unmeasured, not free.`
      : `${got} words measured. Tap one.`;
    summarise();
  }
  $("go").disabled = false;
  running = false;
}

$("go").addEventListener("click", run);
$("input").addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") run();
});

function toggle(id, fn){
  const b = $(id);
  b.addEventListener("click", () => {
    const on = b.getAttribute("aria-pressed") === "true";
    b.setAttribute("aria-pressed", String(!on));
    fn(!on);
  });
}
toggle("pos", v => { opts.pos = v; });
toggle("syl", v => { opts.syl = v; });
toggle("num", v => { document.body.classList.toggle("shownum", v); });
toggle("mov", v => { document.body.classList.toggle("showmoves", v); });

document.body.classList.add("showmoves");
build(tokenize($("input").value));
</script>
</body>
</html>
