<script>
const D={"types":{"thermo":{"label":"thermodynamic","color":"#ffffff"},"info":{"label":"informational","color":"#6ff7ff"},"life":{"label":"biological / geochemical","color":"#c6ff4a"},"mind":{"label":"semiotic / mind","color":"#c3b1ff"},"attractor":{"label":"future attractor","color":"#ff4fd8"},"gate":{"label":"gate / operator","color":"#fff04a"},"myth":{"label":"mythological","color":"#ff7a7a"},"laffoley":{"label":"Laffoley device","color":"#7affc8"},"odum":{"label":"energy systems (Odum)","color":"#b0501a"},"work":{"label":"our instrument","color":"#b32f73"},"totality":{"label":"neighbouring totality","color":"#55642a"},"chem":{"label":"chemistry / metabolism","color":"#1f7a8c"},"motif":{"label":"folk motif / narrative","color":"#8a4b2a"}},"nodes":[{"id":"planck","t":"thermo","name":"Planck epoch","eq":"ℓP = √(ħG/c³) ≈ 1.6×10⁻³⁵ m","gloss":"Below this length and before 5.4×10⁻⁴⁴ s, no tested physics applies. Geometry itself is unmeasured: the first non-languaged region on the map.","src":"Planck (1899)","link":"https://en.wikipedia.org/wiki/Planck_units","spec":0},{"id":"inflation","t":"thermo","name":"Cosmic inflation","eq":"a(t) ∝ e^(Ht)","gloss":"Exponential expansion smooths spacetime and stretches quantum fluctuations into the seeds of every later structure. The first traces are written here.","src":"Starobinsky (1980); Guth (1981); Linde (1982)","link":"https://en.wikipedia.org/wiki/Inflation_(cosmology)","spec":0},{"id":"wheeler","t":"gate","name":"Measurement gate","eq":"|ψ⟩ → |k⟩ with p = |⟨k|ψ⟩|²","gloss":"Wheeler's 'it from bit': every physical thing takes its existence from yes/no answers. Inflationary fluctuations decohere into classical density ripples; the unmeasured becomes definite. The gate between non-languaged and languaged.","src":"Wheeler (1989); Kiefer & Polarski on decoherence of primordial perturbations","link":"https://en.wikipedia.org/wiki/John_Archibald_Wheeler","spec":0},{"id":"tzimtzum","t":"myth","name":"Tzimtzum","eq":"∞ → void (chalal) + residue (reshimu)","gloss":"Lurianic Kabbalah: the infinite contracts to open a space where a world can exist, and a residue, the reshimu, remains. Creation as subtraction; difference opened by withdrawal.","src":"Isaac Luria, 16th c., via Hayyim Vital","link":"https://en.wikipedia.org/wiki/Tzimtzum","spec":0},{"id":"tiamat","t":"myth","name":"Tiamat / tohu va-vohu","eq":"","gloss":"The primordial deep: the salt-sea chaos of the Enuma Elish, the 'formless and void' of Genesis 1:2. Myth puts disorder first. Physics puts order first (low entropy). That inversion is the crux of the whole map.","src":"Enuma Elish (2nd millennium BCE); Genesis 1:2","link":"https://en.wikipedia.org/wiki/Tiamat","spec":0},{"id":"past","t":"thermo","name":"Past hypothesis","eq":"S(t₀) ≪ S_max","gloss":"The universe began in an extraordinarily low-entropy state. Every arrow of time (memory, trace, cause) borrows against it. Penrose puts the initial state's improbability near 1 in 10^(10^123).","src":"Penrose, The Emperor's New Mind (1989); Albert, Time and Chance (2000)","link":"https://en.wikipedia.org/wiki/Entropy_as_an_arrow_of_time","spec":0},{"id":"bbn","t":"thermo","name":"Big Bang nucleosynthesis","eq":"Yp ≈ 0.245 (helium-4 mass fraction)","gloss":"In about twenty minutes the universe fixes its first alphabet: hydrogen, helium, a trace of lithium. That composition persists for 13.8 billion years as an early record.","src":"Alpher, Bethe & Gamow (1948)","link":"https://en.wikipedia.org/wiki/Big_Bang_nucleosynthesis","spec":0},{"id":"boltzmann","t":"thermo","name":"Statistical entropy","eq":"S = k_B ln W","gloss":"Entropy counts the microstates that look identical from outside. Disorder is already a statement about hidden arrangements: an epistemic quantity inside a physical one.","src":"Boltzmann (1877); the formula as written by Planck","link":"https://en.wikipedia.org/wiki/Boltzmann%27s_entropy_formula","spec":0},{"id":"clausius","t":"thermo","name":"Entropy","eq":"dS = δQ_rev / T","gloss":"Clausius coins the word from Greek tropē, transformation: the energy of the world is constant, its entropy tends to a maximum. Placed here, where matter first reaches thermal equilibrium.","src":"Clausius (1865)","link":"https://en.wikipedia.org/wiki/Entropy","spec":0},{"id":"simondon","t":"mind","name":"Individuation","eq":"disparation → information → individual","gloss":"Simondon: individuals are not given. They crystallize out of a metastable, supersaturated pre-individual field. Information is the tension that resolves an incompatibility. The dark ages are that field at cosmic scale.","src":"Simondon, L'individuation (1958; pub. 1964/1989)","link":"https://en.wikipedia.org/wiki/Gilbert_Simondon","spec":0},{"id":"peirce","t":"mind","name":"Index","eq":"sign ⇄ object ⇄ interpretant","gloss":"Peirce: an index is a sign bound to its object by physical connection, as smoke to fire or a footprint to a foot. The cosmic background is an index 13 billion years before any interpreter. Traces precede readers.","src":"Peirce, writings c. 1867 to 1911","link":"https://en.wikipedia.org/wiki/Semiotic_theory_of_Charles_Sanders_Peirce","spec":0},{"id":"darkages","t":"thermo","name":"Gravitational clumping","eq":"C_V < 0","gloss":"No stars yet; matter clumps in the dark. Self-gravitating systems have negative heat capacity, so clumping raises total entropy while making local order. Gravity is the first anti-thermal agent.","src":"Lynden-Bell & Wood (1968)","link":"https://en.wikipedia.org/wiki/Chronology_of_the_universe","spec":0},{"id":"cmb","t":"info","name":"Cosmic background","eq":"T ≈ 2.725 K   ΔT/T ~ 10⁻⁵","gloss":"At ~380,000 years light decouples from matter. The oldest legible trace: a photograph of the universe, measured rather than remembered.","src":"Penzias & Wilson (1965); COBE, WMAP, Planck","link":"https://en.wikipedia.org/wiki/Cosmic_microwave_background","spec":0},{"id":"prigogine","t":"gate","name":"Bifurcation node","eq":"σ = Σ Jₖ Xₖ ≥ 0","gloss":"Far from equilibrium, fluctuations are amplified at bifurcation points and a system falls into a new ordered regime, irreversibly: symmetry breaking driven by dissipation. One source diagram calls this a 'heat-death bypass'. More exactly, local order grows while total entropy still rises; it does not escape heat death.","src":"Glansdorff & Prigogine (1971); Nobel Prize (1977)","link":"https://en.wikipedia.org/wiki/Dissipative_system","spec":0},{"id":"bh","t":"thermo","name":"Black holes","eq":"S = k_B c³ A / (4Għ)","gloss":"The largest entropy stores in the universe. Entropy scales with horizon area, not volume: the root of holography and of the claim that information is geometric.","src":"Bekenstein (1972); Hawking (1974)","link":"https://en.wikipedia.org/wiki/Black_hole_thermodynamics","spec":0},{"id":"funcinfo","t":"info","name":"Increasing functional information","eq":"I(Eₓ) = −log₂ F(Eₓ)","gloss":"Proposed 'missing law': systems of many interacting parts, under selection for function, evolve toward greater functional information. Applied alike to stellar nucleosynthesis, minerals and life. Contested and new.","src":"Wong, Hazen et al., PNAS (2023)","link":"https://www.pnas.org/doi/10.1073/pnas.2310223120","spec":1},{"id":"stars","t":"thermo","name":"Stars","eq":"L☉ ≈ 3.8×10²⁶ W","gloss":"Dissipative furnaces. Earth takes in sunlight and returns roughly twenty infrared photons for each visible one received. That entropy export powers everything alive.","src":"Schrödinger (1944); Penrose, Cycles of Time (2010)","link":"https://en.wikipedia.org/wiki/Stellar_evolution","spec":0},{"id":"bataille","t":"mind","name":"General economy","eq":"sun → surplus → growth or expenditure","gloss":"Bataille: the sun gives without return. Living systems receive more energy than growth can absorb, and the excess must be spent, gloriously or catastrophically. The accursed share.","src":"Bataille, The Accursed Share (1949)","link":"https://en.wikipedia.org/wiki/The_Accursed_Share","spec":0},{"id":"chaisson","t":"thermo","name":"Energy rate density","eq":"Φm = E / (t·m)   erg s⁻¹ g⁻¹","gloss":"Complexity tracks energy throughput per mass. Galaxy ~0.5, Sun ~2, plants ~900, animals ~20,000, human brain ~150,000, society ~500,000. One curve across cosmic, biological and cultural evolution.","src":"Chaisson, Cosmic Evolution (2001)","link":"https://en.wikipedia.org/wiki/Eric_Chaisson","spec":0},{"id":"smolin","t":"attractor","name":"Cosmological natural selection","eq":"","gloss":"Smolin's hypothesis: black holes spawn universes with slightly mutated constants, so the constants are selected for making black holes. A Darwinism of cosmology. Speculative.","src":"Smolin, The Life of the Cosmos (1997)","link":"https://en.wikipedia.org/wiki/Cosmological_natural_selection","spec":1},{"id":"derrida","t":"mind","name":"Trace","eq":"","gloss":"Derrida: every sign carries the mark of what it is not; presence is always already deferred. Physically: Jack Hills zircons hold crystals about 4.4 billion years old, the oldest known terrestrial record.","src":"Derrida, Of Grammatology (1967); Wilde et al., Nature (2001)","link":"https://en.wikipedia.org/wiki/Trace_(deconstruction)","spec":0},{"id":"england","t":"life","name":"Dissipative adaptation","eq":"β⟨ΔQ⟩ + ln(π₂₁/π₁₂) + ΔS_int ≥ 0","gloss":"Driven matter tends to reorganize into shapes that absorb and dissipate work from its surroundings well: a thermodynamic bias toward lifelike structure before life.","src":"England, J. Chem. Phys. (2013)","link":"https://en.wikipedia.org/wiki/Jeremy_England","spec":1},{"id":"mineral","t":"life","name":"Mineral evolution","eq":"~12 presolar minerals → ~6,000 species","gloss":"Earth's mineral diversity rose in stages, and most species depend on life (oxygenation). Geology as co-evolving record.","src":"Hazen et al., American Mineralogist (2008)","link":"https://en.wikipedia.org/wiki/Mineral_evolution","spec":0},{"id":"assembly","t":"info","name":"Assembly theory","eq":"A = Σ e^(aᵢ) (nᵢ − 1) / N_T","gloss":"An object's assembly index counts minimal construction steps. Abundant high-index objects are signatures of selection: matter that carries its own history. Contested.","src":"Sharma, Cronin, Walker et al., Nature (2023)","link":"https://en.wikipedia.org/wiki/Assembly_theory","spec":1},{"id":"deacon","t":"life","name":"Teleodynamics","eq":"homeo → morpho → teleodynamics","gloss":"Deacon: ends, meanings and purposes are absential, defined by what is not present. Order emerges in stacked stages until a system works to preserve its own form.","src":"Deacon, Incomplete Nature (2011)","link":"https://en.wikipedia.org/wiki/Incomplete_Nature","spec":0},{"id":"darkenergy","t":"thermo","name":"Dark energy","eq":"Ω_Λ ≈ 0.68   w ≈ −1","gloss":"Dominant since roughly 5 billion years ago; discovered in 1998 as accelerating expansion. About 68% of the energy budget and of unknown nature: the largest unmeasured quantity in physics. DESI results (2024–25) hint it may evolve.","src":"Riess et al. (1998); Perlmutter et al. (1999); DESI","link":"https://en.wikipedia.org/wiki/Dark_energy","spec":0},{"id":"dna","t":"life","name":"Genetic code","eq":"4 bases → ≤ 2 bits per base","gloss":"The first durable peer-to-peer matter protocol: copyable, error-corrected, distributed through every cell without a center.","src":"Watson, Crick, Franklin, Wilkins (1953); Nirenberg & Matthaei (1961)","link":"https://en.wikipedia.org/wiki/Genetic_code","spec":0},{"id":"schrodinger","t":"life","name":"Negative entropy","eq":"−S = k log (1/D)","gloss":"Schrödinger: an organism keeps its order by drawing order from its environment and exporting disorder. He predicted an 'aperiodic crystal' as the hereditary code nine years before DNA's structure.","src":"Schrödinger, What Is Life? (1944)","link":"https://en.wikipedia.org/wiki/What_Is_Life%3F","spec":0},{"id":"demon","t":"myth","name":"Maxwell's demon","eq":"","gloss":"The thought-creature that sorts molecules to beat the second law, exorcised by Szilard, Brillouin, Landauer and Bennett: to sort it must measure, and to keep sorting it must forget. Ion pumps are its tame descendants. The mythic ancestor of agentic entropy.","src":"Maxwell, letter to Tait (1867); Theory of Heat (1871)","link":"https://en.wikipedia.org/wiki/Maxwell%27s_demon","spec":0},{"id":"friston","t":"mind","name":"Free energy principle","eq":"F = E_q[ln q(s) − ln p(o,s)] ≥ −ln p(o)","gloss":"Anything that persists behaves as if it minimizes variational free energy, an upper bound on surprise. A Markov blanket separates inside from outside; to persist is to model.","src":"Friston, Nature Reviews Neuroscience (2010)","link":"https://en.wikipedia.org/wiki/Free_energy_principle","spec":0},{"id":"autopoiesis","t":"life","name":"Autopoiesis","eq":"","gloss":"A living system is a network that produces the components that produce it. The boundary is made by what it bounds.","src":"Maturana & Varela (1972; English 1980)","link":"https://en.wikipedia.org/wiki/Autopoiesis","spec":0},{"id":"serres","t":"info","name":"The parasite","eq":"","gloss":"Serres: noise is not outside the system but its third term. Every channel hosts a parasite, and new order arises from interception.","src":"Serres, Le Parasite (1980)","link":"https://en.wikipedia.org/wiki/Michel_Serres","spec":0},{"id":"kauffman","t":"life","name":"Adjacent possible","eq":"","gloss":"Biospheres expand into what is one step away and cannot prestate it. The space of the possible grows as it is explored.","src":"Kauffman, Investigations (2000)","link":"https://en.wikipedia.org/wiki/Adjacent_possible","spec":0},{"id":"p2p","t":"info","name":"P2P matter topology","eq":"pattern persists ⇔ copied across local substrate","gloss":"The working hypothesis of this map: genomes, minerals, records and protocols as peer-to-peer topologies, patterns that persist by copying through locally connected matter without a center, carving legible structure out of an unmeasured background. A synthesis, not established science.","src":"This synthesis","link":"","spec":1},{"id":"vernadsky","t":"life","name":"Biosphere as force","eq":"","gloss":"Vernadsky: living matter is a geological force, moving atoms at planetary scale.","src":"Vernadsky, The Biosphere (1926)","link":"https://en.wikipedia.org/wiki/Vladimir_Vernadsky","spec":0},{"id":"gaia","t":"life","name":"Gaia","eq":"","gloss":"The biosphere regulates its own planetary conditions. Earth's atmosphere is a chemical disequilibrium visible from space: a trace of life legible at astronomical distance.","src":"Lovelock (1972); Lovelock & Margulis (1974)","link":"https://en.wikipedia.org/wiki/Gaia_hypothesis","spec":1},{"id":"bulla","t":"info","name":"Bulla genealogy","eq":"clay token → alphabet → coin → machine token","gloss":"Clay counting tokens (from c. 8000 BCE) sealed in clay envelopes (bullae, c. 3500 BCE) precede writing. A chain of counting-matter running through alphabet and coin to the language-model token.","src":"Schmandt-Besserat, Before Writing (1992)","link":"https://en.wikipedia.org/wiki/Bulla_(seal)","spec":0},{"id":"bateson","t":"info","name":"Difference that makes a difference","eq":"","gloss":"Bateson's definition of information: not a thing but a difference that registers somewhere downstream. Information lives in relations.","src":"Bateson, Steps to an Ecology of Mind (1972)","link":"https://en.wikipedia.org/wiki/Gregory_Bateson","spec":0},{"id":"shannon","t":"info","name":"Shannon entropy","eq":"H(X) = −Σ p(x) log₂ p(x)","gloss":"Uncertainty of a message source, in bits. Formally the Gibbs entropy without Boltzmann's constant; von Neumann reportedly suggested the name. Same form, different referent: a question the whole map orbits.","src":"Shannon, A Mathematical Theory of Communication (1948)","link":"https://en.wikipedia.org/wiki/Entropy_(information_theory)","spec":0},{"id":"jaynes","t":"info","name":"Maximum entropy","eq":"p* = argmax H(p) subject to constraints","gloss":"Jaynes: thermodynamics is inference. Entropy measures what we do not know given what we measured. The bridge that makes Shannon and Boltzmann one idea.","src":"Jaynes, Physical Review (1957)","link":"https://en.wikipedia.org/wiki/Principle_of_maximum_entropy","spec":0},{"id":"stiegler","t":"mind","name":"Tertiary retention","eq":"","gloss":"Stiegler: memory exteriorized into technical objects (tool, script, file) is how humans inherit what they never lived. Every such support is a pharmakon, remedy and poison at once.","src":"Stiegler, Technics and Time 1 (1994)","link":"https://en.wikipedia.org/wiki/Bernard_Stiegler","spec":0},{"id":"tononi","t":"mind","name":"Integrated information","eq":"Φ","gloss":"Consciousness as irreducible integrated information. Disputed, but it gives 'sentient matrices' a candidate measure.","src":"Tononi (2004)","link":"https://en.wikipedia.org/wiki/Integrated_information_theory","spec":1},{"id":"lotman","t":"gate","name":"Semiotic membrane","eq":"non-text ⇢ boundary ⇢ text","gloss":"Lotman: meaning exists only inside a semiosphere whose boundary translates the outside (noise, non-text) into the inside. The edge between languaged and non-languaged.","src":"Lotman, 'On the Semiosphere' (1984)","link":"https://en.wikipedia.org/wiki/Semiosphere","spec":0},{"id":"noosphere","t":"mind","name":"Noosphere","eq":"","gloss":"A thinking layer enveloping the biosphere. Teilhard reads it as convergence toward Omega; Vernadsky as a new geological stage.","src":"Le Roy, Teilhard, Vernadsky (1920s); Teilhard, The Phenomenon of Man (pub. 1955)","link":"https://en.wikipedia.org/wiki/Noosphere","spec":0},{"id":"szilard","t":"info","name":"Szilard engine","eq":"W = k_B T ln 2 per bit","gloss":"One molecule, one partition, one bit: knowing the molecule's side extracts work. The first explicit link between information and energy.","src":"Szilard (1929)","link":"https://en.wikipedia.org/wiki/Entropy_in_thermodynamics_and_information_theory","spec":0},{"id":"landauer","t":"info","name":"Landauer's principle","eq":"E ≥ k_B T ln 2 ≈ 2.9×10⁻²¹ J at 300 K","gloss":"Erasing one bit must dissipate at least this much heat. Information is physical, and the cost lives in forgetting, not in knowing. Measured experimentally in 2012.","src":"Landauer (1961); Bennett (1982); Bérut et al., Nature (2012)","link":"https://en.wikipedia.org/wiki/Landauer%27s_principle","spec":0},{"id":"brillouin","t":"info","name":"Negentropy of information","eq":"ΔS_observe ≥ k_B ln 2","gloss":"Brillouin: information is negative entropy, and every observation is paid for in entropy elsewhere.","src":"Brillouin (1953)","link":"https://en.wikipedia.org/wiki/Negentropy","spec":0},{"id":"hui","t":"mind","name":"Recursivity","eq":"","gloss":"Hui: after cybernetics, machines become recursive and absorb contingency. Technology as a new organicism.","src":"Hui, Recursivity and Contingency (2019)","link":"https://en.wikipedia.org/wiki/Yuk_Hui","spec":0},{"id":"laffoley","t":"laffoley","name":"Laffoley's diagrams","eq":"Bauharoque = Bauhaus + Baroque","gloss":"Paul Laffoley (1935–2015), Boston architect and painter whose large, text-dense canvases fused physics, occultism and architecture into operable-looking diagrams. The formal precedent for this map.","src":"Kent Fine Art; The Phenomenology of Revelation (1989)","link":"https://en.wikipedia.org/wiki/Paul_Laffoley","spec":0},{"id":"technosphere","t":"info","name":"Technosphere","eq":"~18–20 TW primary power","gloss":"Haff: humans and machines as one planetary system with its own dynamics and metabolism, which people inhabit more than steer.","src":"Haff (2014)","link":"https://en.wikipedia.org/wiki/Technosphere","spec":0},{"id":"absorber","t":"gate","name":"Retrocausal physics","eq":"advanced + retarded waves","gloss":"Rigorous precedent for the future reaching back: Wheeler–Feynman absorber theory, Aharonov's two-state vector formalism, Cramer's transactional interpretation. Future boundary conditions take part in present events.","src":"Wheeler & Feynman (1945); Aharonov, Bergmann & Lebowitz (1964); Cramer (1986)","link":"https://en.wikipedia.org/wiki/Wheeler%E2%80%93Feynman_absorber_theory","spec":0},{"id":"aion","t":"myth","name":"Aion / Chronos","eq":"","gloss":"Greek time splits: chronos, measured succession; aion, the whole of time at once, and in Deleuze the time of events. Attractors live in aion.","src":"Heraclitus fr. B52; Deleuze, The Logic of Sense (1969)","link":"https://en.wikipedia.org/wiki/Aion_(deity)","spec":0},{"id":"ccru","t":"attractor","name":"Hyperstition","eq":"fiction → circulation → reality","gloss":"Fictions that make themselves real by circulating: a feedback loop from imagined future to present action.","src":"Cybernetic Culture Research Unit (1990s)","link":"https://en.wikipedia.org/wiki/Cybernetic_Culture_Research_Unit","spec":0},{"id":"singularity","t":"attractor","name":"Technocapital singularity","eq":"","gloss":"Land: capital as an intelligence assembling itself from the future, using the present as its construction site (Φ_T). In an engineering register: Vinge, Kurzweil.","src":"Land, 'Meltdown' (1994); Vinge (1993); Kurzweil (2005)","link":"https://en.wikipedia.org/wiki/Accelerationism","spec":1},{"id":"kardashev","t":"thermo","name":"Kardashev scale","eq":"K = (log₁₀ P − 6) / 10","gloss":"Civilizations ranked by harnessed power, P in watts. Humanity sits near K ≈ 0.73.","src":"Kardashev (1964); Sagan's interpolation (1973)","link":"https://en.wikipedia.org/wiki/Kardashev_scale","spec":0},{"id":"hyperobject","t":"attractor","name":"Hyperobject","eq":"","gloss":"Morton: entities so massively distributed in time and space that they defeat local perception, like global warming or plutonium (Φ_Hy). Viscous, nonlocal, temporally undulating: their effects arrive before our grasp of them.","src":"Morton, Hyperobjects (2013)","link":"https://en.wikipedia.org/wiki/Hyperobject","spec":0},{"id":"laststars","t":"thermo","name":"Last stars","eq":"star formation ends ~10¹⁴ yr","gloss":"Gas runs out; long-lived red dwarfs are the last lights.","src":"Adams & Laughlin, Reviews of Modern Physics (1997)","link":"https://en.wikipedia.org/wiki/Future_of_an_expanding_universe","spec":0},{"id":"proton","t":"thermo","name":"Proton decay","eq":"τ_p > 10³⁴ yr (if at all)","gloss":"If protons decay, white dwarfs and neutron stars evaporate. Not observed; Super-Kamiokande sets the lower bound.","src":"Adams & Laughlin (1997); Super-Kamiokande","link":"https://en.wikipedia.org/wiki/Proton_decay","spec":1},{"id":"dyson","t":"mind","name":"Eternal intelligence","eq":"finite energy, infinite subjective time","gloss":"Dyson argued that life could think forever in an open universe by slowing and hibernating. Accelerating expansion undermines the argument.","src":"Dyson, Rev. Mod. Phys. (1979); Krauss & Starkman (2000)","link":"https://en.wikipedia.org/wiki/Dyson%27s_eternal_intelligence","spec":1},{"id":"thanaton","t":"laffoley","name":"Thanaton","eq":"","gloss":"Laffoley's Thanaton paintings (late 1980s) present themselves as devices for crossing the boundary of death: the diagram as instrument. Here, the interface to the era where records dissolve.","src":"Laffoley, Thanaton III (1989)","link":"https://en.wikipedia.org/wiki/Paul_Laffoley","spec":0},{"id":"page","t":"info","name":"Page curve","eq":"S_rad rises, then falls to 0","gloss":"Does evaporation destroy information? 'Island' calculations (2019) recover the Page curve, suggesting information escapes.","src":"Page (1993); Penington; Almheiri et al. (2019)","link":"https://en.wikipedia.org/wiki/Black_hole_information_paradox","spec":0},{"id":"hawking","t":"thermo","name":"Hawking evaporation","eq":"T_H = ħc³ / (8πGMk_B)","gloss":"Black holes radiate slowly: ~10⁶⁷ yr for a stellar mass, up to ~10¹⁰⁰ yr for the largest.","src":"Hawking (1974)","link":"https://en.wikipedia.org/wiki/Hawking_radiation","spec":0},{"id":"ouroboros","t":"myth","name":"Ouroboros","eq":"","gloss":"The serpent eating its tail, first seen on a shrine in Tutankhamun's tomb (14th c. BCE): the end feeding the beginning. The oldest diagram of retrocausal closure.","src":"Enigmatic Book of the Netherworld; Greek alchemy","link":"https://en.wikipedia.org/wiki/Ouroboros","spec":0},{"id":"bbrain","t":"myth","name":"Boltzmann brain","eq":"","gloss":"In an eternal high-entropy universe, a lone observer fluctuating into existence is vastly likelier than an ordered cosmos. Used as a reductio against some cosmologies.","src":"Albrecht & Sorbo (2004)","link":"https://en.wikipedia.org/wiki/Boltzmann_brain","spec":0},{"id":"omega","t":"attractor","name":"Omega Point","eq":"","gloss":"Teilhard: evolution converges on a final point of maximal complexity and consciousness that draws the process toward itself, a cause from the future (Φ_Ω). Tipler's physical version needs a collapsing universe, which dark energy disfavors.","src":"Teilhard (1955); Tipler, The Physics of Immortality (1994)","link":"https://en.wikipedia.org/wiki/Omega_Point","spec":1},{"id":"heatdeath","t":"thermo","name":"Heat death","eq":"S → S_max   ∇T → 0","gloss":"No gradients, no work, no readable records. With dark energy a de Sitter horizon remains, at a tiny but nonzero temperature.","src":"Kelvin (1852); Gibbons & Hawking (1977)","link":"https://en.wikipedia.org/wiki/Heat_death_of_the_universe","spec":0},{"id":"ccc","t":"attractor","name":"Conformal cyclic cosmology","eq":"","gloss":"Penrose: once only massless radiation remains, scale loses meaning and the far future becomes conformally a new big bang. Physics' ouroboros. Speculative.","src":"Penrose, Cycles of Time (2010)","link":"https://en.wikipedia.org/wiki/Conformal_cyclic_cosmology","spec":1},{"id":"quantumfoam","t":"thermo","name":"Quantum foam","eq":"topology fluctuates at ℓP (hypothesis)","gloss":"Wheeler's picture of spacetime at the Planck scale: geometry and even topology fluctuating. Never observed. The purest case of the unmeasured.","src":"Wheeler (1955)","link":"https://en.wikipedia.org/wiki/Quantum_foam","spec":1},{"id":"emc2","t":"thermo","name":"Mass–energy equivalence","eq":"E = mc²","gloss":"Matter is stored energy. Stars run on converting about 0.7% of hydrogen's mass into energy during fusion to helium.","src":"Einstein (1905)","link":"https://en.wikipedia.org/wiki/Mass%E2%80%93energy_equivalence","spec":0},{"id":"friedmann","t":"thermo","name":"Friedmann expansion","eq":"(ȧ/a)² = 8πGρ/3 − kc²/a² + Λc²/3","gloss":"The equation of an expanding universe. The Λ term, the cosmological constant, is the simplest form of dark energy.","src":"Friedmann (1922); Lemaître (1927)","link":"https://en.wikipedia.org/wiki/Friedmann_equations","spec":0},{"id":"firststars","t":"thermo","name":"First stars","eq":"Population III, metal-free","gloss":"The first stars, massive and made only of primordial elements, light up within a few hundred million years. Not yet directly confirmed; JWST is searching.","src":"Theory: Abel, Bryan & Norman (2002); JWST","link":"https://en.wikipedia.org/wiki/Stellar_population","spec":1},{"id":"galaxies","t":"thermo","name":"Galaxy formation","eq":"","gloss":"Dark-matter halos collapse first; gas cools and falls in. JWST sees galaxies already formed at redshift above 10, a few hundred million years after the start.","src":"White & Rees (1978); JWST results (2022 onward)","link":"https://en.wikipedia.org/wiki/Galaxy_formation_and_evolution","spec":0},{"id":"crystal","t":"info","name":"Crystallization","eq":"one unit cell, repeated","gloss":"A crystal is order that carries little information: a single pattern repeated. Schrödinger's aperiodic crystal is the inversion. 'Informational crystallization' in this synthesis names order that also stores information.","src":"Bravais (1848); Schrödinger (1944)","link":"https://en.wikipedia.org/wiki/Crystal","spec":0},{"id":"abiogenesis","t":"life","name":"Abiogenesis","eq":"","gloss":"Life from chemistry, roughly 4 billion years ago. The mechanism is unknown; an RNA world is a leading hypothesis.","src":"Oparin (1924); Haldane (1929); Miller–Urey (1952)","link":"https://en.wikipedia.org/wiki/Abiogenesis","spec":0},{"id":"chemoton","t":"life","name":"Chemoton","eq":"metabolism + template + membrane","gloss":"Gánti's minimal living system: an autocatalytic metabolism, a replicating template and a membrane, each driving the others.","src":"Gánti, The Principles of Life (1971)","link":"https://en.wikipedia.org/wiki/Chemoton","spec":0},{"id":"nk","t":"life","name":"NK fitness landscape","eq":"N genes, K interactions → ruggedness","gloss":"Kauffman's tunable landscapes: raise K and the landscape grows rugged, with many local peaks for evolution to get stuck on or jump between.","src":"Kauffman & Levin (1987); Kauffman (1993)","link":"https://en.wikipedia.org/wiki/NK_model","spec":0},{"id":"turing","t":"life","name":"Turing patterns","eq":"∂X/∂t = D∇²X + F(X)","gloss":"Two reacting chemicals that diffuse at different rates break a uniform state into spots and stripes. Found first in chemistry (reaction–diffusion), then in developing bodies. Symmetry breaking paid for by dissipation: the equation at the center of the engine.","src":"Turing, 'The Chemical Basis of Morphogenesis' (1952)","link":"https://en.wikipedia.org/wiki/Turing_pattern","spec":0},{"id":"mendel","t":"life","name":"Mendelian inheritance","eq":"Aa × Aa → 1 AA : 2 Aa : 1 aa","gloss":"Discrete heritable factors, tallied in a Punnett square. Heredity as a combinatorial code.","src":"Mendel (1866); Punnett (1905)","link":"https://en.wikipedia.org/wiki/Mendelian_inheritance","spec":0},{"id":"multicell","t":"life","name":"Multicellularity","eq":"","gloss":"Cells cooperating as one body. It evolved independently many times; complex forms arose in animals, plants, fungi and some algae.","src":"Grosberg & Strathmann (2007)","link":"https://en.wikipedia.org/wiki/Multicellular_organism","spec":0},{"id":"cognition","t":"mind","name":"Conscious cognition","eq":"","gloss":"Nervous systems that model their world and themselves. Far older than language; how experience arises remains open.","src":"Nagel (1974); Chalmers (1995)","link":"https://en.wikipedia.org/wiki/Consciousness","spec":0},{"id":"kolmogorov","t":"info","name":"Kolmogorov complexity","eq":"K(x) = min{|p| : U(p) = x}","gloss":"The length of the shortest program that outputs x. Uncomputable in general; a string that cannot be compressed is random.","src":"Solomonoff (1964); Kolmogorov (1965); Chaitin (1966)","link":"https://en.wikipedia.org/wiki/Kolmogorov_complexity","spec":0},{"id":"bpe","t":"gate","name":"Tokenization","eq":"merge the most frequent pair, repeat","gloss":"Byte-pair encoding cuts text into learned sub-word tokens and a fixed vocabulary. Today's semiotic membrane: where language becomes countable matter for machines.","src":"Gage (1994); Sennrich, Haddow & Birch (2016)","link":"https://en.wikipedia.org/wiki/Byte_pair_encoding","spec":0},{"id":"neural","t":"info","name":"Neural matrices","eq":"y = σ(Wx + b)","gloss":"Networks as stacked weight matrices: McCulloch–Pitts neurons, the perceptron, backpropagation, the transformer.","src":"McCulloch & Pitts (1943); Rosenblatt (1958); Rumelhart et al. (1986); Vaswani et al. (2017)","link":"https://en.wikipedia.org/wiki/Neural_network_(machine_learning)","spec":0},{"id":"nescious","t":"mind","name":"Nescious matrices","eq":"","gloss":"A coinage from the source diagram, read here as systems that transform information without knowing: ledgers, markets, models. Not an established term.","src":"Source diagram","link":"","spec":1},{"id":"ai","t":"info","name":"Artificial intelligence","eq":"~10¹⁰ erg s⁻¹ g⁻¹ at the chip (estimate)","gloss":"Learned models running on accelerators. A current accelerator draws roughly 700 W through well under a gram of active silicon, so its energy rate density sits far above a brain's. That figure is an estimate made for this map.","src":"Estimate from published accelerator power and die size","link":"https://en.wikipedia.org/wiki/Artificial_intelligence","spec":0},{"id":"p2pmesh","t":"info","name":"P2P meshes","eq":"every node both client and server","gloss":"Networks without a center: file sharing, mesh radio, federated and distributed protocols.","src":"Napster (1999); BitTorrent (2001); Bitcoin (2008)","link":"https://en.wikipedia.org/wiki/Peer-to-peer","spec":0},{"id":"aigrids","t":"info","name":"Distributed AI grids","eq":"","gloss":"Training and inference spread across data centers and devices. Near-future scale-up of the technosphere's computation.","src":"Industry trend, 2020s","link":"https://en.wikipedia.org/wiki/Distributed_artificial_intelligence","spec":1},{"id":"engine","t":"gate","name":"Agentic entropy engine","eq":"ΔA ≥ 0  while  ΔS_total ≥ 0","gloss":"The synthesis as a machine: energy gradients feed a loop in which dissipation builds records, records build models, and models redirect dissipation. ΔA ≥ 0 (agentic order accumulating locally) is a postulate of this map, not physics.","src":"This synthesis, after the three source diagrams","link":"","spec":1},{"id":"phiE","t":"gate","name":"Φ_E energy gradient","eq":"∇T, ∇μ → work","gloss":"Operator: a difference in temperature or chemical potential that can do work. Every loop on this map starts at one.","src":"Carnot (1824); Gibbs (1876)","link":"https://en.wikipedia.org/wiki/Exergy","spec":0},{"id":"phiR","t":"gate","name":"Φ_R recursive feedback","eq":"output → input","gloss":"Operator: a product of the process becomes a cause of the process. Autocatalysis, heredity, learning.","src":"Wiener, Cybernetics (1948)","link":"https://en.wikipedia.org/wiki/Feedback","spec":0},{"id":"phiD","t":"gate","name":"Φ_D directed intervention","eq":"goal → action → gradient","gloss":"Operator: an agent spends energy to steer a gradient toward a goal. Engineering, agriculture, policy, code.","src":"This synthesis","link":"","spec":1},{"id":"phiL","t":"gate","name":"Φ_L retrocausal linkage","eq":"future boundary → present event","gloss":"Operator: a future state treated as a condition on the present. Rigorous in some physics formalisms; mythic or speculative elsewhere.","src":"This synthesis, after absorber theory","link":"","spec":1},{"id":"akasha","t":"myth","name":"Akasha","eq":"Φ_A","gloss":"Sanskrit ākāśa, space or ether. Theosophy made it the 'Akashic record' of everything that has happened: a total trace outside time.","src":"Blavatsky (late 19th c.)","link":"https://en.wikipedia.org/wiki/Akashic_records","spec":0},{"id":"platonic","t":"myth","name":"Platonic forms","eq":"Φ_P","gloss":"Eternal patterns of which things are copies. Here: the pull of a pattern that seems to exist before its first instance.","src":"Plato, Republic and Timaeus","link":"https://en.wikipedia.org/wiki/Theory_of_forms","spec":0},{"id":"jung","t":"myth","name":"Collective unconscious","eq":"Φ_C","gloss":"Jung: an inherited layer of the psyche shared by all humans, structured by archetypes. Influential; not a scientific finding.","src":"Jung (1916 onward)","link":"https://en.wikipedia.org/wiki/Collective_unconscious","spec":0},{"id":"bousso","t":"thermo","name":"Causal entropic principle","eq":"Λ predicted from entropy produced in a causal diamond","gloss":"Bousso and colleagues weighted possible universes by the entropy produced inside an observer's causal diamond, mostly by dust heated by starlight, and predicted a cosmological constant close to the observed one. A real, quantitative bridge between entropy production, observers and dark energy.","src":"Bousso, Harnik, Kribs & Perez, Phys. Rev. D (2007)","link":"https://arxiv.org/abs/hep-th/0702115","spec":1},{"id":"wissner","t":"info","name":"Causal entropic forces","eq":"F = T_c ∇S_c(X, τ)","gloss":"Wissner-Gross and Freer: a system pushed toward states that keep the most future paths open shows tool-use-like and cooperative behaviour in simulation. A physical, testable version of 'the future pulls the present', with no backward causation. Contested.","src":"Wissner-Gross & Freer, Phys. Rev. Lett. 110, 168702 (2013)","link":"https://doi.org/10.1103/PhysRevLett.110.168702","spec":1},{"id":"kolchinsky","t":"info","name":"Semantic information","eq":"information that keeps a system viable","gloss":"Kolchinsky and Wolpert: semantic information is the part of a system's information about its environment that causally helps it stay out of equilibrium. Scramble it and viability drops. The most direct formal candidate for 'agentic' information.","src":"Kolchinsky & Wolpert, Interface Focus (2018)","link":"https://doi.org/10.1098/rsfs.2018.0041","spec":1},{"id":"still","t":"info","name":"Thermodynamics of prediction","eq":"β⟨W_diss⟩ = I_mem − I_pred","gloss":"Still, Sivak, Bell and Crooks: a driven system dissipates energy in proportion to the information it keeps that does not help predict the future. Efficiency requires prediction: modelling and thermodynamics are bound together.","src":"Still, Sivak, Bell & Crooks, Phys. Rev. Lett. 109, 120604 (2012)","link":"https://doi.org/10.1103/PhysRevLett.109.120604","spec":0},{"id":"energese_l","t":"odum","name":"Energy Systems Language","eq":"source · storage · sink · producer · consumer · interaction","gloss":"Odum's symbol grammar for drawing any system as sources, flows, storages, interactions and heat sinks; he called it energese. The band above redraws the engine in it.","src":"Odum, Environment, Power, and Society (1971)","link":"https://en.wikipedia.org/wiki/Energy_Systems_Language","spec":0},{"id":"emergy","t":"odum","name":"Emergy","eq":"Em = Σ τᵢ · Eᵢ   [sej]","gloss":"Embodied solar energy: all the energy, direct and indirect, used to make something, expressed as solar emjoules. The word was suggested by David Scienceman in 1983. Widely used in ecological accounting, and criticized for its assumptions (e.g. Hau & Bakshi 2004).","src":"Odum, Environmental Accounting (1996)","link":"https://en.wikipedia.org/wiki/Emergy","spec":1},{"id":"transformity","t":"odum","name":"Transformity","eq":"τ = emergy ⁄ available energy   [sej/J]","gloss":"Rises up the energy hierarchy as many joules of sunlight become fewer joules of fuel, food, services and information. Rough orders of magnitude: sunlight 1, wind ~10³, rain ~10⁴, fuels ~10⁴–10⁵, electricity ~10⁵, food ~10⁶, services and information higher. Values depend on the global baseline used. A candidate measured axis for 'information regime'.","src":"Odum (1996)","link":"https://en.wikipedia.org/wiki/Emergy","spec":1},{"id":"mpp","t":"odum","name":"Maximum power principle","eq":"useful power → max, often near 50% efficiency","gloss":"Lotka: selection favours systems that increase the energy flux through them. Odum and Pinkerton: systems that prevail maximize useful power, often at intermediate efficiency. This plate's H1 is a descendant; this is its prior art.","src":"Lotka, PNAS (1922); Odum & Pinkerton, American Scientist (1955)","link":"https://en.wikipedia.org/wiki/Maximum_power_principle","spec":1},{"id":"hierarchy","t":"odum","name":"Energy hierarchy","eq":"many low-quality J → few high-quality J → feedback","gloss":"Odum tied self-organization, transformity and information together: high-transformity units, information above all, feed back to amplify the flows that produced them. The engine's recursive feedback, already drawn by Odum.","src":"Odum, 'Self-organization, transformity, and information', Science (1988)","link":"https://doi.org/10.1126/science.242.4882.1132","spec":1},{"id":"pulsing","t":"odum","name":"Pulsing paradigm","eq":"growth → climax → descent → low restoration","gloss":"Systems accumulate storages and then release them in pulses rather than holding a steady state. Odum and Odum applied it to civilization. The loop drawn as a pulse.","src":"Odum & Odum, A Prosperous Way Down (2001)","link":"https://en.wikipedia.org/wiki/Howard_T._Odum","spec":1},{"id":"ratios","t":"odum","name":"Emergy indices","eq":"EYR = Y ⁄ F     ELR = (N + F) ⁄ R","gloss":"Emergy yield ratio and environmental loading ratio: what a process returns for what the economy invests, and how hard it leans on non-renewable and purchased inputs. The accounting a totalizer runs.","src":"Brown & Ulgiati, Ecological Engineering (1997)","link":"https://en.wikipedia.org/wiki/Emergy","spec":1},{"id":"w_descent","t":"work","name":"THE DESCENT","eq":"emergy tiers → cosmological floor","gloss":"A scrolling fall through one object's lineage of expenditure: object-specific emergy tiers until solar emjoules give out, then the same cosmological tiers for every object, down to the Penrose floor. The left lobe, experienced as a fall.","src":"Our instrument (Opposite City)","link":"","spec":0},{"id":"w_totalizer","t":"work","name":"Emergy totalizer & energese transcoder","eq":"EYR · ELR · sej per dollar","gloss":"Instruments that redraw any input in Odum's symbol grammar and run emergy accounting.","src":"Our instrument (Opposite City)","link":"","spec":0},{"id":"w_accursed","t":"work","name":"THE ACCURSED SHARE","eq":"price = cost + pay + profit shear","gloss":"Decomposes a price into what it cost, what it paid, and what was sheared off as profit: the economy's heat sink, measured.","src":"Our instrument (Opposite City)","link":"","spec":0},{"id":"w_reshimu","t":"work","name":"RESHIMU","eq":"+kT ln 2 per reading; pay it back on erasure","gloss":"A Szilard engine made of words. Each reading extracts kT ln 2 of work; clearing the notebook returns it as heat. In expanding mode nothing is erased and the ledger never returns to zero.","src":"Our instrument (Opposite City)","link":"","spec":0},{"id":"w_apophasis","t":"work","name":"APOPHASIS","eq":"surprisal in bits, per word","gloss":"Replays the possibility field a sentence declined at every position. The unmeasured side of the semiotic membrane, made visible. Live.","src":"Our instrument (Opposite City)","link":"https://opposite.city/apophasis/","spec":0},{"id":"w_pentimento","t":"work","name":"PENTIMENTO","eq":"choose from the logit lens","gloss":"A browser-local language model in which you pick each next word from the model's possibility field. Choice as measurement.","src":"Our instrument (Opposite City)","link":"","spec":0},{"id":"w_dof","t":"work","name":"Degrees of semantic freedom","eq":"free word = unspent bit","gloss":"Measures how pinned each word in a sentence is. Ambiguity as information not yet erased.","src":"Our instrument (Opposite City)","link":"","spec":0},{"id":"w_isopleth","t":"work","name":"ISOPLETH","eq":"extent × duration, dispersal-velocity lines","gloss":"A moving scale–space (Stommel) diagram of technology. How far and how fast patterns spread: P2P persistence made measurable.","src":"Our instrument (Opposite City)","link":"","spec":0},{"id":"w_range","t":"work","name":"RANGE (planned)","eq":"technologies as species","gloss":"A biogeography of technique: origins, dispersal fronts, endemism and extinction for named technologies.","src":"Our instrument (Opposite City)","link":"","spec":0},{"id":"w_bulla","t":"work","name":"Bulla → token","eq":"clay token → alphabet → coin → LLM token","gloss":"The recurring cosmological frame of the practice: one lineage of counting-matter.","src":"Our instrument (Opposite City)","link":"","spec":0},{"id":"w_agri","t":"work","name":"Agriculture as the vector","eq":"surplus sunlight → counting → writing","gloss":"Writing and number arise to count agricultural surplus, and that surplus is captured sunlight: language as a solar product.","src":"Our instrument (Opposite City)","link":"","spec":0},{"id":"w_lgtc","t":"work","name":"LGTC doctrine","eq":"communication = liturgy","gloss":"Communication in any form is liturgy. Tzimtzum is read as expansion ('tzimtzumutzmitz'): an expanding universe never pays the erasure tax.","src":"Our instrument (Opposite City)","link":"","spec":0},{"id":"w_folk","t":"work","name":"Folk motif classifiers","eq":"motif index ↔ solar economy","gloss":"Motif-index and tale-type instruments, with a proposed mapping of story motifs onto the energy economies that carry them.","src":"Our instrument (Opposite City)","link":"","spec":0},{"id":"w_atproto","t":"work","name":"ATProto LLM & ACCRUAL","eq":"inference as posts; participation as equity","gloss":"A language model run in the open on a peer-to-peer protocol, with ownership accruing to participation. The P2P lobe as infrastructure.","src":"Our instrument (Opposite City)","link":"","spec":0},{"id":"w_sacred","t":"work","name":"One glorious sacred expenditure","eq":"the practice as ~40 instruments","gloss":"The whole practice rebuilt as a single monument of live instruments, with expenditure as the organizing law.","src":"Our instrument (Opposite City)","link":"","spec":0},{"id":"cod","t":"gate","name":"Conservation of difference","eq":"nothing erased, only spread thinner","gloss":"The controlling figure of this practice: difference is never destroyed, only redistributed. Physics shadows: unitarity (quantum information is scrambled, not lost, as the Page curve suggests), Liouville's theorem (phase-space volume is conserved), and Landauer (erasure is where the cost lives).","src":"This synthesis: the practice's controlling figure","link":"","spec":1},{"id":"jantsch","t":"totality","name":"Jantsch: self-organizing universe","eq":"dissipative structures, cosmos → mind","gloss":"Scales Prigogine's dissipative structures from cosmology through life to mind and culture. The closest existing precedent for this plate. Expands it toward the co-evolution of micro and macro scales.","src":"Jantsch, The Self-Organizing Universe (1980)","link":"https://en.wikipedia.org/wiki/Erich_Jantsch","spec":0},{"id":"bighistory","t":"totality","name":"Big History","eq":"thresholds of complexity under Goldilocks conditions","gloss":"13.8 billion years told as thresholds of rising complexity, with energy flow as the through-line. Fits the vector; expands it into a teachable sequence of named thresholds.","src":"Christian, Maps of Time (2004); Spier, Big History and the Future of Humanity (2010)","link":"https://en.wikipedia.org/wiki/Big_History","spec":1},{"id":"whitehead","t":"totality","name":"Whitehead: process","eq":"actual occasions · concrescence · lure","gloss":"Reality as occasions that take up their past and add novelty; God acts as a lure, not a pusher. Fits the attractors without backward causation; expands the loop into a metaphysics of becoming.","src":"Whitehead, Process and Reality (1929)","link":"https://en.wikipedia.org/wiki/Process_and_Reality","spec":0},{"id":"hegel","t":"totality","name":"Hegel: spirit knowing itself","eq":"the true is the whole","gloss":"Spirit comes to know itself through its own history. Fits a loop that reads its own records; expands the map toward self-knowledge as its end.","src":"Hegel, Phenomenology of Spirit (1807)","link":"https://en.wikipedia.org/wiki/The_Phenomenology_of_Spirit","spec":0},{"id":"hofstadter","t":"totality","name":"Strange loops","eq":"a level-crossing return to itself","gloss":"A system that moves through levels and arrives back at itself: Gödel's self-reference, Escher's hands, Bach's canons. The figure for a map that expands its meaning toward itself.","src":"Hofstadter, Gödel, Escher, Bach (1979)","link":"https://en.wikipedia.org/wiki/Strange_loop","spec":0},{"id":"dg","t":"totality","name":"Deleuze & Guattari: strata","eq":"physico-chemical · organic · alloplastic","gloss":"'The Geology of Morals' sorts reality into three strata, each double-articulated. They map almost exactly onto the three lobes, and the body without organs onto the unmeasured.","src":"Deleuze & Guattari, A Thousand Plateaus (1980)","link":"https://en.wikipedia.org/wiki/A_Thousand_Plateaus","spec":0},{"id":"luhmann","t":"totality","name":"Luhmann: social systems","eq":"only communication communicates","gloss":"Society as an autopoietic system made of communications, not people. Fits the semiotic membrane and communication as the unit that circulates.","src":"Luhmann, Social Systems (1984)","link":"https://en.wikipedia.org/wiki/Niklas_Luhmann","spec":0},{"id":"sefirot","t":"totality","name":"Lurianic cycle","eq":"tzimtzum → shevirat ha-kelim → tikkun","gloss":"Contraction, the breaking of the vessels, and repair. Contraction as the unmeasured, breaking as symmetry breaking at the crossover, repair as recursive feedback.","src":"Isaac Luria via Hayyim Vital (16th c.)","link":"https://en.wikipedia.org/wiki/Lurianic_Kabbalah","spec":0},{"id":"indra","t":"totality","name":"Indra's net","eq":"every jewel reflects every other","gloss":"Huayan Buddhism's infinite net with a jewel at each knot, each reflecting all the others: a total peer-to-peer image, some 1,300 years old.","src":"Fazang (7th c.); Avatamsaka Sutra","link":"https://en.wikipedia.org/wiki/Indra%27s_net","spec":0},{"id":"spinoza","t":"totality","name":"Spinoza: one substance","eq":"Deus sive Natura","gloss":"One substance, God or Nature, with infinitely many attributes. Fits the refusal to split physics from theology; a single field behind all three lobes.","src":"Spinoza, Ethics (1677)","link":"https://en.wikipedia.org/wiki/Ethics_(Spinoza_book)","spec":0},{"id":"leibniz","t":"totality","name":"Leibniz: monads","eq":"windowless mirrors of the whole","gloss":"Units without windows, each mirroring the universe from its own point of view, plus the dream of a universal calculus of thought. A contrast case for P2P: reflection without exchange.","src":"Leibniz, Monadology (1714)","link":"https://en.wikipedia.org/wiki/Monadology","spec":0},{"id":"llull","t":"totality","name":"Llull: Ars Magna","eq":"combinatorial wheels","gloss":"Rotating wheels that combine divine attributes to generate true statements: an early language machine. Extends the tokenization membrane back to the 1300s.","src":"Ramon Llull, Ars Magna (c. 1305)","link":"https://en.wikipedia.org/wiki/Ramon_Llull","spec":0},{"id":"borges","t":"totality","name":"The Library of Babel","eq":"every possible book","gloss":"A library holding every possible book. Almost all of it is noise, and meaning is a vanishing island. The unmeasured field and the declined possibilities of language.","src":"Borges (1941)","link":"https://en.wikipedia.org/wiki/The_Library_of_Babel","spec":0},{"id":"ruliad","t":"totality","name":"Wolfram: the ruliad","eq":"the limit of all computations","gloss":"The entangled limit of all possible computations. Observers with bounded computation sample it, and physics follows from how they sample: the measurement gate, computationally.","src":"Wolfram (2021)","link":"https://writings.stephenwolfram.com/2021/11/the-concept-of-the-ruliad/","spec":1},{"id":"constructor_th","t":"totality","name":"Constructor theory","eq":"possible and impossible tasks","gloss":"Physics restated as which transformations can and cannot be performed, with constructor theories of information and of life. A rigorous language for agency and records.","src":"Deutsch (2013); Deutsch & Marletto (2015); Marletto (2015)","link":"https://en.wikipedia.org/wiki/Constructor_theory","spec":1},{"id":"tegmark","t":"totality","name":"Mathematical universe","eq":"reality = mathematical structure","gloss":"The claim that physical reality is a mathematical structure: the Platonic node, stated as physics.","src":"Tegmark (2008)","link":"https://en.wikipedia.org/wiki/Mathematical_universe_hypothesis","spec":1},{"id":"miller","t":"totality","name":"Living Systems","eq":"20 subsystems × 8 levels","gloss":"Matter-energy and information-processing subsystems found at every level from cell to supranational system. A ready-made cross-level checklist for the scale axis.","src":"J. G. Miller, Living Systems (1978)","link":"https://en.wikipedia.org/wiki/Living_systems","spec":1},{"id":"beer","t":"totality","name":"Viable System Model","eq":"viable systems within viable systems","gloss":"Every viable system contains, and is contained in, viable systems with the same five functions. Recursion as a design rule.","src":"Beer, Brain of the Firm (1972)","link":"https://en.wikipedia.org/wiki/Viable_system_model","spec":1},{"id":"bogdanov","t":"totality","name":"Tektology","eq":"a universal science of organization","gloss":"A general science of organization, decades before cybernetics and systems theory.","src":"Bogdanov (1912–1917)","link":"https://en.wikipedia.org/wiki/Tektology","spec":0},{"id":"fuller","t":"totality","name":"Synergetics","eq":"whole-system behaviour","gloss":"The geometry of thinking: tetrahedral coordinates and behaviour of whole systems unpredicted by their parts.","src":"Fuller, Synergetics (1975)","link":"https://en.wikipedia.org/wiki/Synergetics_(Fuller)","spec":0},{"id":"moore","t":"totality","name":"World-ecology","eq":"capitalism organizes nature","gloss":"Capitalism as a way of organizing nature that depends on cheap natures. Fits the accursed share and the emergy that markets do not pay for.","src":"Moore, Capitalism in the Web of Life (2015)","link":"https://en.wikipedia.org/wiki/Jason_W._Moore","spec":0},{"id":"gurdjieff","t":"totality","name":"Ray of Creation","eq":"worlds stepped down in octaves","gloss":"An esoteric energy hierarchy: worlds descend from the Absolute in ratios, with 'shocks' needed at intervals. Close to Laffoley's world.","src":"Ouspensky, In Search of the Miraculous (1949)","link":"https://en.wikipedia.org/wiki/Fourth_Way","spec":0},{"id":"alchemy","t":"totality","name":"The Great Work","eq":"nigredo → albedo → citrinitas → rubedo","gloss":"Dissolution to perfection as a phase sequence: a mythic template for the loop's stages.","src":"Hermetic and alchemical tradition","link":"https://en.wikipedia.org/wiki/Magnum_opus_(alchemy)","spec":0},{"id":"warburg","t":"totality","name":"Atlas & Mundaneum","eq":"panels and cards for all of culture","gloss":"Warburg's Mnemosyne Atlas (1924–29) and Otlet's Mundaneum: attempts to hold the whole of culture on panels and index cards. Form precedents for a total, navigable plate.","src":"Warburg; Otlet","link":"https://en.wikipedia.org/wiki/Aby_Warburg","spec":0},{"id":"gibbs","t":"chem","name":"Gibbs free energy","eq":"ΔG = ΔH − TΔS","gloss":"A reaction runs forward only if it lowers free energy. Life couples unfavourable reactions to favourable ones; this is the book-keeping of every metabolism.","src":"Gibbs (1876–78)","link":"https://en.wikipedia.org/wiki/Gibbs_free_energy","spec":0},{"id":"arrhenius","t":"chem","name":"Reaction rates","eq":"k = A · e^(−Eₐ ⁄ RT)","gloss":"Rates rise steeply with temperature and fall with the height of the energy barrier. Catalysts and enzymes lower the barrier without changing ΔG: they choose which gradients get spent, and when.","src":"Arrhenius (1889)","link":"https://en.wikipedia.org/wiki/Arrhenius_equation","spec":0},{"id":"autocatalysis","t":"chem","name":"Autocatalysis","eq":"A + B → 2B","gloss":"A product speeds up its own production: the chemical root of replication and runaway growth. The formose reaction makes sugars this way.","src":"Butlerov (1861); Kauffman on autocatalytic sets (1986)","link":"https://en.wikipedia.org/wiki/Autocatalysis","spec":0},{"id":"bzreact","t":"chem","name":"Belousov–Zhabotinsky reaction","eq":"bromate oxidizes malonic acid; cerium or ferroin catalyst","gloss":"A chemical clock. Held far from equilibrium it oscillates and forms travelling spirals. Belousov's result was at first rejected because such oscillation was thought impossible.","src":"Belousov (1951, published 1959); Zhabotinsky (1964)","link":"https://en.wikipedia.org/wiki/Belousov%E2%80%93Zhabotinsky_reaction","spec":0},{"id":"chemiosmosis","t":"chem","name":"Chemiosmosis","eq":"proton-motive force ≈ 150–200 mV","gloss":"Cells store energy as a proton gradient across a membrane and spend it through ATP synthase, a rotary motor. Every living thing runs on a membrane gradient: the semiotic membrane has a literal ancestor.","src":"Mitchell (1961); Nobel Prize (1978)","link":"https://en.wikipedia.org/wiki/Chemiosmosis","spec":0},{"id":"atp","t":"chem","name":"ATP","eq":"ATP → ADP + Pᵢ    ΔG°′ ≈ −30.5 kJ/mol","gloss":"The cell's energy currency, recycled constantly: a resting human turns over roughly their own body weight in ATP each day.","src":"Lipmann (1941)","link":"https://en.wikipedia.org/wiki/Adenosine_triphosphate","spec":0},{"id":"krebs","t":"chem","name":"Citric acid cycle","eq":"acetyl-CoA → 2 CO₂ + reduced carriers","gloss":"The central loop of aerobic metabolism. Run in reverse (the reductive cycle) it fixes carbon and is a candidate for very early metabolism. A literal engine loop inside the biological lobe.","src":"Krebs & Johnson (1937)","link":"https://en.wikipedia.org/wiki/Citric_acid_cycle","spec":0},{"id":"origin_metab","t":"chem","name":"Metabolism first","eq":"mineral surfaces, vent gradients","gloss":"Proposals that life began as self-sustaining chemistry on mineral surfaces or at alkaline hydrothermal vents, before genes. Debated against RNA-world views.","src":"Wächtershäuser (1988); Russell & Martin; Lane","link":"https://en.wikipedia.org/wiki/Iron%E2%80%93sulfur_world_hypothesis","spec":1},{"id":"photosynthesis","t":"chem","name":"Photosynthesis","eq":"6CO₂ + 6H₂O + light → C₆H₁₂O₆ + 6O₂","gloss":"Sunlight captured into chemical bonds. Field efficiency is low, a few percent at most, yet it powers nearly every food web and, through fossil fuels, most of the technosphere.","src":"Ingenhousz (1779); Calvin cycle (1950s)","link":"https://en.wikipedia.org/wiki/Photosynthesis","spec":0},{"id":"goe","t":"chem","name":"Great Oxidation Event","eq":"O₂ rises ~2.4–2.1 Gyr ago","gloss":"Photosynthetic oxygen transformed atmosphere, oceans and minerals: life rewriting geology.","src":"Geochemical record; Holland (2006)","link":"https://en.wikipedia.org/wiki/Great_Oxidation_Event","spec":0},{"id":"kleiber","t":"chem","name":"Metabolic scaling","eq":"B ∝ M^(3/4)","gloss":"Metabolic rate scales roughly with the three-quarter power of body mass. West, Brown and Enquist explained it with space-filling transport networks; the exponent is still debated.","src":"Kleiber (1932); West, Brown & Enquist (1997)","link":"https://en.wikipedia.org/wiki/Kleiber%27s_law","spec":1},{"id":"trophic","t":"chem","name":"Trophic efficiency","eq":"~10% passes to the next level","gloss":"Only a small share of the energy at one feeding level reaches the next, which caps the height of food pyramids. A founding study of ecosystem energetics, in Odum's lineage.","src":"Lindeman (1942)","link":"https://en.wikipedia.org/wiki/Ecological_efficiency","spec":0},{"id":"brainpower","t":"chem","name":"Brain power budget","eq":"~20 W, about 20% of resting energy","gloss":"The human brain runs on roughly twenty watts, a large share of the body's resting budget. A benchmark for comparing biological and machine information processing.","src":"Raichle & Gusnard (2002)","link":"https://en.wikipedia.org/wiki/Brain","spec":0},{"id":"homochirality","t":"chem","name":"Homochirality","eq":"L-amino acids, D-sugars","gloss":"Life uses one hand of its molecules. How that symmetry broke is unsolved: another symmetry breaking at the crossover.","src":"Pasteur (1848); open problem","link":"https://en.wikipedia.org/wiki/Homochirality","spec":0},{"id":"b2fh","t":"chem","name":"Element forging","eq":"H → He → C, O … Fe; heavier by neutron capture","gloss":"Stars forge elements up to iron; neutron capture makes heavier ones, including in neutron-star mergers observed in 2017. Chemistry's alphabet is written in stars.","src":"Burbidge, Burbidge, Fowler & Hoyle (1957); GW170817","link":"https://en.wikipedia.org/wiki/Nucleosynthesis","spec":0},{"id":"periodic","t":"chem","name":"Periodic table","eq":"ordered by atomic number; properties recur","gloss":"Mendeleev left gaps and predicted the missing elements: a crystallized record of the stellar alphabet.","src":"Mendeleev (1869)","link":"https://en.wikipedia.org/wiki/Periodic_table","spec":0},{"id":"haber","t":"chem","name":"Industrial nitrogen fixation","eq":"N₂ + 3H₂ → 2NH₃","gloss":"Haber–Bosch ammonia feeds roughly half of humanity and uses on the order of 1–2% of world energy: the technosphere's metabolism.","src":"Haber (1909); Bosch (1913)","link":"https://en.wikipedia.org/wiki/Haber_process","spec":0},{"id":"socmetab","t":"chem","name":"Social metabolism","eq":"material and energy flows of societies","gloss":"Industrial ecology measures what a society takes in, transforms and excretes, treating the economy as an organism. Odum's accounting, extended to cities and nations.","src":"Fischer-Kowalski (1998)","link":"https://en.wikipedia.org/wiki/Social_metabolism","spec":0},{"id":"w_bz","t":"work","name":"BZ (live)","eq":"reaction–diffusion on a torus","gloss":"A live Belousov–Zhabotinsky field: bromate oxidation held far from equilibrium, spiral cores as phase singularities.","src":"Our instrument (Opposite City)","link":"https://opposite.city/bz/","spec":0},{"id":"w_chiral","t":"work","name":"CHIRAL","eq":"a mirrored hand inside the phone","gloss":"A mirror-image hand reaches out from the screen and tracks your scrolling: handedness as the subject.","src":"Our instrument (Opposite City)","link":"","spec":0},{"id":"motif_index","t":"motif","name":"Thompson Motif-Index","eq":"23 lettered classes, A to Z","gloss":"Stith Thompson's index of recurring story elements, lettered A (mythological) to Z (miscellaneous), with no classes I, O or Y. A taxonomy of narrative, as the periodic table is a taxonomy of matter.","src":"Thompson, Motif-Index of Folk-Literature (1932–36; rev. 1955–58)","link":"https://en.wikipedia.org/wiki/Motif-Index_of_Folk-Literature","spec":0},{"id":"atu","t":"motif","name":"ATU tale types","eq":"ATU 1 to 2399","gloss":"The Aarne–Thompson–Uther index classifies whole plots (ATU 510A is Cinderella). Uther's 2004 revision covers about 2,400 types.","src":"Aarne (1910); Thompson (1928, 1961); Uther (2004)","link":"https://en.wikipedia.org/wiki/Aarne%E2%80%93Thompson%E2%80%93Uther_Index","spec":0},{"id":"m_egg","t":"motif","name":"A641 Cosmic egg","eq":"","gloss":"The universe hatches from an egg. On the plate: the low-entropy start and inflation.","src":"Thompson A641","link":"https://en.wikipedia.org/wiki/World_egg","spec":0},{"id":"m_parents","t":"motif","name":"A625 World parents","eq":"","gloss":"Sky-father and earth-mother, pushed apart to make room for the world: creation as a split. On the plate: symmetry breaking and tzimtzum.","src":"Thompson A625","link":"https://en.wikipedia.org/wiki/Motif-Index_of_Folk-Literature","spec":0},{"id":"m_fire","t":"motif","name":"A1415 Theft of fire","eq":"","gloss":"A culture hero steals fire for people (Prometheus, Māui, Raven). On the plate: an energy gradient taken into the technosphere.","src":"Thompson A1415","link":"https://en.wikipedia.org/wiki/Prometheus","spec":0},{"id":"m_deluge","t":"motif","name":"A1010 Deluge","eq":"","gloss":"The world is flooded and remade. On the plate: the pulsing paradigm's descent and restoration.","src":"Thompson A1010","link":"https://en.wikipedia.org/wiki/Flood_myth","spec":0},{"id":"m_paradise","t":"motif","name":"A1331 Paradise lost","eq":"","gloss":"An original ordered state is lost and cannot be recovered. On the plate: the arrow of time, borrowed from the low-entropy past.","src":"Thompson A1331","link":"https://en.wikipedia.org/wiki/Golden_Age","spec":0},{"id":"m_prophecy","t":"motif","name":"M300 Prophecies","eq":"","gloss":"The future is announced and then fulfilled despite resistance. On the plate: the attractors and hyperstition.","src":"Thompson M300","link":"https://en.wikipedia.org/wiki/Prophecy","spec":0},{"id":"m_numbers","t":"motif","name":"Z71 Formulistic numbers","eq":"","gloss":"Threes, sevens and twelves recur across tales. On the plate: crystallization, a pattern repeated with little new information.","src":"Thompson Z71","link":"https://en.wikipedia.org/wiki/Motif-Index_of_Folk-Literature","spec":0},{"id":"m_clay","t":"motif","name":"A1241 Humans made from clay","eq":"","gloss":"People shaped from earth. On the plate: abiogenesis and the chemoton, and clay again in the bulla lineage.","src":"Thompson A1241","link":"https://en.wikipedia.org/wiki/Motif-Index_of_Folk-Literature","spec":0},{"id":"m_name","t":"motif","name":"ATU 500 The Name of the Helper","eq":"","gloss":"Rumpelstiltskin: learning the true name breaks the helper's power. On the plate: the measurement gate, where naming is control.","src":"ATU 500","link":"https://en.wikipedia.org/wiki/Rumpelstiltskin","spec":0},{"id":"m_smith","t":"motif","name":"ATU 330 The Smith and the Devil","eq":"","gloss":"A smith bargains with the devil and outwits him; phylogenetic analysis suggests the tale may be about 6,000 years old. On the plate: Maxwell's demon, a bargain with an agent that sorts.","src":"ATU 330; da Silva & Tehrani (2016)","link":"https://en.wikipedia.org/wiki/The_Smith_and_the_Devil","spec":0},{"id":"m_magician","t":"motif","name":"ATU 325 The Magician and His Pupil","eq":"","gloss":"A duel of shape-shifting transformations. On the plate: morphogenesis and the transformations of the loop.","src":"ATU 325","link":"https://en.wikipedia.org/wiki/Aarne%E2%80%93Thompson%E2%80%93Uther_Index","spec":0},{"id":"m_cinder","t":"motif","name":"ATU 510A Cinderella","eq":"","gloss":"Hidden worth revealed by a test. On the plate: selection as a measurement that reveals function.","src":"ATU 510A","link":"https://en.wikipedia.org/wiki/Cinderella","spec":0},{"id":"m_hunt","t":"motif","name":"The Cosmic Hunt","eq":"","gloss":"A hunter pursues an animal that becomes a constellation, often the Big Dipper. Some researchers trace its spread back to the Palaeolithic. A story that behaves like a P2P pattern.","src":"d'Huy (2012–2016)","link":"https://en.wikipedia.org/wiki/Cosmic_Hunt","spec":1},{"id":"phylofolk","t":"motif","name":"Phylogenetic folklore","eq":"tales as lineages, dated like languages","gloss":"Tale types treated like genes or languages and dated with phylogenetic methods. The story layer becomes measurable dispersal.","src":"da Silva & Tehrani, Royal Society Open Science (2016)","link":"https://doi.org/10.1098/rsos.150645","spec":1},{"id":"berezkin","t":"motif","name":"World motif catalogue","eq":"motifs mapped by region","gloss":"Berezkin's analytical catalogue maps where mythological motifs occur worldwide, allowing statistical study of ancient migrations.","src":"Berezkin (from the 1990s)","link":"https://en.wikipedia.org/wiki/Yuri_Berezkin","spec":1},{"id":"witzel","t":"motif","name":"Laurasian storyline","eq":"creation → gods → heroes → end of the world","gloss":"Witzel argues that many Eurasian and American mythologies share one storyline from creation to final destruction: a mythic totality running parallel to this plate's arrow. Contested.","src":"Witzel, The Origins of the World's Mythologies (2012)","link":"https://en.wikipedia.org/wiki/Michael_Witzel","spec":1}],"relations":[["clausius","boltzmann","lineage"],["boltzmann","shannon","lineage"],["shannon","jaynes","lineage"],["boltzmann","jaynes","lineage"],["demon","szilard","lineage"],["szilard","landauer","lineage"],["szilard","brillouin","lineage"],["landauer","page","lineage"],["shannon","bateson","lineage"],["peirce","derrida","lineage"],["derrida","stiegler","lineage"],["bulla","stiegler","lineage"],["bulla","shannon","lineage"],["schrodinger","dna","lineage"],["schrodinger","autopoiesis","lineage"],["prigogine","england","lineage"],["prigogine","stars","lineage"],["england","assembly","lineage"],["assembly","funcinfo","lineage"],["funcinfo","mineral","lineage"],["mineral","gaia","lineage"],["gaia","vernadsky","lineage"],["vernadsky","noosphere","lineage"],["autopoiesis","friston","lineage"],["tononi","friston","lineage"],["past","stars","lineage"],["past","bbn","lineage"],["inflation","cmb","lineage"],["cmb","darkages","lineage"],["darkages","stars","lineage"],["stars","chaisson","lineage"],["chaisson","kardashev","lineage"],["bh","h ts.","omega":"Recast as convergence: test whether independent lineages, biological and technological, converge on the same solutions more often than chance predicts.","hyperobject":"Not a scientific claim. It can be operationalized as systems whose correlation length and time exceed an observer's measurement window.","absorber":"Retrocausality is testable only in quantum settings (weak measurement, two-state vector formalism). Do not extend it to cosmic teleology without a new prediction.","darkenergy":"Follow DESI, Euclid and Rubin for time-varying dark energy. Any link to agentic entropy needs a quantitative prediction first.","england":"Driven self-assembly experiments: check whether configurations that absorb more work become more probable, as the relation predicts.","friston":"Compare free-energy models with rivals on the same neural or behavioural data. The principle is flexible, so demand risky predictions.","tononi":"Follow the adversarial-collaboration model (IIT against global workspace, 2023): preregistered, rival predictions.","prigogine":"Bifurcations show critical slowing down, with rising autocorrelation and variance before the transition. Measure these as early-warning signals.","wheeler":"Operationalize measurement as mutual information gained per unit of entropy produced by the apparatus.","shannon":"Use compression-based and mutual-information estimators on real records (genomes, sediments, archives) to estimate persistent information.","phiL":"Keep as interpretation unless it yields a prediction a forward-causal model does not.","phiE":"Measure exergy flux into the system; it is the budget against which η is computed.","phiR":"Estimate feedback strength with transfer entropy from output back to input.","phiD":"Measure directed intervention as transfer entropy from an agent's goal variables to environmental gradients.","p2pmesh":"Network science: measure resilience and information half-life under node removal.","turing":"Classic, well tested: pred       if(pts.length>2){pts[1][1]=pts[0][1]===pts[1][1]?pts[1][1]:pts[1][1];}
      const col=k==='retro'?'#be185d':k==='gate'?'#a0740a':TYPEC[byId[a].t];
      const p=el('path',{class:'edge',d:roundPath(pts),stroke:col,'stroke-width':k==='lineage'?3.4:4.2,'stroke-opacity':.8,'marker-end':`url(#m_${col.slice(1)})`,'stroke-dasharray':k==='retro'?'16 10':'','data-a':a,'data-b':b},LEDGE);
      // bends get small vias
      const mid=pts[Math.floor(pts.length/2)];
      const word=k==='retro'?'pulls':k==='gate'?'passes through':'leads to';
      const tl=el('text',{class:'elab','data-a':a,'data-b':b,x:mid[0]+8,y:mid[1]-8,style:`font:italic 600 26px 'Barlow Condensed';fill:${col}`},LLAB);tl.textContent=word;
      edges.push([p,tl,a,b]);
    }
    if(n%12===0){tip.textContent=`Routing connections… ${n} of ${list.length}`;await new Promise(r=>setTimeout(r,0))}
  }
  // vias belong to edges for focus
  LEDGE.querySelectorAll('circle.edge').forEach(c=>edges.push([c,{classList:{toggle(){}}},c.dataset.a,c.dataset.b]));
  tip.textContent='Tap any node to trace its connections. Tap empty space to show all again.';
}
/* ---------- view ---------- */
let vb={x:0,y:0,w:W,h:H};const cw=()=>svg.clientWidth,ch=()=>svg.clientHeight;
function apply(){vb.h=vb.w*ch()/cw();svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const s=cw()/vb.w;
}
function fit(x,y,w,h){const s=Math.min(cw()/w,ch()/h);vb.w=cw()/s;vb.x=x+w/2-vb.w/2;vb.y=y+h/2-(vb.w*ch()/cw())/2;apply()}
function zoomAt(px,py,f){const wx=vb.x+px/cw()*vb.w,wy=vb.y+py/ch()*vb.h,nw=Math.min(W*1.6,Math.max(300,vb.w*f));vb.x=wx-px/cw()*nw;vb.y=wy-py/ch()*(nw*ch()/cw());vb.w=nw;apply()}
let fly=null;
function flyTo(cx,cy,w,ms=900){cancelAnimationFrame(fly);const a={...vb},t0=performance.now(),b={x:cx-w/2,y:cy-w*ch()/cw()/2,w};
  if(reduce){Object.assign(vb,b);apply();return}
  const st=now=>{let k=Math.min(1,(now-t0)/ms);k=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;vb.x=a.x+(b.x-a.x)*k;vb.y=a.y+(b.y-a.y)*k;vb.w=a.w+(b.w-a.w)*k;apply();if(k<1)fly=requestAnimationFrame(st)};fly=requestAnimationFrame(st)}
const pts=new Map();let moved=0,down=null,pinch=null;
svg.addEventListener('pointerdown',e=>{cancelAnimationFrame(fly);svg.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;down=pts.size===1?e.target:null;
  if(pts.size===2){const[p,q]=[...pts.values()];pinch=Math.hypot(p.x-q.x,p.y-q.y)}});
svg.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const pr=pts.get(e.pointerId),c={x:e.clientX,y:e.clientY};
  if(pts.size===1){const dx=c.x-pr.x,dy=c.y-pr.y;moved+=Math.abs(dx)+Math.abs(dy);vb.x-=dx*vb.w/cw();vb.y-=dy*vb.h/ch();apply()}
  pts.set(e.pointerId,c);if(pts.size===2){const[p,q]=[...pts.values()],d=Math.hypot(p.x-q.x,p.y-q.y),r=svg.getBoundingClientRect();if(pinch)zoomAt((p.x+q.x)/2-r.left,(p.y+q.y)/2-r.top,pinch/d);pinch=d;moved=99}});
svg.addEventListener('pointerup',e=>{
  if(pts.size===1&&moved<8&&down){const t=down;
    const hr=t.closest&&t.closest('[data-href]');
    if(hr)window.open(hr.dataset.href,'_blank','noopener');}
  pts.delete(e.pointerId);if(pts.size<2)pinch=null});
svg.addEventListener('pointercancel',e=>{pts.delete(e.pointerId);pinch=null});
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(e.deltaY*(e.ctrlKey?.012:.0016)))},{passive:false});
addEventListener('resize',apply);
document.getElementById('zin').onclick=()=>zoomAt(cw()/2,ch()/2,.6);
document.getElementById('zout').onclick=()=>zoomAt(cw()/2,ch()/2,1.6);
document.getElementById('whole').onclick=()=>{const s=Math.min(cw()/W,ch()/H);flyTo(W/2,H/2,cw()/s)};
document.getElementById('save').onclick=()=>{const c=svg.cloneNode(true);c.setAttribute('viewBox',`0 0 ${W} ${H}`);c.setAttribute('width',W);c.setAttribute('height',H);
  const st=document.createElementNS(NS,'style');st.textContent="text{paint-order:stroke;stroke:#fffdf1;stroke-width:5px}text.nohalo{stroke:none}.elab{display:none}";c.prepend(st);
  const bl=new Blob([new XMLSerializer().serializeToString(c)],{type:'image/svg+xml'});const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='agentic-entropy-pathways.svg';document.body.appendChild(a);a.click();a.remove()};
let off=0;function anim(){const f=document.getElementById('flow');if(f&&!reduce){off-=4;f.setAttribute('stroke-dashoffset',off)}requestAnimationFrame(anim)}

(async()=>{
  try{await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,2500))])}catch(e){}
  drawTitle();drawLoop();drawPhase();drawLegend();drawEnergese();drawChem();drawMotifStrip();
  layoutRegions();drawText();anim();
  mono(LINS);mono(LBLK);
  if(innerWidth<700)fit(B,B,2400,2400);else fit(0,0,W,H);
  await drawEdges();
  window.__ready=true;
})();
