<script>
"use strict";
/* =====================================================================
   REMIX. A take is a picture: time runs left to right, pitch runs bottom
   to top (bass below, treble above), and lit means loud. Under it, a
   granular sampler reads the take.

     a grain       a short window cut from the take and played back.
                   on screen it is a box that inverts the picture where
                   it is reading. left to right is the stretch of take
                   it covers; how high it sits is how far it was
                   transposed (up an octave, up a seventh of the screen);
                   the box thickens toward the way it is travelling, so
                   a grain running backwards leans the other way.
     the head      one column of dither, where the take is being read.
     the loop      the stretch of take being worked is drawn inverted
                   in blue; while you drag it out it is pink. a grain
                   reading inside it inverts back, so it shows as the
                   picture moving through the block. a loop that is
                   kept but switched off stays blue on the lit picture
                   only. the colour of each is the colour of its word.
     ticks (chop)  along the top edge, one for every attack the take
                   was found to contain, taller when struck harder.
     a freeze      a bar rising from the bottom edge where a moment was
                   caught and is being held, as tall as it is loud.
     strings       short runs from the left edge at the height of each
                   pitch the sympathetic strings are tuned to, as long
                   as they are being driven.
     age           where the tape has flaked away the picture goes dark,
                   in the same places every pass, more of it each pass.

   Nothing here is decoration: if a mark is lit it is telling you where
   something is, how fast, or which way.

   A take opened from a post opens on the whole instrument, but the take
   plays clean, once, as itself: the original, untouched. The first touch on
   the picture or any control hands it to the instrument at the point you
   had reached, and the remix begins. A link that carries settings skips
   the clean play and opens the remix as it was left.

   There is no start screen. The take is fetched and drawn straight away;
   a phone will not make sound until it is touched, so the first touch
   anywhere wakes the sound, and "play" is there for that first touch.

   "undo" steps back through changes to the settings, one at a time.

   The link is the remix. Every setting lives in the address after the
   take's own id, so whatever you leave on screen is what whoever opens
   that link gets. The audio itself is never copied: it is fetched from
   the band's own repo.
 ==================================================================== */

const $ = s => document.querySelector(s);
const el = (t, c, txt) => { const e = document.createElement(t); if(c) e.className = c; if(txt != null) e.textContent = txt; return e; };
const cv = $("#cv"), ctx = cv.getContext("2d", { alpha:false });

const BAYER = (() => {
  const m = [
    [ 0,32, 8,40, 2,34,10,42],[48,16,56,24,50,18,58,26],
    [12,44, 4,36,14,46, 6,38],[60,28,52,20,62,30,54,22],
    [ 3,35,11,43, 1,33, 9,41],[51,19,59,27,49,17,57,25],
    [15,47, 7,39,13,45, 5,37],[63,31,55,23,61,29,53,21]];
  const f = new Float32Array(64);
  for(let y=0;y<8;y++) for(let x=0;x<8;x++) f[y*8+x] = (m[y][x] + 0.5)/64;
  return f;
})();

const AN = { N:1024, LO:60, HI:8000, BANDS:28,
             K:6.0,        // robust deviations above the local median
             REL:2.0,      // and at least this multiple of that median
             MIN:6.0,      // and an absolute rise, in nepers summed over bands:
                           // a real attack is 20-70, a flutter in a drone is under 1
             QUIET:0.01,   // log floor, as a fraction of the take's loudest band
             LOCAL:3,      // frames either side that a peak must beat
             WIN:1.2,      // seconds either side for the local median
             SPACING:0.08, // seconds between peaks, at the closest
             FLOOR:0.2,    // of the take's 95th-percentile onset
             GATE:0.03 };  // of the take's 95th-percentile loudness

function makeFFT(n){
  const levels = Math.round(Math.log2(n));
  const rev = new Uint16Array(n);
  for(let i=0;i<n;i++){ let r=0, x=i; for(let b=0;b<levels;b++){ r=(r<<1)|(x&1); x>>=1; } rev[i]=r; }
  const cs = new Float32Array(n/2), sn = new Float32Array(n/2);
  for(let i=0;i<n/2;i++){ cs[i]=Math.cos(2*Math.PI*i/n); sn[i]=-Math.sin(2*Math.PI*i/n); }
  return (re, im) => {
    for(let i=0;i<n;i++){ const j=rev[i]; if(j>i){
      let t=re[i]; re[i]=re[j]; re[j]=t; t=im[i]; im[i]=im[j]; im[j]=t; } }
    for(let size=2; size<=n; size<<=1){
      const half=size>>1, step=n/size;
      for(let i=0;i<n;i+=size) for(let j=i,k=0;j<i+half;j++,k+=step){
        const l=j+half;
        const tr=re[l]*cs[k]-im[l]*sn[k], ti=re[l]*sn[k]+im[l]*cs[k];
        re[l]=re[j]-tr; im[l]=im[j]-ti; re[j]+=tr; im[j]+=ti;
      }
    }
  };
}

function pct(a, q){
  const c = Float32Array.from(a).sort();
  return c.length ? c[Math.min(c.length-1, Math.floor(q*c.length))] : 0;
}

async function analyse(pcm, rate, yieldFn){
  const N = AN.N, hop = Math.max(256, Math.round(rate*0.016/64)*64);
  const nF = Math.max(0, Math.floor((pcm.length - N)/hop));
  const fft = makeFFT(N), re = new Float32Array(N), im = new Float32Array(N);
  const mag = new Float32Array(N/2 + 1);
  const win = new Float32Array(N);
  for(let i=0;i<N;i++) win[i] = 0.5 - 0.5*Math.cos(2*Math.PI*i/(N-1));
  const hz = rate/N, hi = Math.min(AN.HI, rate/2*0.95);
  const edges = [];
  for(let b=0;b<=AN.BANDS;b++){
    let e = Math.round(AN.LO*Math.pow(hi/AN.LO, b/AN.BANDS)/hz);
    if(b > 0 && e <= edges[b-1]) e = edges[b-1] + 1;
    edges.push(e);
  }
  const spec = start => {
    for(let i=0;i<N;i++){ const v = start+i < pcm.length ? pcm[start+i] : 0; re[i]=v*win[i]; im[i]=0; }
    fft(re, im);
    for(let i=0;i<=N/2;i++) mag[i] = Math.hypot(re[i], im[i])/N;
  };
  const B = AN.BANDS, bm = new Float32Array(nF*B), rms = new Float32Array(nF);
  for(let t=0;t<nF;t++){
    const s0 = t*hop;
    let e = 0; for(let i=0;i<N;i++){ const v = pcm[s0+i]; e += v*v; }
    rms[t] = Math.sqrt(e/N);
    spec(s0);
    for(let b=0;b<B;b++){
      let m = 0; for(let i=edges[b];i<edges[b+1];i++) m += mag[i]*mag[i];
      bm[t*B + b] = Math.sqrt(m);
    }
    if(yieldFn && (t % 150) === 149) await yieldFn(t + 1, nF, bm, hop);
  }
  // log-compress above a floor taken from this take, so the hiss under a
  // quiet passage can't swing the log wildly; then the rise in each band is
  // measured against the loudest of it and its neighbours a frame earlier,
  // so vibrato and a drifting partial are not mistaken for attacks
  const eps = Math.max(1e-7, AN.QUIET*pct(bm, 0.99));
  const o = new Float32Array(nF), prev = new Float32Array(B).fill(Math.log(eps));
  const cur = new Float32Array(B);
  for(let t=0;t<nF;t++){
    let flux = 0;
    for(let b=0;b<B;b++) cur[b] = Math.log(eps + bm[t*B + b]);
    for(let b=0;b<B;b++){
      let ref = prev[b];
      if(b > 0 && prev[b-1] > ref) ref = prev[b-1];
      if(b < B-1 && prev[b+1] > ref) ref = prev[b+1];
      const dl = cur[b] - ref; if(t > 0 && dl > 0) flux += dl;
    }
    o[t] = flux;
    prev.set(cur);
  }
  const p95r = pct(rms, 0.95), p95o = pct(o, 0.95);
  const gate = Math.max(0.0015, AN.GATE*p95r), floor = AN.FLOOR*p95o;
  const w = Math.max(8, Math.round(AN.WIN*rate/hop));
  const tmp = new Float32Array(2*w + 1), dev = new Float32Array(2*w + 1);
  const found = [];
  for(let t=AN.LOCAL; t<nF-AN.LOCAL; t++){
    const v = o[t];
    if(v <= floor || v < AN.MIN || rms[Math.min(nF-1, t+1)] < gate) continue;
    let top = true;
    for(let j=1;j<=AN.LOCAL && top;j++) if(o[t-j] >= v || o[t+j] > v) top = false;
    if(!top) continue;
    const a = Math.max(0, t-w), b = Math.min(nF, t+w+1), len = b - a;
    const ts = tmp.subarray(0, len); ts.set(o.subarray(a, b)); ts.sort();
    const med = ts[len>>1];
    const ds = dev.subarray(0, len);
    for(let i=0;i<len;i++) ds[i] = Math.abs(ts[i] - med);
    ds.sort();
    const sigma = 1.4826*ds[len>>1];
    const z = (v - med)/(sigma + 1e-4);
    if(z < AN.K || v < AN.REL*med) continue;
    found.push({ f:t, z, v });
  }
  // keep peaks apart; between two that are too close, the larger stays
  const gap = AN.SPACING*rate/hop, kept = [];
  for(const c of found){
    const last = kept[kept.length-1];
    if(last && c.f - last.f < gap){ if(c.z > last.z) kept[kept.length-1] = c; }
    else kept.push(c);
  }
  // where in the take's own pitch range each one sat: the spectral centroid
  // just after the attack, placed between the 5th and 95th percentile
  const ev = kept.map(c => {
    spec(Math.min(c.f + 1, nF - 1)*hop);
    let sw = 0, s = 0;
    for(let i=Math.floor(AN.LO/hz); i<=Math.floor(hi/hz); i++){ sw += mag[i]; s += mag[i]*i*hz; }
    return { t:(c.f*hop + N*0.5)/rate, v:c.v, s:Math.max(0.15, Math.min(1, c.z/10)),
             lc:Math.log2((sw > 0 ? s/sw : 1000) + 1) };
  });
  if(ev.length){
    const lcs = ev.map(e => e.lc);
    let lo = pct(lcs, 0.05), up = pct(lcs, 0.95);
    if(up - lo < 1.5){ const m = (up+lo)/2; lo = m - 0.75; up = m + 0.75; }
    for(const e of ev) e.pos = Math.max(0.04, Math.min(0.96, (e.lc - lo)/(up - lo)));
  }
  // loudness against the take's own loud, lightly smoothed
  const lv = new Float32Array(nF); let sm = 0;
  for(let t=0;t<nF;t++){ sm += (Math.min(1, rms[t]/(p95r + 1e-9)) - sm)*0.12; lv[t] = sm; }
  // what is still ringing: in each band, the energy that was already there
  // about 100 ms earlier. a click has none; a held string has nearly all of
  // it. each band against its own loud, so treble shows as well as bass.
  const SUSF = 6, rg = new Float32Array(nF*B), sl = new Float32Array(nF);
  const gref = pct(bm, 0.99);
  for(let b=0;b<B;b++){
    const col = new Float32Array(nF);
    for(let t=0;t<nF;t++) col[t] = bm[t*B + b];
    const ref = Math.max(pct(col, 0.98), 0.1*gref) + 1e-9;
    for(let t=0;t<nF;t++){
      const m = t >= SUSF ? Math.min(col[t], col[t-SUSF]) : 0;
      rg[t*B + b] = Math.min(1, Math.sqrt(m/ref));
    }
  }
  let sv = 0;
  for(let t=0;t<nF;t++){
    let a = 0; for(let b=0;b<B;b++) a += rg[t*B + b];
    sv += (a/B - sv)*0.05; sl[t] = sv;
  }
  return { rate, hop, events:ev, lv, rg, sl, bm, nb:B, dur:pcm.length/rate };
}



/* the recorder streams IMA ADPCM behind a four-byte marker "OCA1".
   anything without it is decoded by the browser, whatever it is.        */

const ADPCM_STEP = new Int32Array([
  7,8,9,10,11,12,13,14,16,17,19,21,23,25,28,31,34,37,41,45,50,55,60,66,73,
  80,88,97,107,118,130,143,157,173,190,209,230,253,279,307,337,371,408,449,
  494,544,598,658,724,796,876,963,1060,1166,1282,1411,1552,1707,1878,2066,
  2272,2499,2749,3024,3327,3660,4026,4428,4871,5358,5894,6484,7132,7845,
  8630,9493,10442,11487,12635,13899,15289,16818,18500,20350,22385,24623,
  27086,29794,32767]);
const ADPCM_INDEX = new Int32Array([-1,-1,-1,-1,2,4,6,8]);

function decodeADPCM(bytes){
  const b = new Uint8Array(bytes);
  if(b[0]!==79 || b[1]!==67 || b[2]!==65 || b[3]!==49) return null;
  const rate = new DataView(bytes).getUint32(4, true);
  const n = (b.length - 12) * 2;
  const out = new Float32Array(n);
  let pred = 0, index = 0;
  for(let i=0;i<n;i++){
    const byte = b[12 + (i>>1)];
    const code = (i & 1) ? (byte >> 4) : (byte & 15);
    const step = ADPCM_STEP[index];
    let q = step >> 3;
    if(code & 4) q += step;
    if(code & 2) q += step >> 1;
    if(code & 1) q += step >> 2;
    pred += (code & 8) ? -q : q;
    if(pred > 32767) pred = 32767;
    if(pred < -32768) pred = -32768;
    index += ADPCM_INDEX[code & 7];
    if(index < 0) index = 0;
    if(index > 88) index = 88;
    out[i] = pred / 32768;
  }
  return { rate, pcm: out };
}

async function decodeBytes(bytes){
  const coded = decodeADPCM(bytes);
  if(coded){
    const buf = ac.createBuffer(1, coded.pcm.length, coded.rate);
    buf.getChannelData(0).set(coded.pcm);
    return buf;
  }
  return await ac.decodeAudioData(bytes);
}

function mono(buf){
  const a = buf.getChannelData(0);
  if(buf.numberOfChannels < 2) return a;
  const b = buf.getChannelData(1), m = new Float32Array(a.length);
  for(let i=0;i<m.length;i++) m[i] = (a[i] + b[i])*0.5;
  return m;
}



function mono(buf){
  const a = buf.getChannelData(0);
  if(buf.numberOfChannels < 2) return a;
  const b = buf.getChannelData(1), m = new Float32Array(a.length);
  for(let i=0;i<m.length;i++) m[i] = (a[i] + b[i])*0.5;
  return m;
}
function reverseBuf(b){
  const r = ac.createBuffer(b.numberOfChannels, b.length, b.sampleRate);
  for(let c=0;c<b.numberOfChannels;c++){
    const s = b.getChannelData(c), d = r.getChannelData(c), n = b.length;
    for(let i=0;i<n;i++) d[i] = s[n-1-i];
  }
  return r;
}

/* ---------- the settings ---------------------------------------------------- */

const P = { sp:1, pt:0, rv:0, lk:1, tn:0,     // tape: speed (negative = backwards), pitch, flip chance, pitch follows speed, tone
            gs:0.16, dn:12.5, sc:0, sw:0,     // grain: size, density, scatter, spread. at these, the grains add back up to the take exactly
            md:0, cs:4, cl:1, co:0,           // engine (0 grains, 1 slices); slices: steps/s, length, order
            gp:1, th:0, tm:0,                 // slices: rests kept (x1 = as played), thinning, timing (0 grid, 1 the take's own spacing)
            ec:0, et:0.375, rm:0, dr:1, wt:1,   // space: echo, echo time, room, dry, wet (wet is the echo, room and inside)
            st:1,                             // tape: stretch (the take slowed without lowering it)
            fz:0, ss:0, sr:0.6, fs:0,         // hold: freeze level, sympathetic strings, how long they ring, frequency shift (Hz)
            ag:0, ai:0,                       // hold: age (passes the tape has made), aging on its own
            si:0 };                           // space: the take inside itself
const DEF = Object.assign({}, P);

const pc = v => Math.round(v*100) + "%";
const DEFS = [
  { k:"sp", tab:"tape",  label:"speed",   lo:-4,   hi:4,   c:"speed", fmt:v => "×" + v.toFixed(2).replace("-","−") },
  { k:"pt", tab:"tape",  label:"pitch",   lo:-24,  hi:24,  c:"lin", step:1, fmt:v => (v>0?"+":v<0?"−":"") + Math.abs(v) + " st" },
  { k:"rv", tab:"tape",  label:"flip",    lo:0,    hi:1,   c:"lin", fmt:pc },

  { k:"wt", tab:"space", label:"wet",     lo:0,    hi:1.5, c:"lin", fmt:pc }

const ORDERS = ["in sequence","shuffled","backwards","drunk","stuck"];

function fromF(d, f, raw){
  let v;
  if(d.c === "lin") v = d.lo + f*(d.hi - d.lo);
  else if(d.c === "log") v = d.lo*Math.pow(d.hi/d.lo, f);
  else if(d.c === "sq") v = d.lo + (d.hi - d.lo)*f*f;
  else if(d.c === "bip"){ const x = f*2 - 1; v = Math.abs(x) < 0.02 ? 0 : Math.sign(x)*d.hi*Math.pow((Math.abs(x) - 0.02)/0.98, 3); }
  else {
    const x = f*2 - 1, a = Math.abs(x);
    v = Math.sign(x)*4*(Math.pow(4, a) - 1)/3;
    if(!raw) for(const s of [0, .25, .5, 1, 2, 3, 4]) if(Math.abs(Math.abs(v) - s) < 0.035*Math.max(1, s)){ v = Math.sign(v)*s; break; }
  }
  if(d.step) v = Math.round(v/d.step)*d.step;
  return v;
}
function toF(d, v){
  if(d.c === "lin") return (v - d.lo)/(d.hi - d.lo);
  if(d.c === "log") return Math.log(v/d.lo)/Math.log(d.hi/d.lo);
  if(d.c === "sq") return Math.sqrt(Math.max(0, (v - d.lo)/(d.hi - d.lo)));
  if(d.c === "bip"){ if(Math.abs(v) < 1e-9) return 0.5; const a = 0.02 + 0.98*Math.cbrt(Math.min(1, Math.abs(v)/d.hi)); return (Math.sign(v)*a + 1)/2; }
  const a = Math.log(1 + 3*Math.abs(v)/4)/Math.log(4);
  return (Math.sign(v)*a + 1)/2;
}

/* ---------- audio ------------------------------------------------------------ */

let ac = null, bus, dry, echoSend, dly, dlp, fbg, roomSend, conv, master, comp, recDest, wet, tlp, thp;
let pre, fzBus, strIn, strOut, combs = [], shiftNode = null, agDly, agLfoG, agFlG, agWs, agLP, siSend, selfConv, wsA = -1;
let sbuf = null, srev = null, sk = 1, stretchJob = 0, stretchTimer = 0, stretchPend = 0;
let fzp = [], fzLayers = [], strF = [], flake = null, lastAgeT = 0, ageHash = 0;
let buf = null, revBuf = null, TL = null, base = null;
let pos = 0, playing = false, holding = false, loopOn = false, reg = { a:0, b:1 };
let regionMode = false, nextT = 0, nextS = 0, ci = 0, ciHere = false, slices = [];
/* the sequence picks up at the slice under the head, not back at the first one */
function chopFromHead(){ if(!buf || !slices.length) return; const sl = activeSlices(); let i = 0; for(let k=0;k<sl.length;k++) if(sl[k].s <= pos + 1e-6) i = k; ci = i; ciHere = true; }
const grains = [];
let shownPos = 0, take = null, takeLabel = "", job = 0, started = false;
let rigOpen = false, clean = false, listenEnded = false, lnode = null, lstart = 0, loff = 0;
let curHead = 0;          // where the head was when a grain was cut: the playhead draws this, not the scattered read point

const CUR_H = new Float32Array(128), CUR_T = new Float32Array(128);
for(let i=0;i<128;i++){
  const u = i/127;
  CUR_H[i] = Math.pow(Math.sin(Math.PI*u), 2);
  CUR_T[i] = Math.min(1, u/0.08, (1-u)/0.08);
}

function buildGraph(){
  ac = new (window.AudioContext||window.webkitAudioContext)();
  bus = ac.createGain();
  dry = ac.createGain();
  echoSend = ac.createGain(); dly = ac.createDelay(1.5); dly.delayTime.value = 0.375;
  dlp = ac.createBiquadFilter(); dlp.type = "lowpass"; dlp.frequency.value = 2800;
  fbg = ac.createGain();
  roomSend = ac.createGain(); conv = ac.createConvolver();
  master = ac.createGain(); comp = ac.createDynamicsCompressor();
  recDest = ac.createMediaStreamDestination();
  const n = Math.floor(ac.sampleRate*2.4), ir = ac.createBuffer(2, n, ac.sampleRate);
  for(let c=0;c<2;c++){ const d = ir.getChannelData(c); for(let i=0;i<n;i++) d[i] = (Math.random()*2-1)*Math.pow(1 - i/n, 3); }
  conv.buffer = ir;
  wet = ac.createGain();
  tlp = ac.createBiquadFilter(); tlp.type = "lowpass";  tlp.frequency.value = 20000; tlp.Q.value = 1.1;
  thp = ac.createBiquadFilter(); thp.type = "highpass"; thp.frequency.value = 10;    thp.Q.value = 1.1;
  /* after the engine and before tone: freezes join the grains, then shift, then
     the tape's age; sympathetic strings listen there and ring back into tone */
  pre = ac.createGain(); fzBus = ac.createGain(); fzBus.gain.value = 0;
  agDly = ac.createDelay(0.1); agDly.delayTime.value = 0.006;
  const lfo = ac.createOscillator(), fl = ac.createOscillator();
  lfo.frequency.value = 0.31; fl.frequency.value = 5.7;
  agLfoG = ac.createGain(); agFlG = ac.createGain(); agLfoG.gain.value = 0; agFlG.gain.value = 0;
  lfo.connect(agLfoG); agLfoG.connect(agDly.delayTime); fl.connect(agFlG); agFlG.connect(agDly.delayTime);
  lfo.start(); fl.start();
  agWs = ac.createWaveShaper();
  agLP = ac.createBiquadFilter(); agLP.type = "lowpass"; agLP.Q.value = -3; agLP.frequency.value = Math.min(22000, ac.sampleRate*0.49);
  strIn = ac.createGain(); strIn.gain.value = 0; strOut = ac.createGain(); strOut.gain.value = 0.6;
  for(let i=0;i<6;i++){
    const d = ac.createDelay(0.05), lp = ac.createBiquadFilter(), fb = ac.createGain();
    lp.type = "lowpass"; lp.Q.value = -20; lp.frequency.value = 3000; fb.gain.value = 0;   // Q is in dB here: well under 0 so the loop never gains
    d.delayTime.value = 1/(110 + 30*i);
    strIn.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(strOut);
    combs.push({ d, lp, fb });
  }
  bus.connect(pre); fzBus.connect(pre);
  pre.connect(agDly); agDly.connect(agWs); agWs.connect(agLP); agLP.connect(tlp);
  agLP.connect(strIn); strOut.connect(tlp);
  tlp.connect(thp);
  loadShifter();
  thp.connect(dry); dry.connect(master);
  thp.connect(echoSend); echoSend.connect(dly); dly.connect(dlp); dlp.connect(fbg); fbg.connect(dly); dlp.connect(wet);
  thp.connect(roomSend); roomSend.connect(conv); conv.connect(wet);
  siSend = ac.createGain(); siSend.gain.value = 0; selfConv = ac.createConvolver();
  thp.connect(siSend); siSend.connect(selfConv); selfConv.connect(wet);
  wet.connect(master); master.gain.value = 0.9;
  master.connect(comp); comp.connect(ac.destination); comp.connect(recDest);
  sync();
}

function sync(){
  if(!ac) return;
  const t = ac.currentTime;
  echoSend.gain.setTargetAtTime(P.ec*0.9, t, 0.03);
  fbg.gain.setTargetAtTime(0.25 + 0.55*P.ec, t, 0.03);
  roomSend.gain.setTargetAtTime(P.rm*0.8, t, 0.03);
  dry.gain.setTargetAtTime(P.dr, t, 0.03);
  wet.gain.setTargetAtTime(P.wt, t, 0.03);
  dly.delayTime.setTargetAtTime(P.et, t, 0.06);          // moving it while it rings bends the repeats, like tape
  const x = P.tn;
  tlp.frequency.setTargetAtTime(x < -0.03 ? 18000*Math.pow(180/18000, -x) : 20000, t, 0.03);
  thp.frequency.setTargetAtTime(x >  0.03 ? 20*Math.pow(3500/20, x)        : 10,    t, 0.03);
  const g = P.md ? 0.9 : 1/Math.pow(Math.max(1, 0.5*P.dn*P.gs), 0.75);
  bus.gain.setTargetAtTime(g, t, 0.05);
  // hold
  if(P.fz > 0.001 && !fzp.length && buf && !clean){ fzp.push(Math.round(headNow()*100)/100); }
  syncFreeze();
  fzBus.gain.setTargetAtTime(P.fz*P.fz*1.4, t, 0.08);
  const fr = Math.pow(2, P.pt/12);
  for(const l of fzLayers) if(l.s) l.s.playbackRate.setTargetAtTime(fr, t, 0.05);
  const fb = P.ss > 0.001 ? 0.88 + 0.115*P.sr : 0;
  strIn.gain.setTargetAtTime(P.ss*1.1*Math.sqrt(1 - fb*fb + 0.0001), t, 0.05);
  for(const c of combs){ c.fb.gain.setTargetAtTime(fb, t, 0.05); c.lp.frequency.setTargetAtTime(1600 + 4200*P.sr, t, 0.05); }
  if(shiftNode) shiftNode.parameters.get("shift").setValueAtTime(P.fs, t);
  syncAge(t);
  siSend.gain.setTargetAtTime(P.si*0.2, t, 0.05);
  wantStretch();
}
function syncAge(t){
  const A = ageA();
  agLfoG.gain.setTargetAtTime(A*0.0035, t, 0.2);
  agFlG.gain.setTargetAtTime(A*0.0005, t, 0.2);
  agLP.frequency.setTargetAtTime(Math.min(22000, ac.sampleRate*0.49)*Math.pow(650/20000, A), t, 0.2);
  if(Math.abs(A - wsA) > 0.02 || (A < 0.001) !== (wsA < 0.001)){
    wsA = A;
    if(A < 0.001) agWs.curve = null;
    else { const n = 1024, c = new Float32Array(n), k = 1 + 3*A; for(let i=0;i<n;i++){ const x = i/(n-1)*2 - 1; c[i] = Math.tanh(k*x)/Math.tanh(k); } agWs.curve = c; }
  }
}

/* one grain: play `dur` seconds of output, reading the take at rate `rate`
   from p (forwards) or back from p (rev). */
function fire(t, p, dur, rate, rev, kind){
  const D = buf.duration, k = sbuf ? sk : 1;       // p is a place in the take; the stretched take is k times as long
  let off, avail, p0;
  if(rev){ const end = Math.min(D, Math.max(0, p)); off = (D - end)*k; avail = end*k; p0 = end; }
  else   { const st  = Math.min(D, Math.max(0, p)); off = st*k;       avail = (D - st)*k; p0 = st; }
  const dd = Math.min(dur, avail/rate);
  if(!(dd >= 0.012)) return;
  let curve = kind === "slice" ? CUR_T : CUR_H;
  const A = ageA();
  if(A > 0.001 && flake){
    const c = new Float32Array(64), len = dd*rate/k; let mx = 0;
    for(let i=0;i<64;i++){ const u = i/63; c[i] = curve[Math.round(u*127)]*live(rev ? p0 - u*len : p0 + u*len); if(c[i] > mx) mx = c[i]; }
    if(mx < 0.01) return;                      // this stretch of tape is gone
    curve = c;
  }
  t = Math.max(t, ac.currentTime + 0.005);
  const s = ac.createBufferSource(); s.buffer = rev ? (sbuf ? srev : revBuf) : (sbuf || buf); s.playbackRate.value = rate;
  const e = ac.createGain(); e.gain.value = 0;
  s.connect(e);
  let out = e;
  if(ac.createStereoPanner && P.sw > 0){
    const pn = ac.createStereoPanner(); pn.pan.value = (Math.random()*2-1)*P.sw; e.connect(pn); out = pn;
  }
  out.connect(bus);
  e.gain.setValueCurveAtTime(curve, t, dd);
  s.start(t, off); s.stop(t + dd + 0.02);
  s.onended = () => { try{ s.disconnect(); e.disconnect(); if(out !== e) out.disconnect(); }catch(_){} };
  grains.push({ t, dur:dd, p, len:dd*rate/k, rev, rate, kind, hd:curHead });
}

function advance(dp){
  pos += dp;
  const D = buf.duration;
  if(loopOn){
    const a = reg.a, b = reg.b, L = b - a;
    if(L > 0.02){
      if(pos > b) pos = a + ((pos - a) % L);
      else if(pos < a) pos = b - ((a - pos) % L);
    }
  } else if(pos >= D){ pos = D; playing = false; words(); }
  else if(pos <= 0){ pos = 0; playing = false; words(); }
}

function grainStep(t, iv){
  const sp = P.sp;
  let rate = Math.pow(2, P.pt/12);
  if(P.lk) rate *= Math.abs(sp);
  if(!(P.lk && Math.abs(sp) < 0.02)){
    rate = Math.max(0.02, Math.min(16, rate));
    const rev = (sp < 0) !== (Math.random() < P.rv);
    curHead = pos;
    fire(t, pos + (Math.random()*2-1)*P.sc, P.gs, rate, rev, "grain");
  }
  if(!holding) advance(sp*iv/(sbuf ? sk : 1));
}

function activeSlices(){
  if(!loopOn || (reg.a <= 0.001 && reg.b >= buf.duration - 0.001)) return slices;
  const s = slices.filter(x => x.s >= reg.a - 0.01 && x.s < reg.b);
  return s.length ? s : slices;
}
/* an event is its body (the attack and the ring, until it has sunk back toward the
   floor) and then its rest (the silence, and the hiss, until the next attack). gap
   scales the rest: x1 is as played, 0 packs the attacks together, 2 doubles the
   silences. thin drops events, the quietest first: an event goes once thin has
   passed its rank among the take's attacks. the loudest tenth always stays, so
   thin all the way up leaves the strongest hits, never silence. */
const thinP = q => P.th < 0.005 ? 0 : Math.max(0, Math.min(1, (P.th*0.9 - q)/0.08 + 0.5));
function sliceRate(){
  let rate = Math.pow(2, P.pt/12);
  if(P.lk) rate *= Math.abs(P.sp);
  return rate;
}
function chopStep(t, ivGrid){
  const sl = activeSlices(), n = sl.length;
  if(!n) return ivGrid;
  ci = Math.min(ci, n-1);
  if(ciHere){ ciHere = false; }
  else switch(P.co){
    case 0: ci = (ci + 1) % n; break;
    case 1: ci = (Math.random()*n)|0; break;
    case 2: ci = (ci - 1 + n) % n; break;
    case 3: ci = (ci + (Math.random() < 0.5 ? -1 : 1)*(Math.random() < 0.3 ? 2 : 1) + n*3) % n; break;
    default: break;
  }
  const s = sl[ci];
  if(P.lk && Math.abs(P.sp) < 0.02) return ivGrid;
  const rate = Math.max(0.02, Math.min(16, sliceRate()));
  const body = s.eb - s.s, rest = Math.max(0, s.e - s.eb);
  const span = body + Math.min(P.gp, 1)*rest;
  const own = P.tm === 1, k = sbuf ? sk : 1;
  const iv = own ? Math.max(0.03, (body + P.gp*rest)*k/rate) : ivGrid;
  pos = s.s;
  if(Math.random() >= thinP(s.q)){
    /* on the grid a hit rings until the next step, reading on past its own
       slice the way a pad does, so slices shorter than a step do not leave
       a hole after each one. length shortens it. */
    const dur = own ? span*k/rate*Math.min(P.cl, 1) : ivGrid*P.cl;
    const rev = (P.sp < 0) !== (Math.random() < P.rv);
    curHead = s.s;
    fire(t, rev ? s.s + dur*rate/k : s.s, dur, rate, rev, "slice");
  }
  return iv;
}

/* tap an attack to play it. the slices tile the take, so the one under your finger
   is the one that plays; drag across the take to strum through them. */
function sliceAt(t){
  let lo = 0, hi = slices.length - 1;
  while(lo < hi){ const m = (lo + hi + 1) >> 1; if(slices[m].s <= t) lo = m; else hi = m - 1; }
  return lo;
}
function tapFire(i){
  if(!buf || !slices.length) return;
  if(ac.state === "suspended") ac.resume();
  const s = slices[i];
  if(P.lk && Math.abs(P.sp) < 0.02) return;
  const rate = Math.max(0.02, Math.min(16, sliceRate()));
  const span = (s.eb - s.s) + Math.min(P.gp, 1)*Math.max(0, s.e - s.eb), k = sbuf ? sk : 1;
  const dur = span*k/rate*Math.min(P.cl, 1);
  const rev = (P.sp < 0) !== (Math.random() < P.rv);
  curHead = s.s;
  fire(ac.currentTime + 0.005, rev ? s.s + dur*rate/k : s.s, dur, rate, rev, "slice");
  pos = s.s;
}

function tick(){
  if(!buf || !ac) return;
  const now = ac.currentTime;
  const dt = lastAgeT ? Math.min(0.5, now - lastAgeT) : 0; lastAgeT = now;
  if(P.ai && playing && !clean && dt > 0){
    /* a pass is once through what is being played: the loop, or the whole take, at this speed and stretch */
    const span = (loopOn ? Math.max(0.05, reg.b - reg.a) : buf.duration)*(sbuf ? sk : 1)/Math.max(0.05, Math.abs(P.sp));
    P.ag = Math.min(300, P.ag + dt/span);
    syncAge(now);
    const d = DEFS.find(x => x.k === "ag"); if(d && d.upd && tab === "hold") d.upd();
    if(now - ageHash > 2){ ageHash = now; clearTimeout(hashTimer); hashTimer = setTimeout(writeHash, 50); }
  }
  if(!(playing || holding)){ nextT = 0; nextS = 0; return; }
  const horizon = now + 0.25;
  if(!P.md){
    if(nextT < now) nextT = now + 0.02;
    while(nextT < horizon){
      const j = Math.min(0.2, P.sc*2);       // timing wobbles only once scatter is up
      const iv = (1/P.dn)*(1 + j*(2*Math.random() - 1));
      grainStep(nextT, iv);
      nextT += iv;
    }
  } else {
    if(nextS < now) nextS = now + 0.02;
    while(nextS < horizon) nextS += chopStep(nextS, 1/P.cs);
  }
}
setInterval(tick, 30);

/* ---------- hold: stretch, freeze, strings, shift, age, inside ----------------------- */

const FFTS = {};
const fftN = n => FFTS[n] || (FFTS[n] = makeFFT(n));
function pow2(x){ let n = 1024; while(n < x) n <<= 1; return n; }
function hannW(n){ const w = new Float32Array(n); for(let i=0;i<n;i++) w[i] = 0.5 - 0.5*Math.cos(2*Math.PI*i/n); return w; }
function rng(seed){ let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0)/4294967296; }; }
/* keep a window's magnitudes, draw its phases at random, and turn it back into sound (left in re) */
function smear(mag, N, re, im, fft, rnd){
  re[0] = mag[0]; im[0] = 0; re[N/2] = mag[N/2]; im[N/2] = 0;
  for(let k=1;k<N/2;k++){ const ph = rnd()*2*Math.PI; re[k] = mag[k]*Math.cos(ph); im[k] = mag[k]*Math.sin(ph); re[N-k] = re[k]; im[N-k] = -im[k]; }
  for(let k=0;k<N;k++) im[k] = -im[k];
  fft(re, im);
  for(let k=0;k<N;k++) re[k] /= N;
}
function magAt(src, start, N, win, re, im, fft, mag, w){
  for(let i=0;i<N;i++){ const j = start + i; re[i] = (j >= 0 && j < src.length ? src[j] : 0)*win[i]; im[i] = 0; }
  fft(re, im);
  for(let k=0;k<=N/2;k++) mag[k] = (w == null ? 0 : mag[k]) + Math.hypot(re[k], im[k])*(w == null ? 1 : w);
}
function fitLevel(out, n, target){
  let e = 0, pk = 0; for(let i=0;i<n;i++){ e += out[i]*out[i]; const a = Math.abs(out[i]); if(a > pk) pk = a; }
  const r = Math.sqrt(e/Math.max(1, n)) + 1e-12, g = Math.min(target/r, 0.98/(pk + 1e-12));
  for(let i=0;i<n;i++) out[i] *= g;
}
function rmsOf(a, i0, i1){ let e = 0, n = 0; for(let i=Math.max(0,i0); i<Math.min(a.length,i1); i++){ e += a[i]*a[i]; n++; } return Math.sqrt(e/Math.max(1, n)); }

/* stretch: the take slowed down without going down in pitch. every window of it is
   kept as its colour and smeared out in time (paulstretch); at the top a few
   seconds become minutes. the head walks the take that many times slower. */
const STRETCH_MAX = 180;
function stretchWanted(){ return buf ? Math.max(1, Math.min(P.st, STRETCH_MAX/buf.duration)) : 1; }
function wantStretch(){
  if(!buf || !ac) return;
  const k = stretchWanted();
  if(k < 1.005){ if(sbuf || stretchPend){ stretchJob++; stretchPend = 0; sbuf = srev = null; sk = 1; } return; }
  if(sbuf && Math.abs(k - sk) < 0.01*sk) { if(stretchPend){ stretchJob++; stretchPend = 0; } return; }
  if(stretchPend && Math.abs(k - stretchPend) < 0.01*stretchPend) return;
  stretchPend = k; stretchJob++;
  clearTimeout(stretchTimer);
  stretchTimer = setTimeout(() => renderStretch(k), 350);
  if(P.st > k + 0.01) say("stretch stops at three minutes for a take this long");
}
async function renderStretch(k){
  const mine = ++stretchJob, b0 = buf;
  const src = mono(buf), sr = buf.sampleRate;
  const N = pow2(sr*(k < 1.6 ? 0.07 : k < 4 ? 0.14 : 0.25)), H = N/2;
  const outLen = Math.round(src.length*k), out = new Float32Array(outLen), nrm = new Float32Array(outLen);
  const win = hannW(N), re = new Float32Array(N), im = new Float32Array(N), mag = new Float32Array(N/2 + 1), fft = fftN(N), rnd = rng(src.length + Math.round(k*1000));
  const frames = Math.ceil(outLen/H) + 2;
  for(let f=0; f<frames; f++){
    const os = f*H - N/2;
    magAt(src, Math.round(f*H/k) - N/2, N, win, re, im, fft, mag);
    smear(mag, N, re, im, fft, rnd);
    for(let i=0;i<N;i++){ const j = os + i; if(j < 0 || j >= outLen) continue; out[j] += re[i]*win[i]; nrm[j] += win[i]*win[i]; }
    if(f % 24 === 23){
      say("stretching " + Math.round(f/frames*100) + "%");
      await new Promise(r => setTimeout(r, 0));
      if(mine !== stretchJob || buf !== b0) return;
    }
  }
  for(let j=0;j<outLen;j++) out[j] = nrm[j] > 1e-4 ? out[j]/Math.sqrt(nrm[j]) : 0;
  fitLevel(out, outLen, rmsOf(src, 0, src.length));
  const b = ac.createBuffer(1, outLen, sr); b.getChannelData(0).set(out);
  if(mine !== stretchJob || buf !== b0) return;
  sbuf = b; srev = reverseBuf(b); sk = k; stretchPend = 0;
