}

/* freeze: one moment of the take held for as long as you like. its colour is kept
   and its phases redrawn over and over, looped so the join is not heard. up to
   three can be held at once; catching a fourth lets the oldest go. */
const FZ_LEN = 8, FZ_MAX = 3;
function headNow(){ return playing ? shownPos : pos; }
async function freezeBuffer(p){
  const b0 = buf, src = mono(buf), sr = buf.sampleRate, N = pow2(sr*0.25), H = N/2;
  const L = Math.round(FZ_LEN*sr/H)*H, out = new Float32Array(L);
  const win = hannW(N), re = new Float32Array(N), im = new Float32Array(N), mag = new Float32Array(N/2 + 1), fft = fftN(N), rnd = rng(Math.round(p*1000) + src.length);
  const c = Math.round(p*sr);
  magAt(src, c - N/2 - N/4, N, win, re, im, fft, mag);
  for(let k=0;k<=N/2;k++) mag[k] /= 3;
  magAt(src, c - N/2, N, win, re, im, fft, mag, 1/3);
  magAt(src, c - N/2 + N/4, N, win, re, im, fft, mag, 1/3);
  for(let f=0; f<L/H; f++){
    smear(mag, N, re, im, fft, rnd);
    for(let i=0;i<N;i++) out[(f*H + i) % L] += re[i]*win[i];
    if(f % 12 === 11){ await new Promise(r => setTimeout(r, 0)); if(buf !== b0) return null; }
  }
  fitLevel(out, L, rmsOf(src, c - N/2, c + N/2));
  const b = ac.createBuffer(1, L, sr); b.getChannelData(0).set(out);
  return b;
}
function syncFreeze(){
  if(!ac) return;
  const now = ac.currentTime;
  for(const l of fzLayers) if(!l.dead && (!buf || l.b0 !== buf || !fzp.includes(l.p))){
    l.dead = true;
    if(!l.g) continue;
    l.g.gain.cancelScheduledValues(now); l.g.gain.setValueAtTime(l.g.gain.value, now); l.g.gain.setTargetAtTime(0, now, 0.8);
    try{ l.s.stop(now + 5); }catch(_){}
  }
  if(!buf) return;
  for(const p of fzp) if(!fzLayers.some(l => !l.dead && l.p === p)){
    const l = { p, s:null, g:null, b0:buf, dead:false };
    fzLayers.push(l);
    freezeBuffer(p).then(b => {
      if(!b || l.dead || l.b0 !== buf){ fzLayers = fzLayers.filter(x => x !== l); return; }
      const t0 = ac.currentTime;
      const s = ac.createBufferSource(); s.buffer = b; s.loop = true; s.playbackRate.value = Math.pow(2, P.pt/12);
      const g = ac.createGain(); g.gain.value = 0; g.gain.setTargetAtTime(1, t0, 0.8);
      s.connect(g); g.connect(fzBus); s.start(t0, Math.random()*b.duration);
      s.onended = () => { try{ g.disconnect(); }catch(_){} fzLayers = fzLayers.filter(x => x !== l); };
      l.s = s; l.g = g;
    });
  }
}
function catchHere(){
  if(!buf) return;
  handoff(); remember();
  const p = Math.round(headNow()*100)/100;
  fzp = fzp.filter(x => x !== p); fzp.push(p);
  while(fzp.length > FZ_MAX) fzp.shift();
  if(P.fz < 0.01){ P.fz = 0.6; syncSliders(); }
  changed(); words();
  say("held at " + fmtT(p) + (fzp.length > 1 ? ". " + fzp.length + " held" : ""));
}
function letGo(){ if(!fzp.length) return; remember(); fzp = []; changed(); words(); say("let go"); }

/* sympathetic strings: six resonators tuned to the strongest pitches in the take,
   folded down into the low strings' range. whatever is playing sets them ringing. */
function tuneStrings(){
  if(!buf || !ac) return;
  const src = mono(buf), sr = buf.sampleRate, N = pow2(sr*0.2);
  const win = hannW(N), re = new Float32Array(N), im = new Float32Array(N), mag = new Float32Array(N/2 + 1), fft = fftN(N);
  const nF = Math.max(1, Math.min(60, Math.floor(src.length/(N/2))));
  for(let f=0; f<nF; f++) magAt(src, Math.round((src.length - N)*f/Math.max(1, nF - 1)), N, win, re, im, fft, mag, f ? 1 : null);
  const hz = sr/N, peaks = [];
  for(let k=Math.ceil(70/hz); k<Math.min(N/2 - 1, 1500/hz); k++) if(mag[k] > mag[k-1] && mag[k] >= mag[k+1]) peaks.push([k*hz, mag[k]]);
  peaks.sort((a,b) => b[1] - a[1]);
  const top = Math.min(330, ac.sampleRate/128*0.92), fold = f => { while(f >= top) f /= 2; while(f < 55) f *= 2; return f; };
  const out = [];
  for(const [f] of peaks){
    const g = fold(f);
    if(out.every(x => Math.abs(1200*Math.log2(g/x)) > 30)) out.push(g);
    if(out.length === 6) break;
  }
  const root = out[0] || 110;
  for(const r of [1.5, 2, 1.25, 3, 1.875]) if(out.length < 6){ const g = fold(root*r); if(out.every(x => Math.abs(1200*Math.log2(g/x)) > 30)) out.push(g); }
  while(out.length < 6) out.push(fold(root*(out.length + 1)));
  strF = out;
  out.forEach((f, i) => combs[i].d.delayTime.setValueAtTime(1/f, ac.currentTime));
}

/* the take inside itself: its own first seconds used as the room it plays in */
function selfRoom(){
  if(!buf || !ac) return;
  const src = mono(buf), sr = buf.sampleRate, R = ac.sampleRate;
  const n = Math.max(64, Math.round(Math.min(buf.duration, 5)*R)), d = new Float32Array(n);
  for(let i=0;i<n;i++){
    const x = i*sr/R, j = Math.floor(x), fr = x - j;
    d[i] = (src[j] || 0)*(1 - fr) + (src[j+1] || 0)*fr;
  }
  for(let i=0;i<n;i++){ const u = i/n; d[i] *= Math.min(1, i/(0.005*R))*(u > 0.7 ? Math.pow((1 - u)/0.3, 2) : 1); }
  const b = ac.createBuffer(1, n, R); b.getChannelData(0).set(d);
  try{ selfConv.buffer = b; }catch(_){}
}

/* frequency shift: every partial moved by the same number of hertz, so a string
   turns to bell metal. a few hertz is a slow phasing; a pair of allpass chains
   splits the sound into two copies a quarter turn apart and spins them. */
const SHIFT_SRC = `
const A=[0.6923878,0.9360654322959,0.9882295226860,0.9987488452737], B=[0.4021921162426,0.8561710882420,0.9722909545651,0.9952884791278];
function mk(c){ return c.map(() => new Float64Array(4)); }
function run(st, co, x){ for(let k=0;k<co.length;k++){ const s = st[k], a2 = co[k]*co[k]; const y = a2*(x + s[3]) - s[1]; s[1] = s[0]; s[0] = x; s[3] = s[2]; s[2] = y; x = y; } return x; }
class Shift extends AudioWorkletProcessor{
  static get parameterDescriptors(){ return [{ name:"shift", defaultValue:0, automationRate:"k-rate" }]; }
  constructor(){ super(); this.ch = []; this.ph = 0; this.m = 0; }
  process(ins, outs, params){
    const i = ins[0], o = outs[0], f = params.shift[0];
    if(!i || !i.length){ for(const c of o) c.fill(0); return true; }
    while(this.ch.length < i.length) this.ch.push({ a:mk(A), b:mk(B), pa:0 });
    const n = i[0].length, dp = 2*Math.PI*f/sampleRate, tgt = Math.abs(f) > 0.04 ? 1 : 0;
    for(let s=0;s<n;s++){
      this.ph += dp; if(this.ph > Math.PI) this.ph -= 2*Math.PI; else if(this.ph < -Math.PI) this.ph += 2*Math.PI;
      this.m += (tgt - this.m)*0.002;
      const cs = Math.cos(this.ph), sn = Math.sin(this.ph);
      for(let c=0;c<i.length;c++){
        const st = this.ch[c], x = i[c][s];
        const ia = run(st.a, A, x), I = st.pa; st.pa = ia;
        const Q = run(st.b, B, x);
        o[c][s] = x*(1 - this.m) + (I*cs + Q*sn)*this.m;
      }
    }
    for(let c=i.length;c<o.length;c++) o[c].set(o[0]);
    return true;
  }
}
registerProcessor("oc-shift", Shift);`;
async function loadShifter(){
  try{
    if(!ac.audioWorklet) throw 0;
    const url = URL.createObjectURL(new Blob([SHIFT_SRC], { type:"application/javascript" }));
    await ac.audioWorklet.addModule(url);
    const n = new AudioWorkletNode(ac, "oc-shift", { numberOfInputs:1, numberOfOutputs:1, outputChannelCount:[2] });
    pre.disconnect(agDly); pre.connect(n); n.connect(agDly);
    shiftNode = n; sync();
  }catch(err){ console.warn("shift unavailable", err); const d = DEFS.find(x => x.k === "fs"); if(d && d.row) d.row.style.opacity = "0.5"; }
}

/* age: the tape played over and over until it flakes. the same places go first
   every time, as on a real loop, and the rest wows, saturates and dulls. */
const ageA = () => 1 - Math.exp(-P.ag/40);
function makeFlakes(){
  if(!buf) return;
  const n = Math.ceil(buf.duration/0.01) + 2, v = new Float32Array(n), rnd = rng(buf.length*7 + 3);
  for(const [cell, w] of [[5, 0.3], [30, 0.4], [150, 0.3]]){
    const m = Math.ceil(n/cell) + 2, pts = new Float32Array(m);
    for(let i=0;i<m;i++) pts[i] = rnd();
    for(let i=0;i<n;i++){ const x = i/cell, j = Math.floor(x), u = x - j, s = u*u*(3 - 2*u); v[i] += w*(pts[j]*(1 - s) + pts[j+1]*s); }
  }
  const idx = Array.from(v.keys()).sort((a,b) => v[a] - v[b]);
  flake = new Float32Array(n);
  idx.forEach((i, r) => { flake[i] = r/(n - 1); });
}
function live(t){
  const A = ageA();
  if(A <= 0.001 || !flake) return 1;
  const f = flake[Math.max(0, Math.min(flake.length - 1, Math.round(t/0.01)))];
  return Math.max(0, Math.min(1, (f - (A*0.97 - 0.05))/0.05));
}

/* ---------- the take, as a picture --------------------------------------------- */

let PX = 3, W = 0, H = 0, img, gridCv, gridCtx, lit, ov;

function build(){
  const r = cv.getBoundingClientRect(), vw = Math.max(1, r.width), vh = Math.max(1, r.height);
  PX = Math.max(3, Math.ceil(Math.max(innerWidth, innerHeight)/300));
  cv.width = Math.max(PX*8, Math.floor(vw/PX)*PX);
  cv.height = Math.max(PX*8, Math.floor(vh/PX)*PX);
  W = cv.width/PX; H = cv.height/PX;
  gridCv = document.createElement("canvas"); gridCv.width = W; gridCv.height = H;
  gridCtx = gridCv.getContext("2d", { alpha:false });
  img = gridCtx.createImageData(W, H);
  for(let i=3;i<img.data.length;i+=4) img.data[i] = 255;
  lit = new Uint8Array(W*H); ov = new Float32Array(W*H);
  ctx.imageSmoothingEnabled = false;
  computeBase();
}

function computeBase(){
  base = null;
  if(!TL || !W) return;
  baseFrom(TL.bm, TL.nb, TL.bm.length/TL.nb, TL.hop, TL.rate, TL.dur);
}
/* the dots arrive left to right while the take is being read */
function baseFrom(bm, B, nF, hop, rate, dur){
  if(!W) return;
  const cell = new Float32Array(W*B);
  for(let f=0;f<nF;f++){
    const tt = (f*hop + AN.N/2)/rate;
    const x = Math.min(W-1, Math.floor(tt/dur*W));
    for(let b=0;b<B;b++){ const v = bm[f*B + b]; if(v > cell[x*B + b]) cell[x*B + b] = v; }
  }
  const ref = pct(cell, 0.995) + 1e-9;
  base = new Float32Array(W*H);
  for(let y=0;y<H;y++){
    const bf = (H-1-y)/(H-1)*(B-1), b0 = Math.floor(bf), b1 = Math.min(B-1, b0+1), fr = bf - b0;
    for(let x=0;x<W;x++){
      const m = cell[x*B + b0]*(1-fr) + cell[x*B + b1]*fr;
      base[y*W + x] = Math.pow(Math.min(1, Math.log(1 + 30*m/ref)/Math.log(31)), 1.6);
    }
  }
}

function draw(){
  if(!img) return;
  const now = ac ? ac.currentTime : 0, D = buf ? buf.duration : 1;
  while(grains.length && grains[0].t + grains[0].dur + 0.1 < now) grains.shift();
  ov.fill(0);
  let latest = null;
  for(const g of grains){
    if(g.t > now) continue;
    latest = g;
    const age = (now - g.t)/g.dur; if(age > 1) continue;
    const env = Math.pow(Math.sin(Math.PI*age), 2);
    const x0s = g.rev ? g.p - g.len : g.p;
    const cx0 = Math.max(0, Math.floor(x0s/D*W));
    const cx1 = Math.min(W-1, Math.max(cx0 + 1, Math.ceil((x0s + g.len)/D*W)));
    /* a grain carries every pitch in the stretch it reads, so it is drawn the
       full height of the picture, as that stretch of picture moved to where
       it now sounds: up for higher, down for lower. faint where the take is
       quiet, so the grain's extent still shows. */
    const shift = Math.round(Math.log2(g.rate)*(H/7.06));
    const span = Math.max(1, cx1 - cx0);
    for(let x=cx0; x<=cx1; x++){
      let u = (x - cx0)/span; if(g.rev) u = 1 - u;
      const k = env*(0.4 + 0.6*u);
      for(let y=0; y<H; y++){
        const sy = y + shift;
        const c = (base && sy >= 0 && sy < H) ? base[sy*W + x] : 0;
        const d = k*(0.12 + 0.88*c);
        const i = y*W + x; if(d > ov[i]) ov[i] = d;
      }
    }
  }
  if(latest) shownPos = latest.hd;
  if(holding || !(playing)) shownPos = pos;
  if(clean) shownPos = listenPos();
  const ra = Math.min(reg.a, reg.b), rb = Math.max(reg.a, reg.b);
  const a = ra/D*W, b = rb/D*W;
  const whole = ra <= 0.001 && rb >= D - 0.001;
  const drawing = regionMode && dragging;
  const inside = buf && !clean && !whole && (loopOn || drawing);
  const zoned = buf && !clean && !whole;
  const zc = drawing ? ZDRAW : ZLOOP;
  let lx = null;
  if(buf && !clean && ageA() > 0.001 && flake){ lx = new Float32Array(W); for(let x=0;x<W;x++) lx[x] = live((x + 0.5)/W*D); }
  for(let y=0;y<H;y++){
    const row = (y&7)*8, row2 = ((y+3)&7)*8;
    for(let x=0;x<W;x++){
      const i = y*W + x;
      let v = base ? base[i]*(lx ? lx[x] : 1) > BAYER[row + (x&7)] : false;
      if(ov[i] > BAYER[row2 + ((x+5)&7)]) v = !v;
      if(inside && x >= a && x <= b) v = !v;
      lit[i] = v ? 1 : 0;
    }
  }
  if(buf){
    if(P.md && TL){
      for(const sl of slices){
        if(sl.a == null) continue;
        const x0 = Math.min(W-1, Math.floor(sl.a/D*W)) + 1, x1 = Math.min(W-1, Math.floor(sl.eb/D*W));
        for(let x=x0; x<=x1; x++) lit[x] ^= 1;
      }
      for(const e of TL.events){
        const x = Math.min(W-1, Math.floor(e.t/D*W)), hh = Math.max(2, Math.round(e.s*H*0.12));
        for(let y=0;y<hh;y++) lit[y*W + x] ^= 1;
      }
    }
    if(!clean){
      for(const l of fzLayers){
        if(l.b0 !== buf || !l.g) continue;
        const x = Math.min(W-1, Math.floor(l.p/D*W)), hh = Math.round(Math.min(1, l.g.gain.value*P.fz)*H*0.3);
        for(let y=H-1; y>=H-hh; y--){ lit[y*W + x] ^= 1; if(x + 1 < W) lit[y*W + x + 1] ^= 1; }
      }
      if(P.ss > 0.001 && strF.length){
        const hiF = Math.min(AN.HI, buf.sampleRate/2*0.95), wl = Math.max(2, Math.round(P.ss*W*0.08));
        for(const f of strF){
          const y = Math.round((H-1) - Math.log(f/AN.LO)/Math.log(hiF/AN.LO)*(H-1));
          if(y >= 0 && y < H) for(let x=0; x<wl; x++) lit[y*W + x] ^= 1;
        }
      }
    }
    const hx = Math.min(W-1, Math.max(0, Math.floor(shownPos/D*W)));
    for(let y=0;y<H;y+=2) lit[y*W + hx] ^= 1;
  }
  const dd = img.data;
  for(let i=0, o=0;i<lit.length;i++, o+=4){
    let c = lit[i] ? WHITE : BLACK;
    if(lit[i] && zoned){ const x = i % W; if(x >= a && x <= b) c = zc; }
    dd[o] = c[0]; dd[o+1] = c[1]; dd[o+2] = c[2];
  }
  gridCtx.putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(gridCv, 0, 0, cv.width, cv.height);
}

const WHITE = [255,255,255], BLACK = [0,0,0], ZLOOP = [77,220,255], ZDRAW = [255,106,213];
const fmtT = s => Math.floor(s/60) + ":" + (s%60 < 10 ? "0" : "") + (s%60).toFixed(1);
let hudLast = "";
function hud(){
  let s;
  if(!buf) s = takeLabel || "";
  else if(clean) s = (takeLabel ? takeLabel + "\n" : "") + fmtT(shownPos) + " / " + fmtT(buf.duration) + "   as played";
  else s = (takeLabel ? takeLabel + "\n" : "") + fmtT(shownPos) + " / " + fmtT(buf.duration) + "   ×" +
           P.sp.toFixed(2).replace("-","−") + "   " + (P.md ? "slices" : "grains") +
           (playing ? "" : "   stopped") + (loopOn ? "   loop" : "") +
           (sbuf ? "   stretched ×" + sk.toFixed(sk < 10 ? 1 : 0) : "") + (P.ag >= 0.5 ? "   pass " + Math.round(P.ag) : "");
  if(s !== hudLast){ $("#hud").textContent = s; hudLast = s; }
}

function frame(){ draw(); hud(); requestAnimationFrame(frame); }

/* ---------- clean: the take, played as itself, before anyone touches it ------------------------------------ */

function listenStart(from){
  stopListen();
  const D = buf.duration;
  from = Math.max(0, Math.min(D - 0.05, from));
  const t0 = ac.currentTime + 0.02, rem = D - from;
  const s = ac.createBufferSource(); s.buffer = buf;
  const g = ac.createGain();
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(1, t0 + 0.012);
  g.gain.setValueAtTime(1, t0 + Math.max(0.013, rem - 0.02));
  g.gain.linearRampToValueAtTime(0, t0 + rem);
  s.connect(g); g.connect(master);
  s.start(t0, from);
  lstart = t0; loff = from; listenEnded = false;
  const n = { s, g };
  s.onended = () => {
    try{ g.disconnect(); }catch(_){}
    if(lnode === n){ lnode = null; listenEnded = true; words(); }
  };
  lnode = n; words();
}
function listenPos(){
  if(!buf) return 0;
  if(lnode) return Math.min(buf.duration, loff + Math.max(0, ac.currentTime - lstart));
  return listenEnded ? buf.duration : loff;
}
function stopListen(fade){
  if(!lnode) return;
  const { s, g } = lnode, now = ac.currentTime, f = fade || 0.012;
  loff = listenPos(); lnode = null;
  s.onended = () => { try{ g.disconnect(); }catch(_){} };
  try{
    g.gain.cancelScheduledValues(now);
    g.gain.setValueAtTime(g.gain.value, now);
    g.gain.linearRampToValueAtTime(0, now + f);
    s.stop(now + f + 0.01);
  }catch(_){}
}
function showRig(){
  $("#pic").classList.remove("listen");
  $("#panel").style.display = "";
  build();
}
/* the take, as played, on the open instrument. the line under it says what to do */
function startClean(){
  clean = true; listenEnded = false; loff = 0; playing = false;
  showRig();
  if(ac.state === "running") listenStart(0);
  cleanNote();
}
function cleanNote(){ if(clean){ clearTimeout(noteTimer); $("#note").textContent = "take it apart and repost"; } }
/* the first touch: the clean take stops where it was and the instrument carries on from there */
function handoff(){
  if(!clean || !buf) return;
  const D = buf.duration, p = listenPos();
  stopListen(0.1); clean = false; listenEnded = false; rigOpen = true;
  pos = p >= D - 0.05 ? reg.a : p;
  playing = true; nextT = 0; nextS = 0; chopFromHead();
  $("#note").textContent = "";
  words();
}
$("#panel").addEventListener("pointerdown", e => {
  if(!clean) return;
  if(W1.play && e.target === W1.play) return;          // play and stop work on the clean take
  wake(); handoff();
}, true);

/* ---------- pointer: hold to freeze, drag to scrub, or draw a loop ---------------- */

let dragging = false, moved = false, lastTap = 0, tapIdx = -1;
function fx(e){ const r = cv.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left)/r.width)); }
cv.addEventListener("pointerdown", e => {
  if(!buf) return;
  if(clean){
    wake();
    if(!lnode && !listenEnded && loff === 0){ listenStart(fx(e)*buf.duration); return; }   // nothing heard yet: this touch plays the take from here
    handoff(); return;     // the first touch only hands over. it does not move the head or hold it: the take carries on as it was
  }
  cv.setPointerCapture(e.pointerId);
  dragging = true; moved = false;
  const D = buf.duration, t = fx(e)*D;
  if(regionMode){ remember(); reg = { a:t, b:t }; }
  else if(P.md){ tapIdx = sliceAt(t); tapFire(tapIdx); }
  else { holding = true; pos = t; }
});
cv.addEventListener("pointermove", e => {
  if(!dragging || !buf) return;
  moved = true;
  const D = buf.duration, t = fx(e)*D;
  if(regionMode) reg.b = t;
  else if(P.md){ const i = sliceAt(t); if(i !== tapIdx){ tapIdx = i; tapFire(i); } }
  else pos = t;
});
function release(){
  if(!dragging) return;
  dragging = false;
  if(regionMode){
    let a = Math.min(reg.a, reg.b), b = Math.max(reg.a, reg.b);
    if(b - a < 0.05){ a = 0; b = buf.duration; say("whole take"); } else { loopOn = true; say("loop"); }
    reg = { a, b }; regionMode = false; words(); changed();
    return;
  }
  holding = false;
  const now = performance.now();
  if(!P.md && !moved && now - lastTap < 350){ remember(); reg = { a:0, b:buf.duration }; say("whole take"); changed(); }
  lastTap = now;
}
cv.addEventListener("pointerup", release);
cv.addEventListener("pointercancel", release);

/* ---------- undo: every change to the settings can be stepped back ------------------- */

const undoStack = [];
function remember(){
  undoStack.push(JSON.stringify({ P, loopOn, reg, fzp }));
  if(undoStack.length > 60) undoStack.shift();
}
function undo(){
  const s = undoStack.pop();
  if(!s){ say("nothing to undo"); return; }
  const o = JSON.parse(s);
  Object.assign(P, o.P); loopOn = o.loopOn; reg = o.reg; fzp = o.fzp || [];
  if(P.md && tab === "grain") tab = "chop";
  if(!P.md && tab === "chop") tab = "grain";
  syncSliders(); showTab(); words(); changed();
  say("undone");
}

/* ---------- the panel ---------------------------------------------------------------- */

let tab = "tape", lastNudge = 0;
const sliders = [];
function mkSlider(d){
  const row = el("div","row"), l = el("span","l",d.label), v = el("span","v"), bar = el("div","bar"), fill = el("div","fill");
  bar.append(fill); row.append(l, v, bar);
  d.upd = () => {
    const f = Math.min(1, Math.max(0, toF(d, P[d.k])));
    if(d.c === "speed" || d.c === "bip"){ const a = Math.min(f, .5), b = Math.max(f, .5); fill.style.left = a*100 + "%"; fill.style.width = (b-a)*100 + "%"; }
    else { fill.style.left = "0"; fill.style.width = f*100 + "%"; }
    v.textContent = d.fmt(P[d.k]);
  };
  const set = e => {
    const r = bar.getBoundingClientRect();
    P[d.k] = fromF(d, Math.min(1, Math.max(0, (e.clientX - r.left)/r.width)));
    d.upd(); changed();
  };
  bar.tabIndex = 0;
  bar.addEventListener("pointerdown", e => { remember(); bar.setPointerCapture(e.pointerId); bar.focus(); set(e); });
  bar.addEventListener("pointermove", e => { if(e.buttons) set(e); });
  /* arrows nudge the slider that has focus; shift for bigger steps. a run of nudges is one undo */
  bar.addEventListener("keydown", e => {
    const dir = (e.key === "ArrowRight" || e.key === "ArrowUp") ? 1 : (e.key === "ArrowLeft" || e.key === "ArrowDown") ? -1 : 0;
    if(!dir) return;
    e.preventDefault(); handoff();
    const now = performance.now(); if(now - lastNudge > 800) remember(); lastNudge = now;
    if(d.step) P[d.k] = Math.max(d.lo, Math.min(d.hi, P[d.k] + dir*d.step*(e.shiftKey ? 12 : 1)));
    else P[d.k] = fromF(d, Math.min(1, Math.max(0, toF(d, P[d.k]) + dir*(e.shiftKey ? 0.1 : 0.01))), true);
    d.upd(); changed(); words();
  });
  /* the value itself puts this one setting back as the take had it */
  v.addEventListener("click", () => {
    if(Math.abs(P[d.k] - DEF[d.k]) < 1e-9) return;
    remember(); P[d.k] = DEF[d.k]; d.upd(); changed(); words();
    say(d.label + " back to the original");
  });
  d.upd(); d.row = row;
  return row;
}

function word(parent, txt, fn){
  const b = el("button","w",txt); b.onclick = fn; parent.append(b); return b;
}

const W1 = {}, W2 = {}, W3 = {};
function panel(){
  const w1 = $("#w1"), w2 = $("#w2"), sl = $("#sl"), w3 = $("#w3");
  W1.play = word(w1, "play", () => toggle());
  W1.rev  = word(w1, "reverse", () => { remember(); P.sp = -P.sp || -1; syncSliders(); changed(); words(); });
  W1.loop = word(w1, "loop", () => {
    remember(); loopOn = !loopOn; words(); changed();
    if(loopOn && buf && reg.a <= 0.001 && reg.b >= buf.duration - 0.001) say("looping the whole take. region to choose a stretch");
  });
  W1.reg  = word(w1, "region", () => { regionMode = !regionMode; say(regionMode ? "drag across the take to draw the loop" : ""); words(); });
  W1.loop.classList.add("lp"); W1.reg.classList.add("dw");
  W1.undo = word(w1, "undo", () => undo());
  W1.orig = word(w1, "original", () => original());
  for(const t of ["tape","grain","chop","hold","space"]){
    W2[t] = word(w2, t, () => {
      tab = t;
      if(t === "grain" && P.md){ remember(); P.md = 0; sync(); changed(); }
      if(t === "chop" && !P.md){ remember(); P.md = 1; sync(); changed(); say("tap an attack. drag across to strum. stop the sequence to play by hand"); }
      showTab(); words();
    });
  }
  for(const d of DEFS) sl.append(mkSlider(d));
  /* quick speeds and options inside the tabs */
  const q = el("div","wr"); q.id = "quick";
  for(const [lab, val] of [["−2",-2],["−1",-1],["−½",-.5],["0",0],["½",.5],["1",1],["2",2]]){
    const b = word(q, lab, () => { remember(); P.sp = val; syncSliders(); changed(); words(); });
    b.dataset.v = val;
  }
  sl.append(q);
  W3.lock = word(el("div","wr"), "", () => { remember(); P.lk = P.lk ? 0 : 1; words(); changed(); });
  W3.lock.parentNode.id = "lockwrap"; sl.append(W3.lock.parentNode);
  const ow = el("div","wr"); ow.id = "orderwrap";
  W3.order  = word(ow, "", () => { remember(); P.co = (P.co + 1) % ORDERS.length; words(); changed(); });
  W3.timing = word(ow, "", () => { remember(); P.tm = P.tm ? 0 : 1; words(); changed(); });
  sl.append(ow);
  const hw = el("div","wr"); hw.id = "holdwrap";
  W3.catch = word(hw, "catch", () => catchHere());
  W3.letgo = word(hw, "let go", () => letGo());
  W3.aging = word(hw, "", () => { handoff(); remember(); P.ai = P.ai ? 0 : 1; words(); changed(); if(P.ai) say("it ages a pass each time through"); });
  sl.append(hw);
  W3.bounce = word(w3, "bounce", () => bounce());
  W3.share  = word(w3, "share", () => share());
  W3.post   = word(w3, "post", () => openSheet());
  W3.takes  = word(w3, "takes", () => openCat());
  showTab(); words();
}
function showTab(){
  for(const d of DEFS) d.row.style.display = d.tab === tab ? "flex" : "none";
  $("#quick").style.display = tab === "tape" ? "flex" : "none";
  $("#lockwrap").style.display = tab === "tape" ? "flex" : "none";
  $("#orderwrap").style.display = tab === "chop" ? "flex" : "none";
  $("#holdwrap").style.display = tab === "hold" ? "flex" : "none";
}
function syncSliders(){ for(const d of DEFS) d.upd(); }
function words(){
  W1.play.textContent = (clean ? !!lnode : playing) ? "stop" : "play";
  W1.rev.classList.toggle("on", P.sp < 0);
  W1.loop.classList.toggle("on", loopOn);
  W1.reg.classList.toggle("on", regionMode);
  for(const t in W2) W2[t].classList.toggle("on", t === tab);
  W3.lock.textContent = "pitch follows speed: " + (P.lk ? "yes" : "no");
  W3.order.textContent = "order: " + ORDERS[P.co];
  W3.timing.textContent = "timing: " + (P.tm ? "own spacing" : "grid");
  W3.aging.textContent = "aging: " + (P.ai ? "on its own" : "by hand");
  W3.aging.classList.toggle("on", !!P.ai);
  W3.catch.textContent = fzp.length ? "catch another" : "catch";
  W3.letgo.style.display = fzp.length ? "" : "none";
  for(const b of $("#quick").children) b.classList.toggle("on", Math.abs(P.sp - parseFloat(b.dataset.v)) < 0.001);
  W3.bounce.textContent = rec ? "stop bounce" : "bounce";
  W3.bounce.classList.toggle("on", !!rec);
}

function toggle(){
  if(!buf) return;
  if(ac.state === "suspended") ac.resume();
  if(clean){ if(lnode) stopListen(); else listenStart(listenEnded ? 0 : loff); words(); cleanNote(); return; }
  if(!playing && !loopOn){
    if(P.sp >= 0 && pos >= buf.duration - 0.01) pos = 0;
    if(P.sp < 0 && pos <= 0.01) pos = buf.duration;
  }
  playing = !playing; nextT = 0; nextS = 0;
  if(playing) chopFromHead();
  words();
}
addEventListener("keydown", e => {
  if(e.target && e.target.closest && e.target.closest("input,textarea")) return;
  if(e.code === "Space"){ e.preventDefault(); toggle(); }
  if(e.key === "r"){ handoff(); remember(); P.sp = -P.sp || -1; syncSliders(); changed(); words(); }
  if((e.ctrlKey || e.metaKey) && e.key === "z"){ e.preventDefault(); undo(); }
});

let noteTimer = 0;
function say(s, html){
  const n = $("#note");
  if(html) n.innerHTML = s; else n.textContent = s;
  clearTimeout(noteTimer);
  if(s) noteTimer = setTimeout(() => { if(!n.querySelector("a")) n.textContent = ""; }, 4500);
}

/* ---------- the link is the remix ------------------------------------------------------ */

const KEYS = ["sp","pt","rv","lk","tn","gs","dn","sc","sw","md","cs","cl","co","gp","th","tm","ec","et","rm","dr","wt","st","fz","ss","sr","fs","ag","ai","si"];
let hashTimer = 0;
function paramString(){
  const q = new URLSearchParams();
  for(const k of KEYS) if(Math.abs(P[k] - DEF[k]) > 1e-6) q.set(k, String(Math.round(P[k]*1000)/1000));
  if(buf && (reg.a > 0.001 || reg.b < buf.duration - 0.001)){
    q.set("la", (Math.round(reg.a*100)/100).toString()); q.set("lb", (Math.round(reg.b*100)/100).toString());
  }
  if(loopOn) q.set("lo", "1");
  if(fzp.length) q.set("fp", fzp.join("_"));
  return q.toString();
}
function writeHash(){
  if(!take) return;
  const q = paramString();
  history.replaceState(null, "", "#" + take.did + "/" + take.cid + (q ? "?" + q : ""));
}
function changed(){
  sync(); clearTimeout(hashTimer); hashTimer = setTimeout(writeHash, 400);
}
/* every setting back to the take as it was. undo brings the remix back */
function original(){
  if(!buf) return;
  if(!paramString()){ say("this is the original"); return; }
  remember();
  Object.assign(P, DEF);
  loopOn = false; reg = { a:0, b:buf.duration }; regionMode = false; fzp = [];
  if(tab === "chop") tab = "grain";
  syncSliders(); showTab(); words(); changed();
  say("the original. undo for the remix");
}

let pending = null;      // region from the address, applied once the take is loaded
function parseHash(){
  const h = (location.hash || "").replace(/^#/, "").trim();
  const m = h.match(/^(did:[a-z0-9:%._-]+)\/([a-z0-9]+)(?:\?(.*))?$/i);
  if(!m) return null;
  return { did:m[1], cid:m[2], q:new URLSearchParams(m[3] || "") };
}
/* a take starts from the plain settings. the only settings that arrive with a
   take are the ones written into its link. */
function resetSettings(){
  Object.assign(P, DEF); fzp = [];
  undoStack.length = 0;
  tab = "tape";
  syncSliders(); showTab(); sync(); words();
}
function applyParams(q){
  Object.assign(P, DEF);
  undoStack.length = 0;
  for(const k of KEYS) if(q.has(k)){ const v = parseFloat(q.get(k)); if(isFinite(v)) P[k] = v; }
  P.md = P.md ? 1 : 0; P.lk = P.lk ? 1 : 0; P.tm = P.tm ? 1 : 0; P.ai = P.ai ? 1 : 0;
  fzp = (q.get("fp") || "").split("_").map(parseFloat).filter(x => isFinite(x) && x >= 0).slice(-FZ_MAX);
  pending = { la:q.has("la") ? parseFloat(q.get("la")) : null, lb:q.has("lb") ? parseFloat(q.get("lb")) : null, lo:q.has("lo") ? q.get("lo") !== "0" : (q.has("la") && q.has("lb")) };
  syncSliders();
  tab = P.md ? "chop" : "tape"; showTab();
}

async function share(){
  if(!take){ say("this take is only on this device. pick one from the repo to get a link"); return; }
  clearTimeout(hashTimer); writeHash();
  const url = location.href;
  if(navigator.share){ try{ await navigator.share({ title:"ximeremix", url }); return; }catch(e){ if(e && e.name === "AbortError") return; } }
  let ok = false;
  try{ await navigator.clipboard.writeText(url); ok = true; }catch(e){}
  const a = '<a href="' + url.replace(/"/g, "&quot;") + '">' + (ok ? "link copied" : "this is the link") + "</a>";
  say(a, true);
}

/* ---------- post: the remix goes up as a reply under the take's own post ------------------ */

/* same session the give page keeps, so a phone signed in there is signed in here */
const SKEY = "remix.give.session";
let S = null, keep = false, sheetBusy = false;
try{
  const k = JSON.parse(localStorage.getItem(SKEY) || "null");
  if(k && k.refresh){ S = Object.assign({ access:null }, k); keep = true; }
}catch(e){}
function saveS(){
  try{
    if(keep && S) localStorage.setItem(SKEY, JSON.stringify({ did:S.did, handle:S.handle, pds:S.pds, host:S.host, refresh:S.refresh }));
    else localStorage.removeItem(SKEY);
  }catch(e){}
}
function entryway(pds){
  try{ return /\.bsky\.network$/.test(new URL(pds).hostname) ? "https://bsky.social" : pds; }catch(e){ return pds; }
}
async function refreshS(){
  const r = await fetch(S.host + "/xrpc/com.atproto.server.refreshSession", { method:"POST", headers:{ Authorization:"Bearer " + S.refresh } });
  if(!r.ok){ S = null; saveS(); sheetShow(); throw new Error("signed out. sign in again"); }
  const j = await r.json(); S.access = j.accessJwt; S.refresh = j.refreshJwt; saveS();
}
async function callS(nsid, body, retried){
  if(!S.access && !retried) await refreshS();
  const r = await fetch(S.pds + "/xrpc/" + nsid, { method:"POST",
    headers:{ "Content-Type":"application/json", Authorization:"Bearer " + S.access }, body:JSON.stringify(body) });
  if(r.ok) return r.json();
  const j = await r.json().catch(() => ({}));
  if(!retried && (j.error === "ExpiredToken" || r.status === 401)){ await refreshS(); return callS(nsid, body, true); }
  throw new Error(j.message || j.error || ("posting failed (" + r.status + ")"));
}
async function signInS(){
  const handle = $("#shhandle").value.trim().replace(/^@/, ""), pw = $("#shpw").value.trim();
  if(!handle || !pw){ sheetSay("the account and an app password, both"); return; }
  sheetSay("signing in");
  try{
    let did = handle;
    if(!handle.startsWith("did:")){
      const r = await fetch("https://public.api.bsky.app/xrpc/com.atproto.identity.resolveHandle?handle=" + encodeURIComponent(handle));
      if(!r.ok) throw new Error("no account called " + handle);
      did = (await r.json()).did;
    }
    const pds = await pdsFor(did), host = entryway(pds);
    const r = await fetch(host + "/xrpc/com.atproto.server.createSession", { method:"POST",
      headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ identifier:handle, password:pw }) });
    const j = await r.json().catch(() => ({}));
    if(!r.ok) throw new Error(r.status === 401 ? "that account and app password didn't work" : (j.message || "sign in failed (" + r.status + ")"));
    S = { did:j.did || did, handle:j.handle || handle, access:j.accessJwt, refresh:j.refreshJwt, pds, host };
    $("#shpw").value = "";
    saveS(); sheetShow(); sheetSay("");
  }catch(e){ sheetSay(e.message || String(e)); }
}
function signOutS(){
  if(S && S.refresh) fetch(S.host + "/xrpc/com.atproto.server.deleteSession", { method:"POST", headers:{ Authorization:"Bearer " + S.refresh } }).catch(() => {});
  S = null; saveS(); sheetShow();
}
/* the take's own post: the oldest post on the take's account that carries its id */
async function findAnchor(t){
  if(t.anchor !== undefined) return t.anchor;
  const pds = await pdsFor(t.did);
  let cursor = "", hit = null;
  for(let page=0; page<6; page++){
    const r = await fetch(pds + "/xrpc/com.atproto.repo.listRecords?repo=" + encodeURIComponent(t.did) +
      "&collection=app.bsky.feed.post&limit=100" + (cursor ? "&cursor=" + encodeURIComponent(cursor) : ""));
    if(!r.ok) break;
    const j = await r.json();
    for(const rec of (j.records || [])){
      if(JSON.stringify(rec.value || {}).includes(t.cid)) hit = { uri:rec.uri, cid:rec.cid, reply:(rec.value || {}).reply || null };
    }
    cursor = j.cursor; if(!cursor) break;
  }
  t.anchor = hit;
  return hit;
}
const postLink = uri => { const p = uri.split("/"); return "https://bsky.app/profile/" + encodeURIComponent(p[2]) + "/post/" + encodeURIComponent(p[4]); };
function sheetSay(s, html){ const n = $("#shst"); if(html) n.innerHTML = s; else n.textContent = s || ""; }
function sheetShow(){
  $("#shin").hidden = !!S; $("#shout").hidden = !S;
  const who = $("#shwho"); who.textContent = "";
  if(S){ who.append(el("div","w","as @" + S.handle)); word(who, "sign out", () => signOutS()); }
  SH.keep.textContent = "remember this phone: " + (keep ? "yes" : "no");
  SH.keep.classList.toggle("on", keep);
  SH.post.textContent = sheetBusy ? "posting..." : "post";
}
const SH = {};
function sheetChrome(){
  SH.sign = word($("#shinw"), "sign in", () => signInS());
  SH.keep = word($("#shinw"), "", () => { keep = !keep; saveS(); sheetShow(); });
  SH.post = word($("#shoutw"), "post", () => postRemix());
  word($("#shclose"), "close", () => closeSheet());
  $("#shpw").addEventListener("keydown", e => { if(e.key === "Enter") signInS(); });
}
function openSheet(){
  if(!take){ say("this take is only on this device. pick one from takes to post a remix of it"); return; }
  if(!paramString()){ say("nothing changed yet. this is still the take as it was"); return; }
  if(!SH.post) sheetChrome();
  $("#shhead").textContent = "post this remix as a reply under " + (takeLabel || "the take") + ", from your own bluesky account.";
  sheetSay(""); sheetShow();
  $("#sheet").classList.add("open");
}
function closeSheet(){ $("#sheet").classList.remove("open"); }
async function postRemix(){
  if(sheetBusy || !S || !take) return;
  sheetBusy = true; sheetShow(); sheetSay("finding the take's post");
  try{
    clearTimeout(hashTimer); writeHash();
    const url = location.href;
    const a = await findAnchor(take);
    if(!a) throw new Error("couldn't find the post this take came from");
    const parent = { uri:a.uri, cid:a.cid }, root = a.reply && a.reply.root ? a.reply.root : parent;
    const words = $("#shwords").value.trim(), label = "ximeremix";
    const lead = words ? words + "\n\n" : "", te = new TextEncoder();
    const byteStart = te.encode(lead).length, byteEnd = byteStart + te.encode(label).length;
    sheetSay("posting");
    const p = await callS("com.atproto.repo.createRecord", { repo:S.did, collection:"app.bsky.feed.post", record:{
      $type:"app.bsky.feed.post", text:lead + label, createdAt:new Date().toISOString(),
      reply:{ root, parent },
      facets:[{ index:{ byteStart, byteEnd }, features:[{ $type:"app.bsky.richtext.facet#link", uri:url }] }],
      embed:{ $type:"app.bsky.embed.external", external:{ uri:url, title:"ximeremix of " + (takeLabel || "a take"), description:BAND } } } });
    $("#shwords").value = "";
    sheetSay('posted. <a href="' + postLink(p.uri) + '" target="_blank" rel="noopener">see it under the take</a>', true);
  }catch(e){ sheetSay((e.message || String(e)) + ". the remix is still here; post again when you can"); }
  sheetBusy = false; sheetShow();
}

/* ---------- bounce: record what you hear ------------------------------------------------ */

let rec = null, recChunks = [];
function bounce(){
  if(!ac) return;
  if(rec){ rec.stop(); return; }
  const types = ["audio/webm;codecs=opus","audio/ogg;codecs=opus","audio/mp4","audio/webm"];
  const mt = window.MediaRecorder ? types.find(t => MediaRecorder.isTypeSupported(t)) : null;
  if(!window.MediaRecorder){ say("this browser can't record the output"); return; }
  rec = new MediaRecorder(recDest.stream, mt ? { mimeType:mt } : undefined);
  recChunks = [];
  rec.ondataavailable = e => { if(e.data && e.data.size) recChunks.push(e.data); };
  rec.onstop = () => {
    const type = (rec && rec.mimeType) || mt || "audio/webm";
    const blob = new Blob(recChunks, { type });
    const url = URL.createObjectURL(blob);
    const ext = /ogg/.test(type) ? "ogg" : /mp4/.test(type) ? "m4a" : "webm";
    rec = null; words();
    say('<a href="' + url + '" download="ximeremix.' + ext + '">save ximeremix.' + ext + "</a>", true);
  };
  rec.start(); words();
  if(!playing && buf) toggle();
  say("recording what you hear");
}

/* ---------- loading a take ------------------------------------------------------------------ */

async function decodeBytes(bytes){
  const coded = decodeADPCM(bytes);
  if(coded){
    const b = ac.createBuffer(1, coded.pcm.length, coded.rate);
    b.getChannelData(0).set(coded.pcm);
    return b;
  }
  return await ac.decodeAudioData(bytes);
}
async function pdsFor(did){
  const r = await fetch("https://plc.directory/" + did);
  if(!r.ok) throw new Error("could not resolve " + did);
  const doc = await r.json();
  const svc = (doc.service || []).find(s => String(s.id).endsWith("atproto_pds"));
  if(!svc) throw new Error("no pds in that did document");
  return svc.serviceEndpoint.replace(/\/$/, "");
}

function makeSlices(){
  const D = buf.duration, ev = TL.events, out = [];
  const lv = TL.lv, hop = TL.hop, r = TL.rate, N = AN.N, floor = pct(lv, 0.1);
  const bodyEnd = (a, s, e) => {
    const f0 = Math.max(0, Math.round((a*r - N*0.5)/hop));
    let peak = 0;
    for(let f=f0; f<Math.min(lv.length, f0 + 8); f++) if(lv[f] > peak) peak = lv[f];
    const thr = Math.max(0.3*peak, floor*1.3);
    let eb = e;
    for(let f=f0 + 6; f<lv.length; f++){
      const tt = (f*hop + N*0.5)/r;
      if(tt >= e){ break; }
      if(lv[f] < thr){ eb = tt; break; }
    }
    return Math.min(e, Math.max(s + 0.06, eb));
  };
  if(ev.length >= 2){
    for(let i=0;i<ev.length;i++){
      const s = Math.max(0, ev[i].t - 0.04), e = i+1 < ev.length ? Math.max(s + 0.05, ev[i+1].t - 0.04) : D;
      if(e - s > 0.03) out.push({ s, e, eb:bodyEnd(ev[i].t, s, e), a:ev[i].t, str:ev[i].s });
    }
    const vs = out.map(x => ev.find(v => v.t === x.a).v).sort((a,b) => a-b);
    for(const x of out){ const v = ev.find(y => y.t === x.a).v; let k = 0; while(k < vs.length && vs[k] < v) k++; x.q = vs.length > 1 ? k/(vs.length - 1) : 1; }
    if(ev[0].t > 0.3){ const e = Math.max(0.05, ev[0].t - 0.04); out.unshift({ s:0, e, eb:e, str:0.1, q:0 }); }
  } else {
    const n = Math.max(2, Math.min(16, Math.round(D/0.5)));
    for(let i=0;i<n;i++){ const s = D*i/n, e = D*(i+1)/n; out.push({ s, e, eb:e, str:0.5 }); }
    const pk = out.map(x => { let m = 0; for(let f=Math.floor(x.s*r/hop); f<Math.min(lv.length, Math.ceil(x.e*r/hop)); f++) if(lv[f] > m) m = lv[f]; return m; });
    const so = pk.slice().sort((a,b) => a-b);
    out.forEach((x, i) => { x.q = so.indexOf(pk[i])/(n - 1); });
  }
  return out;
}

async function loadBuffer(abuf, label, t){
  const mine = ++job;
  stopListen(); clean = false; listenEnded = false;
  playing = false; holding = false; grains.length = 0;
  buf = null; TL = null; base = null; take = t || null; takeLabel = label || "";
  flake = null; syncFreeze();
  words();
  say("listening");
  const rb = reverseBuf(abuf);
  const tl = await analyse(mono(abuf), abuf.sampleRate, (done, total, bm, hop) => {
    if(mine === job){
      baseFrom(bm, AN.BANDS, done, hop, abuf.sampleRate, abuf.duration);
      say("listening " + Math.round(done/total*100) + "%");
    }
    return new Promise(r => setTimeout(r, 0));
  });
  if(mine !== job) return;
  buf = abuf; revBuf = rb; TL = tl;
  slices = makeSlices(); ci = 0;
  stretchJob++; stretchPend = 0; sbuf = srev = null; sk = 1;
  makeFlakes(); tuneStrings(); selfRoom();
  if(fzp.length && P.fz < 0.001) fzp = [];
  fzp = fzp.filter(x => x <= abuf.duration);
  sync();
  const D = buf.duration;
  reg = { a:0, b:D }; loopOn = false;
  if(pending){
    if(pending.la != null && pending.lb != null && pending.lb > pending.la){ reg = { a:Math.max(0, pending.la), b:Math.min(D, pending.lb) }; }
    loopOn = pending.lo; pending = null;
  }
  pos = P.sp < 0 ? reg.b : reg.a;
  /* never wait on the sound waking here: before a touch, a phone holds that promise
     open, and waiting would keep the picture from ever showing */
  say("");
  if(rigOpen){ showRig(); playing = true; nextT = 0; nextS = 0; }
  else startClean();
  words();
  if(take) writeHash();
}

async function playTake(t, label){
  say("fetching");
  const pds = await pdsFor(t.did);
  const r = await fetch(pds + "/xrpc/com.atproto.sync.getBlob?did=" + encodeURIComponent(t.did) + "&cid=" + encodeURIComponent(t.cid));
  if(!r.ok) throw new Error("take not found (" + r.status + ")");
  const total = +((r.headers && r.headers.get("content-length")) || 0);
  let bytes;
  if(total && r.body && r.body.getReader){
    const rd = r.body.getReader(), parts = [];
    let got = 0;
    for(;;){
      const { done, value } = await rd.read();
      if(done) break;
      parts.push(value); got += value.length;
      say("fetching " + Math.min(99, Math.round(got/total*100)) + "%");
    }
    const all = new Uint8Array(got); let o = 0;
    for(const p of parts){ all.set(p, o); o += p.length; }
    bytes = all.buffer;
  } else bytes = await r.arrayBuffer();
  const ab = await decodeBytes(bytes);
  await loadBuffer(ab, label || "", { did:t.did, cid:t.cid });
}
async function playFile(f){
  resetSettings(); pending = null;
  say("reading");
  const ab = await decodeBytes(await f.arrayBuffer());
  rigOpen = true;
  await loadBuffer(ab, "", null);
}

/* ---------- the band's takes ------------------------------------------------------------------ */

const BAND = "OPPOSITE CITY";
/* takes are read by account id, which never changes when a handle does.
   the first account's id is fixed; handles the project has gone by are
   looked up too, so a take is found whichever of them it was posted under. */
const DIDS = ["did:plc:srqsjbfm2sfyhqvzfyl3as2t"];
const HANDLES = ["oppositecity.bsky.social", "opposite.city", "rainwatchbaseball.bsky.social"];
let catItems = null, catBusy = false;

function findBlobs(o, out){
  if(!o || typeof o !== "object") return;
  if(o.$type === "blob" && o.ref && o.ref.$link) out.push({ cid:o.ref.$link, mime:o.mimeType || "" });
  for(const k in o) findBlobs(o[k], out);
}
async function loadCatalogue(){
  const dids = new Set(DIDS);
  await Promise.all(HANDLES.map(async h => {
    try{
      const r = await fetch("https://public.api.bsky.app/xrpc/com.atproto.identity.resolveHandle?handle=" + h);
      if(r.ok){ const d = (await r.json()).did; if(d) dids.add(d); }
    }catch(e){}
  }));
  const seen = new Set(), items = [];
  for(const did of dids){
    try{ await readTakes(did, seen, items); }catch(e){}
  }
  items.sort((a, b) => a.when < b.when ? 1 : -1);
  items.forEach((it, i) => { it.n = items.length - i; });   // 1 is the first take ever made
  return items;
}
async function readTakes(did, seen, items){
  const pds = await pdsFor(did);
  let cursor = "";
  for(let page=0; page<3; page++){
    const r = await fetch(pds + "/xrpc/com.atproto.repo.listRecords?repo=" + encodeURIComponent(did) +
      "&collection=app.bsky.feed.post&limit=100" + (cursor ? "&cursor=" + encodeURIComponent(cursor) : ""));
    if(!r.ok) break;
    const j = await r.json();
    for(const rec of (j.records || [])){
      const v = rec.value || {}, raw = JSON.stringify(v);
      const add = (cid) => { if(seen.has(cid)) return; seen.add(cid); items.push({ did, cid, when:v.createdAt || "", text:v.text || "" }); };
      for(const m of raw.matchAll(/(?:take|remix)\/#(did:[a-z0-9:%._-]+)\/([a-z0-9]+)/gi)) if(m[1] === did) add(m[2]);
      const bl = []; findBlobs(v, bl);
      for(const b of bl) if(/^(audio|video)\//.test(b.mime) || b.mime === "application/octet-stream") add(b.cid);
    }
    cursor = j.cursor; if(!cursor) break;
  }
}
function renderCat(){
  const list = $("#catlist"); list.textContent = "";
  if(!catItems || !catItems.length){
    const p = el("div","item", catBusy ? "looking for takes..." : "no takes found there. pick a file instead.");
    list.append(p); return;
  }
  for(const it of catItems){
    const b = el("button","item" + (take && take.cid === it.cid ? " cur" : ""));
    const t = (it.text || "").replace(/\S*(?:https?:\/\/|opposite\.city|did:)\S*/g, "").replace(/\s+/g, " ").trim().slice(0, 70);
    b.append(el("div","d", "take " + it.n));
    if(t) b.append(el("div","t", t));
    b.onclick = async () => {
      closeCat(); resetSettings(); pending = null; rigOpen = false;
      try{ await playTake({ did:it.did, cid:it.cid }, "take " + it.n); }
      catch(e){ say(String(e.message || e)); }
    };
    list.append(b);
  }
}
async function openCat(){
  $("#cat").classList.add("open");
  renderCat();
  if(catItems == null && !catBusy){
    catBusy = true; renderCat();
    try{ catItems = await loadCatalogue(); }catch(e){ catItems = []; $("#cathead").lastChild.textContent = String(e.message || e); }
    catBusy = false; renderCat();
  }
}
function closeCat(){ $("#cat").classList.remove("open"); }
function catChrome(){
  const h = $("#cathead"); h.textContent = "";
  h.append(el("div","", BAND), el("div","", "takes. open one and take it apart."));
  const w = $("#catwords");
  word(w, "from file", () => $("#file").click());
  word(w, "close", () => closeCat());
}
$("#file").onchange = async e => {
  const f = e.target.files && e.target.files[0]; if(!f) return;
  closeCat();
  try{ await playFile(f); }catch(err){ say("could not decode that"); }
};
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", async e => {
  e.preventDefault();
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if(!f) return;
  start(); closeCat();
  try{ await playFile(f); }catch(err){ say("could not decode that"); }
});

/* ---------- boot ----------------------------------------------------------------------------------- */

function wake(){ if(ac && ac.state !== "running") ac.resume(); }
addEventListener("pointerdown", wake, true);
addEventListener("keydown", wake, true);
function start(){
  if(started) return;
  started = true;
  buildGraph();
  panel(); catChrome(); build();
  requestAnimationFrame(frame);
}
/* a clip handed over from the clipper: read once from this device's storage, never posted */
function clipDB(){
  return new Promise((ok, no) => {
    const r = indexedDB.open("ximeremix", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("clips");
    r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
  });
}
async function takeClip(key){
  const db = await clipDB();
  const rec = await new Promise((ok, no) => {
    const q = db.transaction("clips").objectStore("clips").get(key);
    q.onsuccess = () => ok(q.result); q.onerror = () => no(q.error);
  });
  if(!rec) return null;
  return { buf:await decodeBytes(await rec.wav.arrayBuffer()), name:rec.name || "" };
}
async function begin(){
  const clip = new URLSearchParams(location.search).get("clip");
  if(clip){
    rigOpen = true; start();
    try{
      const c = await takeClip(clip);
      if(c){ resetSettings(); pending = null; await loadBuffer(c.buf, c.name, null); return; }
    }catch(e){}
    say("that clip isn't on this device any more. drop a file, or pick a take");
    openCat(); return;
  }
  const t = parseHash();
  rigOpen = !!t && [...t.q.keys()].length > 0;
  start();
  if(t){
    applyParams(t.q);
    try{ await playTake({ did:t.did, cid:t.cid }, ""); }
    catch(e){ say(String(e.message || e)); openCat(); }
  } else openCat();
}
begin();
addEventListener("hashchange", async () => {
  if(!started) return;
  const t = parseHash();
  if(t && (!take || take.cid !== t.cid)){
    rigOpen = [...t.q.keys()].length > 0;
    applyParams(t.q);
    try{ await playTake({ did:t.did, cid:t.cid }, ""); }catch(e){ say(String(e.message || e)); }
  }
});
let rebuild = null;
addEventListener("resize", () => { clearTimeout(rebuild); rebuild = setTimeout(() => { if(started) build(); }, 250); });
