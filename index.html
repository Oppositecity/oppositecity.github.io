<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>OPPOSITE CITY</title>
<meta name="description" content="Opposite City — an artistic agency, idea firm, and widget farm." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
<style>
  :root{
    --desk:#3a3a3a; --face:#c0c0c0; --hi:#ffffff; --lo:#808080; --shadow:#000000;
    --text:#000000;
    /* --- dials: change these, the whole layout follows --- */
    --pad:8px;          /* page gutter */
    --gap:6px;          /* space between windows */
    --max:1440px;       /* widest the content ever gets */
    --tile:168px;       /* narrowest a window may be before dropping a column */
    --tileh:212px;      /* window height */
    --mast-cap:92px;    /* masthead stops growing here */
  }
  @media (min-width:640px){ :root{ --tile:240px; } }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{height:100%;}
  body{
    min-height:100%; background:var(--desk);
    font-family:'Courier Prime','Courier New',Courier,monospace;
    font-size:14px; color:var(--text);
    -webkit-font-smoothing:none;
    padding-bottom:40px;
  }
  .out{border:2px solid; border-color:var(--hi) var(--shadow) var(--shadow) var(--hi);
       box-shadow:inset 1px 1px 0 var(--face), inset -1px -1px 0 var(--lo);}
  .in {border:2px solid; border-color:var(--lo) var(--hi) var(--hi) var(--lo);}

  /* ---- masthead ---- */
  #head{padding:10px var(--pad) 8px; color:#fff;}
  #head h1{font-weight:700; line-height:1; letter-spacing:0; white-space:nowrap;
           font-size:min(calc((100vw - var(--pad) * 2 - 2px) / 7.8), var(--mast-cap));}

  /* ---- controls ---- */
  #controls{padding:0 var(--pad) 10px; display:flex; flex-direction:column; gap:7px;}
  #q{width:100%; padding:10px; font-family:inherit; font-size:14px; background:#fff; color:#000;}
  #q::placeholder{color:#555; opacity:1;}
  #chips{display:flex; flex-wrap:wrap; gap:5px;}
  .chip{font-family:inherit; font-size:11px; letter-spacing:1px; padding:8px 10px;
        background:var(--face); color:#000; cursor:pointer; min-height:36px;}
  .chip[aria-pressed="true"]{border-color:var(--lo) var(--hi) var(--hi) var(--lo);
        box-shadow:none; font-weight:700;}

  /* ---- the grid: every surface an open window, all the same size ---- */
  #grid{display:grid; gap:var(--gap); padding:0 var(--pad) 14px;
        grid-template-columns:repeat(auto-fill, minmax(min(100%, var(--tile)), 1fr));}
  .win{height:var(--tileh); display:flex; flex-direction:column; background:var(--face);
       text-decoration:none; color:inherit; overflow:hidden;}
  .win.act{cursor:pointer;}
  .win.hit{outline:3px solid #fff; outline-offset:2px;}
  .tbar{display:flex; align-items:center; gap:5px; padding:3px 5px; color:#fff;
        font-weight:700; font-size:12px; flex:0 0 auto;}
  .tbar .tt{flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; letter-spacing:.5px;}
  .tbar .st{font-size:10px; letter-spacing:1px; white-space:nowrap; font-weight:400;}
  .wbody{flex:1; overflow:auto; padding:6px 7px; font-size:13px; line-height:1.32;}
  .tagrow{margin-top:5px; display:flex; flex-wrap:wrap; gap:3px;}
  .tag{font-size:10px; padding:1px 5px; background:#fff; color:#000;}
  .foot{flex:0 0 auto; padding:4px 5px 5px; background:var(--face); font-size:10px; letter-spacing:1px;}
  .frow{display:flex; justify-content:space-between; align-items:center; gap:5px; margin-bottom:3px;}
  .frow .go{font-weight:700;}
  .dim{color:#3a3a3a;}
  .meter{height:9px; background:#fff;}
  .meter .fill{height:100%;}

  /* ---- taskbar ---- */
  /* one measure for everything; centres once the viewport passes --max */
  #head,#controls,#grid,#empty,#note{max-width:var(--max); margin-inline:auto; width:100%;}
  #taskbar{position:fixed; left:0; right:0; bottom:0; min-height:36px;
           background:var(--face); display:flex; align-items:center; gap:5px;
           padding:4px calc(4px + env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) 4px; z-index:99;}
  .tb{min-height:30px; padding:0 11px; background:var(--face); color:#000; font-family:inherit;
      font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap;}
  .tb:active{border-color:var(--lo) var(--hi) var(--hi) var(--lo);}
  #count{flex:1; font-size:11px; letter-spacing:1px; padding:0 6px; overflow:hidden;
         white-space:nowrap; text-overflow:ellipsis;}
  #clock{font-size:11px; padding:0 8px; min-height:30px; display:flex; align-items:center; background:#fff;}
  #empty{color:#fff; padding:0 var(--pad) 20px; font-size:13px;}
  :focus-visible{outline:2px dotted #fff; outline-offset:2px;}
  @media (max-width:520px){
    :root{--tileh:196px;}
    .wbody{font-size:12px; padding:5px 6px;}
    .tbar{font-size:11px;} .tbar .st{font-size:9px;}
    .tag{font-size:9px;}
  }
  @media (prefers-reduced-motion:no-preference){ .win{transition:outline-color .15s;} }
  /* districts + completion numbers: kept in the data, hidden from the view */
  #chips{display:none;}
  .frow .dim{display:none;}
  .meter{display:none;}
</style>
</head>
<body>

<div id="head">
  <h1>OPPOSITE CITY</h1>
</div>

<div id="controls">
  <input id="q" placeholder="search every surface" autocomplete="off" aria-label="Search surfaces" />
  <div id="chips"></div>
</div>

<div id="grid"></div>
<p id="empty" style="display:none">Nothing here matches.</p>

<div id="taskbar" class="out">
  <div id="count"></div>
  <div id="clock" class="in"></div>
</div>

<script>
/* REGISTRY:BEGIN */
const REGISTRY = {
 "lexicon": "city.opposite.surface",
 "generated": "2026-07-11",
 "published": "2026-07-30",
 "note": "Approved, deployed surfaces only. The full list lives in registry-master.json.",
 "front": [],
 "districts": [
  {
   "id": "language",
   "name": "Language",
   "blurb": "writing instruments & semiotic tools"
  },
  {
   "id": "civic",
   "name": "Civic",
   "blurb": "sortition, institutions, infrastructure"
  },
  {
   "id": "viz",
   "name": "Atlas",
   "blurb": "visualization & knowledge browsers"
  },
  {
   "id": "ambient",
   "name": "Ambient",
   "blurb": "widgets that drift"
  }
 ],
 "surfaces": [
  {
   "slug": "split",
   "name": "SPLIT",
   "district": "language",
   "status": "live",
   "finish": 90,
   "tags": [
    "figure-ground",
    "pinwheel",
    "type generator",
    "riley"
   ],
   "blurb": "Figure-ground reversal type generator. Two tones only, always exact opposites — grid and pinwheel modes, up to 48 blades per glyph. The reversal is conserved: nothing lost or added in the exchange.",
   "url": "https://opposite.city/split/"
  },
  {
   "slug": "sortition-congress",
   "name": "Sortition Congress",
   "district": "civic",
   "status": "live",
   "finish": 70,
   "tags": [
    "sortition",
    "democracy",
    "lottery"
   ],
   "blurb": "A legislature chosen by lot instead of election. A working model of government by random sample.",
   "url": "https://opposite.city/sortition-congress/"
  },
  {
   "slug": "circlefornia",
   "name": "CIRCLEFORNIA",
   "district": "viz",
   "status": "live",
   "finish": 80,
   "tags": [
    "california",
    "measurement",
    "equivalence"
   ],
   "blurb": "Measures any point on Earth against California. A california equivalent finder — the state as a unit of comparison.",
   "url": "https://opposite.city/circlefornia/"
  },
  {
   "slug": "somesets",
   "name": "SOMESET GENERATOR",
   "district": "ambient",
   "status": "live",
   "finish": 75,
   "tags": [
    "colour drift",
    "fullscreen",
    "ambient"
   ],
   "blurb": "A sunset that never settles. Geometry fixed, colour continuous — mostly almost-plausible, sometimes not. Press set to freeze one mid-transition, rise to let it go.",
   "url": "https://opposite.city/somesets/"
  },
  {
   "slug": "bz",
   "name": "BZ",
   "district": "ambient",
   "status": "live",
   "finish": 85,
   "tags": [
    "reaction-diffusion",
    "excitable media",
    "phase singularity",
    "fullscreen"
   ],
   "blurb": "A chemical clock rendered as a field: bromate oxidation held far enough from equilibrium that it oscillates instead of settling. Three coupled species on a torus, each cell reacting against the mean of its neighbours — reaction against diffusion. The spiral cores are phase singularities, points where the oscillation has no defined phase and the medium must wind around them.",
   "url": "https://opposite.city/bz/"
  },
  {
   "slug": "polyrhythm",
   "name": "POLYRHYTHMIC TIME CLOCK",
   "district": "ambient",
   "status": "live",
   "finish": 75,
   "tags": [
    "clock",
    "polyrhythm",
    "web audio",
    "interval"
   ],
   "blurb": "A clock that rings the time. Thirteen nested intervals — hour, half hour, minute, second — each striking on its own real boundary, so the polyrhythm is the clock's own arithmetic rather than something invented for it. Nine musical rings divide the bar against them at whatever tempo you set. Everything lands together on the minute; the whole field lands on the hour.",
   "url": "https://opposite.city/polyrhythm/"
  },
  {
   "slug": "semantic-voyage",
   "name": "SEMANTIC VOYAGE",
   "district": "viz",
   "status": "live",
   "finish": 80,
   "tags": [
    "word embeddings",
    "glove",
    "semantic space",
    "starfield",
    "navigation"
   ],
   "blurb": "Twenty thousand English words placed by meaning — real GloVe vectors projected into three dimensions, so that neighbours in the language stay neighbours in the room. You travel only by similarity: each word offers the handful nearest it, and reaching anywhere means finding a chain of small resemblances. Frequency works as stellar magnitude, so common words carry across the whole field and rare ones resolve only when you are close.",
   "url": "https://opposite.city/semantic-voyage/"
  }
 ]
};
/* REGISTRY:END */

/* prefer surfaces.json from the host — publishing the file is publishing the
   site. the inlined copy is the offline fallback. editing happens in the yard. */
let REG = REGISTRY, D, S;
function index(){
  D = Object.fromEntries(REG.districts.map(d=>[d.id,d]));
  S = REG.surfaces;
}
index();

/* every surface gets its own colour, fresh every load — the original mechanic.
   one hue, three jobs: dark title bar, pale body, mid meter. */
const HUE = {};
function colours(slug){
  if(!HUE[slug]){
    const h=Math.floor(Math.random()*360), sat=38+Math.random()*30;
    HUE[slug]={
      bar:`hsl(${h} ${Math.min(70,sat+18)}% 24%)`,
      body:`hsl(${h} ${sat}% 88%)`,
      fill:`hsl(${h} ${Math.min(75,sat+15)}% 38%)`
    };
  }
  return HUE[slug];
}

const MODE='city';
let filter='all';
const esc=t=>String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const $=id=>document.getElementById(id);

function shown(){
  const q=$('q').value.trim().toLowerCase();
  return S.filter(s=>{
    const deployed=/^https?:\/\//i.test((s.url||'').trim());
    if(MODE==='city' ? !deployed : deployed) return false;
    if(filter!=='all' && s.district!==filter) return false;
    if(!q) return true;
    return (s.name+' '+s.slug+' '+(s.blurb||'')+' '+(s.tags||[]).join(' ')+' '+(D[s.district]?.name||''))
      .toLowerCase().includes(q);
  });
}

function statusLabel(s){
  return s.status==='live'?'● LIVE':s.status==='build'?'◐ BUILD':'○ CONCEPT';
}

function tile(s){
  const c=colours(s.slug), f=Math.max(0,Math.min(100,s.finish??0));
  const el=document.createElement(s.url?'a':'div');
  el.className='win out'+(s.url?' act':'');
  el.id='t-'+s.slug;
  if(s.url){ el.href=s.url; }
  el.innerHTML=`
    <div class="tbar" style="background:${c.bar}">
      <span class="tt">${esc(s.name)}</span><span class="st">${statusLabel(s)}</span>
    </div>
    <div class="wbody" style="background:${c.body}">
      <div>${esc(s.blurb||'')}</div>
      <div class="tagrow">${(s.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
    </div>
    <div class="foot">
      <div class="frow">
        <span class="dim">${esc(D[s.district]?.name||s.district)}</span>
        <span class="go">${s.url?'OPEN →':`<span class="dim">${f}/100</span>`}</span>
      </div>
      <div class="meter in"><div class="fill" style="width:${f}%; background:${c.fill}"></div></div>
    </div>`;
  return el;
}

function draw(){
  const g=$('grid'), rows=shown();
  g.innerHTML='';
  rows.forEach(s=>g.appendChild(tile(s)));
  $('empty').style.display=rows.length?'none':'';
  const f=filter; filter='all'; const tot=shown().length; filter=f;
  $('count').textContent=`${rows.length} of ${tot} surfaces`;
}

/* ---- district chips ---- */
function chips(){
  const c=$('chips'); c.innerHTML='';
  const mk=(id,label,n)=>{
    const b=document.createElement('button');
    b.className='chip out'; b.setAttribute('aria-pressed', filter===id);
    b.textContent=`${label} ${n}`;
    b.onclick=()=>{ filter=id; chips(); draw(); };
    c.appendChild(b);
  };
  const f=filter; filter='all'; const pool=shown(); filter=f;
  mk('all','ALL',pool.length);
  REG.districts.forEach(d=>{
    const n=pool.filter(s=>s.district===d.id).length;
    if(n) mk(d.id,d.name.toUpperCase(),n);
  });
}


/* ---- boot ---- */
$('q').oninput=draw;
async function boot(){
  if(location.protocol!=='file:'){
    try{ const r=await fetch('surfaces.json',{cache:'no-store'});
         if(r.ok){ REG=await r.json(); index(); } }catch(e){}
  }
  chips(); draw();
  tick(); setInterval(tick,30000);
}
function tick(){
  $('clock').textContent=new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
}
boot();
</script>
</body>
</html>
