<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OPPOSITE CITY</title>
<meta name="description" content="Opposite City — an artistic agency, idea firm, and widget farm. El Segundo, CA." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
<style>
  :root{
    --desk:#008080; --face:#c0c0c0; --hi:#ffffff; --lo:#808080; --shadow:#000000;
    --title1:#000080; --title2:#1084d0; --text:#000000;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden;}
  body{
    background:var(--desk);
    font-family:'Courier Prime','Courier New',Courier,monospace;
    font-size:14px; color:var(--text);
    -webkit-font-smoothing:none;
  }
  /* ---- bevel primitives ---- */
  .out{border:2px solid; border-color:var(--hi) var(--shadow) var(--shadow) var(--hi);
       box-shadow:inset 1px 1px 0 var(--face), inset -1px -1px 0 var(--lo);}
  .in {border:2px solid; border-color:var(--lo) var(--hi) var(--hi) var(--lo);}
  /* ---- desktop icons ---- */
  #desk{position:fixed; inset:0 0 34px 0; overflow:auto;}
  #icons{display:flex; flex-direction:column; flex-wrap:wrap; align-content:flex-start;
         gap:4px; padding:8px; height:100%;}
  .icon{width:84px; padding:6px 2px; text-align:center; cursor:pointer;
        color:#fff; text-shadow:1px 1px 0 #000; user-select:none;}
  .icon:active .glyph{filter:invert(1);}
  .glyph{width:34px; height:28px; margin:0 auto 4px; position:relative;}
  .glyph .tab{position:absolute; top:0; left:0; width:14px; height:6px;}
  .glyph .body{position:absolute; top:4px; left:0; right:0; bottom:0;
               border:1px solid #000;}
  .icon .lbl{font-size:11px; line-height:1.15; word-wrap:break-word;}
  /* ---- skyline desktop: the city ---- */
  #desk{transition:background .8s; overflow-x:auto; overflow-y:hidden;}
  #skyline{position:absolute; left:0; bottom:26px;
           display:flex; align-items:flex-end; gap:0; padding:0 24px;
           height:82%; min-width:max-content;}
  .blk{display:flex; align-items:flex-end; gap:2px; position:relative;
       padding:0 10px 24px 10px;}
  .blk+.blk{margin-left:16px;}
  .blk .street{position:absolute; bottom:4px; left:50%; transform:translateX(-50%);
       font-size:10px; letter-spacing:2px; text-transform:uppercase; color:#fff;
       text-shadow:1px 1px 0 #000;
       white-space:nowrap; cursor:pointer; padding:1px 7px;
       background:rgba(0,0,0,.4);}
  .blk .street:hover{background:rgba(0,0,0,.65);}
  .bldg{position:relative; cursor:pointer; image-rendering:pixelated;
        align-self:flex-end; transition:transform .1s, filter .1s;}
  .bldg:hover{transform:translateY(-4px); filter:brightness(1.2);}
  .bldg:active{filter:brightness(.8);}
  .bldg canvas{display:block; image-rendering:pixelated;}
  #skybtn{position:fixed; top:6px; right:8px; z-index:9998;
          font-family:inherit; font-size:11px; padding:3px 8px; cursor:pointer;}
  /* ---- windows ---- */
  .win{position:absolute; min-width:230px; max-width:92vw;
       background:var(--face); display:flex; flex-direction:column;
       box-shadow:2px 2px 0 rgba(0,0,0,.4);}
  .tbar{display:flex; align-items:center; gap:6px; padding:2px 3px;
        background:linear-gradient(90deg,var(--title1),var(--title2));
        color:#fff; font-weight:700; font-size:12px; cursor:move;
        touch-action:none; user-select:none;}
  .tbar .tt{flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
            letter-spacing:.5px;}
  .tbtn{width:18px; height:16px; background:var(--face); color:#000;
        font-size:11px; font-weight:700; line-height:12px; text-align:center;
        cursor:pointer; font-family:inherit; flex:0 0 auto;}
  .tbtn:active{border-color:var(--lo) var(--hi) var(--hi) var(--lo);}
  .wbody{overflow:auto; padding:10px; max-height:62vh; font-size:13px;}
  /* ---- cards ---- */
  .card{background:var(--face); padding:8px; margin-bottom:8px; cursor:pointer;}
  .card:last-child{margin-bottom:0;}
  .card .nm{font-weight:700;}
  .card .bl{margin-top:3px; line-height:1.35;}
  .tagrow{margin-top:5px; display:flex; flex-wrap:wrap; gap:4px;}
  .tag{font-size:10px; padding:0 4px; background:#e5e5e5; border:1px solid var(--lo);}
  .status{font-size:10px; text-transform:uppercase; letter-spacing:1px;}
  /* finish meter */
  .meter{margin-top:6px; height:10px; background:#fff; position:relative;}
  .meter .fill{position:absolute; inset:1px auto 1px 1px; background:var(--title1);}
  .meter .pc{position:absolute; right:3px; top:-1px; font-size:9px; color:#000;}
  /* district header inside window */
  .dhead{font-size:11px; margin-bottom:8px; padding-bottom:6px;
         border-bottom:1px dotted var(--lo);}
  /* ask */
  #askq{width:100%; padding:4px 6px; font-family:inherit; font-size:13px;
        background:#fff; margin-bottom:8px;}
  /* ---- taskbar ---- */
  #taskbar{position:fixed; left:0; right:0; bottom:0; height:34px;
           background:var(--face); display:flex; align-items:center;
           gap:4px; padding:3px 4px; z-index:99999;}
  .tb{height:26px; padding:0 10px; background:var(--face); font-family:inherit;
      font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap;}
  .tb:active{border-color:var(--lo) var(--hi) var(--hi) var(--lo);}
  #openrow{flex:1; display:flex; gap:4px; overflow-x:auto;}
  #openrow .tb{font-weight:400; max-width:130px; overflow:hidden; text-overflow:ellipsis;}
  #clock{font-size:11px; padding:0 8px; height:26px; display:flex; align-items:center;}
  a{color:var(--title1);}
  @media (max-width:600px){ .win{min-width:200px;} .wbody{max-height:56vh;}
    .bldg{margin:0 1px;} .bldg .plaque{font-size:8px;} }
</style>
</head>
<body>

<div id="desk"><div id="skyline"></div></div>
<button id="skybtn" class="out" onclick="rerollSky()">REROLL SKY</button>

<div id="taskbar" class="out">
  <button class="tb out" onclick="openDirectory()">CITY&nbsp;HALL</button>
  <button class="tb out" onclick="openAsk()">ASK</button>
  <button class="tb out" onclick="stumble()">STUMBLE</button>
  <button class="tb out" onclick="toggleMayor(this)">MAYOR</button>
  <button class="tb out" id="exportbtn" style="display:none" onclick="exportRegistry()">EXPORT&nbsp;REGISTRY</button>
  <div id="openrow"></div>
  <div id="clock" class="in"></div>
</div>

/* live registry: prefer surfaces.json from the host (edit the file = edit the
   site), fall back to the inlined copy for file:// / offline. then overlay any
   local edits made in MAYOR mode. */
let REG = REGISTRY, D, S, EDITS = {};
try { EDITS = JSON.parse(localStorage.getItem('oc-edits') || '{}'); } catch(e){}
function applyEdits(){
  REG.surfaces.forEach(s=>{ if(EDITS[s.slug]) Object.assign(s, EDITS[s.slug]); });
  D = Object.fromEntries(REG.districts.map(d=>[d.id,d]));
  S = REG.surfaces;
}
applyEdits();

/* pastel bodies — fresh every load, the original mechanic */
function pastel(){const h=Math.floor(Math.random()*360);
  const s=40+Math.random()*30, l=75+Math.random()*15;
  return `hsl(${h} ${s}% ${l}%)`;}

/* ---- window manager ---- */
let z=10; const openWins={};
function mkWin(id,title,html,x,y,w){
  if(openWins[id]){focusWin(id); return openWins[id];}
  const el=document.createElement('div');
  el.className='win out'; el.id='w-'+id;
  el.style.left=(x??(20+Math.random()*Math.max(20,innerWidth-320)))+'px';
  el.style.top =(y??(16+Math.random()*Math.max(20,innerHeight-360)))+'px';
  if(w) el.style.width=w+'px';
  el.innerHTML=`<div class="tbar"><span class="tt">${title}</span>
    <button class="tbtn out" data-x aria-label="Close ${title}">×</button></div>
    <div class="wbody" style="background:${pastel()}">${html}</div>`;
  document.body.appendChild(el);
  el.style.zIndex=++z;
  el.addEventListener('pointerdown',()=>focusWin(id));
  el.querySelector('[data-x]').addEventListener('click',e=>{e.stopPropagation();closeWin(id);});
  drag(el, el.querySelector('.tbar'));
  openWins[id]={el,title};
  renderTaskbar();
  return openWins[id];
}
function focusWin(id){ if(openWins[id]) openWins[id].el.style.zIndex=++z; }
function closeWin(id){ if(!openWins[id])return;
  openWins[id].el.remove(); delete openWins[id]; renderTaskbar(); }
function drag(el,handle){
  let sx,sy,ox,oy,pid=null;
  handle.addEventListener('pointerdown',e=>{
    if(e.target.closest('.tbtn'))return;
    pid=e.pointerId; handle.setPointerCapture(pid);
    sx=e.clientX; sy=e.clientY; ox=el.offsetLeft; oy=el.offsetTop;
  });
  handle.addEventListener('pointermove',e=>{
    if(pid===null||e.pointerId!==pid)return;
    el.style.left=Math.max(-el.offsetWidth+60, ox+e.clientX-sx)+'px';
    el.style.top =Math.max(0, Math.min(innerHeight-60, oy+e.clientY-sy))+'px';
  });
  const end=e=>{ if(e.pointerId===pid) pid=null; };
  handle.addEventListener('pointerup',end);
  handle.addEventListener('pointercancel',end);
}
function renderTaskbar(){
  const row=document.getElementById('openrow'); row.innerHTML='';
  for(const id in openWins){
    const b=document.createElement('button');
    b.className='tb out'; b.textContent=openWins[id].title;
    b.onclick=()=>focusWin(id); row.appendChild(b);
  }
}

/* ---- content renderers ---- */
function meter(f){return `<div class="meter in"><div class="fill" style="width:${f}%"></div><span class="pc">${f}</span></div>`;}
function card(s){
  const st=s.status==='live'?'● live':s.status==='build'?'◐ build':'○ concept';
  return `<div class="card out" onclick="openSurface('${s.slug}')">
    <div class="nm">${s.name} <span class="status">${st}</span></div>
    <div class="bl">${s.blurb}</div>
    <div class="tagrow">${(s.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
    ${meter(s.finish??0)}</div>`;
}
let MAYOR=false;
function esc(t){return String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function openSurface(slug){
  const s=S.find(x=>x.slug===slug); if(!s)return;
  if(MAYOR){ openEditor(s); return; }
  const link=s.url?`<p style="margin-top:8px"><a href="${s.url}">OPEN →</a></p>`
                  :`<p style="margin-top:8px;font-size:11px">not yet wired — url pending in surfaces.json</p>`;
  mkWin('s-'+slug, s.name.toUpperCase(),
    `<div class="dhead">${D[s.district].name} district — ${s.status} — finish ${s.finish??0}/100</div>
     <p>${s.blurb}</p>
     <div class="tagrow" style="margin-top:8px">${(s.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
     ${meter(s.finish??0)}${link}`, null, null, 300);
}
function openEditor(s){
  const f=(k,v,ml)=> ml
    ?`<label style="font-size:10px">${k}</label><textarea data-f="${k}" class="in" style="width:100%;font-family:inherit;font-size:12px;padding:4px;min-height:70px;background:#fff">${esc(v)}</textarea>`
    :`<label style="font-size:10px">${k}</label><input data-f="${k}" class="in" style="width:100%;font-family:inherit;font-size:12px;padding:4px;background:#fff" value="${esc(v)}"/>`;
  mkWin('e-'+s.slug,'EDIT: '+s.name.toUpperCase(),
    `<div class="dhead">changes save to this browser instantly. EXPORT REGISTRY (taskbar) makes them permanent.</div>
     ${f('name',s.name)} ${f('blurb',s.blurb,1)} ${f('tags',(s.tags||[]).join(', '))}
     ${f('status',s.status)} ${f('finish',s.finish??0)} ${f('url',s.url||'')}
     <div style="margin-top:8px;display:flex;gap:6px">
       <button class="tb out" data-save>SAVE</button>
       <button class="tb out" data-revert>REVERT</button></div>`, null, null, 300);
  const w=openWins['e-'+s.slug].el;
  w.querySelector('[data-save]').onclick=()=>{
    const g=k=>w.querySelector(`[data-f="${k}"]`).value;
    EDITS[s.slug]={name:g('name'),blurb:g('blurb'),status:g('status'),url:g('url'),
      finish:Math.max(0,Math.min(100,parseInt(g('finish'))||0)),
      tags:g('tags').split(',').map(t=>t.trim()).filter(Boolean)};
    localStorage.setItem('oc-edits',JSON.stringify(EDITS));
    applyEdits(); closeWin('e-'+s.slug); openSurfaceView(s.slug);
  };
  w.querySelector('[data-revert]').onclick=()=>{
    delete EDITS[s.slug]; localStorage.setItem('oc-edits',JSON.stringify(EDITS));
    location.reload();
  };
}
function openSurfaceView(slug){ const m=MAYOR; MAYOR=false; openSurface(slug); MAYOR=m; }
function toggleMayor(btn){
  MAYOR=!MAYOR;
  btn.textContent=MAYOR?'MAYOR ✎':'MAYOR';
  btn.style.background=MAYOR?'#ffd0d0':'';
  document.getElementById('exportbtn').style.display=MAYOR?'':'none';
}
function exportRegistry(){
  const out=JSON.parse(JSON.stringify(REG));
  out.generated=new Date().toISOString().slice(0,10);
  const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='surfaces.json'; a.click();
}
function openDistrict(id){
  const d=D[id]; const list=S.filter(s=>s.district===id)
    .sort((a,b)=>(b.finish??0)-(a.finish??0));
  mkWin('d-'+id, d.name.toUpperCase(),
    `<div class="dhead">${d.blurb} — ${list.length} surfaces</div>`+
    list.map(card).join(''), null, null, 330);
}
function openDirectory(){
  const front=REG.front.map(sl=>S.find(s=>s.slug===sl)).filter(Boolean);
  mkWin('directory','OPPOSITE CITY — DIRECTORY',
    `<div class="dhead">an artistic agency, idea firm, and widget farm — el segundo, ca<br>
     ${S.length} surfaces · ${REG.districts.length} districts · registry: city.opposite.surface</div>`+
    front.map(card).join('')+
    `<div style="margin-top:6px;font-size:11px">districts are folders on the desktop. ASK searches. STUMBLE wanders.</div>`,
    Math.max(10,(innerWidth-360)/2), 24, 360);
}
function openAsk(){
  mkWin('ask','ASK THE CITY',
    `<input id="askq" class="in" placeholder="type to search surfaces…"
       oninput="renderAsk(this.value)" autocomplete="off"/>
     <div id="askr"></div>`, null, 40, 320);
  setTimeout(()=>document.getElementById('askq')?.focus(),50);
}
function renderAsk(q){
  q=(q||'').toLowerCase().trim();
  const r=document.getElementById('askr'); if(!r)return;
  if(!q){r.innerHTML='';return;}
  const hits=S.filter(s=>(s.name+' '+s.blurb+' '+(s.tags||[]).join(' ')+' '+D[s.district].name)
    .toLowerCase().includes(q)).slice(0,12);
  r.innerHTML=hits.length?hits.map(card).join(''):'<p>nothing in the city matches. yet.</p>';
}
function stumble(){ openSurface(S[Math.floor(Math.random()*S.length)].slug); }

let PAL;
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return h;}
function rollPalette(){
  const h=Math.floor(Math.random()*360);
  const night=Math.random()<.35;
  const l1=night?12+Math.random()*10:30+Math.random()*25;
  const l2=night?22+Math.random()*12:50+Math.random()*22;
  PAL={
    sky:`linear-gradient(hsl(${h} ${35+Math.random()*30}% ${l1}%), hsl(${(h+30+Math.random()*60)%360} ${40+Math.random()*30}% ${l2}%) 62%, hsl(${(h+70+Math.random()*80)%360} ${45+Math.random()*35}% ${l2+14}%))`,
    lit:`hsl(${(h+40+Math.random()*40)%360} 95% ${78+Math.random()*12}%)`,
    dark:`hsl(${h} 22% 12%)`,
    silhou:`hsl(${h} 28% ${night?18:32}%)`,
    night
  };
  document.getElementById('desk').style.background=PAL.sky;
}
function bhue(slug){ return Math.floor(Math.random()*360); } // every building random, every load

/* one building per surface. shape seeded by slug (stable), color random (fresh). */
function drawSurfaceBuilding(s, px){
  const hsh=hash(s.slug);
  const wCells=3+(hsh%4);                          // width 3–6, stable per surface
  const hCells=Math.max(4, Math.round(3+(s.finish||0)/5.5)); // height from finish: 4–21
  const roof=hsh%5;                                // 0 flat 1 antenna 2 water tower 3 setback 4 crown
  const hue=bhue(s.slug), sat=45+((hsh>>3)%40), lig=38+((hsh>>5)%28);
  const body=`hsl(${hue} ${sat}% ${lig}%)`;
  const shade=`hsl(${hue} ${sat}% ${Math.max(12,lig-18)}%)`;
  const roofC=`hsl(${(hue+((hsh>>7)%80))%360} ${sat}% ${Math.min(85,lig+18)}%)`;
  const roofH=(roof===0?0: roof===3?2:3);
  const cw=wCells*px, ch=(hCells+roofH)*px;
  const c=document.createElement('canvas'); c.width=cw; c.height=ch;
  const g=c.getContext('2d'); g.imageSmoothingEnabled=false;
  const y0=roofH*px;
  // body + right-edge shade for depth
  g.fillStyle=body; g.fillRect(0,y0,cw,ch-y0);
  g.fillStyle=shade; g.fillRect(cw-px,y0,px,ch-y0);
  // roof features
  g.fillStyle=roofC;
  if(roof===1){ g.fillRect(Math.floor(cw/2)-1,0,2,roofH*px); g.fillRect(Math.floor(cw/2)-2,0,4,2);}      // antenna
  else if(roof===2){ g.fillRect(px,px,Math.max(px,cw-3*px),roofH*px-px); g.fillRect(px+1,0,2,px);}        // water tower
  else if(roof===3){ g.fillRect(px,0,cw-2*px,roofH*px);}                                                  // setback
  else if(roof===4){ for(let i=0;i<wCells;i+=2) g.fillRect(i*px,px,px,roofH*px-px);}                      // crown
  // windows: lit fraction by status; live glows, concept sits dark
  const litFrac= s.status==='live'?0.75 : s.status==='build'?0.35 : 0.08;
  for(let r=1;r<hCells-0;r++){
    for(let col=0;col<wCells-1;col++){
      const cell=(hsh + r*31 + col*7)%100;
      g.fillStyle= cell<litFrac*100 ? PAL.lit : PAL.dark;
      g.fillRect(col*px+2, y0+r*px+1, px-3, px-2);
    }
  }
  return c;
}

/* distant silhouette layer + ground strip */
function drawBackdrop(widthPx){
  document.getElementById('bgcity')?.remove();
  document.getElementById('ground')?.remove();
  const c=document.createElement('canvas'); c.id='bgcity';
  const H=Math.floor(innerHeight*.45);
  c.width=widthPx; c.height=H;
  c.style.cssText=`position:absolute;left:0;bottom:50px;height:${H}px;pointer-events:none;opacity:.55;image-rendering:pixelated;`;
  const g=c.getContext('2d'); g.fillStyle=PAL.silhou;
  let x=0;
  while(x<widthPx){ const w=14+Math.random()*40, h=H*(.25+Math.random()*.7);
    g.fillRect(x,H-h,w,h); x+=w+Math.random()*10; }
  document.getElementById('desk').prepend(c);
  const gr=document.createElement('div'); gr.id='ground';
  gr.style.cssText=`position:absolute;left:0;bottom:26px;height:24px;width:${widthPx}px;background:${PAL.dark};opacity:.85;pointer-events:none;`;
  document.getElementById('desk').prepend(gr);
}

function renderSkyline(){
  const sky=document.getElementById('skyline'); sky.innerHTML='';
  const px = innerWidth<620 ? 5 : 8;
  REG.districts.forEach(d=>{
    const list=S.filter(s=>s.district===d.id)
      .sort((a,b)=>hash(a.slug)%13-hash(b.slug)%13);   // stable jumble within block
    const blk=document.createElement('div'); blk.className='blk';
    list.forEach(s=>{
      const el=document.createElement('div'); el.className='bldg';
      el.appendChild(drawSurfaceBuilding(s,px));
      el.onclick=()=>openSurface(s.slug);
      el.title=`${s.name} — ${d.name}`;
      blk.appendChild(el);
    });
    const st=document.createElement('span'); st.className='street';
    st.textContent=d.name; st.onclick=()=>openDistrict(d.id);
    blk.appendChild(st);
    sky.appendChild(blk);
  });
  requestAnimationFrame(()=>drawBackdrop(Math.max(innerWidth, sky.scrollWidth+60)));
}
function rerollSky(){ rollPalette(); renderSkyline(); }

/* ---- boot ---- */
async function boot(){
  if(location.protocol!=='file:'){
    try{ const r=await fetch('surfaces.json',{cache:'no-store'});
         if(r.ok){ REG=await r.json(); applyEdits(); } }catch(e){}
  }
  rollPalette(); renderSkyline();
  openDirectory();
  const shuffled=[...S].sort(()=>Math.random()-.5).slice(0,2);
  shuffled.forEach(s=>openSurface(s.slug));
  focusWin('directory');
  tick(); setInterval(tick,30000);
}
function tick(){
  const d=new Date();
  document.getElementById('clock').textContent=
    d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
}
let rTimer; addEventListener('resize',()=>{clearTimeout(rTimer);rTimer=setTimeout(renderSkyline,200);});
boot();
</script>
