<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="base-uri 'self'; object-src 'none'; form-action 'self'">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>i am sitting in a room</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{
  --void:#0a0e13;
  --air:#f6f9fb;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--void);
  color:var(--air);
  font-family:'Courier Prime','Courier New',Courier,monospace;
  font-size:16px;
  -webkit-font-smoothing:antialiased;
  touch-action:none;
}

#stage{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:3rem 1.5rem;
}

/* One text, one slot per token. A slot holds the word it was, then the
   word it is becoming, in the same place, through a blur of marks that
   are neither. */
#text{
  width:100%;
  max-width:36em;
  font-size:clamp(1rem,2.7vw,1.22rem);
  line-height:1.95;
}
.chunk{white-space:nowrap}
.slot{white-space:pre;will-change:filter,opacity;filter:blur(var(--wear,0em))}

/* Laptop and up. The phone layout above is untouched. Type grows with
   the screen while the measure stays a readable line. */
@media (min-width:720px){
  :root{
    --fs:clamp(1.3rem, .55rem + 1.15vw, 1.7rem);
    --col:min(calc(100vw - 6rem), calc(var(--fs) * 34));
  }
  #stage{padding:3rem}
  #text{font-size:var(--fs);max-width:var(--col);line-height:1.9}
}
@media (min-width:720px) and (max-height:800px){
  :root{--fs:clamp(1.15rem, .5rem + 1vw, 1.45rem)}
  #text{line-height:1.8}
}
</style>
</head>
<body>

<div id="stage">
  <div id="text"></div>
</div>

<script>
'use strict';

const SOURCE = "I am sitting in a room different from the one you are in now. I am recording the sound of my speaking voice and I am going to play it back into the room again and again until the resonant frequencies of the room reinforce themselves so that any semblance of my speech, with perhaps the exception of rhythm, is destroyed. What you will hear, then, are the natural resonant frequencies of the room articulated by speech. I regard this activity not so much as a demonstration of a physical fact, but more as a way to smooth out any irregularities my speech might have.";

// Structure is the room, not the speech. Function words are the walls:
// they do not drift, they are what the drifting happens inside of.
const WALLS = new Set(('a an the this that these those i me my myself you your we us our they them their he him his she her it its ' +
'is am are was were be been being do does did done have has had will would shall should can could may might must ' +
'of in on at to for from by with without into onto out up down over under again and or but so than then as if not no yes ' +
'what which who whom whose when where why how there here now').split(' '));

const textEl = document.getElementById('text');
let S = null;

// ── seeded noise so a session is stable and repeatable ──────────────
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function syllables(w){
  w = w.toLowerCase().replace(/[^a-z]/g,'');
  if(!w) return 1;
  if(w.length<=3) return 1;
  w = w.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/,'').replace(/^y/,'');
  const m = w.match(/[aeiouy]{1,2}/g);
  return m ? m.length : 1;
}

// Inflection is grammar, not meaning — it survives the substitution.
// The stem drifts; the ending is re-applied to whatever comes back.
const ENDINGS = [
  [/ies$/, 'ies'], [/ing$/, 'ing'], [/ed$/, 'ed'],
  [/(ches|shes|sses|xes)$/, 'es'], [/ly$/, 'ly'], [/[^aeiouss]s$/, 's']
];
const NOT_PLURAL = new Set(['perhaps','always','sometimes','towards','besides','afterwards','forwards','backwards','upwards','downwards','nevertheless','otherwise','whereas','across','anyways']);
function endingOf(w){
  const l = w.toLowerCase();
  if(l.length < 5 || NOT_PLURAL.has(l)) return null;
  for(const [re, tag] of ENDINGS) if(re.test(l)) return tag;
  return null;
}
// Which part of speech an ending implies. Bolting -ing onto a noun is
// where the nonsense came from: loss -> lossing.
const ENDING_POS = { ing:'v', ed:'v', ly:'adj', s:'n', es:'n', ies:'n' };

function inflect(w, tag){
  if(!tag) return w;
  const l = w.toLowerCase();
  if(wears(l, tag) || (/^(s|es|ies)$/.test(tag) && /s$/.test(l))) return w;
  const dbl = /[^aeiou][aeiou][^aeiouwxysz]$/.test(l) && syllables(l) === 1;
  switch(tag){
    case 'ing': return /e$/.test(l) && !/ee$/.test(l) ? w.slice(0,-1)+'ing' : dbl ? w+w.slice(-1)+'ing' : w+'ing';
    case 'ed':  return /e$/.test(l) ? w+'d' : /[^aeiou]y$/.test(l) ? w.slice(0,-1)+'ied' : dbl ? w+w.slice(-1)+'ed' : w+'ed';
    case 'ly':  return /[^aeiou]y$/.test(l) ? w.slice(0,-1)+'ily' : w+'ly';
    default:    return /[^aeiou]y$/.test(l) ? w.slice(0,-1)+'ies' : /(s|x|z|ch|sh)$/.test(l) ? w+'es' : w+'s';
  }
}

function tokenize(text){
  const out=[], re=/(\s+)|([A-Za-z][A-Za-z']*)|([^\sA-Za-z]+)/g;
  let m;
  while((m=re.exec(text))){
    if(m[1]) out.push({k:'sp', v:' '});
    else if(m[2]){
      const v=m[2], l=v.toLowerCase();
      out.push({
        k:'w', v,
        cap: v[0]===v[0].toUpperCase(),
        wall: WALLS.has(l),
        origin: l,                 // the word it is tethered to, forever
        spoken: v,                 // exactly as Lucier said it
        tag: endingOf(v),          // the ending it keeps, forever
        r: -1,                     // how far out in the origin's neighbourhood it stands
        recent: [l]                // what it has lately been, so it does not circle
      });
    }
    else out.push({k:'p', v:m[3]});
  }
  return out;
}

// ── the room's reply ───────────────────────────────────────────────
const cache = new Map();
const POS = new Set(['n','v','adj','adv']);

let throttled = 0;
const nap = ms => new Promise(r => setTimeout(r, ms));

// One request, with the difference between "no answer" and "refused"
// preserved. Datamuse throttles bursts; a 429 is the room being busy,
// not the room being empty, and must never be cached as a result.
async function ask(url){
  for(let tryN = 0; tryN < 3; tryN++){
    if(throttled > Date.now()) await nap(throttled - Date.now());
    try{
      const r = await fetch(url);
      if(r.ok) return await r.json();
      if(r.status === 429 || r.status >= 500){
        throttled = Date.now() + 900 * (tryN + 1);
        continue;
      }
      return null;
    }catch(e){
      await nap(400 * (tryN + 1));
    }
  }
  return null;
}

async function probe(query, max){
  if(cache.has(query)) return cache.get(query);
  const data = await ask('https://api.datamuse.com/words?' + query + '&md=pf&max=' + max);
  if(data === null) return null;          // refused — do not cache
  const clean = (Array.isArray(data)?data:[])
    .filter(d => typeof d.word==='string' && /^[a-z][a-z\']*$/i.test(d.word))
    .map(d => {
      const tags = d.tags || [];
      const f = tags.find(t => t.startsWith('f:'));
      return { w:d.word.toLowerCase(), p:tags.filter(t => POS.has(t)), f: f ? parseFloat(f.slice(2)) : 0 };
    });
  cache.set(query, clean);
  return clean;
}

// ── the tether ─────────────────────────────────────────────────────
// Every word that drifts is tied to the word it was spoken as. Its
// neighbourhood is everything the language holds near that first word,
// nearest first. A word may only become something inside it, and each
// pass it steps further out, so it keeps going without ever leaving.
const tethers = new Map();
async function tether(origin){
  if(tethers.has(origin)) return tethers.get(origin);
  const [near, called, kind] = await Promise.all([
    probe('ml=' + encodeURIComponent(origin), 1000),
    probe('rel_trg=' + encodeURIComponent(origin), 200),
    probe('sp=' + encodeURIComponent(origin), 1)
  ]);
  if(near === null) return null;
  const rank = new Map();
  for(const c of near) if(!rank.has(c.w)) rank.set(c.w, { r:rank.size, p:c.p, f:c.f });
  for(const c of called || []) if(!rank.has(c.w)) rank.set(c.w, { r:rank.size, p:c.p, f:c.f });
  const pos = kind && kind[0] && kind[0].w === origin ? kind[0].p : [];
  const t = { rank, list:[...rank.keys()], pos };
  tethers.set(origin, t);
  return t;
}

// An ending put back on by rule has to come out as a word the language
// actually has: session is a verb somewhere, but sessioning is nowhere.
async function real(w){
  const d = await probe('sp=' + encodeURIComponent(w), 1);
  // the bar is commonness, not existence: catched and lossing exist as typos
  return !!(d && d[0] && d[0].w === w.toLowerCase() && d[0].f >= 1);
}

// Ends in the ending and is built on a stem: bring and string end in
// -ing but are not anything-ing, and speed is not a past tense.
function wears(w, tag){
  if(endingOf(w) !== tag) return false;
  const stem = w.slice(0, w.length - (tag === 'ies' ? 3 : tag.length));
  if(!/[aeiouy]/.test(stem)) return false;
  if(tag === 'ed' && /eed$/.test(w)) return false;
  return true;
}

function fits(tok, T, w, info){
  const need = tok.tag ? ENDING_POS[tok.tag] : null;
  // a relative that already wears the ending is already the right form:
  // destroyed can become wrecked, whatever the dictionary calls wrecked
  if(tok.tag && wears(w, tok.tag)) return true;
  // otherwise an ending may only go on a word that is mainly that kind:
  // session can be a verb, but sessioning is not English
  if(need && info.p[0] !== need) return false;
  // a word can only be replaced by something that can stand in its place
  if(T.pos.length && info.p.length && !info.p.some(t => T.pos.includes(t))) return false;
  return true;
}

async function reply(tok, rnd, used){
  const T = await tether(tok.origin);
  if(!T) return null;
  const now = tok.v.toLowerCase();
  const base = tok.recent[tok.recent.length - 1];
  // what it means, and what it calls to mind: the drift may go sideways
  const [ml, trg] = await Promise.all([
    probe('ml=' + encodeURIComponent(base), 150),
    probe('rel_trg=' + encodeURIComponent(base), 60)
  ]);
  if(ml === null) return null;             // the room is busy; try next time
  const kin = trg ? ml.concat(trg) : ml;

  const shaped = [];
  for(const c of kin){
    // the walls never stand in for anything
    if(WALLS.has(c.w)) continue;
    const info = T.rank.get(c.w);
    if(!info || !fits(tok, T, c.w, info)) continue;
    // a word that already wears an ending would end up wearing two
    const own = endingOf(c.w);
    if(own && own !== tok.tag && wears(c.w, own)) continue;
    // common words only: slang and rarities read as a joke, not a drift
    if(c.f < 0.6) continue;
    const f = inflect(c.w, tok.tag), l = f.toLowerCase();
    if(l === now || tok.recent.includes(c.w) || used.has(l)) continue;
    shaped.push({ w:c.w, f, r:info.r });
  }

  // further out than it stands now, by a stride that is not timid
  const out = shaped.filter(c => c.r > tok.r).sort((a, b) => a.r - b.r);
  if(out.length > 1){
    const k = Math.floor(Math.pow(rnd(), 0.7) * Math.min(10, out.length));
    out.unshift(out.splice(k, 1)[0]);
  }
  // at the edge, it wanders inside the neighbourhood
  const rest = shaped.filter(c => c.r <= tok.r).sort(() => rnd() - .5);

  let pick = null;
  for(const c of [...out, ...rest].slice(0, 6)){
    if(c.f !== c.w && !(await real(c.f))) continue;
    pick = c; break;
  }

  // and if it has nowhere further to go, the tether pulls it home: it
  // becomes the word first spoken again, and sets out on another path
  if(!pick && now !== tok.origin) pick = { w:tok.origin, f:tok.spoken, r:-1, home:true };
  return pick;
}

async function pool(items, n, fn){
  let i = 0;
  await Promise.all(Array.from({length:Math.min(n, items.length)}, async () => {
    while(i < items.length){ const k = i++; await fn(items[k]); }
  }));
}

async function playBack(tokens, rnd){
  const next = tokens.map(t => t.k==='w' ? {...t, recent:[...t.recent]} : {...t});
  const live = next.filter(t => t.k==='w' && !t.wall);
  const used = new Set(next.filter(t => t.k==='w').map(t => t.v.toLowerCase()));
  // the same word answers the same way — repetition is what reinforces
  const memo = new Map();
  await pool(live, 8, async t => {
    const key = t.origin + '>' + t.v.toLowerCase();
    if(!memo.has(key)) memo.set(key, reply(t, rnd, used));
    const r = await memo.get(key);
    if(r){
      used.add(r.f.toLowerCase());
      t.v = r.home ? t.spoken : t.cap ? r.f[0].toUpperCase()+r.f.slice(1) : r.f;
      t.r = r.home ? -1 : Math.max(t.r, r.r);
      t.recent.push(r.w);
      if(t.recent.length > 12) t.recent.shift();
    }
  });
  return next;
}

// Nothing wears away. Punctuation, capitals and the small words stay
// exactly as spoken, and words never trade places, so whatever is not
// drifting is always true to the original.
const clamp01 = x => Math.max(0, Math.min(1, x));

// What a pass looks like, slot by slot. Spaces never move, so slot i is
// the same place in every pass.
function display(t){
  const out = t.map(x => x.k==='sp' ? ' ' : (x.k==='p' && x.gone) ? '' : x.v);
  for(let i=0;i<t.length;i++){
    if(t[i].k!=='w') continue;
    const l = out[i].toLowerCase();
    if(l!=='a' && l!=='an') continue;
    let j=i+1;
    while(j<t.length && (t[j].k==='sp' || out[j]==='')) j++;
    if(j<t.length && t[j].k==='w') out[i] = /^[aeiou]/i.test(out[j]) ? 'an' : 'a';
  }
  let start = true;
  for(let i=0;i<t.length;i++){
    if(t[i].k==='w'){
      if(start && out[i]) out[i] = out[i][0].toUpperCase()+out[i].slice(1);
      start = false;
    } else if(t[i].k==='p' && /[.!?]$/.test(out[i])) start = true;
  }
  return out;
}

const textOf = d => d.join('');

// ── the tape ───────────────────────────────────────────────────────
// It never ends. Each pass is generated once, in order, and only while
// someone is there; only the last few are kept.
function fresh(text){
  let seed = (Date.now() ^ text.length*2654435761) >>> 0;
  if(self.crypto && crypto.getRandomValues){
    seed = (seed ^ crypto.getRandomValues(new Uint32Array(1))[0]) >>> 0;
  }
  const first = tokenize(text);
  return { states:[first], disp:[display(first)], top:0, rnd:mulberry32(seed), pending:null, retry:0 };
}

// what a word passes through on its way to another: marks that are not
// letters, all in the same face, so every one is the width of a letter
const GLYPHS = '#%&*+=<>/\\|~^@§¶¤øæþðßµ';
const SHIMMER = 10;  // glyph changes per second
const BLUR = 0.45;   // em, at the height of the crossing
// Everything the room plays back wears. Even the words that never change
// go slowly out of focus the longer it plays: a little at first, then
// more, never quite gone.
const WEAR = 0.34;   // em, the blur it approaches
const WEAR_TAU = 90; // passes to get about two thirds of the way there
let wearNow = -1;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

let pos = 0, raf = null, last = 0, energy = 0;
let slotEls = [], changed = [], lastA = -1, lastB = null;
const smooth = t => t*t*(3-2*t);
// a fixed noise per slot, letter and moment
const hash = (a, b, c) => {
  let h = Math.imul(a + 1, 374761393) ^ Math.imul(b + 1, 668265263) ^ Math.imul(c + 1, 2246822519);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
};

function prepare(){
  if(!S || S.pending || Date.now() < S.retry) return;
  const from = S.states[S.top], at = S.top + 1, rnd = S.rnd;
  const before = textOf(S.disp[S.top]);
  const job = playBack(from, rnd).then(tokens => {
    return { tokens, disp: display(tokens), at };
  });
  S.pending = job;
  job.then(r => {
    if(S.pending !== job) return;
    S.pending = null;
    if(r.at !== S.top + 1) return;
    // nothing answered: keep the pass unspent and ask again shortly
    if(textOf(r.disp) === before){ S.retry = Date.now() + 2000; return; }
    S.states[r.at] = r.tokens;
    S.disp[r.at] = r.disp;
    S.top = r.at;
    // keep from the pass on screen onward; only what is behind it goes
    for(const k in S.states) if(+k < Math.floor(pos)){ delete S.states[k]; delete S.disp[k]; }
    wake();
  }, () => { if(S.pending === job) S.pending = null; });
}

// ── the text as slots ──────────────────────────────────────────────
function build(){
  textEl.textContent = '';
  slotEls = [];
  let chunk = null;
  S.states[0].forEach((x, i) => {
    if(x.k === 'sp'){
      textEl.appendChild(document.createTextNode(' '));
      chunk = null; slotEls[i] = null;
      return;
    }
    // a word and the punctuation touching it never break across lines
    if(!chunk){ chunk = document.createElement('span'); chunk.className = 'chunk'; textEl.appendChild(chunk); }
    const s = document.createElement('span');
    s.className = 'slot';
    chunk.appendChild(s);
    slotEls[i] = s;
  });
  lastA = -1; lastB = null;
}

function render(){
  if(!S) return;
  const a = Math.max(0, Math.min(Math.floor(pos), S.top));
  const f = a >= S.top ? 0 : Math.max(0, Math.min(1, pos - a));
  const A = S.disp[a], B = S.disp[a+1] || A;

  if(a !== lastA || B !== lastB){
    changed = [];
    slotEls.forEach((s, i) => {
      if(!s) return;
      s.textContent = A[i];
      s.style.cssText = '';
      if(A[i] !== B[i]) changed.push(i);
    });
    lastA = a; lastB = B;
  }

  const wear = WEAR * (1 - Math.exp(-pos / WEAR_TAU));
  if(Math.abs(wear - wearNow) > .002){ wearNow = wear; textEl.style.setProperty('--wear', wear.toFixed(3) + 'em'); }

  // Only the words that move this pass are touched; the rest only wear.
  // A moving word goes out of focus where it stands while its letters
  // turn, under the blur, into marks that are not letters; at the height
  // of the crossing it becomes its replacement, which comes back into
  // focus as the new word. The line only reflows at that moment, so
  // nothing spills over its neighbours and no gaps open.
  const k = 1 - Math.abs(2 * f - 1);          // 0 at rest, 1 at the crossing
  const tick = Math.floor(performance.now() / (1000 / SHIMMER));
  const veil = REDUCED ? 0 : smooth(Math.min(1, k * 1.25));
  for(const i of changed){
    const s = slotEls[i], w = f < .5 ? A[i] : B[i];
    let out = '';
    for(let j = 0; j < w.length; j++){
      // each letter has its own threshold, so they go and return unevenly
      if(veil > 0 && hash(i, j, 0) < veil) out += GLYPHS[Math.floor(hash(i, j, tick) * GLYPHS.length)];
      else out += w[j];
    }
    if(s.textContent !== out) s.textContent = out;
    if(REDUCED) continue;
    const b = wear + BLUR * smooth(k);
    s.style.filter = 'blur(' + b.toFixed(3) + 'em)';
    s.style.opacity = (1 - .45 * smooth(k)).toFixed(3);
  }
}

// ── presence ───────────────────────────────────────────────────────
// Anything the viewer does — moving, scrolling, touching, clicking,
// typing — feeds the room a little. The room spends it slowly, and when
// the viewer is still it finishes the crossing it is in and rests.
const PACE = 0.9;     // passes per second, at most
const DRAIN = 0.8;    // seconds for the feed to fall by about two thirds
const SETTLE = 0.5;   // passes per second, finishing a crossing alone
const BEGIN = 0.15;   // feed needed to start a new crossing

function loop(t){
  const dt = Math.min(0.1, (t - (last || t)) / 1000);
  last = t;
  energy *= Math.exp(-dt / DRAIN);
  const frac = pos - Math.floor(pos);
  let rate = Math.min(1, energy) * PACE, cap = S.top;
  // too little feed to carry on: finish this crossing, and only this one
  if(rate < SETTLE && frac > 0){ rate = SETTLE; cap = Math.min(cap, Math.ceil(pos)); }
  // a new crossing begins only while the viewer is still there
  if(frac === 0 && energy < BEGIN) rate = 0;
  if(S.top - pos < 4 && energy > 0.05) prepare();
  if(rate > 0 && pos < cap){
    pos = Math.min(cap, pos + rate * dt);
    render();
  }
  if(energy < 0.01 && (pos === Math.floor(pos) || pos >= S.top)){
    energy = 0; raf = null; last = 0;
    return;
  }
  raf = requestAnimationFrame(loop);
}

function wake(){ if(raf === null) raf = requestAnimationFrame(loop); }

function feed(n){
  if(!S || !(n > 0)) return;
  energy = Math.min(1, energy + n);
  wake();
}

let px = null, py = null;
addEventListener('pointermove', e => {
  if(px !== null) feed(Math.min(0.3, Math.hypot(e.clientX - px, e.clientY - py) * 0.004));
  px = e.clientX; py = e.clientY;
}, {passive:true});
addEventListener('pointerdown', () => feed(0.6), {passive:true});
addEventListener('wheel', e => { e.preventDefault(); feed(Math.min(0.4, Math.abs(e.deltaY) * 0.005)); }, {passive:false});
addEventListener('keydown', e => { if(!e.metaKey && !e.ctrlKey) feed(0.5); });
let ty = null, tx = null;
addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; feed(0.6); }, {passive:true});
addEventListener('touchmove', e => {
  const x = e.touches[0].clientX, y = e.touches[0].clientY;
  if(ty !== null) feed(Math.min(0.3, Math.hypot(x - tx, y - ty) * 0.005));
  tx = x; ty = y;
}, {passive:true});

// ── start ──────────────────────────────────────────────────────────
S = fresh(SOURCE);
build();
render();
// the first answer is fetched quietly now, so the first movement is met;
// nothing on the page changes until the viewer does something
prepare();
</script>
</body>
</html>
