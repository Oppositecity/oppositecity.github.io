<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>THE YARD</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
<style>
  :root{--desk:#3a3a3a; --face:#c0c0c0; --hi:#ffffff; --lo:#808080; --shadow:#000000;}
  *{box-sizing:border-box; margin:0; padding:0;}
  html{height:100%;}
  body{min-height:100%; background:var(--desk);
    font-family:'Courier Prime','Courier New',Courier,monospace;
    font-size:14px; color:#000; -webkit-font-smoothing:none; padding-bottom:44px;}
  .out{border:2px solid; border-color:var(--hi) var(--shadow) var(--shadow) var(--hi);
       box-shadow:inset 1px 1px 0 var(--face), inset -1px -1px 0 var(--lo);}
  .in {border:2px solid; border-color:var(--lo) var(--hi) var(--hi) var(--lo);}

  #head{padding:10px 8px 8px; color:#fff;}
  #head h1{font-weight:700; line-height:1; letter-spacing:0; white-space:nowrap;
           font-size:calc((100vw - 18px) / 4.8);}

  #controls{padding:0 8px 10px; display:flex; flex-direction:column; gap:7px;}
  #q{width:100%; padding:10px; font-family:inherit; font-size:14px; background:#fff; color:#000;}
  #q::placeholder{color:#555; opacity:1;}
  #chips{display:flex; flex-wrap:wrap; gap:5px;}
  .chip{font-family:inherit; font-size:11px; letter-spacing:1px; padding:8px 10px;
        background:var(--face); color:#000; cursor:pointer; min-height:36px;}
  .chip[aria-pressed="true"]{border-color:var(--lo) var(--hi) var(--hi) var(--lo);
        box-shadow:none; font-weight:700;}

  #grid{display:grid; gap:6px; padding:0 8px 14px; grid-template-columns:repeat(2, minmax(0,1fr));}
  .win{height:212px; display:flex; flex-direction:column; background:var(--face);
       overflow:hidden; cursor:pointer;}
  .win.open{grid-column:1 / -1; height:auto; cursor:default;}
  .tbar{display:flex; align-items:center; gap:5px; padding:3px 5px; color:#fff;
        font-weight:700; font-size:12px; flex:0 0 auto;}
  .tbar .tt{flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; letter-spacing:.5px;}
  .tbar .st{font-size:10px; letter-spacing:1px; white-space:nowrap; font-weight:400;}
  .wbody{flex:1; overflow:auto; padding:6px 7px; font-size:13px; line-height:1.32;}
  .win.open .wbody{overflow:visible;}
  .tagrow{margin-top:5px; display:flex; flex-wrap:wrap; gap:3px;}
  .tag{font-size:10px; padding:1px 5px; background:#fff; color:#000;}
  .foot{flex:0 0 auto; padding:4px 5px 5px; background:var(--face); font-size:10px; letter-spacing:1px;}
  .frow{display:flex; justify-content:space-between; align-items:center; gap:5px; margin-bottom:3px;}
  .dim{color:#3a3a3a;}
  .meter{height:9px; background:#fff;}
  .meter .fill{height:100%;}

  label{display:block; font-size:10px; letter-spacing:1px; margin:7px 0 2px;}
  input,textarea,select{width:100%; font-family:inherit; font-size:13px; padding:7px;
    background:#fff; color:#000; border:2px solid; border-color:var(--lo) var(--hi) var(--hi) var(--lo);}
  textarea{min-height:60px; resize:vertical;}
  #html{min-height:120px; font-size:11px;}
  .pair{display:flex; gap:6px;} .pair>div{flex:1;}
  .btns{display:flex; gap:5px; margin-top:9px; flex-wrap:wrap;}
  .btns button{flex:1 1 90px; font-family:inherit; font-size:11px; letter-spacing:1px;
    padding:11px 4px; cursor:pointer; background:var(--face); color:#000; min-height:40px;}
  .btns button:active{border-color:var(--lo) var(--hi) var(--hi) var(--lo);}
  .btns button:disabled{color:#4a4a4a; cursor:default;}
  .hint{font-size:10px; line-height:1.5; margin-top:7px;}

  #taskbar{position:fixed; left:0; right:0; bottom:0; min-height:36px; background:var(--face);
    display:flex; align-items:center; gap:5px; z-index:99;
    padding:4px calc(4px + env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) 4px;}
  .tb{min-height:30px; padding:0 11px; background:var(--face); color:#000; font-family:inherit;
      font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap;}
  .tb:active{border-color:var(--lo) var(--hi) var(--hi) var(--lo);}
  #count{flex:1; font-size:11px; letter-spacing:1px; padding:0 6px; overflow:hidden;
         white-space:nowrap; text-overflow:ellipsis;}
  #clock{font-size:11px; padding:0 8px; min-height:30px; display:flex; align-items:center; background:#fff;}

  #keypanel{display:none; margin:0 8px 10px; padding:9px;}
  #keypanel.on{display:block;}
  #log{margin:0 8px 12px; padding:8px; background:#fff; font-size:11px; max-height:150px;
       overflow-y:auto; white-space:pre-wrap; word-break:break-word;}
  #note{color:#fff; padding:0 8px 14px; font-size:12px; line-height:1.5;}
  :focus-visible{outline:2px dotted #fff; outline-offset:2px;}
  @media (max-width:520px){
    .win{height:196px;} .wbody{font-size:12px; padding:5px 6px;}
    .tbar{font-size:11px;} .tbar .st{font-size:9px;} .tag{font-size:9px;}
    .win.open .wbody{font-size:13px;}
  }
</style>
</head>
<body>

<div id="head">
  <h1>THE YARD</h1>
</div>

<div id="keypanel" class="out">
  <label for="tok">FINE-GRAINED TOKEN — stays on this device, never written to a file</label>
  <input id="tok" type="password" placeholder="github_pat_..." autocomplete="off" spellcheck="false">
  <div class="btns">
    <button class="out" id="savekey">USE KEY</button>
    <button class="out" id="forget">FORGET</button>
  </div>
  <p class="hint">Contents write is required. Administration and Pages write are only needed to
  make a repo and switch Pages on. Set an expiry and scope it to this org.</p>
</div>

<div id="controls">
  <input id="q" placeholder="search the yard" autocomplete="off" aria-label="Search unfinished surfaces" />
  <div id="chips"></div>
</div>

<div id="grid"></div>
<p id="note"></p>
<div id="log" class="in">ready.</div>

<div id="taskbar" class="out">
  <button class="tb out" id="keybtn">KEY</button>
  <button class="tb out" id="newbtn">NEW</button>
  <button class="tb out" id="pubbtn">PUBLISH</button>
  <div id="count"></div>
  <div id="clock" class="in"></div>
</div>

<script>
const OWNER='Oppositecity', HUB='oppositecity.github.io';
const MASTER='registry-master.json', PUBLIC='surfaces.json', TK='oc-yard-key';

/* YARD-FALLBACK:BEGIN */
const FALLBACK = {"lexicon": "city.opposite.surface", "generated": "2026-08-12", "note": "Master list. Surfaces with an address and approval appear on opposite.city; the rest sit in the yard.", "front": ["poemstore", "lexicon-devil", "the-receipt", "organology-organ", "n-10-122", "text-temperature", "poem-stream"], "districts": [{"id": "glitch", "name": "Glitch", "blurb": "post-ASCII, materialist-text toolkit — the mark engine"}, {"id": "ambient", "name": "Ambient", "blurb": "watch-don't-use-it widgets — contemplative windows"}, {"id": "language", "name": "Language", "blurb": "writing instruments & semiotic tools"}, {"id": "audio", "name": "Audio", "blurb": "instruments, sonification, found sound"}, {"id": "civic", "name": "Civic", "blurb": "sortition, institutions, infrastructure"}, {"id": "viz", "name": "Atlas", "blurb": "visualization & knowledge browsers"}, {"id": "press", "name": "Press", "blurb": "publishing, broadsheets, the archive"}, {"id": "forge", "name": "Forge", "blurb": "physical fabrication & spinout ventures"}, {"id": "capital", "name": "Capital", "blurb": "fundraising as artwork, the open round"}, {"id": "lgtc", "name": "LGTC", "blurb": "Language God Tax Compliance — arm's length"}], "surfaces": []};
/* YARD-FALLBACK:END */
let REG=null, D={}, S=[], filter='all', openSlug=null;
const $=id=>document.getElementById(id);
const esc=t=>String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const say=m=>{ $('log').textContent=m+'\n'+$('log').textContent; };
const key=()=>localStorage.getItem(TK)||'';
const enc=s=>{const b=new TextEncoder().encode(s); let x=''; b.forEach(c=>x+=String.fromCharCode(c)); return btoa(x);};
const dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));
/* only ever trust http(s) addresses — this page holds a token */
const safeUrl=u=>{ u=(u||'').trim(); return /^https?:\/\//i.test(u)?u:''; };

async function gh(path,opt={}){
  if(!key()) throw new Error('no key — open KEY and add one');
  const r=await fetch('https://api.github.com'+path,{...opt,headers:{
    'Authorization':'Bearer '+key(),'Accept':'application/vnd.github+json',
    'X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}});
  const t=await r.text(); let j=null; try{j=JSON.parse(t);}catch(e){}
  if(!r.ok){const e=new Error((j&&j.message)||r.statusText); e.status=r.status; throw e;}
  return j;
}
async function getFile(repo,path){
  try{ const j=await gh(`/repos/${OWNER}/${repo}/contents/${path}`); return {text:dec(j.content),sha:j.sha}; }
  catch(e){ if(e.status===404) return null; throw e; }
}
async function putFile(repo,path,text,sha,msg){
  const body={message:msg,content:enc(text)}; if(sha) body.sha=sha;
  return (await gh(`/repos/${OWNER}/${repo}/contents/${path}`,{method:'PUT',body:JSON.stringify(body)})).content.sha;
}
/* always write against the copy that's on GitHub right now, never a stale local one */
async function withMaster(fn,msg){
  const f=await getFile(HUB,MASTER);
  if(!f) throw new Error(MASTER+' not found in '+HUB);
  const reg=JSON.parse(f.text);
  const out=fn(reg)||reg;
  await putFile(HUB,MASTER,JSON.stringify(out,null,1),f.sha,msg);
  REG=out; index(); return out;
}
function index(){ D=Object.fromEntries(REG.districts.map(d=>[d.id,d])); S=REG.surfaces; }

/* ---- colour: one hue per surface, fresh each load ---- */
const HUE={};
function colours(slug){
  if(!HUE[slug]){
    const h=Math.floor(Math.random()*360), sat=38+Math.random()*30;
    HUE[slug]={bar:`hsl(${h} ${Math.min(70,sat+18)}% 24%)`,
               body:`hsl(${h} ${sat}% 88%)`, fill:`hsl(${h} ${Math.min(75,sat+15)}% 38%)`};
  }
  return HUE[slug];
}

function yard(){ return S.filter(s=>!(s.approved && safeUrl(s.url))); }
function shown(){
  const q=$('q').value.trim().toLowerCase();
  return yard().filter(s=>{
    if(filter!=='all' && s.district!==filter) return false;
    if(!q) return true;
    return (s.name+' '+s.slug+' '+(s.blurb||'')+' '+(s.tags||[]).join(' ')+' '+(D[s.district]?.name||''))
      .toLowerCase().includes(q);
  });
}
const statusLabel=s=>s.status==='live'?'● LIVE':s.status==='build'?'◐ BUILD':'○ CONCEPT';

function tile(s){
  const c=colours(s.slug), f=Math.max(0,Math.min(100,s.finish??0));
  const el=document.createElement('div');
  el.className='win out'; el.id='t-'+s.slug;
  el.innerHTML=`
    <div class="tbar" style="background:${c.bar}">
      <span class="tt">${esc(s.name)}</span><span class="st">${statusLabel(s)}</span></div>
    <div class="wbody" style="background:${c.body}">
      <div>${esc(s.blurb||'')}</div>
      <div class="tagrow">${(s.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
    </div>
    <div class="foot">
      <div class="frow"><span class="dim">${esc(D[s.district]?.name||s.district)}</span>
        <span class="dim">${safeUrl(s.url)?'STANDING':f+'/100'}</span></div>
      <div class="meter in"><div class="fill" style="width:${f}%; background:${c.fill}"></div></div>
    </div>`;
  el.onclick=()=>open_(s.slug);
  return el;
}

function draw(){
  const g=$('grid'); g.innerHTML='';
  if(!REG){ $('count').textContent=''; return; }
  const rows=shown();
  rows.forEach(s=>g.appendChild(tile(s)));
  $('note').textContent=rows.length?'':'Nothing in the yard matches.';
  const total=yard().length, live=S.filter(s=>s.approved&&safeUrl(s.url)).length;
  $('count').textContent=`${rows.length} of ${total} in the yard · ${live} on opposite.city`;
  if(openSlug && rows.some(s=>s.slug===openSlug)) open_(openSlug,true);
}

/* ---- open a tile: edit it, or build it ---- */
function open_(slug,silent){
  const s=S.find(x=>x.slug===slug); if(!s) return;
  const el=$('t-'+slug); if(!el) return;
  openSlug=slug;
  const c=colours(slug);
  el.className='win out open';
  el.onclick=null;                       // stop the tile handler eating field taps
  el.innerHTML=`
    <div class="tbar" style="background:${c.bar}"><span class="tt">${esc(s.name)}</span>
      <span class="st">${esc(s.slug)}</span></div>
    <div class="wbody" style="background:${c.body}">
      <label for="f-name">NAME</label><input id="f-name" value="${esc(s.name)}">
      <label for="f-blurb">BLURB</label><textarea id="f-blurb">${esc(s.blurb||'')}</textarea>
      <label for="f-tags">TAGS — comma separated</label><input id="f-tags" value="${esc((s.tags||[]).join(', '))}">
      <div class="pair">
        <div><label for="f-district">DISTRICT</label><select id="f-district">
          ${REG.districts.map(d=>`<option value="${d.id}" ${d.id===s.district?'selected':''}>${esc(d.name)}</option>`).join('')}
        </select></div>
        <div><label for="f-finish">FINISH</label><input id="f-finish" type="number" min="0" max="100" value="${s.finish??0}"></div>
      </div>
      <label for="f-status">STATUS</label><select id="f-status">
        ${['concept','build','live'].map(v=>`<option ${s.status===v?'selected':''}>${v}</option>`).join('')}</select>
      <div class="btns">
        <button class="out" id="b-save">SAVE TEXT</button>
        <button class="out" id="b-close">CLOSE</button>
      </div>
      ${safeUrl(s.url)?`<p class="hint">Standing at <b>${esc(safeUrl(s.url))}</b> — open it, check it,
        then show it.</p><div class="btns"><button class="out" id="b-show">SHOW ON OPPOSITE.CITY</button></div>`:''}
      <label for="html">HTML — paste the whole file to put it up</label>
      <textarea id="html" spellcheck="false" placeholder="&lt;!DOCTYPE html&gt;..."></textarea>
      <div class="btns"><button class="out" id="b-deploy">BUILD IT</button></div>
      <p class="hint">Building makes the repo, writes the file, switches Pages on and moves this
      out of the yard. It won't show on opposite.city until you PUBLISH.</p>
    </div>`;
  if(!silent) el.scrollIntoView({block:'nearest'});
  const g=id=>$(id).value;
  const collect=()=>({
    name:g('f-name').trim()||s.name, blurb:g('f-blurb').trim(),
    tags:g('f-tags').split(',').map(t=>t.trim()).filter(Boolean),
    district:g('f-district'), status:g('f-status'),
    finish:Math.max(0,Math.min(100,parseInt(g('f-finish'))||0))
  });
  $('b-close').onclick=e=>{ e.stopPropagation(); openSlug=null; draw(); };
  if($('b-show')) $('b-show').onclick=async e=>{
    e.stopPropagation(); e.target.disabled=true;
    try{
      await withMaster(reg=>{ reg.surfaces.find(x=>x.slug===slug).approved=true; },`yard: approve ${slug}`);
      openSlug=null; say(slug+' approved — PUBLISH to put it on the site.'); chips(); draw();
    }catch(err){ say('could not approve — '+err.message); e.target.disabled=false; }
  };
  $('b-save').onclick=async e=>{
    e.stopPropagation(); const btn=e.target; btn.disabled=true;
    const patch=collect();
    try{
      await withMaster(reg=>{
        const t=reg.surfaces.find(x=>x.slug===slug);
        if(!t) throw new Error(slug+' is not in the registry');
        Object.assign(t,patch);
      },`yard: edit ${slug}`);
      say('saved '+slug+'.'); draw();
    }catch(err){ say('save failed — '+err.message); btn.disabled=false; }
  };
  $('b-deploy').onclick=e=>{ e.stopPropagation(); build(slug,collect()); };
}

/* ---- build: repo, file, pages, registry ---- */
async function build(slug,patch){
  const html=$('html').value;
  if(!html.trim()){ say('paste the HTML first.'); return; }
  if(!/^[a-z0-9][a-z0-9-]*$/.test(slug)){ say('slug must be lowercase letters, numbers and hyphens.'); return; }
  const btn=$('b-deploy'); btn.disabled=true;
  try{
    try{
      await gh(`/orgs/${OWNER}/repos`,{method:'POST',
        body:JSON.stringify({name:slug,private:false,auto_init:false,description:patch.name})});
      say('made the repo '+slug+'.');
    }catch(err){
      if(err.status===422) say('repo already there.');
      else if(err.status===403||err.status===404){
        say('the key cannot make repos. Make '+slug+' on github.com, then build again.'); throw err;
      } else throw err;
    }
    const cur=await getFile(slug,'index.html');
    await putFile(slug,'index.html',html,cur?cur.sha:null,cur?'update surface':'first build');
    say('wrote index.html to '+slug+'.');

    try{
      await gh(`/repos/${OWNER}/${slug}/pages`,{method:'POST',
        body:JSON.stringify({source:{branch:'main',path:'/'}})});
      say('Pages switched on.');
    }catch(err){
      if(err.status===409) say('Pages was already on.');
      else say('could not switch Pages on — '+err.message+' (repo Settings › Pages, once)');
    }

    const url=`https://opposite.city/${slug}/`;
    await withMaster(reg=>{
      const t=reg.surfaces.find(x=>x.slug===slug);
      Object.assign(t,patch,{url,status:'live',approved:false});
    },`yard: build ${slug}`);
    openSlug=null; draw();
    say('standing at '+url+' — check it, then PUBLISH to show it on opposite.city.');
  }catch(err){ say('build stopped — '+err.message); btn.disabled=false; }
}

/* ---- new surface ---- */
$('newbtn').onclick=async()=>{
  if(!REG){ say('load the yard first.'); return; }
  const name=prompt('Name it:'); if(!name) return;
  const slug=(prompt('Slug — lowercase, hyphens:', name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''))||'').trim();
  if(!/^[a-z0-9][a-z0-9-]*$/.test(slug)){ say('slug must be lowercase letters, numbers and hyphens.'); return; }
  try{
    await withMaster(reg=>{
      if(reg.surfaces.some(x=>x.slug===slug)) throw new Error(slug+' already exists');
      reg.surfaces.push({slug,name:name.trim(),district:reg.districts[0].id,status:'concept',
        finish:10,tags:[],blurb:'',url:'',approved:false});
    },`yard: new ${slug}`);
    say('added '+slug+'.'); chips(); draw(); open_(slug);
  }catch(e){ say('could not add — '+e.message); }
};

/* ---- publish ---- */
$('pubbtn').onclick=async()=>{
  if(!REG) return;
  const ok=S.filter(s=>s.approved && safeUrl(s.url));
  if(!confirm(`Show ${ok.length} surface${ok.length===1?'':'s'} on opposite.city? Everything else stays hidden.`)) return;
  const btn=$('pubbtn'); btn.disabled=true;
  try{
    const slugs=new Set(ok.map(s=>s.slug));
    const out={lexicon:REG.lexicon, generated:REG.generated,
      published:new Date().toISOString().slice(0,10),
      note:'Approved, deployed surfaces only. The full list lives in registry-master.json.',
      front:(REG.front||[]).filter(f=>slugs.has(f)),
      districts:REG.districts.filter(d=>ok.some(s=>s.district===d.id)),
      surfaces:ok.map(({approved,...r})=>r)};
    const text=JSON.stringify(out,null,1);
    const cur=await getFile(HUB,PUBLIC);
    await putFile(HUB,PUBLIC,text,cur?cur.sha:null,`publish ${ok.length} surfaces`);
    say('published '+ok.length+' surfaces.');
    try{
      const idx=await getFile(HUB,'index.html');
      if(idx && idx.text.includes('/* REGISTRY:BEGIN */')){
        await putFile(HUB,'index.html',
          idx.text.replace(/\/\* REGISTRY:BEGIN \*\/[\s\S]*?\/\* REGISTRY:END \*\//,
            '/* REGISTRY:BEGIN */\nconst REGISTRY = '+text+';\n/* REGISTRY:END */'),
          idx.sha,'sync inline registry fallback');
        say('offline fallback brought in line.');
      }
    }catch(e){ say('fallback not synced — '+e.message+' (site is still correct)'); }
  }catch(e){ say('publish failed — '+e.message); }
  btn.disabled=false;
};

/* ---- approval lives here too: anything standing but unapproved ---- */
function chips(){
  const c=$('chips'); c.innerHTML=''; if(!REG) return;
  const f=filter; filter='all'; const pool=shown(); filter=f;
  const mk=(id,label,n)=>{
    const b=document.createElement('button');
    b.className='chip out'; b.setAttribute('aria-pressed',filter===id);
    b.textContent=`${label} ${n}`;
    b.onclick=()=>{ filter=id; openSlug=null; chips(); draw(); };
    c.appendChild(b);
  };
  mk('all','ALL',pool.length);
  REG.districts.forEach(d=>{
    const n=pool.filter(s=>s.district===d.id).length;
    if(n) mk(d.id,d.name.toUpperCase(),n);
  });
}

/* ---- key ---- */
$('keybtn').onclick=()=>$('keypanel').classList.toggle('on');
$('tok').value=key();
$('savekey').onclick=async()=>{
  localStorage.setItem(TK,$('tok').value.trim());
  try{ const u=await gh('/user'); say('key accepted for '+u.login); $('keypanel').classList.remove('on'); }
  catch(e){ say('key rejected — '+e.message); }
};
$('forget').onclick=()=>{ localStorage.removeItem(TK); $('tok').value=''; say('key erased from this device.'); };

/* ---- boot: the grid reads the public file, writes need the key ---- */
$('q').oninput=()=>{ openSlug=null; draw(); };
async function boot(){
  try{
    const r=await fetch(MASTER,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    REG=await r.json(); index(); chips(); draw();
    say(yard().length+' in the yard, '+(S.length-yard().length)+' standing.');
  }catch(e){
    REG=JSON.parse(JSON.stringify(FALLBACK)); index(); chips(); draw();
    say('using the built-in copy — '+e.message);
    $('note').textContent='Showing the built-in copy. Saving still writes to the live registry.';
  }
  if(key()) gh('/user').then(u=>say('key on file for '+u.login)).catch(()=>say('key on file is not working.'));
  tick(); setInterval(tick,30000);
}
function tick(){ $('clock').textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}); }
boot();
</script>
</body>
</html>
